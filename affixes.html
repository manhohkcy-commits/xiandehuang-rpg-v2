<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲得慌RPG v2 · 词条一览</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="index.html">← 返回</a><span class="tag">词条库</span>
    <a href="create.html" style="margin-left:auto;">🎒 去装备页</a></div>
  <div id="view"></div>
</div>

<script type="module">
import { AFFIX_LIB, AFFIX_LIB_2, AFFIX_LIB_3, AFFIX_LIB_EXT } from "./js/affixes.js";
import { esc } from "./js/core.js";

const $ = (id) => document.getElementById(id);
const card = (t, inner) => '<div class="card"><div class="card-title">' + t + '</div>' + inner + '</div>';
const row = (a, b, c) => '<div class="row"><span class="k">' + a + (c ? '<div class="hint">' + c + '</div>' : '') + '</span><span class="v">' + b + '</span></div>';

// 第一批：现在的装备会随机出的
let first = "";
const catName = { weapon: "⚔️ 武器", armor: "🛡️ 防具", accessory: "💍 饰品" };
for (const kind of Object.keys(AFFIX_LIB)) {
  if (kind === "条数规则") continue;
  first += '<div class="card-title" style="margin-top:10px;color:#8fd8ff;">' + kind + '</div>';
  const byCat = AFFIX_LIB[kind];
  for (const cat of Object.keys(byCat)) {
    first += '<div class="hint" style="margin-top:6px;color:#6a6a86;">' + catName[cat] + '</div>';
    byCat[cat].forEach((a) => {
      first += '<div class="row"><span class="k">' + a[0] + '</span><span class="v" style="color:#7ee787;">' + a[1] + ' ~ ' + a[2] + (a[3] || "") + '</span></div>';
    });
  }
}

const countRule = Object.keys(AFFIX_LIB.条数规则)
  .map((k) => '<span class="tag" style="margin-right:6px;">' + k + ' = ' + AFFIX_LIB.条数规则[k] + ' 条</span>').join("");

const second = AFFIX_LIB_2.map((a) => row(a[0], '<span style="color:#ffd666;">' + a[1] + '</span>', a[2])).join("");
const ext = AFFIX_LIB_EXT.map((a) => row(a[0], '<span style="color:#8fd8ff;">' + a[1] + '</span>', a[2])).join("");
const third = AFFIX_LIB_3.map((a) => row(a[0], '<span style="color:#c9a0ff;">' + a[1] + '</span>', a[2])).join("");

$("view").innerHTML =
  card("📖 词条一览（共 " +
    (Object.values(AFFIX_LIB).filter((x) => !Array.isArray(x)).length ? "" : "") + "3 批）",
    '<div class="hint">第一批已经生效：商店购买 / 关卡掉落 / 初始装备 都会随机带词条。<br>' +
    '第二批要接进战斗才会生效（明天做）；第三批需要新机制。</div>' +
    '<div style="margin-top:8px;">' + countRule + '</div>') +
  card("第一批 · 纯数值（已生效）", first) +
  card("数值扩展 · 乘区类（待接战斗，" + AFFIX_LIB_EXT.length + " 条）", ext) +
  card("第二批 · 小改（待接战斗）", second) +
  card("第三批 · 新机制（待开发）", third);
</script>
</body>
</html>
