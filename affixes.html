<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲得慌RPG v2 · 词条库</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="index.html">← 返回</a><span class="tag">词条库</span>
    <a href="create.html" style="margin-left:auto;">🎒 去仓库</a></div>
  <div id="view"></div>
</div>

<script type="module">
import { AFFIX_LIB, AFFIX_LIB_2, AFFIX_LIB_3, AFFIX_LIB_EXT } from "./js/affixes.js";

const card = (t, inner) => '<div class="card"><div class="card-title">' + t + '</div>' + inner + '</div>';
const chips = (names) => '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">' +
  [...new Set(names)].map((n) => '<span class="tag" style="font-size:11.5px;padding:3px 9px;">' + n + '</span>').join("") + '</div>';

// 通用词条：按类别列出（所有装备共用同一套池）
let first = "";
for (const kind of Object.keys(AFFIX_LIB)) {
  first += '<div class="hint" style="margin-top:10px;color:#8fd8ff;font-weight:700;">' + kind + '</div>';
  first += chips(AFFIX_LIB[kind]);
}

const extOnly = chips(AFFIX_LIB_EXT.map((a) => a[0]));
const secondOnly = chips(AFFIX_LIB_2.map((a) => a[0]));
const thirdOnly = chips(AFFIX_LIB_3.map((a) => a[0]));

document.getElementById("view").innerHTML =
  card("📖 词条库",
    '<div class="hint">所有装备共用同一套词条池，不按部位限制。具体数值随稀有度、强化与星级变化，以装备详情为准。</div>' +
    '<div style="margin-top:8px;"><span class="tag">R = 2 条</span><span class="tag">SR = 3 条</span>' +
    '<span class="tag">SSR = 4 条</span><span class="tag">UR = 5 条</span></div>') +
  card("通用词条", first) +
  card("数值扩展 · 乘区类（" + AFFIX_LIB_EXT.length + " 种）", extOnly) +
  card("第二批 · 战斗词条（" + AFFIX_LIB_2.length + " 种）", secondOnly) +
  card("第三批 · 机制词条（" + AFFIX_LIB_3.length + " 种）", thirdOnly);
</script>
</body>
</html>
