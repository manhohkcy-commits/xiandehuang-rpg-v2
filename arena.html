<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲得慌RPG v2 · 竞技场</title>
<link rel="stylesheet" href="css/app.css?v=e0ed2d33">
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="index.html">← 返回</a><span class="tag">竞技场</span>
    <a href="lobby.html" style="margin-left:auto;">🏛 大厅</a></div>
  <div id="view"><div class="card"><div class="hint">载入竞技场…</div></div></div>
</div>
<div id="toast" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:8px 16px;border-radius:20px;background:#1b2740;border:1px solid #6ea8fe;color:#cfe6ff;display:none;z-index:99;"></div>
<script type="module">
import { cacheLoad, cacheSave, cloudGet, cloudSave, cloudList, fmt, esc as escCore } from "./js/core.js?v=13807141";
import { charFinal, charPower } from "./js/power.js?v=a52c4ae8";
import { WEAPONS, ARMORS, ACCESSORIES } from "./js/data.js?v=46e9a1b3";
import { makeItem } from "./js/items.js?v=4c8258c6";
import { pullOriginals, originalFinal } from "./js/originals.js?v=8c637db3";
import { createRoom } from "./js/room.js?v=e40b6dc6";

const BOX = "__arena";
const me = (() => {
  try {
    if (localStorage.getItem("rpg2:host") === "1") return localStorage.getItem("rpg2:hostBox") || "zynSD117";
    return localStorage.getItem("rpg2:box") || localStorage.getItem("rpg2:hostBox") || "zynSD117";
  } catch (e) { return "zynSD117"; }
})();
const myName = localStorage.getItem("rpg2:name") || "无名";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
window.addEventListener("error", (e) => {
  const v = document.getElementById("view");
  if (v) v.innerHTML = '<div class="card"><div class="card-title">竞技场加载出错</div><div class="hint">' + String(e.message || e) + '</div></div>';
});
let toastT = null;
function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  t.style.borderColor = bad ? "#ff6b6b" : "#6ea8fe";
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.style.display = "none"; }, 1800);
}

let store = null;
let updatedAt = null;
async function loadStore() {
  let s = null;
  try { s = cacheLoad(me); } catch (e) {}
  try {
    const row = await cloudGet(me);
    if (row && row.store && Number(row.store.v) === 2) { s = row.store; updatedAt = row.updated_at || null; }
  } catch (e) {}
  return s;
}
async function saveStore() {
  if (!store) return;
  store.__at = Date.now();
  try { cacheSave(me, store); } catch (e) {}
  try {
    const r = await cloudSave(me, store, updatedAt || null, (store.chars && store.chars[0] && store.chars[0].name) || "");
    if (r && r.ok) updatedAt = (r.row && r.row.updated_at) || updatedAt;
  } catch (e) {}
}
let data = { v: 1, players: {} };   // { box: { name, pts, w, l, team:[...] } }

async function loadArena() {
  try {
    const r = await cloudGet(BOX);
    const s = r && r.store;
    if (s && s.arena && s.arena.players) data = s.arena;
    else if (s && s.players) data = s;
  } catch (e) { /* 首次为空 */ }
}

async function saveArena() {
  let r0 = null;
  try { r0 = await cloudGet(BOX); } catch (e) {}
  const payload = { v: 2, items: [], chars: [], msgs: [], arena: data };
  const r = await cloudSave(BOX, payload, r0 && r0.updated_at, "竞技场");
  if (!r || r.ok === false) throw new Error((r && r.reason) || "云端写入失败");
  return r;
}

function myRec() {
  return data.players[me] || null;
}

let candidates = [];
async function buildCandidates() {
  candidates = [];
  const chars = (store && store.chars) || [];
  if (chars.length) {
    chars.forEach((ch) => {
      const f = charFinal(ch);
      candidates.push({ name: ch.name, lv: ch.lv || 1, atk: Math.round(f.atk), hp: Math.round(f.hp), spd: Math.round(f.spd || 0) });
    });
    return;
  }
  // 原创角色仅主机端可用；玩家端只能用自建角色
  let isHostMode = false;
  try { isHostMode = localStorage.getItem("rpg2:host") === "1"; } catch (e) {}
  if (!isHostMode) return;
  try {
    const origs = await pullOriginals();
    window.__originals = origs || [];
    (origs || []).forEach((o) => {
      const prog = (store && store.orig && store.orig[o.id]) || {};
      const f = originalFinal(o, {});
      candidates.push({ name: o.name, lv: prog.lv || 1, atk: Math.round(f.atk), hp: Math.round(f.hp), spd: Math.round(f.spd || 0), power: Math.round(f.power || 0) });
    });
  } catch (e) {}
}

function currentChar() {
  const chars = (store && store.chars) || [];
  if (chars.length) {
    const act = chars.find((x) => x.id === store.activeChar) || chars[0];
    return { name: act.name, lv: act.lv || 1 };
  }
  const c0 = candidates[0];
  return c0 ? { name: c0.name, lv: c0.lv } : null;
}
function snapshot() {
  const chars = (store && store.chars) || [];
  if (chars.length) {
    const act = chars.find((x) => x.id === store.activeChar) || chars[0];
    const f = charFinal(act);
    return { name: act.name, lv: act.lv || 1, charId: act.id, box: me, atk: Math.round(f.atk), hp: Math.round(f.hp), def: Math.round(f.def), res: Math.round(f.res), spd: Math.round(f.spd || 0), critRate: Math.round(f.critRate || 5), critDmg: Math.round(f.critDmg || 150) };
  }
  const c0 = candidates[0];
  if (c0) {
    const o = (window.__originals || []).find((x) => x.name === c0.name);
    if (o) {
      const prog = (store && store.orig && store.orig[o.id]) || {};
      const f = originalFinal(o, prog);
      return { name: c0.name, lv: c0.lv, charId: o.id, box: me, atk: Math.round(f.atk), hp: Math.round(f.hp),
        def: Math.round(f.def), res: Math.round(f.res), spd: Math.round(f.spd * 10) / 10, power: Math.round(f.power || 0) };
    }
    return { name: c0.name, lv: c0.lv, atk: c0.atk, hp: c0.hp, spd: c0.spd, power: c0.power };
  }
  return null;
}

function powerOf(team) {
  return team.reduce((s, t) => s + t.atk * 2 + t.hp * 0.5, 0);
}

function today() { return new Date().toISOString().slice(0, 10); }
function dailyUsed(rec) {
  if (!rec) return 0;
  return rec.day === today() ? (Number(rec.used) || 0) : 0;
}
function modes() { return [
  { k: "1v1", n: "1v1 单挑" },
  { k: "3v3", n: "3v3 小队战" },
  { k: "team", n: "团队战" },
  { k: "room", n: "自定义房间" }
]; }
let cloudPlayers = [];
async function loadCloudPlayers() {
  try {
    const rows = await cloudList(200);
    cloudPlayers = [];
    rows.filter((r) => r && r.store && Number(r.store.v) === 2 && String(r.box).indexOf("__") !== 0)
      .forEach((r) => {
        const s = r.store;
        (s.chars || []).forEach((ch) => {
          cloudPlayers.push({
            box: String(r.box), charId: ch.id, name: ch.name || "无名",
            lv: Number(ch.lv) || 1, power: charPower(ch)
          });
        });
      });
  } catch (e) { cloudPlayers = []; }
}

function render() {
  const mode = window.__amode || "1v1";
  const rec = myRec();
  const isHost = (() => { try { return localStorage.getItem("rpg2:host") === "1"; } catch (e) { return false; } })();
  const chars = (store && store.chars) || [];
  const team = (rec && Array.isArray(rec.team)) ? rec.team : [];
  const tabs = modes().map((m) => '<button data-mode="' + m.k + '" class="' + (mode === m.k ? "on" : "") + '">' + m.n + '</button>').join("");

  const defHtml = team.length
    ? team.map((t) => '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;padding:4px 0;"><span>' + esc(t.name) + '（Lv' + t.lv + '）</span><span style="color:#6ea8fe;font-weight:700;">战力 ' + Math.round(t.power || (t.atk * 2 + t.hp * 0.5)) + '</span></div>').join("")
    : '<div class="hint">正在自动布防…</div>';

  const goTrain = '<a href="create.html?box=' + encodeURIComponent(me) + (isHost ? "&tab=orig" : "&tab=cult") + '" style="text-decoration:none;"><button style="margin-top:8px;border-color:#7ee787;color:#7ee787;">🧪 去培养 / 调整</button></a>';

  const others = cloudPlayers.filter((p) => p.box !== me).sort((x, y) => y.power - x.power);
  const list = others.length
    ? others.map((p) =>
        '<div class="row"><span class="k">' + esc(p.name) + '<div class="hint">Lv' + p.lv + ' · 位号尾号 #' + p.box.slice(-4) + '</div></span>' +
        '<span class="v"><span style="color:#8fd8ff;font-weight:700;margin-right:8px;">' + fmt(p.power) + '</span>' +
        '<button data-chal="' + esc(p.box) + '" data-char="' + esc(p.charId || "") + '">挑战</button></span></div>').join("")
    : '<div class="hint">还没有其他玩家创建角色。</div>';

  $("view").innerHTML =
    '<div class="card"><div class="card-title">🏟 竞技场</div>' +
      '<div class="tree-tabs" style="margin-bottom:8px;">' + tabs + '</div>' +
      '<div class="hint">积分 ' + (rec ? rec.pts || 0 : 0) + ' · ' + (rec ? (rec.w || 0) + "胜 " + (rec.l || 0) + "负" : "未开始") +
      ' · 🪙 竞技币 ' + (rec ? rec.coin || 0 : 0) + ' · 今日挑战 ' + dailyUsed(rec) + '/5</div>' +
      (mode === "room"
        ? '<div class="hint" style="margin-top:6px;">自定义房间：可邀请朋友 6 人同场，支持观战。</div>' +
          '<button id="btnRoom" style="margin-top:8px;border-color:#7ee787;color:#7ee787;">🏠 开自定义房切磋（可观战）</button>'
        : '<div class="hint" style="margin-top:6px;">当前模式：' + (modes().find((m) => m.k === mode) || {}).n + '（' + (mode === "1v1" ? "单人角色对战" : "最多 3 名角色组队") + '）</div>') +
    '</div>' +
    '<div class="card"><div class="card-title">🛡 我的防守队</div>' +
      '<div class="hint">' + (isHost ? "主机端：使用原创角色自动布防" : "玩家端：使用你自己的最新角色自动布防") + '</div>' +
      '<div style="margin-top:6px;">' + defHtml + '</div>' + goTrain + '</div>' +
    (mode === "room" ? "" : '<div class="card"><div class="card-title">⚔️ 挑战</div>' + list + '</div>') +
    '<div class="card"><div class="card-title">🪙 竞技币兑换</div>' +
      '<div class="row"><span class="k">R 碎片 ×10<div class="hint">30 币</div></span><span class="v"><button data-shop="shardR">兑换</button></span></div>' +
      '<div class="row"><span class="k">SR 碎片 ×5<div class="hint">90 币</div></span><span class="v"><button data-shop="shardSR">兑换</button></span></div>' +
      '<div class="row"><span class="k">SSR 碎片 ×2<div class="hint">150 币</div></span><span class="v"><button data-shop="shardSSR">兑换</button></span></div>' +
      '<div class="row"><span class="k">金币袋（5,000）<div class="hint">40 币</div></span><span class="v"><button data-shop="gold">兑换</button></span></div>' +
      '<div class="row"><span class="k">随机 R 装备箱<div class="hint">60 币</div></span><span class="v"><button data-shop="boxR">兑换</button></span></div>' +
      '<div class="row"><span class="k">随机 SR 装备箱<div class="hint">200 币</div></span><span class="v"><button data-shop="boxSR">兑换</button></span></div>' +
    '</div>';
  bind();
}

function bind() {
  document.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => { window.__amode = b.dataset.mode; render(); });
  if ($("btnRoom")) $("btnRoom").onclick = async () => {
    try {
      const r = await createRoom(me, myName);
      if (!r || !r.ok) return toast("建房失败：" + ((r && r.reason) || "未知"), true);
      location.href = "rooms.html?room=" + encodeURIComponent(r.id) + "&box=" + encodeURIComponent(me);
    } catch (e) { toast("建房失败：" + (e && e.message || e), true); }
  };
  document.querySelectorAll("[data-chal]").forEach((b) => b.onclick = () => {
    const rec = myRec();
    if (dailyUsed(rec) >= 5) return toast("今日挑战次数已用完（5/5）", true);
    location.href = "battle.html?box=" + encodeURIComponent(me) + "&arena=" + encodeURIComponent(b.dataset.chal) +
      "&char=" + encodeURIComponent(b.dataset.char || "") + "&mode=" + (window.__amode || "1v1");
  });
  document.querySelectorAll("[data-shop]").forEach((b) => b.onclick = async () => {
    const k = b.dataset.shop;
    const COST = { shardR: 30, shardSR: 90, shardSSR: 150, gold: 40, boxR: 60, boxSR: 200 };
    const rec = myRec() || { name: myName, pts: 0, w: 0, l: 0, coin: 0, team: [] };
    const cost = COST[k] || 0;
    if ((Number(rec.coin) || 0) < cost) return toast("竞技币不足（需 " + cost + "）", true);
    rec.coin = (Number(rec.coin) || 0) - cost;
    const f = (store.flags = store.flags || {});
    if (k === "shardR") f.shardR = (Number(f.shardR) || 0) + 10;
    else if (k === "shardSR") f.shardSR = (Number(f.shardSR) || 0) + 5;
    else if (k === "shardSSR") f.shardSSR = (Number(f.shardSSR) || 0) + 2;
    else if (k === "gold") store.gold = (Number(store.gold) || 0) + 5000;
    else {
      const pool = (k === "boxR" ? [ARMORS, ACCESSORIES, WEAPONS] : [ARMORS, ACCESSORIES, WEAPONS]);
      const arr = pool[Math.floor(Math.random() * pool.length)].filter((x) => x.rarity === (k === "boxR" ? "R" : "SR"));
      if (arr.length) store.items.push(makeItem(arr[0].cat || (pool[0] === WEAPONS ? "weapon" : pool[0] === ARMORS ? "armor" : "accessory"), arr[Math.floor(Math.random() * arr.length)]));
    }
    data.players[me] = rec;
    try { await saveStore(); await saveArena(); render(); toast("兑换成功"); } catch (e) { toast("兑换失败：" + (e && e.message || e), true); }
  });
}

async function ensureMyTeam() {
  const rec = myRec();
  if (rec && Array.isArray(rec.team) && rec.team.length) return;
  const snap = snapshot();
  if (!snap) return;
  const r2 = rec || { name: myName, pts: 0, w: 0, l: 0, coin: 0, team: [] };
  r2.team = [snap];
  r2.name = myName;
  data.players[me] = r2;
  try { await saveArena(); } catch (e) {}
}

(async () => {
  try {
  store = await loadStore();
  if (!store) {
    $("view").innerHTML = '<div class="card"><div class="card-title">🏟 竞技场</div><div class="hint">没读到存档（位号 ' + esc(me) + '）。先在个人页建角色，再回来布防。</div><div style="margin-top:8px;"><a href="create.html"><button>去个人页</button></a></div></div>';
    return;
  }
  await buildCandidates();
  if (!candidates.length) {
    $("view").innerHTML = '<div class="card"><div class="card-title">🏟 竞技场</div><div class="hint">你还没有角色，先去建一个再来布防。</div><div style="margin-top:8px;"><a href="create.html"><button>去建角色</button></a></div></div>';
    return;
  }
  await loadArena();
  await loadCloudPlayers();
  await ensureMyTeam();
  render();
  } catch (e) {
    document.getElementById("view").innerHTML = '<div class="card"><div class="card-title">竞技场初始化失败</div><div class="hint">' + String(e && e.message || e) + '</div></div>';
  }
})();
</script>
</body>
</html>
