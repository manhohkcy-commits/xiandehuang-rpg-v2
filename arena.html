<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲得慌RPG v2 · 竞技场</title>
<link rel="stylesheet" href="css/app.css?v=e0ed2d33">
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="index.html">← 返回</a><span class="tag">竞技场</span>
    <a href="lobby.html" style="margin-left:auto;">🏛 大厅</a></div>
  <div id="view"><div class="card"><div class="hint">载入竞技场…</div></div></div>
</div>
<div id="toast" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:8px 16px;border-radius:20px;background:#1b2740;border:1px solid #6ea8fe;color:#cfe6ff;display:none;z-index:99;"></div>
<script type="module">
import { cacheLoad, cacheSave, cloudGet, cloudSave } from "./js/core.js?v=13807141";
import { charFinal, charPower } from "./js/power.js?v=42e16747";
import { WEAPONS, ARMORS, ACCESSORIES } from "./js/data.js?v=1502963d";
import { makeItem } from "./js/items.js?v=4c8258c6";
import { pullOriginals, originalFinal } from "./js/originals.js?v=8c637db3";
import { createRoom } from "./js/room.js?v=17f71e85";

const BOX = "__arena";
const me = (() => {
  try {
    if (localStorage.getItem("rpg2:host") === "1") return localStorage.getItem("rpg2:hostBox") || "zynSD117";
    return localStorage.getItem("rpg2:box") || localStorage.getItem("rpg2:hostBox") || "zynSD117";
  } catch (e) { return "zynSD117"; }
})();
const myName = localStorage.getItem("rpg2:name") || "无名";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
window.addEventListener("error", (e) => {
  const v = document.getElementById("view");
  if (v) v.innerHTML = '<div class="card"><div class="card-title">竞技场加载出错</div><div class="hint">' + String(e.message || e) + '</div></div>';
});
let toastT = null;
function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  t.style.borderColor = bad ? "#ff6b6b" : "#6ea8fe";
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.style.display = "none"; }, 1800);
}

let store = null;
let updatedAt = null;
async function loadStore() {
  let s = null;
  try { s = cacheLoad(me); } catch (e) {}
  try {
    const row = await cloudGet(me);
    if (row && row.store && Number(row.store.v) === 2) { s = row.store; updatedAt = row.updated_at || null; }
  } catch (e) {}
  return s;
}
async function saveStore() {
  if (!store) return;
  store.__at = Date.now();
  try { cacheSave(me, store); } catch (e) {}
  try {
    const r = await cloudSave(me, store, updatedAt || null, (store.chars && store.chars[0] && store.chars[0].name) || "");
    if (r && r.ok) updatedAt = (r.row && r.row.updated_at) || updatedAt;
  } catch (e) {}
}
let data = { v: 1, players: {} };   // { box: { name, pts, w, l, team:[...] } }

async function loadArena() {
  try {
    const r = await cloudGet(BOX);
    const s = r && r.store;
    if (s && s.arena && s.arena.players) data = s.arena;
    else if (s && s.players) data = s;
  } catch (e) { /* 首次为空 */ }
}

async function saveArena() {
  let r0 = null;
  try { r0 = await cloudGet(BOX); } catch (e) {}
  const payload = { v: 2, items: [], chars: [], msgs: [], arena: data };
  const r = await cloudSave(BOX, payload, r0 && r0.updated_at, "竞技场");
  if (!r || r.ok === false) throw new Error((r && r.reason) || "云端写入失败");
  return r;
}

function myRec() {
  return data.players[me] || null;
}

let candidates = [];
async function buildCandidates() {
  candidates = [];
  const chars = candidates;
  if (chars.length) {
    chars.forEach((ch) => {
      const f = charFinal(ch);
      candidates.push({ name: ch.name, lv: ch.lv || 1, atk: Math.round(f.atk), hp: Math.round(f.hp), spd: Math.round(f.spd || 0) });
    });
    return;
  }
  // 原创角色仅主机端可用；玩家端只能用自建角色
  let isHostMode = false;
  try { isHostMode = localStorage.getItem("rpg2:host") === "1"; } catch (e) {}
  if (!isHostMode) return;
  try {
    const origs = await pullOriginals();
    (origs || []).forEach((o) => {
      const prog = (store && store.orig && store.orig[o.id]) || {};
      const f = originalFinal(o, {});
      candidates.push({ name: o.name, lv: prog.lv || 1, atk: Math.round(f.atk), hp: Math.round(f.hp), spd: Math.round(f.spd || 0), power: Math.round(f.power || 0) });
    });
  } catch (e) {}
}

function currentChar() {
  const chars = (store && store.chars) || [];
  if (chars.length) {
    const act = chars.find((x) => x.id === store.activeChar) || chars[0];
    return { name: act.name, lv: act.lv || 1 };
  }
  const c0 = candidates[0];
  return c0 ? { name: c0.name, lv: c0.lv } : null;
}
function snapshot() {
  const chars = (store && store.chars) || [];
  if (chars.length) {
    const act = chars.find((x) => x.id === store.activeChar) || chars[0];
    const f = charFinal(act);
    return { name: act.name, lv: act.lv || 1, atk: Math.round(f.atk), hp: Math.round(f.hp), spd: Math.round(f.spd || 0) };
  }
  const c0 = candidates[0];
  return c0 ? { name: c0.name, lv: c0.lv, atk: c0.atk, hp: c0.hp, spd: c0.spd, power: c0.power } : null;
}

function powerOf(team) {
  return team.reduce((s, t) => s + t.atk * 2 + t.hp * 0.5, 0);
}

function today() { return new Date().toISOString().slice(0, 10); }
function dailyUsed(rec) {
  if (!rec) return 0;
  return rec.day === today() ? (Number(rec.used) || 0) : 0;
}
function render() {
  const chars = (store && store.chars) || [];
  const rec = myRec();
  const myTeam = (rec && Array.isArray(rec.team)) ? rec.team : [];
  const others = Object.keys(data.players).filter((k) => k !== me).map((k) => ({ box: k, ...data.players[k] }));
  others.sort((a, b) => b.pts - a.pts);

  const defender = myTeam[0] || null;
  const pick = defender
    ? '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;"><span>' + esc(defender.name) + '（Lv' + defender.lv + '）</span><span style="color:#6ea8fe;font-weight:700;">战力 ' + Math.round(defender.power != null ? defender.power : (defender.atk * 2 + defender.hp * 0.5)) + '</span></div>'
    : '<div class="hint">还没布防，点下面按钮即可用当前角色布防</div>';

  const list = others.length
    ? others.map((o) => {
      const p = powerOf(o.team || []);
      return '<div class="row"><span class="k">' + esc(o.name) + '<div class="hint">积分 ' + (o.pts || 0) + ' · ' + (o.w || 0) + "胜 " + (o.l || 0) + '负 · 战力 ' + Math.round(p) + '</div></span>' +
        '<span class="v"><button data-fight="' + esc(o.box) + '">挑战</button></span></div>';
    }).join("")
    : '<div class="hint">还没有其他玩家布防，等朋友进来后就会出现在这里。</div>';

  $("view").innerHTML =
    '<div class="card"><div class="card-title">🏟 竞技场</div>' +
    '<div class="hint">积分 ' + (rec ? rec.pts || 0 : 0) + ' · ' + (rec ? (rec.w || 0) + "胜 " + (rec.l || 0) + "负" : "尚未布防") + '</div>' +
    '<div class="hint">🪙 竞技币 ' + (rec ? rec.coin || 0 : 0) + ' · 今日挑战 ' + dailyUsed(rec) + '/5</div>' +
    '<button id="btnRoom" style="margin-top:8px;border-color:#7ee787;color:#7ee787;">🏠 开自定义房切磋（可观战）</button></div>' +
    '<div class="card"><div class="card-title">🛡 我的防守队</div>' +
    '<div class="hint">直接用当前角色布防，朋友挑战的就是这份快照</div>' +
    '<div style="margin-top:6px;">' + pick + '</div>' +
    '<button id="btnSaveTeam" style="margin-top:8px;border-color:#ffd666;color:#ffd666;">🔄 用当前角色布防</button></div>' +
    '<div class="card"><div class="card-title">⚔️ 挑战</div>' + list + '</div>' +
    '<div class="card"><div class="card-title">🪙 竞技币兑换</div>' +
    '<div class="row"><span class="k">R 碎片 ×10<div class="hint">30 币</div></span><span class="v"><button data-shop="shardR">兑换</button></span></div>' +
    '<div class="row"><span class="k">SR 碎片 ×5<div class="hint">90 币</div></span><span class="v"><button data-shop="shardSR">兑换</button></span></div>' +
    '<div class="row"><span class="k">SSR 碎片 ×2<div class="hint">150 币</div></span><span class="v"><button data-shop="shardSSR">兑换</button></span></div>' +
    '<div class="row"><span class="k">金币袋（5,000）<div class="hint">40 币</div></span><span class="v"><button data-shop="gold">兑换</button></span></div>' +
    '<div class="row"><span class="k">随机 R 装备箱<div class="hint">60 币</div></span><span class="v"><button data-shop="boxR">兑换</button></span></div>' +
    '<div class="row"><span class="k">随机 SR 装备箱<div class="hint">200 币</div></span><span class="v"><button data-shop="boxSR">兑换</button></span></div>' +
    '</div>';
  bind();
}

function bind() {
  if ($("btnRoom")) $("btnRoom").onclick = async () => {
    try {
      const r = await createRoom(me, myName);
      if (!r || !r.ok) return toast("建房失败：" + ((r && r.reason) || "未知"), true);
      location.href = "rooms.html?room=" + encodeURIComponent(r.id) + "&box=" + encodeURIComponent(me);
    } catch (e) { toast("建房失败：" + (e && e.message || e), true); }
  };
  if ($("btnSaveTeam")) $("btnSaveTeam").onclick = async () => {
    const snap = snapshot();
    if (!snap) return toast("没有角色", true);
    const rec = myRec() || { name: myName, pts: 0, w: 0, l: 0, coin: 0, team: [] };
    rec.team = [snap];
    rec.name = myName;
    data.players[me] = rec;
    try { await saveArena(); render(); toast("已用 " + snap.name + " 布防"); } catch (e) { toast("保存失败：" + (e && e.message || e), true); }
  };
  document.querySelectorAll("[data-fight]").forEach((b) => b.onclick = async () => {
    const rec = myRec();
    if (!rec || !rec.team || !rec.team.length) return toast("先保存防守队", true);
    const foe = data.players[b.dataset.fight];
    if (!foe) return;
    if (dailyUsed(rec) >= 5) return toast("今日挑战次数已用完（5/5）", true);
    if (rec.day !== today()) { rec.day = today(); rec.used = 0; }
    const teamPower = (t) => t.reduce((s, x) => s + (x.power != null ? Number(x.power) : (x.atk * 2 + x.hp * 0.5)), 0);
    const myP = teamPower(rec.team), foeP = teamPower(foe.team || []);
    const luck = 0.85 + Math.random() * 0.3;
    const win = myP * luck >= foeP;
    const pts = win ? 20 : -10;
    rec.pts = Math.max(0, (rec.pts || 0) + pts);
    if (win) rec.w = (rec.w || 0) + 1; else rec.l = (rec.l || 0) + 1;
    rec.used = dailyUsed(rec) + 1;
    rec.coin = (Number(rec.coin) || 0) + (win ? 10 : 3);
    foe.pts = Math.max(0, (foe.pts || 0) - (win ? 10 : 0));
    data.players[me] = rec;
    try { await saveArena(); } catch (e) {}
    toast((win ? "🏆 胜利！+" : "💀 失败…") + pts + " 分", !win);
    render();
  });
}

(async () => {
  try {
  store = await loadStore();
  if (!store) {
    $("view").innerHTML = '<div class="card"><div class="card-title">🏟 竞技场</div><div class="hint">没读到存档（位号 ' + esc(me) + '）。先在个人页建角色，再回来布防。</div><div style="margin-top:8px;"><a href="create.html"><button>去个人页</button></a></div></div>';
    return;
  }
  await buildCandidates();
  if (!candidates.length) {
    $("view").innerHTML = '<div class="card"><div class="card-title">🏟 竞技场</div><div class="hint">你还没有角色，先去建一个再来布防。</div><div style="margin-top:8px;"><a href="create.html"><button>去建角色</button></a></div></div>';
    return;
  }
  await loadArena();
  render();
  } catch (e) {
    document.getElementById("view").innerHTML = '<div class="card"><div class="card-title">竞技场初始化失败</div><div class="hint">' + String(e && e.message || e) + '</div></div>';
  }
})();
</script>
</body>
</html>
