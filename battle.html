<!DOCTYPE html>
<html lang="zh-HK">
<head>

<body>
<div class="wrap">
  <div class="nav">
    <a href="index.html">← 返回</a>
    <a href="create.html" id="backCreate">🎒 我的角色</a>
    <span class="tag" id="boxTag">—</span>
    <button id="btnSave" style="margin-left:auto;">💾 保存</button>
  </div>
  <div id="view"></div>

<script type="module">
import { cloudGet, cloudSave, cacheLoad, cacheSave, esc, fmt, addReceipt, gateLoad, bumpDaily } from "./js/core.js?v=13807141";
import { getRoom, putRoom, pushIntent, takeIntents, buildUnits, unitOfPlayer } from "./js/room.js?v=f9b6158c";
import { WEAPONS, ARMORS, ACCESSORIES, STAGES, STAGE_READY, CHAR } from "./js/data.js?v=2345f7f0";
import { ORIGINALS, originalToUnits } from "./js/originals.js?v=bcbdbf7b";
import { makeItem } from "./js/items.js?v=a07fdd52";
import { charFinal, charPower, combatTraits, talentActive } from "./js/power.js?v=789e90d1";
import { createBattle, nextActor, commit, damage, setCooldown, aliveUnits, applyStatus, addStatus, isStunned, isSilenced, isDisarmed, canUseSkill, canUseNormal, healUnit, addShield, dispel, hasStatus } from "./js/battle.js?v=c4ed415b";

let box = "", store = null, updatedAt = "", st = null, log = [], busy = false, lastRound = 1;
// 🧬 当前操控的原创角色（记住上次选择，换页不丢）
window.__playOrig = localStorage.getItem("rpg2:playAs") || null;

// 🤝 同行队伍（最多 5 名友方原创角色，默认托管）
function partyIds() { try { return JSON.parse(localStorage.getItem("rpg2:party") || "[]"); } catch (e) { return []; } }
function setParty(a) { try { localStorage.setItem("rpg2:party", JSON.stringify(a.slice(0, 5))); } catch (e) {} }
const $ = (id) => document.getElementById(id);
const view = () => $("view");
const activeChar = () => (store && store.chars || []).find((c) => c.id === store.activeChar) || (store && store.chars || [])[0] || null;
// 武器数据兼容两种存法：装备里直接存 data，或存 {cat,data} 包装
const wpOf = (w) => (w && (w.data || (w.sMult != null || w.sName || w.hitStatus ? w : null))) || {};
// 多段攻击：总倍率平均分到 N 段，每段独立判定暴击
function strike(st, atkId, defId, opts, hits) {
  const n = Math.max(1, Number(hits) || 1);
  let dmg = 0, crit = false, killed = false;
  for (let i = 0; i < n; i++) {
    const r = damage(st, atkId, defId, Object.assign({}, opts, { mult: (Number(opts.mult) || 100) / n }));
    dmg += r.dmg; crit = crit || r.crit; killed = killed || r.killed;
    if (killed) break;
  }
  return { dmg, crit, killed };
}

function readBox() {
  const q = new URLSearchParams(location.search);
  if (q.get("box")) return q.get("box");
  return localStorage.getItem("rpg2:box") || "";
}

async function load() {
  box = readBox();
  $("boxTag").textContent = box || "缺 box";
  $("backCreate").href = "create.html" + (box ? "?box=" + encodeURIComponent(box) : "");
  const g = await gateLoad(box, {});
  if (!g.ok) {
    view().innerHTML = '<div class="card"><div class="card-title">进不去</div><div class="hint">' + esc(g.reason) + '</div>' +
      '<div class="hint" style="margin-top:6px;">先去 <a href="create.html?box=' + encodeURIComponent(box) + '">我的角色</a> 验证一次</div></div>';
    return;
  }
  store = g.store; updatedAt = g.updatedAt || "";
  renderPick();
}

async function save() {
  if (!box || !store) return false;
  store.__at = Date.now();
  cacheSave(box, store);
  if (!updatedAt) return false;   // 新位号还没云端行：本机试用模式
  try {
    const r = await cloudSave(box, store, updatedAt, activeChar() ? activeChar().name : "");
    if (r.ok) updatedAt = r.row.updated_at || updatedAt;
    return r.ok;
  } catch (e) { return false; }
}

// ── 选关 ──────────────────────────────────────────────
function renderPick() {
  const ch = activeChar();
  if (!ch) { view().innerHTML = '<div class="card"><div class="hint">没有角色。先去「我的角色」建一个。</div></div>'; return; }
  const f = charFinal(ch);
  const origList = ORIGINALS.filter((o) => o.camp !== "ally");
  const playOrig = window.__playOrig ? ORIGINALS.find((o) => o.id === window.__playOrig) : null;
  view().innerHTML =
    '<div class="card" style="border-color:' + (playOrig ? "#ffb347" : "#2f4a6a") + ';">' +
      '<div class="card-title" style="color:' + (playOrig ? "#ffb347" : "#6ea8fe") + ';">当前操控</div>' +
      (playOrig
        ? '<div style="font-size:15px;font-weight:800;color:#ffb347;">🧬 ' + esc(playOrig.name) + '（原创角色）</div>' +
          '<div class="hint">胜利经验归他本人，不进你的玩家存档。</div>'
        : '<div style="font-size:15px;font-weight:800;color:#6ea8fe;">🧑 ' + esc(ch.name) + '（我的角色）</div>' +
          '<div class="hint">奖励进入你的玩家存档。</div>') +
    '</div>' +
    '<div class="card"><div class="card-title">出战角色</div>' +
      '<div class="row"><span class="k">🧑 ' + esc(ch.name) + '<div class="hint">我的角色 · Lv' + ch.lv + ' · 战力 ' + fmt(charPower(ch)) + '</div></span>' +
        '<span class="v"><button data-play="me" ' + (playOrig ? '' : 'style="border-color:#6ea8fe;color:#6ea8fe;"') + '>' + (playOrig ? "选择" : "✅ 出战中") + '</button></span></div>' +
      (origList.length
        ? origList.map((o) => {
            const prog = (store.orig && store.orig[o.id]) || { lv: 1, exp: 0 };
            return '<div class="row"><span class="k">🧬 ' + esc(o.name) + (o.title ? ' <span class="hint">' + esc(o.title) + '</span>' : '') +
              '<div class="hint">原创角色 · Lv' + prog.lv + ' · 经验 ' + fmt(prog.exp) + '</div></span>' +
              '<span class="v"><button data-playorig="' + o.id + '" ' + (playOrig && playOrig.id === o.id ? 'style="border-color:#ffb347;color:#ffb347;"' : '') + '>' +
              (playOrig && playOrig.id === o.id ? "✅ 出战中" : "选择") + '</button></span></div>';
          }).join("")
        : '<div class="hint">还没有原创角色（主机端设计好后会出现）。</div>') +
    '</div>' +
    '<div class="card"><div class="card-title">当前面板</div>' +
      (playOrig
        ? (() => { const s = origStats(playOrig); return '<div class="hint">🧬 ' + esc(playOrig.name) + '（原创角色）</div>' +
            '<div class="row"><span class="k">攻击 / 生命</span><span class="v">' + Math.round(s.atk) + ' / ' + Math.round(s.hp) + '</span></div>' +
            '<div class="row"><span class="k">防御 / 法抗</span><span class="v">' + Math.round(s.def) + ' / ' + Math.round(s.res) + '</span></div>'; })()
        : '<div class="row"><span class="k">' + esc(ch.name) + '</span><span class="v">Lv' + ch.lv + ' · 战力 ' + fmt(charPower(ch)) + '</span></div>' +
          '<div class="hint">攻击 ' + Math.round(f.atk) + ' · 生命 ' + Math.round(f.hp) + ' · 防御 ' + Math.round(f.def) + ' · 速度 ' + Math.round(f.spd * 10) / 10 + '</div>') +
    '</div>' +
    (ORIGINALS.filter((o) => o.camp === "ally").length
      ? '<div class="card"><div class="card-title">🤝 同行队伍（最多 5，默认托管）</div>' +
        ORIGINALS.filter((o) => o.camp === "ally").map((o) => {
          const on = partyIds().indexOf(o.id) >= 0;
          return '<div class="row"><span class="k">' + esc(o.name) + ' <span class="hint">' + esc(o.role || "") + '</span></span>' +
            '<span class="v"><button data-party="' + o.id + '" ' + (on ? 'style="border-color:#7ee787;color:#7ee787;"' : '') + '>' +
            (on ? "✅ 已入队" : "加入") + '</button></span></div>';
        }).join("") + '</div>'
      : "") +
    '<div class="card"><div class="card-title">' + (STAGE_READY ? "选择关卡" : "开始战斗") + '</div>' +
      (STAGE_READY
        ? STAGES.map((s) => '<div class="row"><span class="k">' + esc(s.name) +
            '<div class="hint">' + esc(s.foe.name) + ' Lv' + s.foe.lv + ' · HP ' + fmt(s.foe.hp) + ' · 攻 ' + s.foe.atk + '</div></span>' +
            '<span class="v"><button data-stage="' + s.id + '">开战</button></span></div>').join("")
        : '<div class="hint">关卡内容待定，先用默认训练场试功能。</div>' +
          '<div class="row"><span class="k">默认训练场</span><span class="v"><button data-stage="' + STAGES[0].id + '">开战</button></span></div>') +
    '</div>' +
    (ORIGINALS.length
      ? '<div class="card"><div class="card-title">原创角色</div>' +
        ORIGINALS.filter((o) => o.camp !== "ally").map((o) =>
          '<div class="row"><span class="k">' + esc(o.name) + (o.title ? ' <span class="hint">' + esc(o.title) + '</span>' : '') +
          '<div class="hint">' + esc(o.role || "") + ' · 攻击 ' + (o.stats && o.stats.atk) + ' · 生命 ' + (o.stats && o.stats.hp) + '</div></span>' +
          '<span class="v"><button data-orig="' + o.id + '">挑战</button></span></div>').join("") +
        ORIGINALS.filter((o) => o.camp === "ally").map((o) =>
          '<div class="row"><span class="k">' + esc(o.name) + ' <span class="hint">友方</span></span>' +
          '<span class="v"><button data-ally="' + o.id + '">' + (window.__allyId === o.id ? "✅ 已同行" : "邀请同行") + '</button></span></div>').join("") +
        '</div>'
      : "");
  view().querySelectorAll("[data-play]").forEach((b) => b.onclick = () => {
    window.__playOrig = null;
    try { localStorage.removeItem("rpg2:playAs"); } catch (e) {}
    renderPick();
  });
  view().querySelectorAll("[data-playorig]").forEach((b) => b.onclick = () => {
    window.__playOrig = b.dataset.playorig;
    try { localStorage.setItem("rpg2:playAs", window.__playOrig); } catch (e) {}
    renderPick();
  });
  view().querySelectorAll("[data-stage]").forEach((b) => {
    b.onclick = () => startBattle(b.dataset.stage);
  });
  view().querySelectorAll("[data-orig]").forEach((b) => {
    b.onclick = () => startOriginal(b.dataset.orig);
  });
  // 🤝 同行队伍多选
  view().querySelectorAll("[data-party]").forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.party;
      const cur = partyIds();
      const i = cur.indexOf(id);
      if (i >= 0) cur.splice(i, 1);
      else { if (cur.length >= 5) return toast("最多 5 名同行", true); cur.push(id); }
      setParty(cur);
      renderPick();
    };
  });
  view().querySelectorAll("[data-ally]").forEach((b) => {
    b.onclick = () => { window.__allyId = b.dataset.ally; toast("已邀请同行"); renderPick(); };
  });
}

// ── 开战 ──────────────────────────────────────────────
// 🧑‍🤝‍🧑 多人建战：把房间成员的角色快照补全，生成 2v2 / 3v3 单位表
async function buildMultiBattle(stageId) {
  const got = await getRoom(roomId);
  if (!got) return false;
  const room = got.room;
  const stg = STAGES.find((x) => x.id === stageId) || STAGES[0];
  // 1) 补全每个成员的角色快照
  for (const bx of Object.keys(room.members || {})) {
    const m = room.members[bx];
    if (m.char) continue;
    let ch = null;
    if (bx === box) { ch = activeChar(); }
    else {
      try {
        const row = await cloudGet(bx);
        const s2 = row && row.store;
        if (s2 && Number(s2.v) === 2) ch = (s2.chars || [])[0] || null;
      } catch (e) {}
    }
    if (ch) {
      const f = charFinal(ch);
      m.char = {
        lv: ch.lv, atk: f.atk, hp: f.hp, def: f.def, res: f.res, spd: f.spd,
        critRate: f.critRate, critDmg: f.critDmg, dmgCut: f.dmgCut,
        weapon: (ch.equip && ch.equip.weapon) || null,
        traits: combatTraits(ch)
      };
    } else {
      m.char = { lv: 1, atk: 60, hp: 500, def: 20, res: 15, spd: 10, critRate: 5, critDmg: 150, dmgCut: 0, traits: {} };
    }
  }
  // 2) 生成单位
  const built = buildUnits(room, 6);
  st = createBattle(built.units.map((u) => Object.assign({ power: 0 }, u)));
  st.__stage = stg.id;
  st.__owners = built.owners;
  st.__multi = true;
  const myUnit = unitOfPlayer(room, box);
  st.__myUnit = myUnit;
  st.__weapon = (myUnit && built.units.find((u) => u.id === myUnit) || {}).weapon || null;
  st.__talent = talentActive(activeChar());
  log = [];
  lastRound = 1;
  pushLog("— 回合 1 —", "hdr");
  pushLog("👥 多人战：蓝方 " + built.units.filter((u) => u.side === "A").length + " 人 · 红方 " + built.units.filter((u) => u.side === "B").length + " 人", "line");
  await putRoom(Object.assign(room, { phase: "fighting" }), got.updatedAt);
  renderBattle();
  setTimeout(aiTurnIfNeeded, 300);
  return true;
}

// ♻️ 房主刷新后恢复对局：从房间 state 重建战斗
async function tryRestore() {
  if (!roomId) return false;
  const got = await getRoom(roomId);
  if (!got || got.room.host !== box) return false;
  const s = got.room.state;
  if (!s || s.finished || !s.units || !s.units.length) return false;
  st = createBattle(s.units.map((u) => ({
    id: u.id, name: u.name, side: u.side, spd: u.spd, power: 0,
    hp: u.hp, maxHp: u.maxHp, atk: u.atk || 60, def: u.def || 20,
    critRate: u.critRate || 5, critDmg: u.critDmg || 150, dmgCut: u.dmgCut || 0,
    traits: u.traits || {}, weapon: u.weapon || null, rage: u.rage || 0
  })));
  // 把当时的血量/冷却/怒气/状态/回合贴回去
  st.round = Number(s.round) || 1;
  st.__stage = s.stage || "k1";
  st.__owners = s.owners || null;
  st.__myUnit = unitOfPlayer(got.room, box);
  st.__restored = true;
  st.units.forEach((u) => {
    const src = s.units.find((x) => x.id === u.id);
    if (!src) return;
    u.hp = src.hp; u.maxHp = src.maxHp; u.cd = src.cd || 0; u.rage = src.rage || 0;
    u.shield = src.shield || 0;
    u.statuses = src.statuses || [];
    if (u.hp <= 0) u.alive = false;
  });
  // 回合开始标记：把已行动次数清掉（恢复后按新回合开始）
  st.units.forEach((u) => { u.acted = 0; u.allowed = 1; });
  log = (s.log || []).slice(-40);
  lastRound = st.round;
  pushLog("♻️ 已从房间恢复对局（回合 " + st.round + "）", "line");
  renderBattle();
  setTimeout(aiTurnIfNeeded, 300);
  return true;
}

// 🧬 原创角色：按自己的等级成长（每级 +5% 攻/血/防/抗，速度 +0.1）
function origStats(o) {
  const prog = (store.orig && store.orig[o.id]) || { lv: 1, exp: 0 };
  const lv = Number(prog.lv) || 1;
  const k = 1 + 0.05 * (lv - 1);
  const s = o.stats || {};
  return {
    atk: (Number(s.atk) || 60) * k, hp: (Number(s.hp) || 500) * k,
    def: (Number(s.def) || 20) * k, res: (Number(s.res) || 15) * k,
    spd: (Number(s.spd) || 10) + 0.1 * (lv - 1),
    critRate: Number(s.critRate) || 5, critDmg: Number(s.critDmg) || 150
  };
}

function startOriginal(id) {
  const o = ORIGINALS.find((x) => x.id === id);
  if (!o) return;
  const ch = activeChar();
  if (!ch) return;
  const f = charFinal(ch);
  const traits = combatTraits(ch);
  const foe = originalToUnits(o, "B");
  st = createBattle([
    { id: "me", name: ch.name, side: "A", spd: f.spd, power: charPower(ch), hp: f.hp, maxHp: f.hp, atk: f.atk, def: f.def, critRate: f.critRate, critDmg: f.critDmg, dmgCut: f.dmgCut, traits },
    foe
  ]);
  st.__stage = STAGES[0].id;   // 奖励沿用训练场
  st.__auto = localStorage.getItem("rpg2:auto") === "1";
  st.__weapon = ch.equip.weapon || null;
  st.__talent = talentActive(ch);
  log = [];
  lastRound = 1;
  pushLog("— 回合 1 —", "hdr");
  pushLog("⚔️ 挑战原创角色：" + o.name + (o.title ? "（" + o.title + "）" : ""), "line");
  renderBattle();
  aiTurnIfNeeded();
}

function startBattle(stageId) {
  if (roomId && amHost) { buildMultiBattle(stageId); return; }
  const ch = activeChar();
  const f = charFinal(ch);
  const traits = combatTraits(ch);
  const s = STAGES.find((x) => x.id === stageId);
  if (!s) return;
  const playOrig = window.__playOrig ? ORIGINALS.find((o) => o.id === window.__playOrig) : null;
  const meUnit = playOrig
    ? (() => {
        const g = origStats(playOrig);
        return { id: "me", name: playOrig.name, side: "A", spd: g.spd, power: 0, hp: g.hp, maxHp: g.hp, atk: g.atk, def: g.def, critRate: g.critRate, critDmg: g.critDmg };
      })()
    : { id: "me", name: ch.name, side: "A", spd: f.spd, power: charPower(ch), hp: f.hp, maxHp: f.hp, atk: f.atk, def: f.def, critRate: f.critRate, critDmg: f.critDmg, dmgCut: f.dmgCut, traits };
  const units = [
    meUnit,
    { id: "foe", name: s.foe.name, side: "B", spd: s.foe.spd, power: 0, hp: s.foe.hp, maxHp: s.foe.hp, atk: s.foe.atk, def: s.foe.def, critRate: 5, critDmg: 150 }
  ];
  st = createBattle(units);
  st.__origId = playOrig ? playOrig.id : null;
  st.__auto = localStorage.getItem("rpg2:auto") === "1";
  // 🍱 战前准备：便利店的食物，下一场生效
  const meal = store.flags && store.flags.meal;
  if (meal && !playOrig) {
    const b = meal.buff || {};
    const u = st.units.find((x) => x.id === "me");
    if (u) {
      u.hp = Math.round(u.hp * (1 + (b.hpPct || 0) / 100)); u.maxHp = u.hp;
      u.atk = Math.round(u.atk * (1 + (b.atkPct || 0) / 100));
      u.def = Math.round(u.def * (1 + (b.defPct || 0) / 100));
      u.spd = Math.round((u.spd + (b.spd || 0)) * 10) / 10;
      st.__meal = meal.name;
    }
  }
  // 🤝 同行队伍：最多 5 名友方原创角色，作为独立单位（默认托管）
  const party = partyIds().map((id) => ORIGINALS.find((o) => o.id === id)).filter((o) => o && o.camp === "ally").slice(0, 5);
  if (party.length) {
    st.__party = [];
    party.forEach((o) => {
      const g = origStats(o);
      const u = originalToUnits(o, "A");
      Object.assign(u, { id: "o_" + o.id, hp: g.hp, maxHp: g.hp, atk: g.atk, def: g.def, spd: g.spd, critRate: g.critRate, critDmg: g.critDmg });
      st.units.push(u);
      st.__party.push(o.id);
    });
  }
  // 🤝 友方原创角色同行：作为不出现在行动条上的助战单位
  const ally = window.__allyId ? ORIGINALS.find((o) => o.id === window.__allyId && o.camp === "ally") : null;
  if (ally) {
    const u = originalToUnits(ally, "A");
    u.allowed = 0;
    st.units.push(u);
    st.__ally = u;
    pushLog("🤝 " + ally.name + " 与你同行", "line");
  }
  st.__stage = s.id;
  st.__weapon = playOrig ? null : (ch.equip.weapon || null);
  st.__talent = playOrig ? null : talentActive(ch);
  log = [];
  lastRound = 1;
  pushLog("— 回合 1 —", "hdr");
  if (st.__meal) pushLog("🍱 战前准备：" + st.__meal + " 生效（本场）", "line");
  renderBattle();
  aiTurnIfNeeded();
}

// 行动条预览：本回合剩余 + 下一回合完整顺序
function previewOrder(n = 6) {
  if (!st) return [];
  const cmp = (a, b) => {
    if (b.spd !== a.spd) return b.spd - a.spd;
    if (b.power !== a.power) return b.power - a.power;
    if (a.side !== b.side) return a.side === "A" ? -1 : 1;
    return a.seq - b.seq;
  };
  const live = st.units.filter((u) => u.alive !== false);
  const pending = live.filter((u) => (u.acted || 0) < (u.allowed || 1)).sort(cmp);
  const out = pending.slice(0, n);
  if (live.length <= 1) return out;      // 只剩一人：不重复铺满
  if (out.length < n) {
    live.slice().sort(cmp).forEach((u) => { if (out.length < n) out.push(u); });
  }
  return out;
}

function queueHtml2() {
  if (!st) return "";
  const cmp = (a, b) => {
    if (b.spd !== a.spd) return b.spd - a.spd;
    if (b.power !== a.power) return b.power - a.power;
    if (a.side !== b.side) return a.side === "A" ? -1 : 1;
    return a.seq - b.seq;
  };
  const live = st.units.filter((u) => u.alive !== false);
  const nowList = live.filter((u) => (u.acted || 0) < (u.allowed || 1)).sort(cmp);
  const nextList = live.slice().sort(cmp);
  const cur = nextActor(st);

  const cell = (u, idx, showNum) => {
    const on = cur && u.id === cur.id;
    const col = u.side === "A" ? "#6ea8fe" : "#ff9b9b";
    return '<div style="flex:1;min-width:0;padding:4px 6px;border-radius:7px;text-align:center;' +
      'background:' + (on ? col + '33' : '#15152380') + ';border:1px solid ' + (on ? col : '#2f2f4a') + ';">' +
      '<div style="font-size:' + (on ? '11.5' : '10.5') + 'px;color:' + col + ';font-weight:' + (on ? '800' : '500') + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' +
      (on ? "▶ " : (showNum ? (idx + 1) + ". " : "")) + esc(u.name) + '</div>' +
      '<div style="font-size:9px;color:#5a5a78;">速 ' + Math.round(u.spd) + '</div></div>';
  };

  const left = nowList.map((u, i) => cell(u, i, true)).join("");
  const right = nextList.slice(0, 4).map((u) => cell(u, 0, false)).join("");
  return '<div style="margin:8px 0 4px;">' +
    '<div style="display:flex;justify-content:space-between;font-size:10px;color:#6a6a86;margin-bottom:4px;">' +
      '<span>本回合剩余</span><span>下回合</span></div>' +
    '<div style="display:flex;gap:4px;align-items:stretch;">' +
      '<div style="flex:2;display:flex;gap:4px;">' + (left || '<div style="flex:1;text-align:center;font-size:10.5px;color:#5a5a78;">（本回合已行动完）</div>') + '</div>' +
      '<div style="width:1px;background:#2f2f4a;margin:0 2px;"></div>' +
      '<div style="flex:2;display:flex;gap:4px;">' + (right || '') + '</div>' +
    '</div>' +
    '<div style="text-align:right;font-size:10px;color:#6a6a86;margin-top:3px;">回合 ' + st.round + '</div></div>';
}

    '</div>' +

function pushLog(text, kind, subs) {
  log.push({ text, kind: kind || "line", subs: subs || [] });
  if (log.length > 200) log = log.slice(-200);
}

// 回合切换时结算持续伤害（灼烧 = 每回合 最大生命 × v%）
// 防御加成只持续到「该单位下次行动」：出手前先还原
function clearDefend(u) {
  if (u && u.__defBonus) {
    u.dmgCut = Math.max(0, (Number(u.dmgCut) || 0) - 30);
    u.__defBonus = 0;
  }
}

function afterCommit() {
  if (!st || st.finished) return;
  if (st.round !== lastRound) {
    lastRound = st.round;
    pushLog("— 回合 " + st.round + " —", "hdr");
    tickStatuses();
  }
}

function tickStatuses() {
  if (!st) return;  ["me", "foe"].forEach((id) => {
    const u = st.units.find((x) => x.id === id);
    if (!u || u.alive === false) return;
    (u.statuses || []).forEach((s) => {
      if (s.key !== "burn") return;
      const d = Math.max(1, Math.round(u.maxHp * s.v / 100));
      u.hp = Math.max(0, u.hp - d);
      if (u.hp === 0) u.alive = false;
      pushLog("🔥 " + u.name + " 灼烧 −" + d);
    });
  });
}

function me() { return st.units.find((u) => u.id === "me"); }
function foe() { return st.units.find((u) => u.id === "foe"); }

function skillBtnHtml(m) {
  const wp = wpOf(st.__weapon);
  const name = wp.sName || "招式";
  const mult = Number(wp.sMult) || 150;
  const hits = Number(wp.sHits) || 1;
  const cdTotal = Number(wp.sCd) || 2;
  const rage = Number(wp.sRage) || 10;
  const cd = Number(m.cd) || 0;
  const can = cd <= 0;
  const core = "「" + name + "」" + (hits > 1 ? (hits + "×" + mult + "%（共 " + (hits * mult) + "%）") : (mult + "%")) +
    " · 冷却 " + cdTotal + " 回合 · 回怒 " + rage + "%";
  return '<button data-act="skill" ' + (can ? '' : 'disabled') + ' title="' + esc(core) + '">' +
    '🥋 ' + (can ? ('「' + esc(name) + '」' + (mult + "%")) : ('「' + esc(name) + '」冷却 ' + cd + ' 回合')) + '</button>' +
    '<div class="hint" style="flex-basis:100%;margin-top:4px;">' + esc(core) + (can ? '' : '（还剩 ' + cd + ' 回合）') + '</div>';
}

function ultBtnHtml(m) {

  const can = rage >= 100;
  return '<button data-act="ult" ' + (can ? '' : 'disabled') + ' title="必杀：250% 单体 · 需要 100 怒气（每次行动 +25）">' +
    '💥 必杀' + (can ? '（250%）' : '（怒气 ' + Math.round(rage) + '/100）') + '</button>';
}

// 📡 联机（步 2）：把战斗状态写进房间，供其他人观战
let roomId = "", roomAt = "", amHost = true;
async function publishState() {
  if (!roomId || !amHost || !st) return;
  try {
    const got = await getRoom(roomId);
    if (!got) return;
    const room = got.room;
    if (room.host !== box) { amHost = false; return; }
    room.phase = st.finished ? "done" : "fighting";
    room.state = {
      round: st.round,
      stage: st.__stage || "k1",
      owners: st.__owners || null,
      turn: (nextActor(st) || {}).id || null,
      units: st.units.map((u) => ({
        id: u.id, name: u.name, side: u.side, hp: Math.round(u.hp), maxHp: Math.round(u.maxHp),
        spd: u.spd, cd: u.cd || 0, rage: Math.round(u.rage || 0),
        atk: u.atk, def: u.def, critRate: u.critRate, critDmg: u.critDmg, dmgCut: u.dmgCut,
        traits: u.traits || {}, weapon: u.weapon || null, shield: Math.round(u.shield || 0),
        statuses: (u.statuses || []).map((s) => ({ key: s.key, v: s.v, turns: s.turns, label: s.label }))
      })),
      log: log.slice(-40),
      finished: !!st.finished,
      winner: st.winner || null
    };
    const r = await putRoom(room, got.updatedAt);
    if (r.ok) roomAt = r.updatedAt;
  } catch (e) {}
}

// 📡 联机（步 4）：房主轮询客户端 intent 并执行；客户端在「自己那手」时能出手
let lastIntentSeq = 0;
async function pullIntents() {
  if (!roomId || !amHost || !st || st.finished) return;
  try {
    const r = await takeIntents(roomId, lastIntentSeq);
    if (!r.ok || !r.intents.length) return;
    for (const it of r.intents) {
      lastIntentSeq = Math.max(lastIntentSeq, Number(it.seq) || 0);
      const who = st.units.find((u) => u.id === it.unitId);
      const cur = nextActor(st);
      // 校验①：这个单位是不是他控的（多人模式按 owner 判定）
      if (st.__owners && st.__owners[it.unitId] !== it.by) continue;
      // 校验②：必须是这个单位该出手
      if (!who || !cur || cur.id !== who.id) continue;
      if (it.act === "skill" && who.cd > 0) continue;
      if (it.act === "ult" && (Number(who.rage) || 0) < 100) continue;
      if (isStunned(who)) {
        pushLog("💫 " + who.name + " 被控住，跳过本回合");
        commit(st, who.id);
        continue;
      }
      if (it.act === "skill" && !canUseSkill(who)) continue;
      // 😤 目标选择：优先被嘲讽的敌人
      const enemies = st.units.filter((u) => u.alive !== false && u.id !== who.id && u.side !== who.side);
      const taunter = enemies.find((u) => hasStatus(u, "taunt"));
      const other = taunter || enemies[0];
      if (!other) { commit(st, who.id); continue; }
      if (it.act === "defend") {
        who.dmgCut = (Number(who.dmgCut) || 0) + 30;
        who.__defBonus = 1;
        pushLog("🛡️ " + who.name + " 进入防御", "act");
      } else {
        // 每个单位用自己的武器判定招式（联机时不再是房主武器）
        const wp = wpOf(who.weapon || st.__weapon);
        const tr = who.traits || {};
        // R 阶没有技能：技能指令直接忽略，按普攻处理
        if (it.act === "skill" && !wp.sMult && !wp.sSupport) it.act = "normal";
        // ✨ 辅佐武器：招式位变成辅助（自动选血量最低的队友）
        if (it.act === "skill" && wp.sSupport) {
          const allies = st.units.filter((u) => u.alive !== false && u.side === who.side);
          const tgt = allies.slice().sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp))[0] || who;
          const subs = [];
          if (wp.sSupport === "heal") subs.push("治疗 " + tgt.name + " +" + healUnit(st, tgt.id, tgt.maxHp * (Number(wp.sHealPct) || 25) / 100));
          else if (wp.sSupport === "shield") subs.push("护盾 → " + tgt.name + "（" + addShield(st, tgt.id, tgt.maxHp * (Number(wp.sShieldPct) || 20) / 100) + "）");
          else if (wp.sSupport === "buff") { addStatus(st, tgt.id, "atkUp", Number(wp.sBuffPct) || 25, 3, "增益"); subs.push(tgt.name + " 攻击 +" + (Number(wp.sBuffPct) || 25) + "%"); }
          else if (wp.sSupport === "dispel") subs.push("驱散 " + tgt.name + " 的 " + dispel(st, tgt.id, Number(wp.sDispelN) || 2) + " 个减益");
          pushLog("✨ " + who.name + "「" + (wp.sName || "辅佐") + "」→ " + tgt.name, "act", subs);
          addStatus(st, who.id, "scd", 0, Number(wp.sCd) || 3, "辅助技CD");
          commit(st, who.id);
          continue;
        }
        const mult = it.act === "ult" ? (Number(wp.uMult) || 250) : (it.act === "skill" ? (Number(wp.sMult) || 150) : (Number(wp.aMult) || 100));
        const hits = it.act === "ult" ? (wp.uHits || 1) : (it.act === "skill" ? (wp.sHits || 1) : (wp.aHits || 1));
        const res = strike(st, who.id, other.id, { atk: who.atk, mult, critRate: who.critRate, critDmg: who.critDmg, kind: (it.act === "ult" ? "ult" : it.act === "skill" ? "skill" : "normal"), dmgType: (wp.dmgType || "phys"), style: (wp.style || "melee") }, hits);
        if (it.act === "ult") who.rage = 0;
        else who.rage = Math.min(100, (Number(who.rage) || 0) + 25 * (1 + (Number(tr.rageOnSkill) || 0) / 100 + (Number(tr.ragePct) || 0) / 100));
        if (it.act === "skill" && wp.hitStatus) {
          applyStatus(st, who.id, other.id, wp.hitStatus, Number(wp.hitStatusV) || 3, Number(wp.hitStatusTurns) || 2, wp.hitStatusName || wp.hitStatus);
        }
        if (it.act === "skill") {
          setCooldown(st, who.id, Number(wp.sCd) || 2);
        }
        pushLog((it.act === "ult" ? "💥 " : it.act === "skill" ? "🥋 " : "⚔️ ") + who.name + " → " + other.name + " " + res.dmg + (res.crit ? " 暴击💥" : ""), "act");
        // 💥 溅射：招式命中后打相邻敌人
        if (it.act === "skill" && Number(tr.splash) > 0) {
          st.units.filter((u) => u.alive !== false && u.side !== who.side && u.id !== other.id).forEach((u) => {
            const sr = damage(st, who.id, u.id, { atk: who.atk, mult: Number(tr.splash) || 30, critRate: 0, critDmg: who.critDmg, kind: "skill", dmgType: (wp.dmgType || "phys"), style: (wp.style || "melee") });
            pushLog("💥 溅射 → " + u.name + " " + sr.dmg, "line");
          });
        }
        // 🛡️ 防具反制：被击时缴械 / 嘲讽攻击者
        const dt2 = other.traits || {};
        if (Number(dt2.disarm) > 0 && who.alive !== false && Math.random() * 100 < 30) {
          applyStatus(st, other.id, who.id, "disarm", 1, Number(dt2.disarm) || 1, "缴械");
        }
        if (Number(dt2.taunt) > 0 && who.alive !== false) {
          applyStatus(st, other.id, who.id, "taunt", 0, 1, "嘲讽");
        }
      }
      commit(st, who.id);
    }
    renderBattle();
    setTimeout(aiTurnIfNeeded, 300);
  } catch (e) {}
}

const TRAIT_NAMES = { cdReduce: "冷却缩减", rageOnSkill: "招式回怒", rageOnKill: "击杀回怒", rageStart: "初始怒气", sunderBoost: "破防强度", statusPower: "状态强度", statusHit: "状态命中", statusResist: "状态抗性", block: "格挡", tenacity: "韧性", lowHpCut: "残血减伤", physPct: "物理伤害", spellPct: "法术伤害", normalPct: "普攻伤害", skillPct: "技能伤害", ultPct: "必杀伤害", physPen: "物理穿透", spellPen: "法术穿透", meleePct: "近战伤害", rangedPct: "远程伤害", focusPct: "法器伤害" };
const STATUS_NAMES = { stun: "眩晕", freeze: "冰冻", silence: "沉默", disarm: "缴械", taunt: "嘲讽", noheal: "禁疗", immune: "免疫", burn: "灼烧", sunder: "破防", mark: "标记", stack: "层数", atkUp: "增益", tcd: "天赋技CD", scd: "辅助技CD" };

// ♊ 双生：概率不消耗回合（每场限一次，防无限连）
function tryDualborn(u) {
  const p = Number((u.traits || {}).dualborn) || 0;
  if (p > 0 && !u.__dualUsed && Math.random() * 100 < p) {
    u.__dualUsed = true;
    pushLog("♊ 双生：这次行动不消耗回合", "line");
    return true;
  }
  return false;
}

      : '<div class="card"><div class="card-title">行动</div>' +

          '🤖 托管：' + (st.__auto ? '<b style="color:#7ee787;">开</b>' : "关") +

        '</div>' +

          '<button data-act="normal" style="flex:1;min-width:110px;height:38px;" ' + (busy || !a || a.id !== "me" || !canUseNormal(m) ? 'disabled' : '') + '>⚔️ 普攻</button>' +

            (busy || !a || a.id !== "me" || hasStatus(m, "scd") ? 'disabled' : '') + '>✨ ' + esc(wpOf(st.__weapon).sName || "辅助") +
            (hasStatus(m, "scd") ? " 冷却" : "") + '</button>' : '') +
          (st.__talent ? '<button data-act="talent" style="flex:1;min-width:110px;height:38px;border-color:#c9a0ff;color:#c9a0ff;" ' +
            (busy || !a || a.id !== "me" || hasStatus(m, "tcd") ? 'disabled' : '') + '>✨ ' + esc(st.__talent.name) +
            (hasStatus(m, "tcd") ? " 冷却" : "") + '</button>' : '') +
          '</div></div>' : '') +
        (isStunned(m) ? '<div class="hint" style="color:#ffd666;">💫 你被控住了，本回合跳过</div>' : '') +
        (isSilenced(m) ? '<div class="hint" style="color:#ffd666;">🤐 被沉默：不能使用招式和必杀</div>' : '') +
        (isDisarmed(m) ? '<div class="hint" style="color:#ffd666;">🚫 被缴械：本回合只能防御</div>' : '') +
        '<div class="hint" style="margin-top:8px;line-height:1.8;">' +
          '招式：' + esc(wpOf(st.__weapon).sName || "—") + ' · ' +
          (Number(wpOf(st.__weapon).sMult) || 150) + '% · 冷却 ' +
          (Number(wpOf(st.__weapon).sCd) || 2) + ' 回合 　|　 ' +
          '必杀 ' + (Number(wpOf(st.__weapon).uMult) || 250) + '%，每次行动 +25 怒气 　|　 防御：本回合减伤 +30%，持续到你下次行动' +
        '</div>' + traitsLine(m.traits) + '</div></div>') +
    '<div class="card"><div class="card-title">战斗日志</div><div class="log">' +
      log.map((l) => l.kind === "hdr"
        ? '<div style="color:#ffd666;font-weight:700;margin:6px 0 2px;">' + esc(l.text) + '</div>'
        : '<div class="act">' + esc(l.text) + (l.subs && l.subs.length ? l.subs.map((x) => '<div class="sub">↳ ' + esc(x) + '</div>').join("") : "") + '</div>'
      ).join("") + '</div></div>';

  if ($("btnBack")) $("btnBack").onclick = renderPick;
  if ($("btnAgain")) $("btnAgain").onclick = () => startBattle(st.__stage);
  if ($("btnAuto")) $("btnAuto").onclick = () => {
    st.__auto = !st.__auto;
    try { localStorage.setItem("rpg2:auto", st.__auto ? "1" : "0"); } catch (e) {}
    renderBattle();
    aiTurnIfNeeded();
  };
  view().querySelectorAll("[data-act]").forEach((b) => { b.onclick = () => doAct(b.dataset.act); });
  // 日志自动滚到最新
  try {
    const lg = view().querySelector(".log");
    if (lg) lg.scrollTop = lg.scrollHeight;
  } catch (e) {}
  publishState();
}

function doAct(kind) {
  if (!st || st.finished || busy) return;
  if (st.finished) return;
  const a = nextActor(st);
  if (!a || a.id !== "me") return;
  const m = me(), f2 = foe();
  clearDefend(m);
  const wp = wpOf(st.__weapon);
  if (isStunned(m)) {
    pushLog("💫 " + m.name + " 被控住，跳过本回合");
    commit(st, "me");
    renderBattle();
    setTimeout(aiTurnIfNeeded, 380);
    return;
  }
  if (kind === "skill" && !canUseSkill(m)) return;
  if (kind === "normal" && !canUseNormal(m)) return;
  const rounds = [];

  if (kind === "talent") {
    const t = st.__talent;
    if (!t || hasStatus(m, "tcd")) return;
    const subs = [];
    if (t.key === "wall") { const sv = addShield(st, "me", m.maxHp * 0.3); subs.push("护盾 → " + sv); }
    else if (t.key === "frenzy") { addStatus(st, "me", "atkUp", 40, 2, "狂战"); subs.push("攻击 +40%（2 回合）"); }
    else if (t.key === "gale") { m.allowed = (Number(m.allowed) || 1) + 1; subs.push("本回合多行动一次"); }
    else if (t.key === "arcane") {
      const r = damage(st, "me", "foe", { atk: m.atk, mult: 200, critRate: m.critRate, critDmg: m.critDmg, kind: "skill", dmgType: "spell" });
      subs.push("奥术冲击 " + r.dmg + (r.crit ? " 暴击💥" : ""));
    } else if (t.key === "bless") { const h = healUnit(st, "me", m.maxHp * 0.3); subs.push("恢复 " + h); }
    addStatus(st, "me", "tcd", 0, t.cd, "天赋技CD");
    pushLog("✨ " + m.name + "「" + t.name + "」", "act", subs);
    if (!tryDualborn(m)) commit(st, "me");
    renderBattle();
    setTimeout(aiTurnIfNeeded, 380);
    return;
  }

  if (kind === "defend") {
    pushLog("🛡️ " + m.name + " 进入防御（本回合减伤 +30%）");
    m.dmgCut = (m.dmgCut || 0) + 30;
    m.__defBonus = 1;
    if (Number((m.traits || {}).charge) > 0) {
      m.__charged = 1;
      pushLog("🏹 蓄势：下一次攻击 +60%", "line");
    }
    if (!tryDualborn(m)) commit(st, "me");
  } else if (kind === "ult") {
    const r = strike(st, "me", "foe", { atk: m.atk, mult: (Number(wpOf(st.__weapon).uMult) || 250), critRate: m.critRate, critDmg: m.critDmg, kind: "ult", dmgType: (wpOf(st.__weapon).dmgType || "phys"), style: (wpOf(st.__weapon).style || "melee") }, wpOf(st.__weapon).uHits || 1);
    m.rage = 0;
    pushLog("💥 " + m.name + " 必杀 → " + f2.name + " " + r.dmg + (r.crit ? " 暴击💥" : ""));
    if (!tryDualborn(m)) commit(st, "me");
  } else if (kind === "support") {
    // ✨ 辅佐招式：自动选「血量比例最低的队友」（单人就自己）
    const allies = st.units.filter((u) => u.alive !== false && u.side === m.side);
    const tgt = allies.slice().sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp))[0] || m;
    const tid = tgt.id;
    const subs = [];
    if (wp.sSupport === "heal") {
      const h = healUnit(st, tid, tgt.maxHp * (Number(wp.sHealPct) || 25) / 100);
      subs.push(h > 0 ? "治疗 " + tgt.name + " +" + h : tgt.name + " 被禁疗，治疗无效");
    } else if (wp.sSupport === "shield") {
      const sv = addShield(st, tid, tgt.maxHp * (Number(wp.sShieldPct) || 20) / 100);
      subs.push("护盾 → " + tgt.name + "（" + sv + "）");
    } else if (wp.sSupport === "buff") {
      addStatus(st, tid, "atkUp", Number(wp.sBuffPct) || 25, 3, "增益");
      subs.push(tgt.name + " 攻击 +" + (Number(wp.sBuffPct) || 25) + "%（3 回合）");
    } else if (wp.sSupport === "dispel") {
      const n = dispel(st, tid, Number(wp.sDispelN) || 2);
      subs.push("驱散 " + tgt.name + " 的 " + n + " 个减益");
    }
    pushLog("✨ " + m.name + "「" + (wp.sName || "辅佐") + "」→ " + tgt.name, "act", subs);
    addStatus(st, "me", "scd", 0, Number(wp.sCd) || 3, "辅助技CD");
    if (!tryDualborn(m)) commit(st, "me");
  } else if (kind === "skill") {
    if (!wp.sMult && !wp.sSupport) return;
    const mult = Number(wp.sMult) || 150;
    const tr = m.traits || {};
    const baseCd = Number(wp.sCd) || 3;
    const cd = Math.max(1, baseCd - (Number(tr.cdReduce) || 0));
    const r = strike(st, "me", "foe", { atk: m.atk, mult, critRate: m.critRate, critDmg: m.critDmg, kind: "skill", dmgType: (wp.dmgType || "phys"), style: (wp.style || "melee") }, wp.sHits || 1);
    const subs = ["倍率 " + mult + "% · 攻击 " + Math.round(m.atk) + " → 实际 " + r.dmg + (r.crit ? "（暴击）" : "") +
      (cd !== baseCd ? " · 冷却缩减 → " + cd + " 回合" : "")];
    if (wp.hitStatus && r.dmg > 0) {
      const v = Number(wp.hitStatusV) || 3;
      const turns = Number(wp.hitStatusTurns) || 2;
      const nm = wp.hitStatusName || wp.hitStatus;
      const ok = applyStatus(st, "me", "foe", wp.hitStatus, v, turns, nm);
      subs.push(ok ? "对 " + f2.name + " 施加「" + nm + "」" : "「" + nm + "」被 " + f2.name + " 抗掉了");
    }
    // 🥉 控制类词条：招式命中后逐个判定（70% 基础命中，吃状态命中/抗性）
    ["stun", "silence", "freeze", "noheal"].forEach((ck) => {
      if (Number(wp[ck]) > 0) {
        const turns = (ck === "stun" || ck === "freeze") ? 1 : 2;
        const ok2 = applyStatus(st, "me", "foe", ck, Number(wp[ck]) || 0, turns, statusName(ck));
        subs.push(ok2 ? "附加「" + statusName(ck) + "」" : "「" + statusName(ck) + "」被抗掉了");
      }
    });
    pushLog("🥋 " + m.name + "「" + (wp.sName || "招式") + "」→ " + f2.name + " " + r.dmg + (r.crit ? " 暴击💥" : ""), "act", subs);
    setCooldown(st, "me", baseCd);
    // 🏃 追击：招式命中后概率追加 50% 普攻
    if (Number(tr.chase) > 0 && f2.hp > 0 && Math.random() * 100 < Number(tr.chase)) {
      const r3 = damage(st, "me", "foe", { atk: m.atk, mult: 50, critRate: m.critRate, critDmg: m.critDmg, kind: "skill", dmgType: (wp.dmgType || "phys"), style: (wp.style || "melee") });
      pushLog("🏃 追击追加 " + r3.dmg, "line");
    }
    if (!tryDualborn(m)) commit(st, "me");
  } else {
    const r = strike(st, "me", "foe", { atk: m.atk, mult: (Number(wpOf(st.__weapon).aMult) || 100), critRate: m.critRate, critDmg: m.critDmg, kind: "normal", dmgType: (wpOf(st.__weapon).dmgType || "phys"), style: (wpOf(st.__weapon).style || "melee") }, wpOf(st.__weapon).aHits || 1);
    pushLog("⚔️ " + m.name + " 普攻 → " + f2.name + " " + r.dmg + (r.crit ? " 暴击💥" : ""), "act",
      ["攻击 " + Math.round(m.atk) + " × 100% → 目标防御 " + Math.round(f2.def) + " 减免 → 实际 " + r.dmg + (r.crit ? "（暴击 ×" + (m.critDmg / 100).toFixed(1) + "）" : "")]);
    // 🗡️ 连击：普攻概率再打一次（半伤）
    if (Number((m.traits || {}).doubleStrike) > 0 && f2.hp > 0 && Math.random() * 100 < Number(m.traits.doubleStrike)) {
      const r2 = damage(st, "me", "foe", { atk: m.atk, mult: 50, critRate: m.critRate, critDmg: m.critDmg, kind: "normal", dmgType: (wpOf(st.__weapon).dmgType || "phys"), style: (wpOf(st.__weapon).style || "melee") });
      pushLog("🗡️ 连击追加 " + r2.dmg, "line");
    }
    if (!tryDualborn(m)) commit(st, "me");
  }

  // 🤝 同行助战：每回合自动出手一次（不占行动条）
  if (st.__ally && st.__allyRound !== lastRound && !st.finished && f2.hp > 0) {
    st.__allyRound = lastRound;
    const ar = damage(st, "ally", "foe", { atk: st.__ally.atk, mult: 100, critRate: st.__ally.critRate, critDmg: st.__ally.critDmg, kind: "normal", dmgType: "phys", style: "melee" });
    pushLog("🤝 " + st.__ally.name + " 助战 → " + f2.name + " " + ar.dmg, "line");
  }

  if (st.finished) { finish(); renderBattle(); return; }
  if (kind !== "ult") {
    const gain = 25 * (1 + (Number((m.traits || {}).rageOnSkill) || 0) / 100 + (Number((m.traits || {}).ragePct) || 0) / 100);
    m.rage = Math.min(100, (Number(m.rage) || 0) + gain);
  }
  renderBattle();
  setTimeout(aiTurnIfNeeded, 380);
}

// 🤖 我方原创单位自动出手（默认托管）
function autoUnitAct(u) {
  if (!st || st.finished) return;
  const f2 = foe();
  if (!f2 || f2.hp <= 0) return;
  if (isStunned(u)) {
    pushLog("💫 " + u.name + " 被控住，跳过", "line");
    commit(st, u.id);
    renderBattle();
    setTimeout(aiTurnIfNeeded, 300);
    return;
  }
  const r = damage(st, u.id, "foe", { atk: u.atk, mult: 100, critRate: u.critRate, critDmg: u.critDmg, kind: "normal", dmgType: "phys", style: "melee" });
  pushLog("🤖 " + u.name + " → " + f2.name + " " + r.dmg + (r.crit ? " 暴击💥" : ""), "line");
  commit(st, u.id);
  if (st.finished) finish();
  renderBattle();
  setTimeout(aiTurnIfNeeded, 360);
}

function aiTurnIfNeeded() {
  if (!st || st.finished) return;
  if (roomId && amHost) {
    // 联机模式：等对手提交；超时 20 秒由房主代打
    const a0 = nextActor(st);
    if (a0 && a0.id === "foe" && window.__guestControls) {
      if (!window.__waitSince || window.__waitUnit !== a0.id) { window.__waitSince = Date.now(); window.__waitUnit = a0.id; }
      const waited = Date.now() - window.__waitSince;
      if (waited < 20000) { setTimeout(pullIntents, 350); return; }
      window.__waitSince = 0;
      pushLog("⏳ " + a0.name + " 超时未出手，房主代打", "line");
    }
  }  const a = nextActor(st);
  if (!a) return;
  // 🤖 托管：我方自动行动
  if (a.id === "me") {
    if (st.__auto) { setTimeout(() => doAct("normal"), 420); return; }
    renderBattle(); return;
  }
  if (a.side === "A") { autoUnitAct(a); return; }
  if (a.id !== "foe") { renderBattle(); return; }
  busy = true;
  setTimeout(() => {
    const f2 = foe(), m = me();
    clearDefend(f2);
    if (isStunned(f2)) {
      pushLog("💫 " + f2.name + " 被控住，跳过本回合");
      commit(st, "foe");
      busy = false;
      renderBattle();
      setTimeout(aiTurnIfNeeded, 300);
      return;
    }
    const useSkill = Math.random() < 0.3;
    const mult = useSkill ? 150 : 100;
    const r = damage(st, "foe", "me", { atk: f2.atk, mult, critRate: f2.critRate, critDmg: f2.critDmg, kind: "normal", dmgType: "phys", style: "melee" });
    pushLog((useSkill ? "🥋 " : "⚔️ ") + f2.name + (useSkill ? " 技能" : " 普攻") + " → " + m.name + " " + r.dmg + (r.crit ? " 暴击💥" : ""));
    // 🔁 反击：被击后概率反打 60%
    const cb = Number((m.traits || {}).counter) || 0;
    if (cb > 0 && m.alive !== false && f2.alive !== false && Math.random() * 100 < cb) {
      const rc = damage(st, "me", "foe", { atk: m.atk, mult: 60, critRate: m.critRate, critDmg: m.critDmg, kind: "normal", dmgType: (wpOf(st.__weapon).dmgType || "phys"), style: (wpOf(st.__weapon).style || "melee") });
      pushLog("🔁 " + m.name + " 反击 " + rc.dmg, "line");
    }
    // 🛡️ 防具反制：缴械 / 嘲讽
    const dt3 = m.traits || {};
    if (Number(dt3.disarm) > 0 && f2.alive !== false && Math.random() * 100 < 30) {
      applyStatus(st, "me", "foe", "disarm", 1, Number(dt3.disarm) || 1, "缴械");
      pushLog("🚫 " + f2.name + " 被缴械", "line");
    }
    if (Number(dt3.taunt) > 0 && f2.alive !== false) {
      applyStatus(st, "me", "foe", "taunt", 0, 1, "嘲讽");
    }
    commit(st, "foe");
    busy = false;
    if (st.finished) finish();
    renderBattle();
    setTimeout(aiTurnIfNeeded, 300);
  }, 420);
}

function finish() {
  const ch = activeChar();
  if (!st || !st.finished || st.__done) return;
  st.__done = true;
  // 🍱 战前准备：吃完这场就没了（胜败都清）
  if (st.__meal) { store.flags = store.flags || {}; store.flags.meal = null; }
  if (st.winner !== "A") { pushLog("💀 战斗失败"); save(); return; }
  // 🧬 用原创角色出战：经验只给这个原创角色，不动玩家存档
  if (st.__origId) {
    const o = ORIGINALS.find((x) => x.id === st.__origId);
    if (o) {
      store.orig = store.orig || {};
      const cur = store.orig[o.id] || { lv: 1, exp: 0 };
      const gain = 120;
      cur.exp = (Number(cur.exp) || 0) + gain;
      let lvUp = 0;
      while (cur.lv < CHAR.maxLevel && cur.exp >= CHAR.expNeed(cur.lv)) { cur.exp -= CHAR.expNeed(cur.lv); cur.lv++; lvUp++; }
      store.orig[o.id] = cur;
      pushLog("🧬 " + o.name + " 经验 +" + gain + "（当前 Lv" + cur.lv + (lvUp ? " ↑升级" : "") + "）");
      addReceipt(store, "原创", o.name, { note: "原创角色经验 +" + gain });
      save();
      renderBattle();
      return;
    }
  }
  const s = STAGES.find((x) => x.id === st.__stage) || STAGES[0];
  const gold = Number(s.gold) || (120 + s.foe.lv * 8);
  const exp = Number(s.exp) || (40 + s.foe.lv * 6);
  store.gold = (Number(store.gold) || 0) + gold;
  store.exp = (Number(store.exp) || 0) + exp;
  // 🎁 掉落：碎片必掉、强化石必掉、装备按概率
  const rnd = (a) => a[0] + Math.floor(Math.random() * (a[1] - a[0] + 1));
  const dp = s.drop || { shards: [5, 8], stone: [1, 2], gearChance: 5 };
  const shards = rnd(dp.shards), stone = rnd(dp.stone);
  store.flags = store.flags || {};
  store.flags.shards = (Number(store.flags.shards) || 0) + shards;
  store.flags.stone = (Number(store.flags.stone) || 0) + stone;
  // 🎖️ 资历手稿 / 资质勋章：通关掉落（勋章按概率）
  const ms = Math.max(0, Number(dp.manuscript) || 0);
  if (ms) store.flags.manuscript = (Number(store.flags.manuscript) || 0) + ms;
  const mdBase = Math.max(0, Number(dp.medal) || 0);
  const md = (mdBase && Math.random() * 100 < (Number(dp.medalChance) || 0)) ? mdBase : 0;
  if (md) store.flags.medal = (Number(store.flags.medal) || 0) + md;
  const drops = [{ name: "碎片", count: shards }, { name: "强化石", count: stone }];
  if (ms) drops.push({ name: "资历手稿", count: ms });
  if (md) drops.push({ name: "资质鉴定勋章", count: md });
  if (Math.random() * 100 < (dp.gearChance || 0)) {
    const pool = s.tier >= 3 ? [WEAPONS, ARMORS, ACCESSORIES] : [ARMORS, ACCESSORIES];
    const list = pool[Math.floor(Math.random() * pool.length)];
    const def = list[Math.floor(Math.random() * list.length)];
    const cat = pool[0] === WEAPONS && list === WEAPONS ? "weapon" : (list === ARMORS ? "armor" : "accessory");
    store.items.push(makeItem(cat, def));
    drops.push({ name: def.name, count: 1 });
  }
  addReceipt(store, "战斗", s.name, { gold, items: drops });
  bumpDaily(store, "battles");
  store.flags.wins = (Number(store.flags.wins) || 0) + 1;
  // 🤖 同行队伍的原创角色也拿经验
  if (st.__party && st.__party.length) {
    store.orig = store.orig || {};
    st.__party.forEach((id) => {
      const o = ORIGINALS.find((x) => x.id === id);
      if (!o) return;
      const cur = store.orig[id] || { lv: 1, exp: 0 };
      cur.exp = (Number(cur.exp) || 0) + 120;
      while (cur.lv < CHAR.maxLevel && cur.exp >= CHAR.expNeed(cur.lv)) { cur.exp -= CHAR.expNeed(cur.lv); cur.lv++; }
      store.orig[id] = cur;
      pushLog("🤖 " + o.name + " 经验 +120（Lv" + cur.lv + "）", "line");
    });
  }
  st.__reward = { gold, exp, stage: s.name, drops };
  pushLog("🏆 胜利：金币 +" + gold + " · 经验 +" + exp + " · " + drops.map((d) => d.name + "×" + d.count).join("、"));
  save();
}

(async () => {

// 👀 观战视图（只读）
let seq = 0, lastStateAt = 0;
function renderSpectator(state) {
  const meU = state.units.find((u) => u.id === "me") || state.units[0];
  const foeU = state.units.find((u) => u.id !== meU.id) || state.units[1];
  const bar = (u) => {
    const pct = Math.max(0, Math.min(100, Math.round(u.hp / u.maxHp * 100)));
    return '<div class="bar' + (pct <= 25 ? '' : ' full') + '"><i style="width:' + pct + '%"></i></div>' +
      '<div class="hint">' + fmt(u.hp) + ' / ' + fmt(u.maxHp) + (u.cd ? ' · 冷却 ' + u.cd : '') +
      (u.statuses && u.statuses.length ? ' · ' + u.statuses.map((s) => (s.label || s.key) + (s.turns ? '(' + s.turns + ')' : '')).join('、') : '') + '</div>';
  };
  const myTurn = !amHost && !state.finished && state.turn === foeU.id;
  const myUnit = (!amHost && st && st.__myUnit) ? st.__myUnit : null;
  const myTurnReal = !amHost && !state.finished && (!myUnit || state.turn === myUnit) && state.turn !== null;
  const ctrlUnit = myUnit && state.units ? state.units.find((u) => u.id === myUnit) : null;
  const A = state.units.filter((u) => u.side === "A");
  const B = state.units.filter((u) => u.side !== "A");
  const listHtml = (arr, label, color) => '<div class="card-title" style="color:' + color + ';margin-top:8px;">' + label + '（' + arr.length + '）</div>' +
    arr.map((u) => '<div class="row"><span class="k">' + (state.turn === u.id ? "▶ " : "") + esc(u.name) + ' <span class="tag">Lv' + (u.lv || 1) + ' · 速' + Math.round(u.spd) + '</span>' +
      (u.cd ? ' <span class="tag">冷却 ' + u.cd + '</span>' : '') +
      (u.rage >= 100 ? ' <span class="tag" style="color:#ffd666;">怒气满</span>' : '') +
      ((u.statuses || []).length ? '<div class="hint">' + u.statuses.map((s) => (s.label || s.key) + (s.turns ? '(' + s.turns + ')' : '')).join('、') + '</div>' : '') +
      '</span><span class="v">' + u.hp + '/' + u.maxHp + '</span></div>' + bar(u)).join("");
  view().innerHTML =
    '<div class="card"><div class="card-title">' + (amHost ? "👀 观战中" : (myTurnReal ? "⚡ 轮到你（" + esc(ctrlUnit ? ctrlUnit.name : "你的单位") + "）" : "👀 等待")) +
      ' · 回合 ' + (state.round || 1) + (state.finished ? (state.winner === "A" ? " · 🏆 蓝方胜" : " · 🏆 红方胜") : '') + '</div>' +
      listHtml(A, "🔵 蓝方", "#6ea8fe") + listHtml(B, "🔴 红方", "#ff9b9b") +
      '<div id="hostOffline" style="display:none;margin-top:6px;font-size:11px;color:#ff9b9b;">⚠️ 主机 20 秒没有更新，可能掉线了</div>' +
      (myTurnReal
        ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">' +
            '<button data-intent="normal" style="flex:1;min-width:100px;height:36px;">⚔️ 普攻</button>' +
            '<button data-intent="skill" style="flex:1;min-width:100px;height:36px;" ' + ((ctrlUnit && ctrlUnit.cd > 0) ? 'disabled' : '') + '>🥋 招式' + ((ctrlUnit && ctrlUnit.cd > 0) ? ' 冷却 ' + ctrlUnit.cd : '') + '</button>' +
            '<button data-intent="ult" style="flex:1;min-width:100px;height:36px;" ' + ((ctrlUnit && ctrlUnit.rage < 100) ? 'disabled' : '') + '>💥 必杀 ' + Math.round((ctrlUnit && ctrlUnit.rage) || 0) + '/100</button>' +
            '<button data-intent="defend" style="flex:1;min-width:100px;height:36px;">🛡️ 防御</button>' +
          '</div>'
        : '<div class="hint" style="margin-top:6px;">' + (myUnit ? "等自己的单位出手" : "你在观战（房间已满或没分到单位）") + '；数值由房主计算。</div>') + '</div>' +
    '<div class="card"><div class="card-title">战斗日志</div><div class="log">' +
      (state.log || []).map((l) => l.kind === "hdr"
        ? '<div style="color:#ffd666;font-weight:700;margin:6px 0 2px;">' + esc(l.text) + '</div>'
        : '<div class="act">' + esc(l.text) + ((l.subs || []).length ? l.subs.map((x) => '<div class="sub">↳ ' + esc(x) + '</div>').join("") : "") + '</div>').join("") +
    '</div></div>';

  view().querySelectorAll("[data-intent]").forEach((b) => b.onclick = async () => {
    b.disabled = true;
    const r = await pushIntent(roomId, { by: box, unitId: myUnit || (ctrlUnit && ctrlUnit.id) || foeU.id, act: b.dataset.intent });
    if (!r.ok) { b.disabled = false; return; }
  });
}

function pushLogLocal(text) {
  log.push({ text, kind: "line" });
}
</script>
</body>
</html>
