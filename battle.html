<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
<div class="wrap">
  <div class="nav">
    <a href="index.html">← 返回</a>
    <a href="create.html" id="backCreate">🎒 我的角色</a>
    <span class="tag" id="boxTag">—</span>
    <button id="btnSave" style="margin-left:auto;">💾 保存</button>
  </div>
  <div id="view"></div>
</div>

<script type="module">
import { cloudGet, cloudSave, cacheLoad, cacheSave, esc, fmt, addReceipt, gateLoad } from "./js/core.js?v=13807141";
import { getRoom, putRoom, pushIntent, takeIntents, buildUnits, unitOfPlayer } from "./js/room.js?v=17f71e85";
import { } from "./js/battle.js?v=6c3d7562";
import { WEAPONS, ARMORS, ACCESSORIES, STAGES, ENVIRONMENTS, DUNGEONS, CHAR } from "./js/data.js?v=1502963d";
import { makeItem } from "./js/items.js?v=4c8258c6";
import { stagePower, enemyAt, enemyById } from "./js/enemies.js?v=e13271f7";
import { charFinal, charPower, combatTraits, talentActive, talentActiveLevel } from "./js/power.js?v=42e16747";
import { ORIGINALS, originalFinal, ORIGINAL_GEAR, pullOriginals } from "./js/originals.js?v=8c637db3";
import { createBattle, nextActor, commit, damage, setCooldown, aliveUnits, addStatus, addShield, healUnit } from "./js/battle.js?v=6c3d7562";

let box = "", store = null, updatedAt = "", st = null, log = [], busy = false, lastRound = 1;
const $ = (id) => document.getElementById(id);
const view = () => $("view");
const activeChar = () => (store && store.chars || []).find((c) => c.id === store.activeChar) || (store && store.chars || [])[0] || null;

function readBox() {
  const q = new URLSearchParams(location.search);
  if (q.get("box")) return q.get("box");
  return localStorage.getItem("rpg2:box") || "";
}

async function load() {
  box = readBox();
  $("boxTag").textContent = box || "缺 box";
  $("backCreate").href = "create.html" + (box ? "?box=" + encodeURIComponent(box) : "");
  const g = await gateLoad(box, {});
  if (!g.ok) {
    view().innerHTML = '<div class="card"><div class="card-title">进不去</div><div class="hint">' + esc(g.reason) + '</div>' +
      '<div class="hint" style="margin-top:6px;">先去 <a href="create.html?box=' + encodeURIComponent(box) + '">我的角色</a> 验证一次</div></div>';
    return;
  }
  store = g.store; updatedAt = g.updatedAt || "";
  window.addEventListener("error", (e) => {
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#2a1215;border:1px solid #ff6b6b;color:#ffb3b3;padding:8px 10px;border-radius:8px;font-size:11px;";
  box.textContent = "⚠️ 脚本错误：" + (e.message || e) + " @ " + (e.filename || "") + ":" + (e.lineno || 0);
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 12000);
});
view().addEventListener("click", (e) => {
  const el = e.target.closest("[data-target]");
  if (!el) return;
  targetId = el.dataset.target;
  renderBattle();
});
renderPick();
}

async function save() {
  if (!box || !store) return false;
  store.__at = Date.now();
  cacheSave(box, store);
  if (!updatedAt) return false;   // 新位号还没云端行：本机试用模式
  try {
    const r = await cloudSave(box, store, updatedAt, activeChar() ? activeChar().name : "");
    if (r.ok) updatedAt = r.row.updated_at || updatedAt;
    return r.ok;
  } catch (e) { return false; }
}

// ── 选关 ──────────────────────────────────────────────
function stageNo(s) { const m = String(s.id).match(/(\d+)$/); return m ? Number(m[1]) : 0; }
function dungeonKey(s) { return String(s.id).split("_")[0]; }
function clearedFor(s) {
  const f = (store && store.flags) || {};
  const map = f.cleared || {};
  const k = dungeonKey(s);
  if (map[k] != null) return Number(map[k]) || 0;
  return k === "exp" ? (Number(f.expCleared) || 0) : 0;
}
function rewardText(s) {
  const parts = [];
  if (s.gold) parts.push("💰 " + fmt(s.gold));
  if (s.exp) parts.push("✨ " + fmt(s.exp));
  const dp = s.drop || {};
  const rg = (k, name) => { const a = dp[k]; if (!a || !a[1]) return; parts.push(name + " " + a[0] + "~" + a[1]); };
  rg("stone", "强化石");
  rg("refine", "精炼石");
  rg("shardR", "R碎片");
  rg("shardSR", "SR碎片");
  rg("shardSSR", "SSR碎片");
  if (s.themeGear) parts.push("🎁 " + s.themeGear);
  if (dp.kShard) parts.push("究极热动拳套碎片 " + dp.kShard[0] + "~" + dp.kShard[1]);
  if (dp.kyoShard) parts.push("草薙流古武典碎片 " + dp.kyoShard[0] + "~" + dp.kyoShard[1]);
  else if (dp.gearChance) parts.push("装备 " + dp.gearChance + "%");
  return parts.join(" · ");
}

function dungeonListHtml() {
  const pref = (new URLSearchParams(location.search).get("pref") || "").toLowerCase();
  const all = DUNGEONS.filter((d) => (d.type === "daily" || d.type === "event") && d.stages && d.stages.length)
    .filter((d) => !pref || (pref === "daily" ? d.type === "daily" : pref === "event" ? d.type === "event" : true));
  window.__openD = window.__openD || {};
  const renderOne = (d) => {
    const done = Math.min(clearedFor(d.stages[0]), d.stages.length);
    const open = window.__openD[d.id] === true; // 默认收起
    let h = '<div class="card" style="margin:10px 0;padding:10px 12px;">' +
      '<div data-dungeon="' + d.id + '" style="cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:#ffd666;">' +
      '<span>' + (open ? "▾" : "▸") + '</span>' + d.icon + ' ' + esc(d.name) +
      ' <span class="tag">' + d.stages.length + ' 关</span> <span class="tag">已通关 ' + done + '/' + d.stages.length + '</span>' +
      '<span class="hint" style="margin-left:auto;font-weight:400;">' + (open ? "收起" : "展开") + '</span></div>';
    const stageRow = (s) => {
      const no = stageNo(s), cleared = clearedFor(s), locked = no > cleared + 1;
      const tier = s.tier || "";
      const tcol = tier === "首领" ? "#ff6b6b" : tier === "特色" ? "#ffb347" : tier === "精英" ? "#c9a0ff" : "#6a6a86";
      const env = ENVIRONMENTS[s.weather || "clear"] || { icon: "", name: "" };
      return '<div class="row" style="' + (locked ? "opacity:.55;" : "") + '"><span class="k">' + esc(s.name) +
        (tier ? ' <span class="tag" style="border-color:' + tcol + ';color:' + tcol + ';">' + tier + '</span>' : '') +
        '<div class="hint" style="margin-top:2px;">' + esc(s.story || (s.foe && s.foe.name) || "") + '</div>' +
        '<div class="hint" style="margin-top:2px;color:#8fd8ff;">' + esc(s.scene || "") + ' · ' + env.icon + ' ' + env.name +
        ' · 适配 Lv' + s.lv + '~' + (s.lv + 5) + ' · 建议战力 ' + fmt(stagePower(s)) + '</div>' +
        (rewardText(s) ? '<div class="hint" style="margin-top:2px;color:#ffd666;">🎁 ' + esc(rewardText(s)) + '</div>' : '') + '</span>' +
        '<span class="v">' + (locked
          ? '<span class="hint">🔒 通关第 ' + (no - 1) + ' 关解锁</span>'
          : '<button data-stage="' + s.id + '">开战</button>') + '</span></div>';
    };
    if (open) {
      if (d.type === "event") {
        window.__openB = window.__openB || {};
        const groups = {};
        d.stages.forEach((st) => {
          const ids = st.enemies || [];
          const def = ids.length ? enemyById(ids[0]) : null;
          const bn = (st.bossName || (def && def.name) || "未知 BOSS");
          (groups[bn] = groups[bn] || []).push(st);
        });
        Object.keys(groups).forEach((bn) => {
          const key = d.id + "|" + bn;
          const bopen = window.__openB[key] === true;
          h += '<div data-boss="' + key + '" style="cursor:pointer;margin:8px 0 2px;padding:6px 8px;border-left:3px solid #ff9bd2;background:#1a1226;border-radius:6px;font-size:12px;color:#ffd6ec;display:flex;align-items:center;gap:6px;">' +
            '<span>' + (bopen ? "▾" : "▸") + '</span> 👑 ' +
            (groups[bn][0] && groups[bn][0].bossTitle ? '<span style="color:#ffb7d5;font-size:12px;">' + esc(groups[bn][0].bossTitle) + ' · </span>' : '') +
            esc(bn) +
            ' <span class="tag" style="border-color:#ff9bd2;color:#ff9bd2;">' + groups[bn].length + ' 关</span>' +
            '<span class="hint" style="margin-left:auto;">' + (bopen ? "收起" : "展开") + '</span></div>';
          if (bopen) h += groups[bn].map(stageRow).join("");
        });
      } else {
        h += d.stages.map(stageRow).join("");
      }
    }
    if (d.type === "event") {
      h += '<div class="hint" style="margin-top:8px;color:#8a8ab0;font-size:11px;border-top:1px dashed #2a3350;padding-top:6px;">' +
        '🎗 本活动为同人致敬《拳皇》（SNK）之作，非官方内容。' +
        '</div>';
    }
    return h + '</div>';
  };
  const daily = all.filter((d) => d.type === "daily");
  const event = all.filter((d) => d.type === "event");
  const sec = (title, arr) => arr.length
    ? '<div style="margin:14px 0 4px;font-size:12px;font-weight:800;color:#8fd8ff;letter-spacing:1px;">' + title + '</div>' + arr.map(renderOne).join("")
    : "";
  return sec("📅 日常副本", daily) + sec("🎉 限定主题", event);
}

function hostOrig() {
  // 没有玩家角色时，允许直接用原创角色出战（主机/朋友端都适用）
  return (typeof ORIGINALS !== "undefined" && ORIGINALS && ORIGINALS.length) ? ORIGINALS[0] : null;
}
function renderPick() {
  const ch = activeChar();
  const o0 = !ch ? (ORIGINALS.find((o) => o.id === window.__playOrig) || hostOrig()) : null;
  if (!ch && !o0) { view().innerHTML = '<div class="card"><div class="hint">没有角色。先去「我的角色」建一个。</div></div>'; return; }
  const f = ch ? charFinal(ch) : null;
  view().innerHTML =
    '<div class="card"><div class="card-title">出战</div>' +
      (ch
        ? '<div class="row"><span class="k">' + esc(ch.name) + '</span><span class="v">Lv' + ch.lv + ' · 战力 ' + fmt(charPower(ch)) + '</span></div>'
        : (() => { const _p = (store.orig || {})[o0.id] || {}; const _f = originalFinal(o0, _p); return '<div class="row"><span class="k">🧬 ' + esc(_p.name || o0.name) + '</span><span class="v">Lv' + (Number(_p.lv) || 1) + ' · 战力 ' + fmt(_f.power) + '</span></div>'; })()) +
      '<div class="hint">' + (ch ? '攻击 ' + Math.round(f.atk) + ' · 生命 ' + Math.round(f.hp) + ' · 防御 ' + Math.round(f.def) : (() => { const _p2 = (store.orig || {})[o0.id] || {}; const _f2 = originalFinal(o0, _p2); return '攻击 ' + Math.round(_f2.atk) + ' · 生命 ' + Math.round(_f2.hp) + ' · 防御 ' + Math.round(_f2.def); })()) + '</div>' +
    '</div>' +
    '<div class="card"><div class="card-title">选择关卡</div>' +
      dungeonListHtml() +
    '</div>';
  view().querySelectorAll("[data-boss]").forEach((el) => el.onclick = () => {
    const key = el.dataset.boss;
    window.__openB = window.__openB || {};
    window.__openB[key] = window.__openB[key] === true ? false : true;
    renderPick();
  });
  view().querySelectorAll("[data-dungeon]").forEach((el) => el.onclick = () => {
    const id = el.dataset.dungeon;
    window.__openD = window.__openD || {};
    window.__openD[id] = window.__openD[id] === false ? true : false;
    renderPick();
  });
  view().querySelectorAll("[data-stage]").forEach((b) => {
    b.onclick = () => renderPrep(b.dataset.stage);
  });
}

// ── 开战 ──────────────────────────────────────────────
// 🧑‍🤝‍🧑 多人建战：把房间成员的角色快照补全，生成 2v2 / 3v3 单位表
async function buildMultiBattle(stageId) {
  const got = await getRoom(roomId);
  if (!got) return false;
  const room = got.room;
  const stg = STAGES.find((x) => x.id === stageId) || STAGES[0];
  // 1) 补全每个成员的角色快照
  for (const bx of Object.keys(room.members || {})) {
    const m = room.members[bx];
    if (m.char) continue;
    let ch = null;
    if (bx === box) { ch = activeChar(); }
    else {
      try {
        const row = await cloudGet(bx);
        const s2 = row && row.store;
        if (s2 && Number(s2.v) === 2) ch = (s2.chars || [])[0] || null;
      } catch (e) {}
    }
    if (ch) {
      const f = ch ? charFinal(ch) : null;
      m.char = {
        lv: ch.lv, atk: f.atk, hp: f.hp, def: f.def, res: f.res, spd: f.spd,
        critRate: f.critRate, critDmg: f.critDmg, dmgCut: f.dmgCut,
        weapon: (ch.equip && ch.equip.weapon) || null
      };
    } else {
      m.char = { lv: 1, atk: 60, hp: 500, def: 20, res: 15, spd: 10, critRate: 5, critDmg: 150, dmgCut: 0 };
    }
  }
  // 2) 生成单位
  const built = buildUnits(room, 6);
  // 多人 PvE：所有玩家都在我方，敌人来自关卡配置
  built.units.forEach((u) => { u.side = "A"; });
  const foeUnits = (stg.enemies || []).map((eid, i) => {
    const e = enemyAt(eid, stg.lv) || {};
    const stt = e.stats || {};
    return {
      id: "foe" + i, name: e.name || ("敌人" + (i + 1)), side: "B", lv: stg.lv, power: 0,
      hp: stt.hp || 500, maxHp: stt.hp || 500, atk: stt.atk || 50, def: stt.def || 10, res: stt.res || 10,
      spd: stt.spd || 10, critRate: 5, critDmg: 150, dmgCut: 0, rage: 0,
      __skills: e.skills || []
    };
  });
  st = createBattle(built.units.concat(foeUnits).map((u) => Object.assign({ power: 0 }, u)));
  st.__stage = stg.id;
  st.__owners = built.owners;
  st.__multi = true;
  const myUnit = unitOfPlayer(room, box);
  st.__myUnit = myUnit;
  st.__weapon = (myUnit && built.units.find((u) => u.id === myUnit) || {}).weapon || null;
  log = [];
  lastRound = 1;
  pushLog("— 回合 1 —", "hdr");
  pushLog("👥 多人战：蓝方 " + built.units.filter((u) => u.side === "A").length + " 人 · 红方 " + built.units.filter((u) => u.side === "B").length + " 人", "line");
  await putRoom(Object.assign(room, { phase: "fighting" }), got.updatedAt);
  renderBattle();
  setTimeout(aiTurnIfNeeded, 300);
  return true;
}

// ♻️ 房主刷新后恢复对局：从房间 state 重建战斗
async function tryRestore() {
  if (!roomId) return false;
  const got = await getRoom(roomId);
  if (!got || got.room.host !== box) return false;
  const s = got.room.state;
  if (!s || s.finished || !s.units || !s.units.length) return false;
  st = createBattle(s.units.map((u) => ({
    id: u.id, name: u.name, side: u.side, spd: u.spd, power: 0,
    hp: u.hp, maxHp: u.maxHp, atk: u.atk || 60, def: u.def || 20,
    critRate: u.critRate || 5, critDmg: u.critDmg || 150, dmgCut: u.dmgCut || 0
  })));
  // 把当时的血量/冷却/怒气/状态/回合贴回去
  st.round = Number(s.round) || 1;
  st.__stage = s.stage || "k1";
  st.__owners = s.owners || null;
  st.__myUnit = unitOfPlayer(got.room, box);
  st.__restored = true;
  st.units.forEach((u) => {
    const src = s.units.find((x) => x.id === u.id);
    if (!src) return;
    u.hp = src.hp; u.maxHp = src.maxHp; u.cd = src.cd || 0; u.rage = src.rage || 0;
    u.statuses = src.statuses || [];
    if (u.hp <= 0) u.alive = false;
  });
  // 回合开始标记：把已行动次数清掉（恢复后按新回合开始）
  st.units.forEach((u) => { u.acted = 0; u.allowed = 1; });
  log = (s.log || []).slice(-40);
  lastRound = st.round;
  pushLog("♻️ 已从房间恢复对局（回合 " + st.round + "）", "line");
  renderBattle();
  setTimeout(aiTurnIfNeeded, 300);
  return true;
}

let targetId = null;
window.__pickTgt = (id) => {
  try {
    const wpn = (st && st.__weapon && st.__weapon.data) || {};
    const melee = (wpn.style || "melee") === "melee";
    const alive = (st.units || []).filter((u) => u.side === "B" && u.hp > 0);
    const tgt = alive.find((u) => u.id === id);
    if (melee && tgt) {
      const colOf = (u) => (u.__col ? 1 : 0);
      const frontCol = Math.min.apply(null, alive.map(colOf));
      if (colOf(tgt) > frontCol) {
        alert("近战只能攻击前排：先把前排敌人清掉");
        return;
      }
    }
  } catch (e) {}
  targetId = id;
  try { renderBattle(); } catch (e) {}
};
let prepCol = 0;
let prepRow = 1;
function renderPrep(stageId) {
  const s = STAGES.find((x) => x.id === stageId);
  if (!s) { alert("找不到关卡数据：" + stageId); return; }
  const ch = activeChar();
  const colTxt = (v) => v === 0 ? "前排（受击多、近战优先打你）" : "后排（受击少、远程优先）";
  view().innerHTML =
    '<div class="card"><div class="card-title">⚔️ 备战 · ' + esc(s.name) + '</div>' +
    '<div class="hint">' + esc(s.story || "") + '</div>' +
    '<div class="hint" style="margin-top:4px;">奖励：金币 ' + fmt(s.gold) + ' · 经验 ' + fmt(s.exp) +
      (s.tier ? '　|　阶级 ' + s.tier : '') + '</div>' +
    ((!activeChar() && ORIGINALS.length > 1) ? '<div style="margin-top:8px;"><div class="hint" style="font-weight:700;">🧬 出战角色</div>' +
      ORIGINALS.map((o) => {
        const on = (window.__playOrig || ORIGINALS[0].id) === o.id;
        return '<button data-play="' + o.id + '" style="font-size:11px;margin:3px 4px 0 0;' + (on ? 'border-color:#ffb347;color:#ffb347;' : '') + '">' +
          (on ? '✅ ' : '') + esc(o.name) + '</button>';
      }).join("") + '</div>' : "") +
    '<div class="hint" style="margin-top:8px;font-weight:700;">布阵（点格子选位置）</div>' +
    (() => {
      const cell = (col, row) => {
        const on = prepCol === col && prepRow === row;
        return '<button data-slot="' + col + ':' + row + '" style="height:76px;width:100%;' +
          (on ? 'border-color:#ffb347;color:#ffb347;background:#241a08;' : '') + '">' +
          (on ? '🧑 ' + (activeChar() ? activeChar().name : (hostOrig() || {}).name || "你") : "") + '</button>';
      };
      let g = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px;">';
      g += '<div class="hint" style="text-align:center;">后排</div><div class="hint" style="text-align:center;">前排</div>';
      for (let r = 0; r < 3; r++) g += cell(1, r) + cell(0, r);
      return g + '</div>';
    })() +
    '<div class="hint" style="margin-top:6px;">' + colTxt(prepCol) + '</div>' +
    (ORIGINALS.length > 1 ? '<div style="margin-top:10px;"><div class="hint" style="font-weight:700;">🤝 同行（最多 4）</div>' +
      ORIGINALS.slice(1, 6).map((o) => {
        const on = (window.__party || []).indexOf(o.id) >= 0;
        return '<button data-party="' + o.id + '" style="font-size:11px;margin:3px 4px 0 0;' + (on ? 'border-color:#7ee787;color:#7ee787;' : '') + '">' +
          (on ? '✅ ' : '') + esc(o.name) + '</button>';
      }).join("") + '</div>' : "") +
    '<div style="display:flex;gap:8px;margin-top:12px;">' +
      '<button id="prepGo" style="flex:1;border-color:#ffb347;color:#ffb347;">⚔️ 开战</button>' +
      '<button id="prepBack" style="flex:1;">← 返回选关</button>' +
    '</div></div>';
  const party = (window.__party = window.__party || []);
  view().querySelectorAll("[data-party]").forEach((b) => b.onclick = () => {
    const id = b.dataset.party;
    const i = party.indexOf(id);
    if (i >= 0) party.splice(i, 1);
    else { if (party.length >= 4) return; party.push(id); }
    renderPrep(stageId);
  });
  view().querySelectorAll("[data-play]").forEach((b) => b.onclick = () => { window.__playOrig = b.dataset.play; renderPrep(stageId); });
  view().querySelectorAll("[data-slot]").forEach((b) => b.onclick = () => {
    const [c2, r2] = b.dataset.slot.split(":").map(Number);
    prepCol = c2; prepRow = r2; renderPrep(stageId);
  });
  $("prepGo").onclick = () => startBattle(stageId, prepCol, prepRow);
  $("prepBack").onclick = renderPick;
}

function startBattle(stageId, col, row) {
  if (roomId && amHost) {
    // 多人开战失败时给提示并回退单人，避免「点了没反应」
    buildMultiBattle(stageId).then((ok) => {
      if (ok) return;
      const goOn = confirm("多人房间读取失败（可能已解散或过期）。\n要改为单人开战吗？");
      if (goOn) { roomId = null; amHost = false; startBattle(stageId, col, row); }
    }).catch((e) => {
      alert("多人开战出错：" + (e && (e.stack || e.message) || e));
    });
    return;
  }
  const ch = activeChar();
  const o0 = !ch ? hostOrig() : null;
  const of = o0 ? originalFinal(o0, (store.orig || {})[o0.id] || {}) : null;
  const f = ch ? charFinal(ch) : { atk: of.atk, hp: of.hp, def: of.def, res: of.res, spd: of.spd, critRate: of.critRate, critDmg: of.critDmg, dmgCut: 0 };
  const s = STAGES.find((x) => x.id === stageId);
  if (!s) return;
  const mkFoe = (e, i) => {
    const def = (typeof enemyById === "function" ? enemyById(e.id || "") : null) || {};
    return {
      id: "foe" + i, name: e.name, side: "B", spd: e.spd, power: 0,
      hp: e.hp, maxHp: e.hp, atk: e.atk, def: e.def, res: e.res || 0,
      critRate: 5, critDmg: 150, cd: 0, rage: 0,
      __skills: def.skills || e.skills || [],
      allowed: 0, acted: 0
    };
  };
  let foeSpecs = [];
  if (Array.isArray(s.enemies) && s.enemies.length) {
    s.enemies.forEach((id) => {
      const e = enemyAt(id, s.lv);
      if (e) foeSpecs.push({ id: id, name: e.name, role: e.role || "", spd: e.stats.spd, hp: e.stats.hp, atk: e.stats.atk, def: e.stats.def, res: e.stats.res });
    });
  }
  if (!foeSpecs.length) foeSpecs = [s.foe];
  const total = foeSpecs.length;
  const waveCount = Math.max(1, Math.ceil(total / 6));
  const perWave = Math.ceil(total / waveCount);
  const waves = [];
  for (let i = 0; i < total; i += perWave) waves.push(foeSpecs.slice(i, i + perWave));
  const firstWave = waves.shift() || [];
  const restWaves = waves;
  const units = firstWave.map((e, i) => mkFoe(e, i));
  // 🤝 同行：把选中的原创角色加进我方
  const partyIds = (window.__party || []).filter((id) => !o0 || id !== o0.id);
  const allies = partyIds.map((id, i) => {
    const o = ORIGINALS.find((x) => x.id === id);
    if (!o) return null;
    const ofx = originalFinal(o, (store.orig || {})[o.id] || {});
    return { id: "ally" + i, name: o.name, lv: 1, side: "A", spd: ofx.spd, power: ofx.power, hp: ofx.hp, maxHp: ofx.hp,
      atk: ofx.atk, def: ofx.def, critRate: ofx.critRate, critDmg: ofx.critDmg, dmgCut: 0, rage: 0, traits: {}, __auto: true };
  }).filter(Boolean);
  units.push(...allies);

  // 👥 人数缩放：队伍越大，敌人越多（数值不变）
  const extra = allies.length;
  if (extra > 0) {
    const base = foeSpecs.slice(0, 6);
    for (let k = 0; k < extra; k++) foeSpecs.push(base[k % base.length]);
  }
  st = createBattle([
    { id: "me", name: ch ? ch.name : (o0 ? o0.name : "你"), lv: ch ? ch.lv : 1, side: "A", spd: f.spd, power: ch ? charPower(ch) : of.power, hp: f.hp, maxHp: f.hp, atk: f.atk, def: f.def, critRate: f.critRate, critDmg: f.critDmg, dmgCut: f.dmgCut || 0, rage: 0, traits: ch ? combatTraits(ch) : {} }
  ].concat(units));
  // ♾ 无尽试炼：记录回合与累计伤害
  if (s.endless) {
    st.__endless = { rounds: Number(s.rounds) || 10, dmg: 0, maxHp: 0 };
  }
  st.__waves = restWaves;
  targetId = null;
  if (extra > 0) {
    const base = foeSpecs.slice(0, 6);
    for (let k = 0; k < extra; k++) {
      const spec = Object.assign({}, base[k % base.length]);
      const aliveB = st.units.filter((u) => u.side === "B").length;
      if (aliveB < 6) st.units.push(mkFoe(spec, 100 + k));
      else {
        if (!st.__waves.length) st.__waves.push([]);
        st.__waves[st.__waves.length - 1].push(spec);
      }
    }
  }
  st.__waveNo = 1;
  st.__isOrig = !!o0;
  st.__origId = o0 ? o0.id : null;
  st.__talent = (ch && talentActive(ch)) ? Object.assign({}, talentActive(ch)) : null;
  if (st.__talent) st.__talent.lvl = talentActiveLevel(ch, st.__talent.tree);
  st.__tcd = 0;
  st.__galePending = 0;
  st.__frost = 0;
  // 布阵：我方 0=前排 1=后排；敌人前排优先
  const meU = st.units.find((u) => u.id === "me");
  if (meU) { meU.__col = Number(col) || 0; meU.__row = (row == null ? 1 : Number(row)); meU.__back = !!meU.__col; }
  {
    const foes = st.units.filter((u) => u.side === "B");
    const FRONT = ["近战", "坦克", "首领", "特色首领"];
    const isFront = (u) => {
      const spec = foeSpecs.find((x) => x.name === u.name) || {};
      const role = String(spec.role || "");
      return FRONT.some((r) => role.indexOf(r) >= 0);
    };
    // 每个敌人一个独立格：前排 3 格 → 后排 3 格
    const slots = [];
    // 🪞 中轴对称：先中间行，再上下，形成对称阵列
    const ROW_ORDER = [1, 0, 2];
    for (let col = 0; col < 2; col++) ROW_ORDER.forEach((row) => slots.push({ col, row }));
    const used = [];
    const takeSlot = (wantFront) => {
      const idx = slots.findIndex((sl) => !used.includes(sl) && (wantFront ? sl.col === 0 : sl.col === 1));
      const s2 = idx >= 0 ? slots[idx] : slots.find((sl) => !used.includes(sl));
      if (!s2) return null;
      used.push(s2);
      return s2;
    };
    const anyFront = foes.some(isFront);
    const sorted = foes.slice().sort((a, b) => (isFront(b) ? 1 : 0) - (isFront(a) ? 1 : 0));
    if (!anyFront) {
      // 没有识别到前排职业时：按顺序补 1~2 个到前排，避免全挤后排
      const n = Math.min(2, sorted.length);
      for (let k = 0; k < n; k++) sorted[k].__forceFront = true;
    }
    sorted.forEach((u) => {
      const sl = takeSlot(isFront(u) || u.__forceFront);
      if (!sl) return;
      u.__col = sl.col; u.__row = sl.row; u.__back = sl.col === 1;
    });
  }
  st.__stage = s.id;
  if (st.__endless) {
    const boss = st.units.filter((u) => u.side === "B").sort((a, b) => b.maxHp - a.maxHp)[0];
    st.__endless.maxHp = boss ? boss.maxHp : 1;
  }
  st.__weapon = ch ? (ch.equip.weapon || null) : (function () { const gw = (ORIGINAL_GEAR[o0.id] || {}).weapon; return gw ? { data: gw } : null; })();
  // 🌦 天气 + 🏞 场地：双方属性叠加
  {
    const env = ENVIRONMENTS[s.weather || "clear"] || ENVIRONMENTS.clear;
    const mods = Object.assign({}, env.mods || {}, s.sceneMods || {});
    st.units.forEach((u) => {
      if (mods.hpPct) { const k = 1 + mods.hpPct / 100; u.maxHp = Math.round(u.maxHp * k); u.hp = Math.round(u.hp * k); }
      if (mods.atkPct) u.atk = Math.round(u.atk * (1 + mods.atkPct / 100));
      if (mods.defPct) u.def = Math.round(u.def * (1 + mods.defPct / 100));
      if (mods.resPct) u.res = Math.round(u.res * (1 + mods.resPct / 100));
      if (mods.spdPct) u.spd = Math.round(u.spd * (1 + mods.spdPct / 100) * 10) / 10;
      if (mods.critRate) u.critRate = Math.max(0, (Number(u.critRate) || 0) + mods.critRate);
    });
    st.__envName = env.icon + " " + env.name;
    st.__scene = s.scene || "";
  }
  log = [];
  lastRound = 1;
  pushLog("— 回合 1 —", "hdr");
  renderBattle();
  aiTurnIfNeeded();
}

// 行动条预览：本回合剩余 + 下一回合完整顺序
function previewOrder(n = 6) {
  if (!st) return [];
  const cmp = (a, b) => {
    if (b.spd !== a.spd) return b.spd - a.spd;
    if (b.power !== a.power) return b.power - a.power;
    if (a.side !== b.side) return a.side === "A" ? -1 : 1;
    return a.seq - b.seq;
  };
  const live = st.units.filter((u) => u.alive !== false);
  const pending = live.filter((u) => (u.acted || 0) < (u.allowed || 1)).sort(cmp);
  const out = pending.slice(0, n);
  if (live.length <= 1) return out;      // 只剩一人：不重复铺满
  if (out.length < n) {
    live.slice().sort(cmp).forEach((u) => { if (out.length < n) out.push(u); });
  }
  return out;
}

function pushLog(text, kind, subs) {
  log.push({ text, kind: kind || "line", subs: subs || [] });
  if (log.length > 200) log = log.slice(-200);
}

// 回合切换时结算持续伤害（灼烧 = 每回合 最大生命 × v%）
// 防御加成只持续到「该单位下次行动」：出手前先还原
function clearDefend(u) {
  if (u && u.__defBonus) {
    u.dmgCut = Math.max(0, (Number(u.dmgCut) || 0) - 30);
    u.__defBonus = 0;
  }
}

function afterCommit() {
  if (!st || st.finished) return;
  if (st.round !== lastRound) {
    lastRound = st.round;
    pushLog("— 回合 " + st.round + " —", "hdr");
    tickStatuses();
  }
}

function tickStatuses() {
  if (!st) return;  st.units.forEach((u) => {
    if (!u || u.alive === false) return;
    (u.statuses || []).forEach((s) => {
      if (s.key !== "burn") return;
      const d = Math.max(1, Math.round(u.maxHp * s.v / 100));
      u.hp = Math.max(0, u.hp - d);
      if (u.hp === 0) u.alive = false;
      pushLog("🔥 " + u.name + " 灼烧 −" + d);
    });
  });
}

function me() {
  return st.units.find((u) => u.id === "me")
    || (st.__myUnit ? st.units.find((u) => u.id === st.__myUnit) : null)
    || st.units.find((u) => u.side === "A" && u.hp > 0)
    || st.units.find((u) => u.side === "A");
}
function foe() {
  const wpn = (st.__weapon && st.__weapon.data) || {};
  const style = wpn.style || "melee";
  const aliveB = st.units.filter((u) => u.side === "B" && u.hp > 0);
  if (!aliveB.length) return st.units.find((u) => u.side === "B");
  const colOf = (u) => (u.__col ? 1 : 0);
  const frontCol = Math.min.apply(null, aliveB.map(colOf));
  const backCol = Math.max.apply(null, aliveB.map(colOf));

  let sel = targetId ? aliveB.find((u) => u.id === targetId) : null;
  if (sel && style === "melee" && colOf(sel) > frontCol) sel = null;   // 近战不能越位
  if (sel) return sel;

  // 默认索敌：近战→前排；远程→后排；法术→血最少
  if (style === "melee") {
    const front = aliveB.find((u) => colOf(u) === frontCol);
    if (front) return front;
  } else if (style === "ranged") {
    const back = aliveB.find((u) => colOf(u) === backCol);
    if (back) return back;
  } else {
    return aliveB.slice().sort((a, b) => a.hp - b.hp)[0];
  }
  return aliveB[0];
}

// 📡 联机（步 2）：把战斗状态写进房间，供其他人观战
let roomId = "", roomAt = "", amHost = true;
async function publishState() {
  if (!roomId || !amHost || !st) return;
  try {
    const got = await getRoom(roomId);
    if (!got) return;
    const room = got.room;
    if (room.host !== box) { amHost = false; return; }
    room.phase = st.finished ? "done" : "fighting";
    room.state = {
      round: st.round,
      stage: st.__stage || "k1",
      owners: st.__owners || null,
      turn: (nextActor(st) || {}).id || null,
      units: st.units.map((u) => ({
        id: u.id, name: u.name, side: u.side, hp: Math.round(u.hp), maxHp: Math.round(u.maxHp),
        spd: u.spd, cd: u.cd || 0, rage: Math.round(u.rage || 0),
        atk: u.atk, def: u.def, critRate: u.critRate, critDmg: u.critDmg, dmgCut: u.dmgCut,
        statuses: (u.statuses || []).map((s) => ({ key: s.key, v: s.v, turns: s.turns, label: s.label }))
      })),
      log: log.slice(-40),
      finished: !!st.finished,
      winner: st.winner || null
    };
    const r = await putRoom(room, got.updatedAt);
    if (r.ok) roomAt = r.updatedAt;
  } catch (e) {}
}

// 📡 联机（步 4）：房主轮询客户端 intent 并执行；客户端在「自己那手」时能出手
let lastIntentSeq = 0;
async function pullIntents() {
  if (!roomId || !amHost || !st || st.finished) return;
  try {
    const r = await takeIntents(roomId, lastIntentSeq);
    if (!r.ok || !r.intents.length) return;
    for (const it of r.intents) {
      lastIntentSeq = Math.max(lastIntentSeq, Number(it.seq) || 0);
      const who = st.units.find((u) => u.id === it.unitId);
      const cur = nextActor(st);
      // 校验①：这个单位是不是他控的（多人模式按 owner 判定）
      if (st.__owners && st.__owners[it.unitId] !== it.by) continue;
      // 校验②：必须是这个单位该出手
      if (!who || !cur || cur.id !== who.id) continue;
      if (it.act === "skill" && who.cd > 0) continue;
      if (it.act === "ult" && (Number(who.rage) || 0) < 100) continue;
      const other = st.units.find((u) => u.id !== who.id);
      if (it.act === "defend") {
        who.dmgCut = (Number(who.dmgCut) || 0) + 30;
        who.__defBonus = 1;
        pushLog("🛡️ " + who.name + " 进入防御", "act");
      } else {
        const wp = (st.__weapon && st.__weapon.data) || {};
        const mult = it.act === "ult" ? 250 : (it.act === "skill" ? (Number(wp.sMult) || 150) : 100);
        const res = damage(st, who.id, other.id, { atk: who.atk, mult, critRate: who.critRate, critDmg: who.critDmg });
        if (it.act === "ult") who.rage = 0;
        else {
          const g2 = it.act === "skill" ? (Number(wp.sRage) || 10) : (Number(wp.aRage) || 20);
          who.rage = Math.min(100, (Number(who.rage) || 0) + g2);
        }
        if (it.act === "skill" && wp.hitStatus) {
          addStatus(st, other.id, wp.hitStatus, Number(wp.hitStatusV) || 3, Number(wp.hitStatusTurns) || 2, wp.hitStatusName || wp.hitStatus);
        }
        pushLog((it.act === "ult" ? "💥 " : it.act === "skill" ? "🥋 " : "⚔️ ") + who.name + " → " + other.name + " " + res.dmg + (res.crit ? " 暴击💥" : ""), "act");
      }
      commit(st, who.id);
    }
    renderBattle();
    setTimeout(aiTurnIfNeeded, 300);
  } catch (e) {}
}

function gridHtml() {
  const cell = (u) => {
    if (!u) return '<div style="min-height:72px;border:1px dashed #2a3350;border-radius:8px;"></div>';
    const dead = u.hp <= 0;
    const pct = Math.max(0, Math.round(u.hp / u.maxHp * 100));
    const rage = Math.max(0, Math.min(100, Math.round(Number(u.rage) || 0)));
    const isTgt = u.side === "B" && targetId === u.id;
    const clickable = u.side === "B" && !dead;
    return '<div ' + (clickable ? 'data-target="' + u.id + '" onclick="window.__pickTgt(\'' + u.id + '\')" ' : '') + 'style="min-height:72px;border:1px solid ' + (isTgt ? "#ffd666" : (u.side === "A" ? "#3d5a8a" : "#7a3b3b")) + ';border-radius:8px;padding:5px;' + (clickable ? "cursor:pointer;" : "") + (dead ? "opacity:.35;" : "") + (isTgt ? "box-shadow:0 0 0 1px #ffd666 inset;" : "") + '">' +
      '<div style="font-size:11px;font-weight:700;display:flex;justify-content:space-between;gap:4px;">' + esc(u.name) +
      (rage >= 100 ? '<span style="color:#ffd666;font-size:9px;">必杀</span>' : '') + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div style="height:3px;background:#1a1f2e;border-radius:3px;margin-top:2px;overflow:hidden;"><i style="display:block;height:100%;width:' + rage + '%;background:linear-gradient(90deg,#c9a0ff,#ff9bd2);"></i></div>' +
      '<div class="hint" style="font-size:9px;display:flex;justify-content:space-between;">' +
      '<span>' + fmt(Math.round(u.hp)) + '</span><span style="color:#c9a0ff;">🔥' + rage + '</span></div></div>';
  };
  const A = st.units.filter((u) => u.side === "A");
  const B = st.units.filter((u) => u.side === "B");
  const pick = (arr, col, row) => arr.find((u) => (u.__col ? 1 : 0) === col && ((u.__row == null ? 1 : u.__row) === row));
  let h = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;">' +
    '<div class="hint" style="grid-column:span 2;text-align:center;color:#8fd8ff;">🔵 我方</div>' +
    '<div class="hint" style="grid-column:span 2;text-align:center;color:#ff9b9b;">🔴 敌方</div>';
  for (let r = 0; r < 3; r++) {
    h += cell(pick(A, 1, r)) + cell(pick(A, 0, r)) + cell(pick(B, 0, r)) + cell(pick(B, 1, r));
  }
  return h + '</div></div>';
}

function renderBattle() {
  if (!st) return;
  afterCommit();
  const a = nextActor(st);
  const m = me(), f2 = foe();
  const wp = (st.__weapon && st.__weapon.data) || {};
  const turnText = st.finished ? (st.winner === "A" ? "🏆 胜利" : "💀 失败") : ("回合 " + st.round + " · 轮到 " + (a ? esc(a.name) : "—"));

  const hpBar = (u) => {
    const pct = Math.max(0, Math.min(100, Math.round(u.hp / u.maxHp * 100)));
    return '<div class="bar' + (pct <= 25 ? '' : ' full') + '"><i style="width:' + pct + '%"></i></div>' +
      '<div class="hint">' + fmt(Math.round(u.hp)) + ' / ' + fmt(Math.round(u.maxHp)) + (u.cd > 0 ? ' · 招式冷却 ' + u.cd : '') + '</div>';
  };

  view().innerHTML =
    '<div class="card"><div class="card-title">' + turnText + '</div>' +
      queueHtml2() + gridHtml() +
      '<div class="row"><span class="k">🔵 ' + esc(m.name) + '</span><span class="v">' + fmt(Math.round(m.hp)) + ' / ' + fmt(Math.round(m.maxHp)) + '</span></div>' + hpBar(m) +
      '<div class="row"><span class="k">🔴 ' + esc(f2.name) + '</span><span class="v">' + fmt(Math.round(f2.hp)) + ' / ' + fmt(Math.round(f2.maxHp)) + '</span></div>' + hpBar(f2) +
    (st.__isOrig ? '<div class="row"><span class="k">❄️ 霜印</span><span class="v" style="color:#8fd8ff;">' +
      (Number(st.__frost) || 0) + ' / 5　（普攻 +1 · 必杀每层 +15%）</span></div>' : "") +
    '</div>' +
    (st.finished ? '<div class="card"><div class="card-title">' + (st.winner === "A" ? "🏆 胜利" : "💀 失败") + '</div>' +
      (st.winner === "A" && st.__reward
        ? '<div class="row"><span class="k">金币</span><span class="v" style="color:#ffd666;">+' + fmt(st.__reward.gold) + '</span></div>' +
          '<div class="row"><span class="k">经验</span><span class="v" style="color:#7ee787;">+' + fmt(st.__reward.exp) + '</span></div>' +
          '<div class="row"><span class="k">关卡</span><span class="v">' + esc(st.__reward.stage) + '</span></div>' +
          '<div class="hint" style="margin-top:6px;">已写入存档（角色页可见）</div>'
        : '<div class="hint">没有奖励，回去练练再来</div>') +
      '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;"><button id="btnAgain">🔁 再来一场</button><button id="btnBack">← 返回选关</button></div></div>'
      : '<div class="card"><div class="card-title">行动</div>' +
        (function () {
          const t2 = foe();
          const wpn = (st.__weapon && st.__weapon.data) || {};
          const style = wpn.style || "melee";
          const rule = style === "melee" ? "近战：只能打前排" : style === "ranged" ? "远程：可自由选择前后排" : "法术：可自由选择前后排";
          return '<div class="hint" style="margin-bottom:6px;color:#ffd666;">🎯 当前目标：' +
            (t2 ? esc(t2.name) + '（' + ((t2.__col ? 1 : 0) === 0 ? "前排" : "后排") + '）' : "未选择") +
            '　·　' + rule + '　·　点敌方格子切换</div>';
        })() +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;">' +
          '<button data-act="normal" style="flex:1;min-width:110px;height:38px;" ' + (busy || !a || a.id !== "me" ? 'disabled' : '') + '>[普攻] ' + esc(wp.aName || "普攻") + ' · ' + (Number(wp.aMult) || 100) + '%（回怒+' + (Number(wp.aRage) || 20) + '）</button>' +
          (st.__talent ? '<button data-act="talent" style="flex:1;min-width:110px;height:38px;border-color:#c9a0ff;color:#c9a0ff;" ' + (st.__tcd > 0 ? 'disabled' : '') + '>✨ ' + esc(st.__talent.name) + (st.__tcd > 0 ? " 冷却 " + st.__tcd : "") + '</button>' : '') +
          '<button data-act="skill" style="flex:1;min-width:110px;height:38px;" ' + (busy || !a || a.id !== "me" || m.cd > 0 ? 'disabled' : '') + '>' +
            (m.cd > 0 ? '🥋 冷却 ' + m.cd + ' 回合' : '[技能] ' + esc(wp.sName || "招式") + ' · ' + (Number(wp.sMult) || 150) + '%') + '</button>' +
          '<button data-act="ult" style="flex:1;min-width:110px;height:38px;" ' + (busy || !a || a.id !== "me" || (Number(m.rage) || 0) < 100 ? 'disabled' : '') + '>' +
            ((Number(m.rage) || 0) >= 100 ? '[必杀] ' + esc(wp.uName || "必杀") + ' · ' + (Number(wp.uMult) || 250) + '%' : '💥 必杀 ' + Math.round(Number(m.rage) || 0) + '/100') + '</button>' +
          '<button data-act="defend" style="flex:1;min-width:110px;height:38px;" ' + (busy || !a || a.id !== "me" ? 'disabled' : '') + '>[防御] 减伤 30%</button>' +
        '</div>' +
        '<div class="hint" style="margin-top:6px;font-size:11px;color:#9aa4b8;">' +
          esc(wp.sName || "招式") + ' ' + (Number(wp.sMult) || 150) + '%×' + (Number(wp.sHits) || 1) +
          '（CD' + (Number(wp.sCd) || 2) + '·回怒+' + (Number(wp.sRage) || 10) + '）　·　' +
          '必杀 ' + (Number(wp.uMult) || 250) + '%×' + (Number(wp.uHits) || 1) +
          '　·　普攻 ' + (Number(wp.aMult) || 100) + '%×' + (Number(wp.aHits) || 1) + '（回怒+' + (Number(wp.aRage) || 20) + '）' +
        '</div></div>') +
    '<div class="card"><div class="card-title">战斗日志</div><div class="log">' +
      log.map((l) => l.kind === "hdr"
        ? '<div style="color:#ffd666;font-weight:700;margin:6px 0 2px;">' + esc(l.text) + '</div>'
        : '<div class="act">' + esc(l.text) + (l.subs && l.subs.length ? l.subs.map((x) => '<div class="sub">↳ ' + esc(x) + '</div>').join("") : "") + '</div>'
      ).join("") + '</div></div>';

  view().querySelectorAll("[data-target]").forEach((el) => {
    el.onclick = () => { targetId = el.dataset.target; renderBattle(); };
  });
  if ($("btnBack")) $("btnBack").onclick = renderPick;
  if ($("btnAgain")) $("btnAgain").onclick = () => startBattle(st.__stage);
  view().querySelectorAll("[data-act]").forEach((b) => { b.onclick = () => doAct(b.dataset.act); });
  // 日志自动滚到最新
  try {
    const lg = view().querySelector(".log");
    if (lg) lg.scrollTop = lg.scrollHeight;
  } catch (e) {}
  publishState();
}

// 多段倍率曲线：总和不变，逐段递增
function segMults(totalMult, hits, weights) {
  const n = Math.max(1, hits);
  let raw;
  if (Array.isArray(weights) && weights.length === n) raw = weights.slice();
  else { raw = []; for (let i = 0; i < n; i++) raw.push(0.85 + (0.3 * i) / Math.max(1, n - 1)); }
  const sum = raw.reduce((a, b) => a + b, 0) || 1;
  return raw.map((w) => Math.round((totalMult * w / sum) * 10) / 10);
}

function doAct(kind) {
  if (!st || st.finished || busy) return;
  if (st.__tcd > 0) st.__tcd -= 1;   // 天赋主动技冷却随玩家回合递减
  if (st.finished) return;
  const a = nextActor(st);
  if (!a || a.id !== "me") return;
  const m = me(), f2 = foe();
  clearDefend(m);
  const wp = (st.__weapon && st.__weapon.data) || {};
  const rounds = [];

  if (kind === "talent") {
    const t = st.__talent;
    if (!t || st.__tcd > 0) return;
    const L = Math.max(1, Number(t.lvl) || 1);
    const subs = [];
    if (t.key === "wall") { const sv = addShield ? addShield(st, "me", m.maxHp * (0.25 + 0.04 * (L - 1))) : 0; subs.push("护盾 " + sv); }
    else if (t.key === "frenzy") { addStatus(st, "me", "atkUp", 30 + 4 * (L - 1), 2, "狂战"); subs.push("攻击 +" + (30 + 4 * (L - 1)) + "%（2 回合）"); }
    else if (t.key === "gale") { st.__galePending = L >= 3 ? 2 : 1; subs.push("下回合额外行动 " + st.__galePending + " 次"); }
    else if (t.key === "arcane") { const r = damage(st, "me", foe().id, { atk: m.atk, mult: 180 + 18 * (L - 1), critRate: m.critRate, critDmg: m.critDmg }); subs.push("奥术伤害 " + r.dmg + (r.crit ? " 暴击" : "")); }
    else if (t.key === "bless") { const h = healUnit ? healUnit(st, "me", m.maxHp * (0.25 + 0.04 * (L - 1))) : 0; subs.push("恢复 " + h); }
    st.__tcd = Math.max(1, Number(t.cd) - (L >= 3 ? 1 : 0) - (L >= 5 ? 1 : 0));
    pushLog("✨ " + m.name + "「" + t.name + " Lv" + L + "」", "act", subs);
    commit(st, "me");
    if (st.finished && !spawnWave()) finish();
    renderBattle();
    setTimeout(aiTurnIfNeeded, 380);
    return;
  }
  if (kind === "defend") {
    pushLog("🛡️ " + m.name + " 进入防御（本回合减伤 +30%）");
    m.dmgCut = (m.dmgCut || 0) + 30;
    m.__defBonus = 1;
    commit(st, "me");
  } else if (kind === "ult") {
    const frost = st.__isOrig ? (Number(st.__frost) || 0) : 0;
    const ultMult = (Number(wp.uMult) || 250) * (1 + 0.15 * frost);
    const tgt0 = foe();
    const tgts = wp.uShape === "col"
      ? st.units.filter((u) => u.side === "B" && u.hp > 0 && ((u.__col ? 1 : 0) === (tgt0.__col ? 1 : 0)))
      : [tgt0];
    const uHitsN = Math.max(1, Number(wp.uHits) || 1);
    const perU = (Number(wp.uMult) || 250);
    const segU = segMults(perU * uHitsN, uHitsN);
    let r = { dmg: 0, crit: false };
    tgts.forEach((t, i) => {
      for (let h = 0; h < uHitsN; h++) {
        const rr = damage(st, "me", t.id, { atk: m.atk, mult: segU[h], critRate: m.critRate, critDmg: m.critDmg });
        if (st.__endless) st.__endless.dmg += rr.dmg;
        r.dmg += rr.dmg; if (rr.crit) r.crit = true;
      }
      if (i > 0) pushLog("💥 连带命中 " + t.name, "line");
    });
    if (st.__isOrig && frost > 0) { st.__frost = 0; pushLog("❄️ 消耗霜印 ×" + frost + "（倍率 +" + Math.round(frost * 15) + "%）", "line"); }
    m.rage = 0;
    pushLog("💥 " + m.name + " 必杀 → " + f2.name + " " + r.dmg + (r.crit ? " 暴击💥" : ""));
    commit(st, "me");
  } else if (kind === "skill") {
    const per = Number(wp.sMult) || 150;
    const hits = Math.max(1, Number(wp.sHits) || 1);
    const cd = Number(wp.sCd) || 3;
    let r = { dmg: 0, crit: false };
    const segs = [];
    const segPlan = segMults(per * hits, hits, wp.sSegWeights);
    for (let i = 0; i < hits; i++) {
      const rr = damage(st, "me", foe().id, { atk: m.atk, mult: segPlan[i], critRate: m.critRate, critDmg: m.critDmg });
      if (st.__endless) st.__endless.dmg += rr.dmg;
      r.dmg += rr.dmg; if (rr.crit) r.crit = true;
      segs.push(rr.dmg + (rr.crit ? "💥" : ""));
      if (st.__isOrig && rr.dmg > 0) {
        st.__frost = Math.min(5, (Number(st.__frost) || 0) + 1);
        pushLog("❄️ 霜印 +1（" + st.__frost + "/5）", "line");
      }
    }
    const subs = [hits + " 段（" + segPlan.join("/") + "%）· 合计 " + r.dmg + (r.crit ? "（含暴击）" : "") + (hits > 1 ? " · 分段 " + segs.join(" / ") : "")];
    if (wp.hitStatus && r.dmg > 0) {
      addStatus(st, f2.id, wp.hitStatus, Number(wp.hitStatusV) || 3, Number(wp.hitStatusTurns) || 2, wp.hitStatusName || wp.hitStatus);
      subs.push("对 " + f2.name + " 施加「" + (wp.hitStatusName || wp.hitStatus) + "」（" + (Number(wp.hitStatusV) || 3) + "% · " + (Number(wp.hitStatusTurns) || 2) + " 回合）");
    }
    pushLog("🥋 " + m.name + "「" + (wp.sName || "招式") + "」→ " + f2.name + " " + r.dmg + (r.crit ? " 暴击💥" : ""), "act", subs);
    setCooldown(st, "me", cd);
    commit(st, "me");
  } else {
    const aMult = Number(wp.aMult) || 100;
    const aHits = Math.max(1, Number(wp.aHits) || 1);
    const aSeg = segMults(aMult * aHits, aHits, wp.aSegWeights);
    let r = { dmg: 0, crit: false };
    for (let i = 0; i < aHits; i++) {
      const rr = damage(st, "me", foe().id, { atk: m.atk, mult: aSeg[i], critRate: m.critRate, critDmg: m.critDmg });
      if (st.__endless) st.__endless.dmg += rr.dmg;
      r.dmg += rr.dmg; if (rr.crit) r.crit = true;
      if (st.__isOrig && rr.dmg > 0) {
        st.__frost = Math.min(5, (Number(st.__frost) || 0) + 1);
        pushLog("❄️ 霜印 +1（" + st.__frost + "/5）", "line");
      }
    }
    pushLog("⚔️ " + m.name + " 普攻 → " + f2.name + " " + r.dmg + (r.crit ? " 暴击💥" : ""), "act",
      ["攻击 " + Math.round(m.atk) + " × 100% → 目标防御 " + Math.round(f2.def) + " 减免 → 实际 " + r.dmg + (r.crit ? "（暴击 ×" + (m.critDmg / 100).toFixed(1) + "）" : "")]);
    commit(st, "me");
  }

  if (st.__endless && !st.finished && Number(st.round) > st.__endless.rounds) {
    st.finished = true; st.winner = "A";
    pushLog("⏱ 试炼结束：累计伤害 " + Math.round(st.__endless.dmg) + " / " + Math.round(st.__endless.maxHp), "hdr");
    finish(); renderBattle(); return;
  }
  if (st.finished) { finish(); renderBattle(); return; }
  if (kind !== "ult") {
    const gain = kind === "skill"
      ? (Number(wp.sRage) || 10)
      : (Number(wp.aRage) || 20);
    m.rage = Math.min(100, (Number(m.rage) || 0) + gain);
    if (gain) pushLog("⚡ 回怒 +" + gain + "（" + Math.round(m.rage) + "/100）", "line");
  }
  renderBattle();
  setTimeout(aiTurnIfNeeded, 380);
}

function aiTurnIfNeeded() {
  if (!st || st.finished) return;
  if (roomId && amHost) {
    // 联机模式：等对手提交；超时 20 秒由房主代打
    const a0 = nextActor(st);
    if (a0 && a0.side === "B" && window.__guestControls) {
      if (!window.__waitSince || window.__waitUnit !== a0.id) { window.__waitSince = Date.now(); window.__waitUnit = a0.id; }
      const waited = Date.now() - window.__waitSince;
      if (waited < 20000) { setTimeout(pullIntents, 350); return; }
      window.__waitSince = 0;
      pushLog("⏳ " + a0.name + " 超时未出手，房主代打", "line");
    }
  }  const a = nextActor(st);
  if (!a) return;
  if (a.side === "A" && a.id !== "me") {
    // 🤝 同行托管控
    setTimeout(() => {
      const t = foe();
      const r = damage(st, a.id, t.id, { atk: a.atk, mult: 100, critRate: a.critRate, critDmg: a.critDmg });
      pushLog("🤝 " + a.name + " 出手 → " + t.name + " " + r.dmg, "line");
      commit(st, a.id);
      if (st.finished && !spawnWave()) finish();
      renderBattle();
      setTimeout(aiTurnIfNeeded, 300);
    }, 350);
    return;
  }
  if (a.side !== "B") { renderBattle(); return; }
  busy = true;
  setTimeout(() => {
    const f2 = st.units.find((u) => u.id === a.id) || foe();
    const m = me();
    clearDefend(f2);
    const sk = f2.__skills || [];
    const ultS = sk.find((s) => s.kind === "ult");
    const skillS = sk.find((s) => s.kind === "skill");
    const normS = sk.find((s) => s.kind === "normal");
    let used = normS, label = "普攻";
    if (ultS && (Number(f2.rage) || 0) >= 100) { used = ultS; f2.rage = 0; label = "必杀"; }
    else if (skillS && (Number(f2.cd) || 0) <= 0) { used = skillS; f2.cd = Number(skillS.cd) || 3; label = "技能"; }
    else { f2.rage = Math.min(100, (Number(f2.rage) || 0) + (Number(used && used.rage) || (label === "技能" ? 15 : 20))); }
    if ((Number(f2.cd) || 0) > 0) f2.cd -= 1;
    // 🌀 增益：临时 buff，持续 buffTurns 回合
    if (used && used.buff) {
      const bu = Object.assign({}, used.buff);
      const turns = Number(used.buffTurns) || 2;
      f2.__buff = Object.assign({}, f2.__buff || {}, bu, { turns });
      pushLog("🌀 " + f2.name + " 获得增益（" + turns + " 回合）", "line");
    }
    // 回合结束时递减
    if (f2.__buff && f2.__buff.turns != null) {
      // 本次已用，下一回合开始递减
    }
    const mult = Number(used && used.mult) || 100;
    const atkBuff = 1 + ((f2.__buff && Number(f2.__buff.atkPct)) || 0) / 100;
    const hits = Math.max(1, Number(used && used.hits) || 1);
    const shape = (used && used.shape) || (used && used.aoe ? "all" : "single");
    const dmgType = (used && used.dmgType) || "phys";
    const alliesA = st.units.filter((u) => u.side === "A" && u.hp > 0);
    const meRow = (m.__row == null ? 1 : m.__row), meCol = m.__col ? 1 : 0;
    let tgts = [m];
    if (shape === "all") tgts = alliesA;
    else if (shape === "row") tgts = alliesA.filter((u) => (u.__row == null ? 1 : u.__row) === meRow);
    else if (shape === "col") tgts = alliesA.filter((u) => ((u.__col ? 1 : 0) === meCol));
    let total = 0, crit = false;
    const segPlan = segMults(mult * hits, hits, used && used.segWeights);
    tgts.forEach((t) => {
      for (let h = 0; h < hits; h++) {
        const rr = damage(st, f2.id, t.id, { atk: f2.atk * atkBuff, mult: segPlan[h], critRate: f2.critRate, critDmg: f2.critDmg, dmgType });
        total += rr.dmg; if (rr.crit) crit = true;
      }
    });
    if (tgts.length > 1) pushLog("🎯 命中 " + tgts.length + " 个目标", "line");
    const r = { dmg: total, crit };
    pushLog((label === "必杀" ? "💥 " : label === "技能" ? "🥋 " : "⚔️ ") + f2.name + (used && used.name ? "「" + used.name + "」" : "") + " → " + m.name + " " + r.dmg + (r.crit ? " 暴击💥" : ""));
    if (used && used.burn) addStatus(st, f2.id, "me", "burn", Number(used.burn) || 20, 2, "灼烧");
    if (used && used.stun) addStatus(st, f2.id, "me", "stun", Number(used.stun) || 20, 1, "眩晕");
    if (used && used.silence) addStatus(st, f2.id, "me", "silence", Number(used.silence) || 20, 2, "沉默");
    {
      const th = Number((m.traits || {}).thorns) || 0;
      if (th > 0 && r.dmg > 0 && f2.hp > 0) {
        const refl = Math.max(1, Math.round(r.dmg * th / 100));
        f2.hp = Math.max(0, f2.hp - refl);
        if (f2.hp === 0) f2.alive = false;
        pushLog("🌵 反伤 → " + f2.name + " " + refl, "line");
      }
    }
    commit(st, f2.id);
    busy = false;
    if (st.finished && !spawnWave()) finish();
    renderBattle();
    setTimeout(aiTurnIfNeeded, 300);
  }, 420);
}

function spawnWave() {
  if (!st || !st.__waves || !st.__waves.length) return false;
  const wave = st.__waves.shift();
  wave.forEach((e, i) => {
    st.units.push({
      id: "foe_w" + st.__waveNo + "_" + i, name: e.name, lv: e.lv || 1, side: "B", spd: e.spd, power: 0,
      hp: e.hp, maxHp: e.hp, atk: e.atk, def: e.def, res: e.res || 0, critRate: 5, critDmg: 150
    });
  });
  st.__waveNo = (st.__waveNo || 1) + 1;
  st.finished = false; st.winner = null;
  pushLog("🌊 第 " + st.__waveNo + " 波来袭：" + wave.map((x) => x.name).join("、"), "hdr");
  return true;
}

function finish() {
  const ch = activeChar();
  if (!st || !st.finished || st.__done) return;
  st.__done = true;
  if (st.winner !== "A") { pushLog("💀 战斗失败"); return; }
  const s = STAGES.find((x) => x.id === st.__stage) || STAGES[0];
  store.flags = store.flags || {};
  store.flags.firstClear = store.flags.firstClear || {};
  const isEvent = String(s.id).indexOf("fest") === 0;
  // ♾ 无尽试炼：按伤害比例给碎片
  if (s.endless && st.__endless) {
    const ratio = Math.max(0, Math.min(1.2, st.__endless.dmg / Math.max(1, st.__endless.maxHp)));
    const gain = Math.max(2, Math.round(ratio * 40));
    const key = String(s.id).indexOf("fest2") === 0 ? "kShard" : "kyoShard";
    const name = key === "kShard" ? "究极热动拳套碎片" : "草薙流古武典碎片";
    store.flags = store.flags || {};
    store.flags[key] = (Number(store.flags[key]) || 0) + gain;
    addReceipt(store, "无尽试炼", s.name, { items: [{ name, count: gain }] });
    st.__reward = { gold: 0, exp: 0, stage: s.name, drops: [{ name, count: gain }] };
    pushLog("♾ 伤害比 " + Math.round(ratio * 100) + "% → " + name + " +" + gain, "line");
    save();
    return;
  }
  const rewardOK = !(isEvent && !s.repeat && store.flags.firstClear[s.id]);
  if (isEvent && !s.repeat) store.flags.firstClear[s.id] = 1;
  const gold = rewardOK ? (Number(s.gold) || (120 + s.foe.lv * 8)) : 0;
  const exp = rewardOK ? (Number(s.exp) || (40 + s.foe.lv * 6)) : 0;
  store.gold = (Number(store.gold) || 0) + gold;
  // 🔓 通关进度（每个副本独立）
  store.flags = store.flags || {};
  {
    const k = dungeonKey(s), n = stageNo(s);
    const map = store.flags.cleared || (store.flags.cleared = {});
    if (n > (Number(map[k]) || 0)) { map[k] = n; if (k === "exp") store.flags.expCleared = n; pushLog("🔓 已解锁下一关", "line"); }
  }
  store.exp = (Number(store.exp) || 0) + exp;
  // 🧬 原创角色同样吃经验、按同一曲线升级
  if (st.__isOrig && st.__origId && exp > 0) {
    store.orig = store.orig || {};
    const prog = store.orig[st.__origId] || (store.orig[st.__origId] = { lv: 1, exp: 0, breaks: 0 });
    prog.lv = Number(prog.lv) || 1;
    prog.exp = (Number(prog.exp) || 0) + exp;   // 只累积经验，升级由玩家在角色页手动点
  }
  // 🎁 掉落：碎片必掉、强化石必掉、装备按概率
  const rnd = (a) => a[0] + Math.floor(Math.random() * (a[1] - a[0] + 1));
  const ZERO = { shards: [0, 0], stone: [0, 0], refine: [0, 0], shardR: [0, 0], shardSR: [0, 0], shardSSR: [0, 0], bstone: 0, kyoShard: [0, 0], kShard: [0, 0], gearChance: 0 };
  const dp = rewardOK
    ? Object.assign({}, ZERO, { shards: [5, 8], stone: [1, 2], gearChance: 5 }, s.drop || {})
    : ZERO;
  const shards = rnd(dp.shards), stone = rnd(dp.stone);
  store.flags = store.flags || {};
  store.flags.shards = (Number(store.flags.shards) || 0) + shards;
  store.flags.stone = (Number(store.flags.stone) || 0) + stone;
  const refine = rnd(dp.refine);
  const shR = rnd(dp.shardR) || 0, shSR = rnd(dp.shardSR) || 0, shSSR = rnd(dp.shardSSR) || 0;
  const msN = 0, mdN = 0, bst = 0;
  const MAT_NAME = {
    ms1: "初级手稿", ms2: "中级手稿", ms3: "高级手稿",
    md1: "青铜勋章", md2: "白银勋章", md3: "黄金勋章",
    cert1: "新手突破证书", cert2: "入门突破证书", cert3: "精英突破证书", cert4: "大师突破证书"
  };
  const bagAdd = (obj) => {
    if (!obj) return;
    Object.keys(obj).forEach((k) => {
      const n = rnd(obj[k]) || 0;
      if (!n) return;
      store.flags[k] = (Number(store.flags[k]) || 0) + n;
      drops.push({ name: MAT_NAME[k] || k, count: n });
    });
  };
  store.flags.shardR = (Number(store.flags.shardR) || 0) + shR;
  store.flags.shardSR = (Number(store.flags.shardSR) || 0) + shSR;
  store.flags.shardSSR = (Number(store.flags.shardSSR) || 0) + shSSR;
  store.flags.refineStone = (Number(store.flags.refineStone) || 0) + refine;
  const drops = [];
  if (exp) drops.push({ name: "经验", count: exp });
  if (stone) drops.push({ name: "强化石", count: stone });
  if (refine) drops.push({ name: "精炼石", count: refine });
  if (shR) drops.push({ name: "R 碎片", count: shR });
  if (shSR) drops.push({ name: "SR 碎片", count: shSR });
  if (shSSR) drops.push({ name: "SSR 碎片", count: shSSR });
  bagAdd(dp.ms); bagAdd(dp.md); bagAdd(dp.cert);
  const gearFlag = s.themeGear ? ("gear_" + s.themeGear) : "";
  if (dp.themeGear && s.themeGear && !(store.flags[gearFlag])) {
    store.flags[gearFlag] = 1;
    const gdef = WEAPONS.find((w) => w.name === s.themeGear) || { name: s.themeGear, rarity: "UR", atk: 150, critRate: 8, critDmg: 20 };
    store.items.push(makeItem("weapon", gdef));
    drops.push({ name: s.themeGear, count: 1 });
  } else if (Math.random() * 100 < (dp.gearChance || 0)) {
    const pool = s.tier >= 3 ? [WEAPONS, ARMORS, ACCESSORIES] : [ARMORS, ACCESSORIES];
    const list0 = pool[Math.floor(Math.random() * pool.length)];
    const list = list0.filter((x) => x.rarity === "R" || x.rarity === "SR");
    const def = (list.length ? list : list0)[Math.floor(Math.random() * (list.length || list0.length))];
    const cat = pool[0] === WEAPONS && list === WEAPONS ? "weapon" : (list === ARMORS ? "armor" : "accessory");
    store.items.push(makeItem(cat, def));
    drops.push({ name: def.name, count: 1 });
  }
  addReceipt(store, "战斗", s.name, { gold, items: drops });
  st.__reward = { gold, exp, stage: s.name, drops };
  if (!rewardOK) pushLog("🎗 重复挑战：本次没有奖励（活动奖励仅首次通关发放）", "line");
  pushLog("🏆 胜利：金币 +" + gold + " · 经验 +" + exp + " · " + drops.map((d) => d.name + "×" + d.count).join("、"));
  save();
}

$("btnSave").onclick = () => save();
(async () => {
  try { await pullOriginals(); } catch (e) {}
  await load();
  // 联机：URL 里带 room → 从房间读状态
  const q = new URLSearchParams(location.search);
  roomId = q.get("room") || "";
  if (roomId) {
    try {
      const got = await getRoom(roomId);
      if (got) {
        amHost = got.room.host === box;
        if (!amHost && got.room.state) renderSpectator(got.room.state);
        if (amHost) { const okRestore = await tryRestore(); if (!okRestore) renderPick(); }
        setInterval(async () => {
  try { await pullOriginals(); } catch (e) {}
          if (amHost) return;
          try {
            const g2 = await getRoom(roomId);
            if (g2 && g2.room.state && g2.room.seq !== seq) {
              seq = g2.room.seq; lastStateAt = Date.now();
              renderSpectator(g2.room.state);
            } else if (lastStateAt && Date.now() - lastStateAt > 20000) {
              const tag = document.getElementById("hostOffline");
              if (tag) tag.style.display = "inline-block";
            }
          } catch (e) {}
        }, 500);
      }
    } catch (e) {}
  }
})();

// 👀 观战视图（只读）
let seq = 0, lastStateAt = 0;
function renderSpectator(state) {
  const meU = state.units.find((u) => u.id === "me") || state.units[0];
  const foeU = state.units.find((u) => u.id !== meU.id) || state.units[1];
  const bar = (u) => {
    const pct = Math.max(0, Math.min(100, Math.round(u.hp / u.maxHp * 100)));
    return '<div class="bar' + (pct <= 25 ? '' : ' full') + '"><i style="width:' + pct + '%"></i></div>' +
      '<div class="hint">' + fmt(u.hp) + ' / ' + fmt(u.maxHp) + (u.cd ? ' · 冷却 ' + u.cd : '') +
      (u.statuses && u.statuses.length ? ' · ' + u.statuses.map((s) => (s.label || s.key) + (s.turns ? '(' + s.turns + ')' : '')).join('、') : '') + '</div>';
  };
  const myTurn = !amHost && !state.finished && state.turn === foeU.id;
  const myUnit = (!amHost && st && st.__myUnit) ? st.__myUnit : null;
  const myTurnReal = !amHost && !state.finished && (!myUnit || state.turn === myUnit) && state.turn !== null;
  const ctrlUnit = myUnit && state.units ? state.units.find((u) => u.id === myUnit) : null;
  const A = state.units.filter((u) => u.side === "A");
  const B = state.units.filter((u) => u.side !== "A");
  const listHtml = (arr, label, color) => '<div class="card-title" style="color:' + color + ';margin-top:8px;">' + label + '（' + arr.length + '）</div>' +
    arr.map((u) => '<div class="row"><span class="k">' + (state.turn === u.id ? "▶ " : "") + esc(u.name) + ' <span class="tag">Lv' + (u.lv || 1) + ' · 速' + Math.round(u.spd) + '</span>' +
      (u.cd ? ' <span class="tag">冷却 ' + u.cd + '</span>' : '') +
      (u.rage >= 100 ? ' <span class="tag" style="color:#ffd666;">怒气满</span>' : '') +
      ((u.statuses || []).length ? '<div class="hint">' + u.statuses.map((s) => (s.label || s.key) + (s.turns ? '(' + s.turns + ')' : '')).join('、') + '</div>' : '') +
      '</span><span class="v">' + u.hp + '/' + u.maxHp + '</span></div>' + bar(u)).join("");
  view().innerHTML =
    '<div class="card"><div class="card-title">' + (amHost ? "👀 观战中" : (myTurnReal ? "⚡ 轮到你（" + esc(ctrlUnit ? ctrlUnit.name : "你的单位") + "）" : "👀 等待")) +
      ' · 回合 ' + (state.round || 1) + (state.finished ? (state.winner === "A" ? " · 🏆 蓝方胜" : " · 🏆 红方胜") : '') + '</div>' +
      listHtml(A, "🔵 蓝方", "#6ea8fe") + listHtml(B, "🔴 红方", "#ff9b9b") +
      '<div id="hostOffline" style="display:none;margin-top:6px;font-size:11px;color:#ff9b9b;">⚠️ 主机 20 秒没有更新，可能掉线了</div>' +
      (myTurnReal
        ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">' +
            '<button data-intent="normal" style="flex:1;min-width:100px;height:36px;">⚔️ 普攻</button>' +
            '<button data-intent="skill" style="flex:1;min-width:100px;height:36px;" ' + ((ctrlUnit && ctrlUnit.cd > 0) ? 'disabled' : '') + '>🥋 招式' + ((ctrlUnit && ctrlUnit.cd > 0) ? ' 冷却 ' + ctrlUnit.cd : '') + '</button>' +
            '<button data-intent="ult" style="flex:1;min-width:100px;height:36px;" ' + ((ctrlUnit && ctrlUnit.rage < 100) ? 'disabled' : '') + '>💥 必杀 ' + Math.round((ctrlUnit && ctrlUnit.rage) || 0) + '/100</button>' +
            '<button data-intent="defend" style="flex:1;min-width:100px;height:36px;">🛡️ 防御</button>' +
          '</div>'
        : '<div class="hint" style="margin-top:6px;">' + (myUnit ? "等自己的单位出手" : "你在观战（房间已满或没分到单位）") + '；数值由房主计算。</div>') + '</div>' +
    '<div class="card"><div class="card-title">战斗日志</div><div class="log">' +
      (state.log || []).map((l) => l.kind === "hdr"
        ? '<div style="color:#ffd666;font-weight:700;margin:6px 0 2px;">' + esc(l.text) + '</div>'
        : '<div class="act">' + esc(l.text) + ((l.subs || []).length ? l.subs.map((x) => '<div class="sub">↳ ' + esc(x) + '</div>').join("") : "") + '</div>').join("") +
    '</div></div>';

  view().querySelectorAll("[data-intent]").forEach((b) => b.onclick = async () => {
    b.disabled = true;
    const r = await pushIntent(roomId, { by: box, unitId: myUnit || (ctrlUnit && ctrlUnit.id) || foeU.id, act: b.dataset.intent });
    if (!r.ok) { b.disabled = false; return; }
  });
}

function pushLogLocal(text) {
  log.push({ text, kind: "line" });
}
</script>
