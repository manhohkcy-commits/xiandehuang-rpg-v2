<script type="module">
import { cloudGet, cloudSave, cacheLoad, cacheSave, esc, fmt, addReceipt, gateLoad, bumpDaily } from "./js/core.js?v=13807141";
import { getRoom, putRoom, pushIntent, takeIntents, buildUnits, unitOfPlayer } from "./js/room.js?v=f9b6158c";
import { WEAPONS, ARMORS, ACCESSORIES, STAGES, STAGE_READY, CHAR, DUNGEONS, ENVIRONMENTS } from "./js/data.js?v=bcdc6c0b";
import { enemyAt, enemyById, enemyPower, stagePower } from "./js/enemies.js?v=00f0acb8";
import { ORIGINALS, originalToUnits, pullOriginals, originalFinal, gearAbilities, ORIGINAL_GEAR } from "./js/originals.js?v=0167d36b";
import { makeItem } from "./js/items.js?v=a6c2aa88";
import { charFinal, charPower, combatTraits, talentActive } from "./js/power.js?v=d92ed317";
import { createBattle, nextActor, commit, damage, setCooldown, aliveUnits, applyStatus, addStatus, isStunned, isSilenced, isDisarmed, canUseSkill, canUseNormal, healUnit, addShield, dispel, hasStatus } from "./js/battle.js?v=273a02ba";

let box = "", store = null, updatedAt = "", st = null, log = [], busy = false, lastRound = 1;
// 🧬 当前操控的原创角色（记住上次选择，换页不丢）
window.__playOrig = localStorage.getItem("rpg2:playAs") || null;

// 🤝 同行队伍（最多 5 名友方原创角色，默认托管）
function partyIds() { try { return JSON.parse(localStorage.getItem("rpg2:party") || "[]"); } catch (e) { return []; } }
// 👑 主机标记：只有主机能操控原创角色
function isHost() { try { if (localStorage.getItem("rpg2:host") === "1") return true; } catch (e) {} try { if (localStorage.getItem("rpg2:hostBox") === "zynSD117" || localStorage.getItem("rpg2:box") === "zynSD117") return true; } catch (e) {} return readBox() === "zynSD117"; }
async function sysPost(text) {
  try {
    const r = await cloudGet("__chat");
    const st = (r && r.store) || { v: 2, items: [], chars: [] };
    st.v = 2; if (!Array.isArray(st.items)) st.items = []; if (!Array.isArray(st.chars)) st.chars = [];
    const msgs = (st.msgs || []).slice(-59);
    msgs.push({ n: "📢 系统", t: text, at: Date.now() });
    st.msgs = msgs;
    await cloudSave("__chat", st, r && r.updated_at, "系统播报");
  } catch (e) {}
}
function origLv(o) {
  if (isHost()) return Number(((store.orig || {})[o.id] || {}).lv) || 1;
  return Number(o.lv) || 1;
}
function setParty(a) { try { localStorage.setItem("rpg2:party", JSON.stringify(a.slice(0, 5))); } catch (e) {} }
const $ = (id) => document.getElementById(id);
const view = () => $("view");
const activeChar = () => (store && store.chars || []).find((c) => c.id === store.activeChar) || (store && store.chars || [])[0] || null;
// 武器数据兼容两种存法：装备里直接存 data，或存 {cat,data} 包装
const wpOf = (w) => (w && (w.data || (w.sMult != null || w.sName || w.hitStatus ? w : null))) || {};
// 多段攻击：总倍率平均分到 N 段，每段独立判定暴击
// 🌊 多段伤害：总倍率不变，按段伤曲线分配（首段重、后段轻）
const HIT_CURVE = {
  1: [1],
  2: [0.6, 0.4],
  3: [0.45, 0.35, 0.2],
  4: [0.4, 0.3, 0.2, 0.1],
  5: [0.3, 0.25, 0.2, 0.15, 0.1]
};
function strike(st, atkId, defId, opts, hits) {
  const n = Math.max(1, Math.min(5, Number(hits) || 1));
  const w = HIT_CURVE[n] || Array(n).fill(1 / n);
  const total = Number(opts.mult) || 100;
  let dmg = 0, crit = false, killed = false;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const r = damage(st, atkId, defId, Object.assign({}, opts, { mult: total * w[i] }));
    dmg += r.dmg; crit = crit || r.crit; killed = killed || r.killed;
    parts.push({ dmg: r.dmg, crit: r.crit });
    if (killed) break;
  }
  return { dmg, crit, killed, hits: n, parts };
}

function readBox() {
  try { if (localStorage.getItem("rpg2:host") === "1") return "zynSD117"; if (localStorage.getItem("rpg2:hostBox") === "zynSD117") return "zynSD117"; } catch (e) {}
  const q = new URLSearchParams(location.search);
  if (q.get("box")) return q.get("box");
  return localStorage.getItem("rpg2:box") || "";
}

async function load() {
  box = readBox();
  $("boxTag").textContent = box || "缺 box";
  $("backCreate").href = "create.html" + (box ? "?box=" + encodeURIComponent(box) : "");
  const g = await gateLoad(box, {});
  if (!g.ok) {
    view().innerHTML = '<div class="card"><div class="card-title">进不去</div><div class="hint">' + esc(g.reason) + '</div>' +
      '<div class="hint" style="margin-top:6px;">先去 <a href="create.html?box=' + encodeURIComponent(box) + '">我的角色</a> 验证一次</div></div>';
    return;
  }
  store = g.store; updatedAt = g.updatedAt || "";
  try { await pullOriginals(); } catch (e) {}
  renderPick();
}

async function save() {
  if (!box || !store) return false;
  store.__at = Date.now();
  cacheSave(box, store);
  if (!updatedAt) return false;   // 新位号还没云端行：本机试用模式
  try {
    const r = await cloudSave(box, store, updatedAt, activeChar() ? activeChar().name : "");
    if (r.ok) updatedAt = r.row.updated_at || updatedAt;
    return r.ok;
  } catch (e) { return false; }
}

// ── 选关 ──────────────────────────────────────────────
// 🏯 副本列表：4 个日常（每档 5 关折叠）+ 待定 + 庆典试炼
function weekKey() {
  const d = new Date();
  const one = new Date(d.getFullYear(), 0, 1);
  const days = Math.floor((d - one) / 86400000);
  const w = Math.ceil((days + one.getDay() + 1) / 7);
  return d.getFullYear() + "-W" + String(w).padStart(2, "0");
}
// 🔒 关卡解锁：通关第 N 关才解锁第 N+1 关
function stageNo(s) { const m = String(s && s.id).match(/(\d+)$/); return m ? Number(m[1]) : 0; }
function dungeonKey(s) { return String((s && s.id) || "").split("_")[0]; }
function clearedFor(s) {
  const f = store.flags || {};
  const map = f.cleared || {};
  const k = dungeonKey(s);
  if (map[k] != null) return Number(map[k]) || 0;
  // 兼容旧存档：经验本进度存在 expCleared
  return k === "exp" ? (Number(f.expCleared) || 0) : 0;
}
function expCleared() { return Number((store.flags || {}).expCleared) || 0; }
function isUnlocked(s) { return stageNo(s) <= clearedFor(s) + 1; }

function dungeonHtml() {
  // 🚧 目前只有「枫林剿匪」设计完成，其他副本先隐藏
  const dailies = DUNGEONS.filter((d) => d.type === "daily" && (d.id === "d_exp" || d.id === "d_gold"));
  const event = null;
  const stageRow = (s) => {
    const no = stageNo(s), locked = !isUnlocked(s);
    return '<div class="row" style="' + (locked ? "opacity:.55;" : "") + '"><span class="k">' + esc(s.name) +
      '<div class="hint" style="margin-top:2px;">' + esc(s.story || "") + '</div>' +
      '<div class="hint" style="margin-top:2px;color:#8fd8ff;">' +
        (s.tier ? '<span class="tag" style="margin-right:6px;' +
          (s.tier === "首领" ? "border-color:#ff6b6b;color:#ff6b6b;"
            : s.tier === "特色" ? "border-color:#ffb347;color:#ffb347;"
            : s.tier === "精英" ? "border-color:#c9a0ff;color:#c9a0ff;" : "") + '">' + s.tier + '</span>' : "") +
        esc(s.scene || "") + " · " + (ENVIRONMENTS[s.weather || "clear"].icon + " " + ENVIRONMENTS[s.weather || "clear"].name +
        " · 适配 Lv" + s.lv + "~" + (s.lv + 5) + " · 建议战力 " + fmt(stagePower(s))) +
      '</div></span>' +
      '<span class="v">' + (locked
        ? '<span class="hint">🔒 通关第 ' + (no - 1) + ' 关解锁</span>'
        : '<button data-enemylist="' + s.id + '" style="margin-right:6px;">👁</button><button data-stage="' + s.id + '">挑战</button>') +
      '</span></div>';
  };

  const dailyCards = dailies.map((d) => {
    if (!d.stages.length) {
      return '<div class="card"><div class="card-title">' + d.icon + ' ' + esc(d.name) + '</div><div class="hint">' + esc(d.desc) + '</div></div>';
    }
    const groups = [1, 2, 3, 4].map((g) => d.stages.filter((s) => s.group === g)).filter((arr) => arr.length);
    return '<div class="card"><div class="card-title">' + d.icon + ' ' + esc(d.name) +
      ' <span class="tag">' + d.stages.length + ' 关</span> <span class="tag">已通关 ' + Math.min(d.stages.length ? clearedFor(d.stages[0]) : 0, d.stages.length) + '/' + d.stages.length + '</span></div>' +
      '<div class="hint" style="margin-bottom:6px;">' + esc(d.desc) + '　|　不限次数</div>' +
      groups.map((arr, gi) => '<details style="margin-top:6px;"' + (gi === 0 ? ' open' : '') + '>' +
        '<summary style="cursor:pointer;font-size:12px;color:#8fd8ff;font-weight:700;">第 ' + (gi + 1) + ' 档 · Lv' +
        arr[0].lv + ' ~ ' + arr[arr.length - 1].lv + '</summary>' +
        arr.map(stageRow).join("") + '</details>').join("") + '</div>';
  }).join("");

  let eventCard = "";
  if (event) {
    const done = (store.flags && store.flags.festWeek) === weekKey();
    eventCard = '<div class="card"><div class="card-title">' + event.icon + ' ' + esc(event.name) + ' <span class="tag">限定</span></div>' +
      '<div class="hint">' + esc(event.desc) + '</div>' +
      (event.stages.length
        ? '<div class="row"><span class="k">' + esc(event.stages[0].name) + ' Lv' + event.stages[0].foe.lv +
          '<div class="hint">HP ' + fmt(event.stages[0].foe.hp) + ' · 攻 ' + event.stages[0].foe.atk + ' · 奖励丰厚</div></span>' +
          '<span class="v">' + (done ? '<span class="hint">本周已通关</span>' :
            '<button data-stage="' + event.stages[0].id + '" style="border-color:#ffb347;color:#ffb347;">挑战</button>') + '</span></div>'
        : '<div class="hint">筹备中</div>') + '</div>';
  }
  return dailyCards + eventCard;
}

// 👁 关卡敌人清单
function openEnemyList(stageId) {
  const s = STAGES.find((x) => x.id === stageId);
  if (!s) return;
  const ids = s.enemies && s.enemies.length ? s.enemies : [];
  const rows = ids.map((id) => {
    const e = enemyAt(id, s.lv);
    if (!e) return "";
    return '<div data-einfo="' + id + '" style="display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid #1a2438;cursor:pointer;">' +
      '<span style="font-weight:700;color:#dbe4f3;">' + esc(e.name) + '</span>' +
      '<span class="hint">' + esc(e.role) + '</span>' +
      '<span style="margin-left:auto;font-size:10.5px;color:#ffd666;">⚔️ ' + fmt(enemyPower(e)) + '</span></div>';
  }).join("");
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(5,8,16,.88);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;";
  ov.innerHTML = '<div class="card" style="max-width:420px;width:100%;max-height:86vh;overflow:auto;">' +
    '<div class="card-title">👁 ' + esc(s.name) + '</div>' +
    '<div class="hint" style="margin-bottom:6px;">可能出现 ' + ids.length + ' 名敌人（Lv' + s.lv + '）· 点任意一名查看详情</div>' +
    '<div style="background:#0d1322;border:1px solid #1c2740;border-radius:10px;overflow:hidden;">' + (rows || '<div class="hint" style="padding:8px;">没有敌人</div>') + '</div>' +
    '<div style="margin-top:10px;"><button id="elClose" style="width:100%;">关闭</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#elClose").onclick = () => ov.remove();
  ov.onclick = (ev) => { if (ev.target === ov) ov.remove(); };
  ov.querySelectorAll("[data-einfo]").forEach((el) => el.onclick = () => openEnemyDetail(el.dataset.einfo, s.lv));
}
function openEnemyDetail(id, lv) {
  const e = enemyAt(id, lv);
  if (!e) return;
  const tint = "#ff9b9b", s = e.stats;
  const r = (k, v) => '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 9px;border-bottom:1px solid #1a2438;">' +
    '<span class="hint">' + k + '</span><span style="font-weight:600;color:#dbe4f3;font-size:13px;">' + v + '</span></div>';
  const sec = (t) => '<div style="font-size:11px;color:#8fd8ff;font-weight:700;letter-spacing:1px;margin:12px 0 5px;">' + t + '</div>';
  const panel = (inner) => '<div style="background:#0d1322;border:1px solid #1c2740;border-radius:10px;overflow:hidden;">' + inner + '</div>';
  const skRow = (x) => '<div style="padding:6px 9px;border-bottom:1px solid #1a2438;"><div style="display:flex;justify-content:space-between;gap:8px;">' +
    '<b style="font-size:13px;color:#dbe4f3;">' + esc(x.name) + '</b><span style="font-size:10.5px;color:#8fd8ff;">' +
    (x.mult ? x.mult + "%" : "") + (x.kind === "ult" ? ' · 怒气100' : (x.cd ? ' · CD' + x.cd : "")) + '</span></div><div class="hint" style="margin-top:2px;">' + esc(x.desc || "") + '</div></div>';
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(5,8,16,.88);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;";
  ov.innerHTML = '<div class="card" style="max-width:460px;width:100%;max-height:88vh;overflow:auto;border:1px solid ' + tint + '66;">' +
    '<div style="display:flex;align-items:center;gap:8px;"><div style="font-size:20px;font-weight:800;color:' + tint + ';">' + esc(e.name) + '</div>' +
    '<span class="tag" style="border-color:' + tint + ';color:' + tint + ';">Lv' + e.lv + '</span>' +
    '<span style="margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#1c2740,#101827);border:1px solid #ffd66655;border-radius:20px;padding:3px 11px;font-size:11px;color:#ffd666;">⚔️ 战力 <b style="font-size:13px;">' + fmt(enemyPower(e)) + '</b></span></div>' +
    '<div class="hint" style="margin:3px 0 2px;">' + esc(e.camp) + ' · ' + esc(e.role) + '</div>' +
    (e.desc ? '<div class="hint" style="margin:8px 0;line-height:1.7;color:#9fb0c8;">' + esc(e.desc) + '</div>' : "") +
    sec("① 面板数据") + panel(r("攻击", fmt(s.atk)) + r("生命", fmt(s.hp)) + r("防御", fmt(s.def)) +
      r("法抗", fmt(s.res)) + r("速度", s.spd) + r("暴击率", s.critRate + "%") + r("暴击伤害", s.critDmg + "%")) +
    sec("② 装备") + panel(r("武器", esc(e.equip.weapon)) + r("上装", esc(e.equip.armor)) + r("下装", esc(e.equip.armor2)) + r("饰品", esc(e.equip.accessory))) +
    sec("③ 招式组") + panel((e.skills || []).map(skRow).join("") || '<div class="hint" style="padding:8px 9px;">没有招式</div>') +
    '<div style="margin-top:10px;"><button id="ecClose" style="width:100%;">关闭</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#ecClose").onclick = () => ov.remove();
  ov.onclick = (ev) => { if (ev.target === ov) ov.remove(); };
}

function renderPick() {
  let ch = activeChar();
  if (!ch && isHost()) {
    // 🧬 主机没有玩家角色：用占位角色，默认操控原创
    ch = { id: "__host__", name: "（未建角色）", lv: 1, str: 0, intel: 0, tech: 0, agi: 0, breaks: 0, equip: {}, free: 0 };
    if (!window.__playOrig && ORIGINALS.length) {
      const first = ORIGINALS.find((o) => o.camp !== "ally") || ORIGINALS[0];
      window.__playOrig = first.id;
    }
  }
  if (!ch) { view().innerHTML = '<div class="card"><div class="hint">没有角色。先去「我的角色」建一个。</div></div>'; return; }
  const f = charFinal(ch);
  const origList = ORIGINALS.filter((o) => o.camp !== "ally");
  const playOrig = window.__playOrig ? ORIGINALS.find((o) => o.id === window.__playOrig) : null;
  view().innerHTML =
    '<div class="card" style="border-color:' + (playOrig ? "#ffb347" : "#2f4a6a") + ';">' +
      '<div class="card-title" style="color:' + (playOrig ? "#ffb347" : "#6ea8fe") + ';">当前操控</div>' +
      (playOrig
        ? '<div style="font-size:15px;font-weight:800;color:#ffb347;">🧬 ' + esc(playOrig.name) + '（原创角色）</div>' +
          '<div class="hint">胜利经验归他本人，不进你的玩家存档。</div>'
        : '<div style="font-size:15px;font-weight:800;color:#6ea8fe;">🧑 ' + esc(ch.name) + '（我的角色）</div>' +
          '<div class="hint">奖励进入你的玩家存档。</div>') +
    '</div>' +
    '<div class="card"><div class="card-title">出战角色</div>' +
      (isHost() ? "" :
        '<div class="row"><span class="k">🧑 ' + esc(ch.name) + '<div class="hint">我的角色 · Lv' + ch.lv + ' · 战力 ' + fmt(charPower(ch)) + '</div></span>' +
        '<span class="v"><button data-play="me" ' + (playOrig ? '' : 'style="border-color:#6ea8fe;color:#6ea8fe;"') + '>' + (playOrig ? "选择" : "✅ 出战中") + '</button></span></div>') +
      (origList.length
        ? origList.map((o) => {
            const prog = (store.orig && store.orig[o.id]) || { lv: 1, exp: 0 };
            const lvShow = origLv(o);
            const host = isHost();
            return '<div class="row"><span class="k">🧬 ' + esc(o.name) + (o.title ? ' <span class="hint">' + esc(o.title) + '</span>' : '') +
              '<div class="hint">原创角色 · Lv' + lvShow + (host ? ' · 经验 ' + fmt(prog.exp) : '') + '</div></span>' +
              '<span class="v">' + (host
                ? '<button data-playorig="' + o.id + '" ' + (playOrig && playOrig.id === o.id ? 'style="border-color:#ffb347;color:#ffb347;"' : '') + '>' +
                  (playOrig && playOrig.id === o.id ? "✅ 出战中" : "选择") + '</button>'
                : '<span class="hint">👑 仅主机可操控</span>') +
              '</span></div>';
          }).join("")
        : '<div class="hint">还没有原创角色（主机端设计好后会出现）。</div>') +
    '</div>' +
    (isHost() ? "" :
    '<div class="card"><div class="card-title">当前面板</div>' +
      '<div class="row"><span class="k">' + esc(ch.name) + '</span><span class="v">Lv' + ch.lv + ' · 战力 ' + fmt(charPower(ch)) + '</span></div>' +
      '<div class="hint">攻击 ' + Math.round(f.atk) + ' · 生命 ' + Math.round(f.hp) + ' · 防御 ' + Math.round(f.def) + ' · 速度 ' + Math.round(f.spd * 10) / 10 + '</div>' +
    '</div>') +
    '</div>' +
    (isHost() && ORIGINALS.filter((o) => o.camp === "ally").length
      ? '<div class="card"><div class="card-title">🤝 同行队伍（最多 5，默认托管）</div>' +
        ORIGINALS.filter((o) => o.camp === "ally").map((o) => {
          const on = partyIds().indexOf(o.id) >= 0;
          return '<div class="row"><span class="k">' + esc(o.name) + ' <span class="hint">' + esc(o.role || "") + '</span></span>' +
            '<span class="v"><button data-party="' + o.id + '" ' + (on ? 'style="border-color:#7ee787;color:#7ee787;"' : '') + '>' +
            (on ? "✅ 已入队" : "加入") + '</button></span></div>';
        }).join("") + '</div>'
      : "") +
    (STAGE_READY
      ? dungeonHtml()
      : '<div class="card"><div class="card-title">开始战斗</div>' +
        '<div class="hint">关卡内容待定，先用默认训练场试功能。</div>' +
        '<div class="row"><span class="k">默认训练场</span><span class="v"><button data-stage="' + (STAGES[0] && STAGES[0].id) + '">开战</button></span></div></div>') +
    (!isHost() && ORIGINALS.length
      ? '<div class="card"><div class="card-title">原创角色</div>' +
        ORIGINALS.filter((o) => o.camp !== "ally").map((o) =>
          '<div class="row"><span class="k">' + esc(o.name) + (o.title ? ' <span class="hint">' + esc(o.title) + '</span>' : '') +
          '<div class="hint">' + esc(o.role || "") + ' · 攻击 ' + (o.stats && o.stats.atk) + ' · 生命 ' + (o.stats && o.stats.hp) + '</div></span>' +
          '<span class="v"><button data-orig="' + o.id + '">挑战</button></span></div>').join("") +
        ORIGINALS.filter((o) => o.camp === "ally").map((o) =>
          '<div class="row"><span class="k">' + esc(o.name) + ' <span class="hint">友方</span></span>' +
          '<span class="v"><button data-ally="' + o.id + '">' + (window.__allyId === o.id ? "✅ 已同行" : "邀请同行") + '</button></span></div>').join("") +
        '</div>'
      : "");
  view().querySelectorAll("[data-play]").forEach((b) => b.onclick = () => {
    window.__playOrig = null;
    try { localStorage.removeItem("rpg2:playAs"); } catch (e) {}
    renderPick();
  });
  view().querySelectorAll("[data-playorig]").forEach((b) => b.onclick = () => {
    window.__playOrig = b.dataset.playorig;
    try { localStorage.setItem("rpg2:playAs", window.__playOrig); } catch (e) {}
    renderPick();
  });
  view().querySelectorAll("[data-stage]").forEach((b) => {
    b.onclick = () => renderPrep(b.dataset.stage);
  });
  view().querySelectorAll("[data-enemylist]").forEach((b) => b.onclick = () => openEnemyList(b.dataset.enemylist));
  view().querySelectorAll("[data-enemy]").forEach((b) => b.onclick = () => {
    const parts = b.dataset.enemy.split(":");
    openEnemyDetail(parts[0], Number(parts[1]));
  });
  view().querySelectorAll("[data-orig]").forEach((b) => {
    b.onclick = () => startOriginal(b.dataset.orig);
  });
  // 🤝 同行队伍多选
  view().querySelectorAll("[data-party]").forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.party;
      const cur = partyIds();
      const i = cur.indexOf(id);
      if (i >= 0) cur.splice(i, 1);
      else { if (cur.length >= 5) return toast("最多 5 名同行", true); cur.push(id); }
      setParty(cur);
      renderPick();
    };
  });
  view().querySelectorAll("[data-ally]").forEach((b) => {
    b.onclick = () => { window.__allyId = b.dataset.ally; toast("已邀请同行"); renderPick(); };
  });
}

// ── 开战 ──────────────────────────────────────────────
// 🧑‍🤝‍🧑 多人建战：把房间成员的角色快照补全，生成 2v2 / 3v3 单位表
async function buildMultiBattle(stageId) {
  const got = await getRoom(roomId);
  if (!got) return false;
  const room = got.room;
  const stg = STAGES.find((x) => x.id === stageId) || STAGES[0];
  // 1) 补全每个成员的角色快照
  for (const bx of Object.keys(room.members || {})) {
    const m = room.members[bx];
    if (m.char) continue;
    let ch = null;
    if (bx === box) { ch = activeChar(); }
    else {
      try {
        const row = await cloudGet(bx);
        const s2 = row && row.store;
        if (s2 && Number(s2.v) === 2) ch = (s2.chars || [])[0] || null;
      } catch (e) {}
    }
    if (ch) {
      const f = charFinal(ch);
      m.char = {
        lv: ch.lv, atk: f.atk, hp: f.hp, def: f.def, res: f.res, spd: f.spd,
        critRate: f.critRate, critDmg: f.critDmg, dmgCut: f.dmgCut,
        weapon: (ch.equip && ch.equip.weapon) || null,
        traits: combatTraits(ch)
      };
    } else {
      m.char = { lv: 1, atk: 60, hp: 500, def: 20, res: 15, spd: 10, critRate: 5, critDmg: 150, dmgCut: 0, traits: {} };
    }
  }
  // 2) 生成单位
  const built = buildUnits(room, 6);
  st = createBattle(built.units.map((u) => Object.assign({ power: 0 }, u)));
  st.__stage = stg.id;
  st.__owners = built.owners;
  st.__multi = true;
  const myUnit = unitOfPlayer(room, box);
  st.__myUnit = myUnit;
  st.__weapon = (myUnit && built.units.find((u) => u.id === myUnit) || {}).weapon || null;
  st.__talent = talentActive(activeChar());
  log = [];
  lastRound = 1;
  pushLog("— 回合 1 —", "hdr");
  pushLog("👥 多人战：蓝方 " + built.units.filter((u) => u.side === "A").length + " 人 · 红方 " + built.units.filter((u) => u.side === "B").length + " 人", "line");
  await putRoom(Object.assign(room, { phase: "fighting" }), got.updatedAt);
  renderBattle();
  setTimeout(aiTurnIfNeeded, 300);
  return true;
}

// ♻️ 房主刷新后恢复对局：从房间 state 重建战斗
async function tryRestore() {
  if (!roomId) return false;
  const got = await getRoom(roomId);
  if (!got || got.room.host !== box) return false;
  const s = got.room.state;
  if (!s || s.finished || !s.units || !s.units.length) return false;
  st = createBattle(s.units.map((u) => ({
    id: u.id, name: u.name, side: u.side, spd: u.spd, power: 0,
    hp: u.hp, maxHp: u.maxHp, atk: u.atk || 60, def: u.def || 20,
    critRate: u.critRate || 5, critDmg: u.critDmg || 150, dmgCut: u.dmgCut || 0,
    traits: u.traits || {}, weapon: u.weapon || null, rage: u.rage || 0
  })));
  // 把当时的血量/冷却/怒气/状态/回合贴回去
  st.round = Number(s.round) || 1;
  st.__stage = s.stage || "k1";
  st.__owners = s.owners || null;
  st.__myUnit = unitOfPlayer(got.room, box);
  st.__restored = true;
  st.units.forEach((u) => {
    const src = s.units.find((x) => x.id === u.id);
    if (!src) return;
    u.hp = src.hp; u.maxHp = src.maxHp; u.cd = src.cd || 0; u.rage = src.rage || 0;
    u.shield = src.shield || 0;
    u.statuses = src.statuses || [];
    if (u.hp <= 0) u.alive = false;
  });
  // 回合开始标记：把已行动次数清掉（恢复后按新回合开始）
  st.units.forEach((u) => { u.acted = 0; u.allowed = 1; });
  log = (s.log || []).slice(-40);
  lastRound = st.round;
  pushLog("♻️ 已从房间恢复对局（回合 " + st.round + "）", "line");
  renderBattle();
  setTimeout(aiTurnIfNeeded, 300);
  return true;
}

// 🧬 原创角色：按自己的等级成长（每级 +5% 攻/血/防/抗，速度 +0.1）
function origStats(o) {
  const prog = (store.orig && store.orig[o.id]) || { lv: 1, exp: 0 };
  return originalFinal(o, Object.assign({}, prog, { lv: origLv(o) }));
}

function startOriginal(id) {
  const o = ORIGINALS.find((x) => x.id === id);
  if (!o) return;
  const ch = activeChar();
  if (!ch) return;
  const f = charFinal(ch);
  const traits = combatTraits(ch);
  const foe = originalToUnits(o, "B");
  st = createBattle([
    { id: "me", name: ch.name, side: "A", spd: f.spd, power: charPower(ch), hp: f.hp, maxHp: f.hp, atk: f.atk, def: f.def, critRate: f.critRate, critDmg: f.critDmg, dmgCut: f.dmgCut, traits },
    foe
  ]);
  st.__stage = STAGES[0].id;   // 奖励沿用训练场
  st.__auto = localStorage.getItem("rpg2:auto") === "1";
  st.__weapon = ch.equip.weapon || null;
  st.__talent = talentActive(ch);
  log = [];
  lastRound = 1;
  pushLog("— 回合 1 —", "hdr");
  pushLog("⚔️ 挑战原创角色：" + o.name + (o.title ? "（" + o.title + "）" : ""), "line");
  renderBattle();
  aiTurnIfNeeded();
}

// 🗺 站位分配：前排近战、后排远程，居中排列（行序 1,0,2）
const LAYOUT_ORDER = [1, 0, 2];
function assignLayout(units, keep) {
  if (keep) return units;
  const front = units.filter((u) => !u.__back);
  const back = units.filter((u) => u.__back);
  front.forEach((u, i) => { u.__row = LAYOUT_ORDER[i % 3]; u.__col = 0; });
  back.forEach((u, i) => { u.__row = LAYOUT_ORDER[i % 3]; u.__col = 1; });
  return units;
}

// 🧍 我方单位（主角 + 同行）
function buildPlayerUnits() {
  const ch = activeChar();
  const f = charFinal(ch);
  const traits = combatTraits(ch);
  const playOrig = window.__playOrig ? ORIGINALS.find((o) => o.id === window.__playOrig) : null;
  const meUnit = playOrig
    ? (() => {
        const g = origStats(playOrig);
        return { id: "me", name: playOrig.name, side: "A", spd: g.spd, power: 0, hp: g.hp, maxHp: g.hp, atk: g.atk, def: g.def, critRate: g.critRate, critDmg: g.critDmg, __back: false };
      })()
    : { id: "me", name: ch.name, side: "A", spd: f.spd, power: charPower(ch), hp: f.hp, maxHp: f.hp, atk: f.atk, def: f.def, critRate: f.critRate, critDmg: f.critDmg, dmgCut: f.dmgCut, traits, __back: ["ranged", "focus"].indexOf((ch.equip && ch.equip.weapon && ch.equip.weapon.style) || "melee") >= 0 };
  const partyArr = (() => { try { return JSON.parse(localStorage.getItem("rpg2:party") || "[]"); } catch (e) { return []; } })();
  const allies = partyArr.map((id) => ORIGINALS.find((o) => o.id === id)).filter(Boolean).slice(0, 5).map((o) => {
    const g = origStats(o);
    return { id: "o_" + o.id, name: o.name, side: "A", spd: g.spd, power: 0, hp: g.hp, maxHp: g.hp, atk: g.atk, def: g.def, critRate: g.critRate, critDmg: g.critDmg, __auto: true, __back: /远程|法术|辅助/.test(o.role || "") };
  });
  const list = [meUnit].concat(allies);
  assignLayout(list);
  return { ch, f, playOrig, meUnit, allies, list, partyArr };
}

// 👹 敌人单位
function buildFoeUnits(s, playerCount) {
  const backRole = (role, name) => /远程|法术|辅助/.test(role || "") || /弓|弩|术士|医疗|机械|号角|鼓|投掷/.test(name || "");
  // ⚖️ 人数补偿：我方每多 1 人，敌人属性 +12%（上限 +60%）
  const dp = Math.min(1.6, 1 + 0.12 * Math.max(0, (playerCount || 1) - 1));
  const list = (s.enemies && s.enemies.length ? s.enemies : [null]).map((eid, i) => {
    const e = eid ? enemyAt(eid, s.lv) : { name: s.foe.name, stats: { hp: s.foe.hp, atk: s.foe.atk, def: s.foe.def, res: s.foe.res, spd: s.foe.spd, critRate: 5, critDmg: 150 }, role: "" };
    return { id: "f" + i, name: e.name, side: "B", spd: e.stats.spd, power: 0,
      hp: Math.round(e.stats.hp * dp), maxHp: Math.round(e.stats.hp * dp),
      atk: Math.round(e.stats.atk * dp), def: Math.round(e.stats.def * dp), res: Math.round(e.stats.res * dp),
      critRate: e.stats.critRate, critDmg: e.stats.critDmg,
      __skills: e.skills || [], __rageGain: e.rageGain || 25, __back: backRole(e.role, e.name) };
  });
  assignLayout(list);
  // 🌊 分波：超过 6 个就平均拆波
  const wc = Math.ceil(list.length / 6);
  const per = Math.ceil(list.length / wc);
  const waves = [];
  for (let i = 0; i < list.length; i += per) waves.push(list.slice(i, i + per));
  const units = waves[0] || [];
  return { units, waves: waves.slice(1), all: list };
}

// 🌊 当前波清空 → 上下一波
function spawnWave() {
  if (!st || st.finished || !st.__waves || !st.__waves.length) return false;
  if (st.units.some((u) => u.side === "B" && u.hp > 0)) return false;
  const wave = st.__waves.shift();
  assignLayout(wave);
  wave.forEach((u) => { u.__row = u.__row; st.units.push(u); });
  st.__waveNo = (st.__waveNo || 1) + 1;
  pushLog("🌊 第 " + st.__waveNo + " 波来袭：" + wave.map((u) => u.name).join("、"), "hdr");
  return true;
}

// ⚔️ 备战界面：调整站位 → 开战
window.__prep = window.__prep || { stageId: null, pos: {}, sel: null };
function renderPrep(stageId) {
  const s = STAGES.find((x) => x.id === stageId);
  if (!s) return;
  if (!isUnlocked(s)) { renderPick(); return; }
  const P = buildPlayerUnits();
  const F = buildFoeUnits(s, P.list.length);
  const foes = F.units;
  window.__prep.stageId = stageId;
  const posOf = (u) => window.__prep.pos[u.id] || { r: u.__row, c: u.__col };
  P.list.forEach((u) => { const p = posOf(u); u.__row = p.r; u.__col = p.c; });
  window.__prep.foes = foes;

  const cellHtml = (u, side, r, c) => {
    const sel = window.__prep.sel === (u && u.id);
    const border = u ? (sel ? "#ffd666" : (side === "A" ? "#3d5a8a" : "#7a3b3b")) : "#2a3350";
    return '<div ' + (u ? 'data-prep="' + u.id + '"' : 'data-slot="' + r + ":" + c + '"') +
      ' style="min-height:58px;border:1px ' + (u ? "solid" : "dashed") + " " + border + ';border-radius:8px;padding:4px;' + (side === "A" ? "cursor:pointer;" : "") + '">' +
      (u ? '<div style="font-size:11px;font-weight:700;">' + esc(u.name) + '</div><div class="hint">' + fmt(u.maxHp) + ' HP</div>' : "") + '</div>';
  };
  const pick = (side, list, col, row) => list.find((u) => (u.__col ? 1 : 0) === col && u.__row === row);
  let grid = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;">' +
    '<div class="hint" style="grid-column:span 2;text-align:center;color:#8fd8ff;font-weight:700;">🔵 我方（可调）</div>' +
    '<div class="hint" style="grid-column:span 2;text-align:center;color:#ff9b9b;font-weight:700;">🔴 敌方</div>' +
    '<div class="hint" style="text-align:center;font-size:10px;">后排</div><div class="hint" style="text-align:center;font-size:10px;">前排</div>' +
    '<div class="hint" style="text-align:center;font-size:10px;">前排</div><div class="hint" style="text-align:center;font-size:10px;">后排</div>';
  for (let r = 0; r < 3; r++) {
    grid += cellHtml(pick("A", P.list, 1, r), "A", r, 1) + cellHtml(pick("A", P.list, 0, r), "A", r, 0) +
      cellHtml(pick("B", foes, 0, r), "B", r, 0) + cellHtml(pick("B", foes, 1, r), "B", r, 1);
  }
  grid += '</div>';

  view().innerHTML = '<div class="card"><div class="card-title">⚔️ 备战 · ' + esc(s.name) + '</div>' +
    '<div class="hint">先调站位：点我方单位选中，再点空格放过去（互换）。敌人：' +
    esc((s.enemies || []).map((id) => (enemyById(id) || {}).name || id).join(" + ") || s.foe.name) +
    (F.waves.length ? '　（共 ' + (F.waves.length + 1) + ' 波，每波最多 6 名）' : '') + '</div>' +
    '<div class="hint">奖励：金币 ' + fmt(s.gold) + ' · 经验 ' + fmt(s.exp) +
      '　|　建议战力 ' + fmt(stagePower(s)) + '　·　主角战力 ' + fmt(charPower(P.ch)) + '</div>' +
    '<div class="hint" style="margin-top:2px;color:#ffd666;">🏞 ' + esc(s.scene || "") + '：' + esc(s.sceneDesc || "") + '</div>' +
    '<div class="hint" style="margin-top:2px;color:#8fd8ff;">' +
      (ENVIRONMENTS[s.weather || "clear"].icon + " " + ENVIRONMENTS[s.weather || "clear"].name + "：" + ENVIRONMENTS[s.weather || "clear"].desc) + '</div>' + grid +
    '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button id="prepGo" style="flex:1;min-width:140px;border-color:#ffb347;color:#ffb347;">⚔️ 开战</button>' +
      '<button id="prepBack" style="flex:1;min-width:140px;">← 返回选关</button>' +
    '</div></div>';

  view().querySelectorAll("[data-prep]").forEach((el) => el.onclick = () => {
    const id = el.dataset.prep;
    const sel = window.__prep.sel;
    if (sel && sel !== id) {
      const a = P.list.find((x) => x.id === sel), b = P.list.find((x) => x.id === id);
      if (a && b) {
        const pa = { r: a.__row, c: a.__col }, pb = { r: b.__row, c: b.__col };
        window.__prep.pos[a.id] = pb; window.__prep.pos[b.id] = pa;
      }
      window.__prep.sel = null;
    } else {
      window.__prep.sel = id;
    }
    renderPrep(stageId);
  });
  view().querySelectorAll("[data-slot]").forEach((el) => el.onclick = () => {
    const [r, c] = el.dataset.slot.split(":").map(Number);
    const selId = window.__prep.sel;
    const u = P.list.find((x) => x.id === selId);
    if (!u) return;
    // 目标格已有人则互换
    const other = P.list.find((x) => x.id !== u.id && (x.__col ? 1 : 0) === c && x.__row === r);
    const cur = { r: u.__row, c: u.__col };
    window.__prep.pos[u.id] = { r, c };
    if (other) window.__prep.pos[other.id] = { r: cur.r, c: cur.c };
    renderPrep(stageId);
  });
  const go = $("prepGo"); if (go) go.onclick = () => startBattle(stageId, window.__prep.pos);
  const bk = $("prepBack"); if (bk) bk.onclick = renderPick;
}

// 🌦 环境效果：天气 + 场地双重叠加
function applyMods(st, m) {
  if (!m) return;
  st.units.forEach((u) => {
    if (m.hpPct) { const f = 1 + m.hpPct / 100; u.maxHp = Math.round(u.maxHp * f); u.hp = Math.round(u.hp * f); }
    if (m.atkPct) u.atk = Math.round(u.atk * (1 + m.atkPct / 100));
    if (m.defPct) u.def = Math.round(u.def * (1 + m.defPct / 100));
    if (m.resPct) u.res = Math.round(u.res * (1 + m.resPct / 100));
    if (m.spdPct) u.spd = Math.round(u.spd * (1 + m.spdPct / 100) * 10) / 10;
    if (m.critRate) u.critRate = Math.max(0, (Number(u.critRate) || 0) + m.critRate);
    u.traits = u.traits || {};
    ["spellPct", "physPct", "rangedPct", "meleePct", "focusPct"].forEach((k) => {
      if (m[k]) u.traits[k] = (Number(u.traits[k]) || 0) + m[k];
    });
  });
}
function applyEnv(st, weatherId, sceneMods) {
  const env = ENVIRONMENTS[weatherId] || ENVIRONMENTS.clear;
  applyMods(st, env.mods || {});
  applyMods(st, sceneMods || {});
  st.__env = weatherId;
  st.__envName = env.icon + " " + env.name;
  return env;
}

function startBattle(stageId, prepPos) {
  if (roomId && amHost) { buildMultiBattle(stageId); return; }
  const s = STAGES.find((x) => x.id === stageId);
  if (!s) return;
  const P = buildPlayerUnits();
  const ch = P.ch, playOrig = P.playOrig;
  const pos = prepPos || (window.__prep && window.__prep.stageId === stageId ? window.__prep.pos : null);
  if (pos) P.list.forEach((u) => { const p = pos[u.id]; if (p) { u.__row = p.r; u.__col = p.c; } });
  const F = buildFoeUnits(s, P.list.length);
  const foes = F.units;
  st = createBattle(P.list.concat(foes));
  st.__party = P.partyArr.slice(0, 5);
  st.__lv = s.lv;
  st.__waves = F.waves;
  st.__waveNo = 1;
  st.__onCommit = () => spawnWave();
  st.__target = (foes.find((u) => !u.__back) || foes[0] || {}).id;
  applyEnv(st, s.weather || "clear", s.sceneMods);
  st.__origId = playOrig ? playOrig.id : null;
  st.__gearAbil = playOrig ? (function () {
    const ab = gearAbilities(playOrig);
    const pr = ((store.orig || {})[playOrig.id] || {});
    ab.ultPct = (Number(ab.ultPct) || 0) + (Number(pr.bonus && pr.bonus.ultPct) || 0);
    return ab;
  })() : null;
  st.__frost = 0;
  st.__auto = localStorage.getItem("rpg2:auto") === "1";
  // 🍱 战前准备：便利店的食物，下一场生效
  const meal = store.flags && store.flags.meal;
  if (meal && !playOrig) {
    const b = meal.buff || {};
    const u = st.units.find((x) => x.id === "me");
    if (u) {
      u.hp = Math.round(u.hp * (1 + (b.hpPct || 0) / 100)); u.maxHp = u.hp;
      u.atk = Math.round(u.atk * (1 + (b.atkPct || 0) / 100));
      u.def = Math.round(u.def * (1 + (b.defPct || 0) / 100));
      u.spd = Math.round((u.spd + (b.spd || 0)) * 10) / 10;
      st.__meal = meal.name;
    }
  }
  // 🤝 友方原创角色同行：作为不出现在行动条上的助战单位
  const ally = window.__allyId ? ORIGINALS.find((o) => o.id === window.__allyId && o.camp === "ally") : null;
  if (ally) {
    const u = originalToUnits(ally, "A");
    u.allowed = 0;
    st.units.push(u);
    st.__ally = u;
    pushLog("🤝 " + ally.name + " 与你同行", "line");
  }
  st.__stage = s.id;
  st.__weapon = playOrig ? (function () {
    const g = ORIGINAL_GEAR[playOrig.id] || playOrig.gearObj || {};
    const w = g.weapon || null;
    return w && (w.sName || w.aName) ? w : null;
  })() : (ch.equip.weapon || null);
  st.__talent = playOrig ? null : talentActive(ch);
  log = [];
  lastRound = 1;
  pushLog("— 回合 1 —", "hdr");
  if (st.__meal) pushLog("🍱 战前准备：" + st.__meal + " 生效（本场）", "line");

}

// 行动条预览：本回合剩余 + 下一回合完整顺序
function previewOrder(n = 6) {
  if (!st) return [];
  const cmp = (a, b) => {
    if (b.spd !== a.spd) return b.spd - a.spd;
    if (b.power !== a.power) return b.power - a.power;
    if (a.side !== b.side) return a.side === "A" ? -1 : 1;
    return a.seq - b.seq;
  };
  const live = st.units.filter((u) => u.alive !== false);
  const pending = live.filter((u) => (u.acted || 0) < (u.allowed || 1)).sort(cmp);
  const out = pending.slice(0, n);
  if (live.length <= 1) return out;      // 只剩一人：不重复铺满
  if (out.length < n) {
    live.slice().sort(cmp).forEach((u) => { if (out.length < n) out.push(u); });
  }
  return out;
}

function queueHtml2() {

function pushLog(text, kind, subs) {
  log.push({ text, kind: kind || "line", subs: subs || [] });
  if (log.length > 200) log = log.slice(-200);
}

// 回合切换时结算持续伤害（灼烧 = 每回合 最大生命 × v%）
// 防御加成只持续到「该单位下次行动」：出手前先还原
function clearDefend(u) {
  if (u && u.__defBonus) {
    u.dmgCut = Math.max(0, (Number(u.dmgCut) || 0) - 30);
    u.__defBonus = 0;
  }
}

function afterCommit() {
  if (!st || st.finished) return;
  if (st.round !== lastRound) {
    lastRound = st.round;
    pushLog("— 回合 " + st.round + " —", "hdr");
    tickStatuses();
  }
}

function tickStatuses() {
  if (!st) return;  ["me", "foe"].forEach((id) => {
    const u = st.units.find((x) => x.id === id);
    if (!u || u.alive === false) return;
    (u.statuses || []).forEach((s) => {
      if (s.key !== "burn") return;
      const d = Math.max(1, Math.round(u.maxHp * s.v / 100));
      u.hp = Math.max(0, u.hp - d);
      if (u.hp === 0) u.alive = false;
      pushLog("🔥 " + u.name + " 灼烧 −" + d);
    });
  });
}

function me() { return st.units.find((u) => u.id === "me"); }
function foe() { return st.units.find((u) => u.side === "B" && u.hp > 0); }
function aliveSide(side) { return st.units.filter((u) => u.side === side && u.hp > 0); }
function isRangedUnit(u) {
  if (u.id === "me") {
    const stl = (wpOf(st.__weapon) || {}).style;
    return stl === "ranged" || stl === "focus";
  }
  return !!u.__back;
}
function frontAlive(side) { return aliveSide(side).filter((u) => !u.__col); }
function validTargets(u) {
  const enemySide = u.side === "A" ? "B" : "A";
  const list = aliveSide(enemySide);
  const front = list.filter((x) => !x.__col);
  if (isRangedUnit(u) || !front.length) return list;
  return front;
}
// 🌊 攻击形式解析：single/row/col/cross/all（相对目标格子）
function shapeUnits(shape, t) {
  const list = st.units.filter((u) => u.side === t.side && u.hp > 0);
  if (shape === "all") return list;
  if (shape === "row") return list.filter((u) => u.__row === t.__row);
  if (shape === "col") return list.filter((u) => u.__col === t.__col);
  if (shape === "cross") return list.filter((u) => u.__row === t.__row || u.__col === t.__col);
  return [t];
}
function targetId() {
  const list = validTargets(me());
  const cur = st.units.find((u) => u.id === st.__target && u.hp > 0);
  if (cur && list.indexOf(cur) >= 0) return cur.id;
  return (list[0] || list[0] || { id: "f0" }).id;
}

function skillBtnHtml(m) {

  const hits = Number(wp.sHits) || 1;

  const rage = Number(wp.sRage) || 10;

  const can = cd <= 0;
  const core = "「" + name + "」" + (hits > 1 ? (hits + "×" + mult + "%（共 " + (hits * mult) + "%）") : (mult + "%")) +

  return '<button data-act="skill" ' + (can ? '' : 'disabled') + ' title="' + esc(core) + '">' +
    '🥋 ' + (can ? ('「' + esc(name) + '」' + (mult + "%")) : ('「' + esc(name) + '」冷却 ' + cd + ' 回合')) + '</button>' +
    '<div class="hint" style="flex-basis:100%;margin-top:4px;">' + esc(core) + (can ? '' : '（还剩 ' + cd + ' 回合）') + '</div>';
}

function ultBtnHtml(m) {

    '💥 必杀' + (can ? '（250%）' : '（怒气 ' + Math.round(rage) + '/100）') + '</button>';
}

// 📡 联机（步 2）：把战斗状态写进房间，供其他人观战
let roomId = "", roomAt = "", amHost = true;
async function publishState() {
  if (!roomId || !amHost || !st) return;
  try {
    const got = await getRoom(roomId);
    if (!got) return;
    const room = got.room;
    if (room.host !== box) { amHost = false; return; }
    room.phase = st.finished ? "done" : "fighting";
    room.state = {
      round: st.round,
      stage: st.__stage || "k1",
      owners: st.__owners || null,
      turn: (nextActor(st) || {}).id || null,
      units: st.units.map((u) => ({
        id: u.id, name: u.name, side: u.side, hp: Math.round(u.hp), maxHp: Math.round(u.maxHp),
        spd: u.spd, cd: u.cd || 0, rage: Math.round(u.rage || 0),
        atk: u.atk, def: u.def, critRate: u.critRate, critDmg: u.critDmg, dmgCut: u.dmgCut,
        traits: u.traits || {}, weapon: u.weapon || null, shield: Math.round(u.shield || 0),
        statuses: (u.statuses || []).map((s) => ({ key: s.key, v: s.v, turns: s.turns, label: s.label }))
      })),
      log: log.slice(-40),
      finished: !!st.finished,
      winner: st.winner || null
    };
    const r = await putRoom(room, got.updatedAt);
    if (r.ok) roomAt = r.updatedAt;
  } catch (e) {}
}

// 📡 联机（步 4）：房主轮询客户端 intent 并执行；客户端在「自己那手」时能出手
let lastIntentSeq = 0;
async function pullIntents() {
  if (!roomId || !amHost || !st || st.finished) return;
  try {
    const r = await takeIntents(roomId, lastIntentSeq);
    if (!r.ok || !r.intents.length) return;
    for (const it of r.intents) {
      lastIntentSeq = Math.max(lastIntentSeq, Number(it.seq) || 0);
      const who = st.units.find((u) => u.id === it.unitId);
      const cur = nextActor(st);
      // 校验①：这个单位是不是他控的（多人模式按 owner 判定）
      if (st.__owners && st.__owners[it.unitId] !== it.by) continue;
      // 校验②：必须是这个单位该出手
      if (!who || !cur || cur.id !== who.id) continue;
      if (it.act === "skill" && who.cd > 0) continue;
      if (it.act === "ult" && (Number(who.rage) || 0) < 100) continue;
      if (isStunned(who)) {
        pushLog("💫 " + who.name + " 被控住，跳过本回合");
        commit(st, who.id);
        continue;
      }
      if (it.act === "skill" && !canUseSkill(who)) continue;
      // 😤 目标选择：优先被嘲讽的敌人
      const enemies = st.units.filter((u) => u.alive !== false && u.id !== who.id && u.side !== who.side);
      const taunter = enemies.find((u) => hasStatus(u, "taunt"));
      const other = taunter || enemies[0];
      if (!other) { commit(st, who.id); continue; }
      if (it.act === "defend") {
        who.dmgCut = (Number(who.dmgCut) || 0) + 30;
        who.__defBonus = 1;
        pushLog("🛡️ " + who.name + " 进入防御", "act");
      } else {
        // 每个单位用自己的武器判定招式（联机时不再是房主武器）
        const wp = wpOf(who.weapon || st.__weapon);
        const tr = who.traits || {};
        // R 阶没有技能：技能指令直接忽略，按普攻处理
        if (it.act === "skill" && !wp.sMult && !wp.sSupport) it.act = "normal";
        // ✨ 辅佐武器：招式位变成辅助（自动选血量最低的队友）
        if (it.act === "skill" && wp.sSupport) {
          const allies = st.units.filter((u) => u.alive !== false && u.side === who.side);
          const tgt = allies.slice().sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp))[0] || who;
          const subs = [];
          if (wp.sSupport === "heal") subs.push("治疗 " + tgt.name + " +" + healUnit(st, tgt.id, tgt.maxHp * (Number(wp.sHealPct) || 25) / 100));
          else if (wp.sSupport === "shield") subs.push("护盾 → " + tgt.name + "（" + addShield(st, tgt.id, tgt.maxHp * (Number(wp.sShieldPct) || 20) / 100) + "）");
          else if (wp.sSupport === "buff") { addStatus(st, tgt.id, "atkUp", Number(wp.sBuffPct) || 25, 3, "增益"); subs.push(tgt.name + " 攻击 +" + (Number(wp.sBuffPct) || 25) + "%"); }
          else if (wp.sSupport === "dispel") subs.push("驱散 " + tgt.name + " 的 " + dispel(st, tgt.id, Number(wp.sDispelN) || 2) + " 个减益");
          pushLog("✨ " + who.name + "「" + (wp.sName || "辅佐") + "」→ " + tgt.name, "act", subs);
          addStatus(st, who.id, "scd", 0, Number(wp.sCd) || 3, "辅助技CD");
          commit(st, who.id);
          continue;
        }
        const mult = it.act === "ult" ? (Number(wp.uMult) || 250) : (it.act === "skill" ? (Number(wp.sMult) || 150) : (Number(wp.aMult) || 100));
        const hits = it.act === "ult" ? (wp.uHits || 1) : (it.act === "skill" ? (wp.sHits || 1) : (wp.aHits || 1));
        const res = strike(st, who.id, other.id, { atk: who.atk, mult, critRate: who.critRate, critDmg: who.critDmg, kind: (it.act === "ult" ? "ult" : it.act === "skill" ? "skill" : "normal"), dmgType: (wp.dmgType || "phys"), style: (wp.style || "melee") }, hits);
        if (it.act === "ult") who.rage = 0;
        else who.rage = Math.min(100, (Number(who.rage) || 0) + 25 * (1 + (Number(tr.rageOnSkill) || 0) / 100 + (Number(tr.ragePct) || 0) / 100));
        if (it.act === "skill" && wp.hitStatus) {
          applyStatus(st, who.id, other.id, wp.hitStatus, Number(wp.hitStatusV) || 3, Number(wp.hitStatusTurns) || 2, wp.hitStatusName || wp.hitStatus);
        }
        if (it.act === "skill") {
          setCooldown(st, who.id, Number(wp.sCd) || 2);
        }
        pushLog((it.act === "ult" ? "💥 " : it.act === "skill" ? "🥋 " : "⚔️ ") + who.name + " → " + other.name + " " + res.dmg + (res.crit ? " 暴击💥" : ""), "act");
        // 💥 溅射：招式命中后打相邻敌人
        if (it.act === "skill" && Number(tr.splash) > 0) {
          st.units.filter((u) => u.alive !== false && u.side !== who.side && u.id !== other.id).forEach((u) => {
            const sr = damage(st, who.id, u.id, { atk: who.atk, mult: Number(tr.splash) || 30, critRate: 0, critDmg: who.critDmg, kind: "skill", dmgType: (wp.dmgType || "phys"), style: (wp.style || "melee") });
            pushLog("💥 溅射 → " + u.name + " " + sr.dmg, "line");
          });
        }
        // 🛡️ 防具反制：被击时缴械 / 嘲讽攻击者
        const dt2 = other.traits || {};
        if (Number(dt2.disarm) > 0 && who.alive !== false && Math.random() * 100 < 30) {
          applyStatus(st, other.id, who.id, "disarm", 1, Number(dt2.disarm) || 1, "缴械");
        }
        if (Number(dt2.taunt) > 0 && who.alive !== false) {
          applyStatus(st, other.id, who.id, "taunt", 0, 1, "嘲讽");
        }
      }
      commit(st, who.id);
    }
    renderBattle();
    setTimeout(aiTurnIfNeeded, 300);
  } catch (e) {}
}

// 🧩 战斗词条展示（第二批）

// ♊ 双生：概率不消耗回合（每场限一次，防无限连）

function renderBattle() {

  };
  // 🗺 单块战场：我方后排 | 我方前排 ‖ 敌方前排 | 敌方后排（左右镜像）
  const battlefield = () => {
    const pick = (side, col, row) => st.units.find((u) => u.side === side && (u.__col ? 1 : 0) === col && u.__row === row);
    let html = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;align-items:start;">' +
      '<div class="hint" style="grid-column:span 2;text-align:center;color:#8fd8ff;font-weight:700;">🔵 我方</div>' +
      '<div class="hint" style="grid-column:span 2;text-align:center;color:#ff9b9b;font-weight:700;">🔴 敌方</div>' +
      '<div class="hint" style="text-align:center;font-size:10px;">后排</div><div class="hint" style="text-align:center;font-size:10px;">前排</div>' +
      '<div class="hint" style="text-align:center;font-size:10px;">前排</div><div class="hint" style="text-align:center;font-size:10px;">后排</div>';
    for (let r = 0; r < 3; r++) {
      html += cell(pick("A", 1, r)) + cell(pick("A", 0, r)) + cell(pick("B", 0, r)) + cell(pick("B", 1, r));
    }
    return html + '</div>';
  };

  view().innerHTML =
    '<div class="card"><div class="card-title">' + turnText + '</div>' +
      queueHtml2() +
      battlefield() +
      '<div class="hint" style="margin-top:6px;">点敌方格子切换攻击目标（近战只能打前排，前排清空才能打后排）</div>' +
    '</div>' +
    (st.finished ? '<div class="card"><div class="card-title">' + (st.winner === "A" ? "🏆 胜利" : "💀 失败") + '</div>' +
      (st.winner === "A" && st.__reward
        ? '<div class="row"><span class="k">金币</span><span class="v" style="color:#ffd666;">+' + fmt(st.__reward.gold) + '</span></div>' +
          '<div class="row"><span class="k">经验</span><span class="v" style="color:#7ee787;">+' + fmt(st.__reward.exp) + '</span></div>' +
          '<div class="row"><span class="k">关卡</span><span class="v">' + esc(st.__reward.stage) + '</span></div>' +
          '<div class="hint" style="margin-top:6px;">已写入存档（角色页可见）</div>'
        : '<div class="hint">没有奖励，回去练练再来</div>') +
      '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;"><button id="btnAgain">🔁 再来一场</button><button id="btnBack">← 返回选关</button></div></div>'
      : '<div class="card"><div class="card-title">行动</div>' +
        '<div class="hint" style="margin-bottom:6px;">' +
          (window.__playOrig ? '🧬 操控中：' + esc((ORIGINALS.find((o) => o.id === window.__playOrig) || {}).name || "原创角色") + '　' : '') +
          '🤖 托管：' + (st.__auto ? '<b style="color:#7ee787;">开</b>' : "关") +
          ' <button id="btnAuto" style="font-size:10px;padding:1px 7px;margin-left:6px;">切换</button>' +
        '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;">' +
          '<button data-act="normal" style="flex:1;min-width:110px;height:38px;" ' + (busy || !a || a.id !== "me" || !canUseNormal(m) ? 'disabled' : '') + '>⚔️ 普攻</button>' +
          '<button data-act="skill" style="flex:1;min-width:110px;height:38px;" ' + (busy || !a || a.id !== "me" || m.cd > 0 || !canUseSkill(m) || (!wpOf(st.__weapon).sMult && !wpOf(st.__weapon).sSupport) ? 'disabled' : '') + '>' +
            '🥋 ' + ((!wpOf(st.__weapon).sMult && !wpOf(st.__weapon).sSupport) ? "无技能" : (m.cd > 0 ? ('冷却 ' + m.cd + ' 回合') : (esc(wpOf(st.__weapon).sName || "招式") + ' ' + (Number(wpOf(st.__weapon).sMult) || 150) + '%' + (wpOf(st.__weapon).sMult ? '（' + (SHAPE_NAME[wpOf(st.__weapon).sShape] || "单体") + '）' : '')))) + '</button>' +
          '<button data-act="ult" style="flex:1;min-width:110px;height:38px;" ' + (busy || !a || a.id !== "me" || (Number(m.rage) || 0) < 100 || isStunned(m) || isSilenced(m) ? 'disabled' : '') + '>' +
            '💥 必杀' + ((Number(m.rage) || 0) >= 100 ? ' ' + (Number(wpOf(st.__weapon).uMult) || 250) + '%（' + (SHAPE_NAME[wpOf(st.__weapon).uShape] || "单体") + '）' : ' ' + Math.round(Number(m.rage) || 0) + '/100') + '</button>' +
          '<button data-act="defend" style="flex:1;min-width:110px;height:38px;" ' + (busy || !a || a.id !== "me" || isStunned(m) ? 'disabled' : '') + '>🛡️ 防御</button>' +
        '</div>' +
        ((wpOf(st.__weapon).sSupport || st.__talent) ? '<div style="margin-top:10px;">' +
          '<div class="hint" style="margin-bottom:4px;">✨ 特殊行动（消耗回合，独立冷却）</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
          (wpOf(st.__weapon).sSupport ? '<button data-act="support" style="flex:1;min-width:110px;height:38px;border-color:#8fd8ff;color:#8fd8ff;" ' +
            (busy || !a || a.id !== "me" || hasStatus(m, "scd") ? 'disabled' : '') + '>✨ ' + esc(wpOf(st.__weapon).sName || "辅助") +
            (hasStatus(m, "scd") ? " 冷却" : "") + '</button>' : '') +
          (st.__talent ? '<button data-act="talent" style="flex:1;min-width:110px;height:38px;border-color:#c9a0ff;color:#c9a0ff;" ' +
            (busy || !a || a.id !== "me" || hasStatus(m, "tcd") ? 'disabled' : '') + '>✨ ' + esc(st.__talent.name) +
            (hasStatus(m, "tcd") ? " 冷却" : "") + '</button>' : '') +
          '</div></div>' : '') +
        (isStunned(m) ? '<div class="hint" style="color:#ffd666;">💫 你被控住了，本回合跳过</div>' : '') +
        (isSilenced(m) ? '<div class="hint" style="color:#ffd666;">🤐 被沉默：不能使用招式和必杀</div>' : '') +
        (isDisarmed(m) ? '<div class="hint" style="color:#ffd666;">🚫 被缴械：本回合只能防御</div>' : '') +
        '<div class="hint" style="margin-top:8px;line-height:1.8;">' +
          '招式：' + esc(wpOf(st.__weapon).sName || "—") + ' · ' +
          (Number(wpOf(st.__weapon).sMult) || 150) + '% · 冷却 ' +
          (Number(wpOf(st.__weapon).sCd) || 2) + ' 回合 　|　 ' +
          '必杀 ' + (Number(wpOf(st.__weapon).uMult) || 250) + '%，每次行动 +25 怒气 　|　 防御：本回合减伤 +30%，持续到你下次行动' +
        '</div>' + traitsLine(m.traits) + '</div></div>') +
    '<div class="card"><div class="card-title">战斗日志</div><div class="log">' +
      log.map((l) => l.kind === "hdr"
        ? '<div style="color:#ffd666;font-weight:700;margin:6px 0 2px;">' + esc(l.text) + '</div>'
        : '<div class="act">' + esc(l.text) + (l.subs && l.subs.length ? l.subs.map((x) =>
            typeof x === "string"
              ? '<div class="sub">↳ ' + esc(x) + '</div>'
              : '<div class="sub" style="font-size:' + x.size + 'px;">↳ ' + esc(x.t) + '</div>').join("") : "") + '</div>'
      ).join("") + '</div></div>';

  if ($("btnBack")) $("btnBack").onclick = renderPick;
  if ($("btnAgain")) $("btnAgain").onclick = () => startBattle(st.__stage);
  if ($("btnAuto")) $("btnAuto").onclick = () => {
    st.__auto = !st.__auto;
    try { localStorage.setItem("rpg2:auto", st.__auto ? "1" : "0"); } catch (e) {}
    renderBattle();
    aiTurnIfNeeded();
  };
  view().querySelectorAll("[data-act]").forEach((b) => { b.onclick = () => doAct(b.dataset.act); });
  view().querySelectorAll("[data-unit]").forEach((el) => el.onclick = () => {
    const u = st.units.find((x) => x.id === el.dataset.unit);
    if (!u || u.side !== "B" || u.hp <= 0) return;
    if (validTargets(me()).indexOf(u) < 0) { pushLog("🚫 近战打不到后排，先清前排", "line"); renderBattle(); return; }
    st.__target = u.id;
    renderBattle();
  });
  // 日志自动滚到最新
  try {
    const lg = view().querySelector(".log");
    if (lg) lg.scrollTop = lg.scrollHeight;
  } catch (e) {}
  publishState();
}

// 🩸 原创角色吸血
function lifestealHeal(m, dealt) {
  const ls = Number((st.__gearAbil || {}).lifesteal) || 0;
  if (ls <= 0 || dealt <= 0) return;
  const before = m.hp;
  m.hp = Math.min(m.maxHp, m.hp + Math.max(1, Math.round(dealt * ls / 100)));
  if (m.hp > before) pushLog("🩸 吸血 +" + (m.hp - before) + "（" + ls + "%）", "line");
}

// 🎯 多段伤害展示：每段独立大小，凸显立体感
function hitParts(r) {
  if (!r || !r.parts || r.parts.length <= 1) return [];
  return r.parts.map((p, i) => ({ t: "第 " + (i + 1) + " 段 " + p.dmg + (p.crit ? " 暴击💥" : ""), size: i === 0 ? 13 : Math.max(9, 12 - i * 0.8) }));
}

function doAct(kind) {
  if (!st || st.finished || busy) return;
  if (st.finished) return;
  const a = nextActor(st);
  if (!a || a.id !== "me") return;
  const m = me(), f2 = foe();
  clearDefend(m);
  const wp = wpOf(st.__weapon);
  if (isStunned(m)) {
    pushLog("💫 " + m.name + " 被控住，跳过本回合");
    commit(st, "me");
    renderBattle();
    setTimeout(aiTurnIfNeeded, 380);
    return;
  }
  if (kind === "skill" && !canUseSkill(m)) return;
  if (kind === "normal" && !canUseNormal(m)) return;
  const rounds = [];

  if (kind === "talent") {
    const t = st.__talent;
    if (!t || hasStatus(m, "tcd")) return;
    const subs = [];
    if (t.key === "wall") { const sv = addShield(st, "me", m.maxHp * 0.3); subs.push("护盾 → " + sv); }
    else if (t.key === "frenzy") { addStatus(st, "me", "atkUp", 40, 2, "狂战"); subs.push("攻击 +40%（2 回合）"); }
    else if (t.key === "gale") { m.allowed = (Number(m.allowed) || 1) + 1; subs.push("本回合多行动一次"); }
    else if (t.key === "arcane") {
      const r = damage(st, "me", targetId(), { atk: m.atk, mult: 200, critRate: m.critRate, critDmg: m.critDmg, kind: "skill", dmgType: "spell" });
      subs.push("奥术冲击 " + r.dmg + (r.crit ? " 暴击💥" : ""));
    } else if (t.key === "bless") { const h = healUnit(st, "me", m.maxHp * 0.3); subs.push("恢复 " + h); }
    addStatus(st, "me", "tcd", 0, t.cd, "天赋技CD");
    pushLog("✨ " + m.name + "「" + t.name + "」", "act", subs);
    if (!tryDualborn(m)) commit(st, "me");
    renderBattle();
    setTimeout(aiTurnIfNeeded, 380);
    return;
  }

  if (kind === "defend") {
    pushLog("🛡️ " + m.name + " 进入防御（本回合减伤 +30%）");
    m.dmgCut = (m.dmgCut || 0) + 30;
    m.__defBonus = 1;
    if (Number((m.traits || {}).charge) > 0) {
      m.__charged = 1;
      pushLog("🏹 蓄势：下一次攻击 +60%", "line");
    }
    if (!tryDualborn(m)) commit(st, "me");
  } else if (kind === "ult") {
    const wp2 = wpOf(st.__weapon);
    const t0 = st.units.find((u) => u.id === targetId());
    const targets = t0 ? shapeUnits(wp2.uShape || "single", t0) : [];
    const frost = st.__origId ? (Number(st.__frost) || 0) : 0;
    const ultPct = Number((st.__gearAbil || {}).ultPct) || 0;
    const ultMult = (Number(wp2.uMult) || 250) * (1 + 0.15 * frost) * (1 + ultPct / 100);
    let total = 0, anyCrit = false;
    targets.filter(Boolean).forEach((t) => {
      const rr = strike(st, "me", t.id, { atk: m.atk, mult: ultMult, critRate: m.critRate, critDmg: m.critDmg, kind: "ult", dmgType: (wp2.dmgType || "phys"), style: (wp2.style || "melee") }, wp2.uHits || 1);
      total += rr.dmg; anyCrit = anyCrit || rr.crit;
    });
    m.rage = 0;
    if (st.__origId) { lifestealHeal(m, total); st.__frost = 0; }
    pushLog("💥 " + m.name + " 必杀 → " + targets.filter(Boolean).map((t) => t.name).join("、") + " 共 " + total + (anyCrit ? " 暴击💥" : "") +
      (frost ? "（消耗霜印 ×" + frost + "，倍率 +" + Math.round(frost * 15) + "%）" : ""));
    if (!tryDualborn(m)) commit(st, "me");
  } else if (kind === "support") {
    // ✨ 辅佐招式：自动选「血量比例最低的队友」（单人就自己）
    const allies = st.units.filter((u) => u.alive !== false && u.side === m.side);
    const tgt = allies.slice().sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp))[0] || m;
    const tid = tgt.id;
    const subs = [];
    if (wp.sSupport === "heal") {
      const h = healUnit(st, tid, tgt.maxHp * (Number(wp.sHealPct) || 25) / 100);
      subs.push(h > 0 ? "治疗 " + tgt.name + " +" + h : tgt.name + " 被禁疗，治疗无效");
    } else if (wp.sSupport === "shield") {
      const sv = addShield(st, tid, tgt.maxHp * (Number(wp.sShieldPct) || 20) / 100);
      subs.push("护盾 → " + tgt.name + "（" + sv + "）");
    } else if (wp.sSupport === "buff") {
      addStatus(st, tid, "atkUp", Number(wp.sBuffPct) || 25, 3, "增益");
      subs.push(tgt.name + " 攻击 +" + (Number(wp.sBuffPct) || 25) + "%（3 回合）");
    } else if (wp.sSupport === "dispel") {
      const n = dispel(st, tid, Number(wp.sDispelN) || 2);
      subs.push("驱散 " + tgt.name + " 的 " + n + " 个减益");
    }
    pushLog("✨ " + m.name + "「" + (wp.sName || "辅佐") + "」→ " + tgt.name, "act", subs);
    addStatus(st, "me", "scd", 0, Number(wp.sCd) || 3, "辅助技CD");
    if (!tryDualborn(m)) commit(st, "me");
  } else if (kind === "skill") {
    if (!wp.sMult && !wp.sSupport) return;
    const mult = Number(wp.sMult) || 150;
    const tr = m.traits || {};
    const baseCd = Number(wp.sCd) || 3;
    const cd = Math.max(1, baseCd - (Number(tr.cdReduce) || 0));
    const t0 = st.units.find((u) => u.id === targetId());
    const targets = t0 ? shapeUnits(wp.sShape || "single", t0) : [];
    let total = 0, anyCrit = false, first = null, firstParts = null;
    targets.filter(Boolean).forEach((t) => {
      const rr = strike(st, "me", t.id, { atk: m.atk, mult, critRate: m.critRate, critDmg: m.critDmg, kind: "skill", dmgType: (wp.dmgType || "phys"), style: (wp.style || "melee") }, wp.sHits || 1);
      total += rr.dmg; anyCrit = anyCrit || rr.crit; first = first || t;
      if (!firstParts) firstParts = rr.parts;
    });
    const r = { dmg: total, crit: anyCrit, parts: targets.filter(Boolean).length === 1 ? firstParts : null };
    const f2 = first || st.units.find((u) => u.id === targetId()) || { name: "目标" };
    const subs = ["倍率 " + mult + "% · 攻击 " + Math.round(m.atk) + " → 实际 " + r.dmg + (r.crit ? "（暴击）" : "") +
      (cd !== baseCd ? " · 冷却缩减 → " + cd + " 回合" : "")];
    hitParts(r).forEach((x) => subs.push(x));
    if (wp.hitStatus && r.dmg > 0) {
      const v = Number(wp.hitStatusV) || 3;
      const turns = Number(wp.hitStatusTurns) || 2;
      const nm = wp.hitStatusName || wp.hitStatus;
      const ok = applyStatus(st, "me", "foe", wp.hitStatus, v, turns, nm);
      subs.push(ok ? "对 " + f2.name + " 施加「" + nm + "」" : "「" + nm + "」被 " + f2.name + " 抗掉了");
    }
    // 🥉 控制类词条：招式命中后逐个判定（70% 基础命中，吃状态命中/抗性）
    ["stun", "silence", "freeze", "noheal"].forEach((ck) => {
      if (Number(wp[ck]) > 0) {
        const turns = (ck === "stun" || ck === "freeze") ? 1 : 2;
        const ok2 = applyStatus(st, "me", "foe", ck, Number(wp[ck]) || 0, turns, statusName(ck));
        subs.push(ok2 ? "附加「" + statusName(ck) + "」" : "「" + statusName(ck) + "」被抗掉了");
      }
    });
    pushLog("🥋 " + m.name + "「" + (wp.sName || "招式") + "」→ " + f2.name + " " + r.dmg + (r.crit ? " 暴击💥" : ""), "act", subs);
    // ❄️ 原创角色：技能也叠霜印（雪葬额外 +1）
    if (st.__origId && r.dmg > 0) {
      const add = 1 + (wp.sName === "雪葬" ? 1 : 0);
      st.__frost = Math.min(5, (Number(st.__frost) || 0) + add);
      pushLog("❄️ 霜印 +" + add + "（" + st.__frost + "/5，必杀 +" + (st.__frost * 15) + "%）", "line");
    }
    setCooldown(st, "me", baseCd);
    // 🏃 追击：招式命中后概率追加 50% 普攻
    if (Number(tr.chase) > 0 && f2.hp > 0 && Math.random() * 100 < Number(tr.chase)) {
      const r3 = damage(st, "me", targetId(), { atk: m.atk, mult: 50, critRate: m.critRate, critDmg: m.critDmg, kind: "skill", dmgType: (wp.dmgType || "phys"), style: (wp.style || "melee") });
      pushLog("🏃 追击追加 " + r3.dmg, "line");
    }
    if (!tryDualborn(m)) commit(st, "me");
  } else {
    const r = strike(st, "me", targetId(), { atk: m.atk, mult: (Number(wpOf(st.__weapon).aMult) || 100), critRate: m.critRate, critDmg: m.critDmg, kind: "normal", dmgType: (wpOf(st.__weapon).dmgType || "phys"), style: (wpOf(st.__weapon).style || "melee") }, wpOf(st.__weapon).aHits || 1);
    pushLog("⚔️ " + m.name + " 普攻 → " + f2.name + " " + r.dmg + (r.crit ? " 暴击💥" : ""), "act",
      ["攻击 " + Math.round(m.atk) + " × 100% → 目标防御 " + Math.round(f2.def) + " 减免 → 实际 " + r.dmg + (r.crit ? "（暴击 ×" + (m.critDmg / 100).toFixed(1) + "）" : "")].concat(hitParts(r)));
    // 🗡️ 连击：普攻概率再打一次（半伤）
    if (Number((m.traits || {}).doubleStrike) > 0 && f2.hp > 0 && Math.random() * 100 < Number(m.traits.doubleStrike)) {
      const r2 = damage(st, "me", targetId(), { atk: m.atk, mult: 50, critRate: m.critRate, critDmg: m.critDmg, kind: "normal", dmgType: (wpOf(st.__weapon).dmgType || "phys"), style: (wpOf(st.__weapon).style || "melee") });
      pushLog("🗡️ 连击追加 " + r2.dmg, "line");
    }
    if (st.__origId && r.dmg > 0) {
      lifestealHeal(m, r.dmg);
      st.__frost = Math.min(5, (Number(st.__frost) || 0) + 1);
      pushLog("❄️ 霜印 +1（" + st.__frost + "/5，必杀 +" + (st.__frost * 15) + "%）", "line");
    }
    if (!tryDualborn(m)) commit(st, "me");
  }

  // 🤝 同行助战：每回合自动出手一次（不占行动条）
  if (st.__ally && st.__allyRound !== lastRound && !st.finished && f2.hp > 0) {
    st.__allyRound = lastRound;
    const ar = damage(st, "ally", "foe", { atk: st.__ally.atk, mult: 100, critRate: st.__ally.critRate, critDmg: st.__ally.critDmg, kind: "normal", dmgType: "phys", style: "melee" });
    pushLog("🤝 " + st.__ally.name + " 助战 → " + f2.name + " " + ar.dmg, "line");
  }

  if (st.finished) { finish(); renderBattle(); return; }
  if (kind !== "ult") {
    // ⚡ 回怒效率由武器决定：普攻 aRage / 技能 sRage / 防御固定 10
    const wpG = wpOf(st.__weapon) || {};
    const hitsForRage = kind === "skill" ? (Number(wpG.sHits) || 1) : (Number(wpG.aHits) || 1);
    let base = kind === "skill"
      ? (Number(wpG.sRage) || Math.round((Number(wpG.aRage) || 25) * 0.6))
      : (Number(wpG.aRage) || 25);
    if (kind === "defend") base = 10;
    const gain = base * hitsForRage * (1 + (Number((m.traits || {}).rageOnSkill) || 0) / 100 + (Number((m.traits || {}).ragePct) || 0) / 100);
    m.rage = Math.min(100, (Number(m.rage) || 0) + gain);
  }
  renderBattle();
  setTimeout(aiTurnIfNeeded, 380);
}

// 🤖 我方原创单位自动出手（默认托管）
function autoUnitAct(u) {
  if (!st || st.finished) return;
  const list = validTargets(u);
  const f2 = list[0];
  if (!f2) return;
  if (isStunned(u)) {
    pushLog("💫 " + u.name + " 被控住，跳过", "line");
    commit(st, u.id);
    renderBattle();
    setTimeout(aiTurnIfNeeded, 300);
    return;
  }
  const r = damage(st, u.id, f2.id, { atk: u.atk, mult: 100, critRate: u.critRate, critDmg: u.critDmg, kind: "normal", dmgType: "phys", style: "melee" });
  pushLog("🤖 " + u.name + " → " + f2.name + " " + r.dmg + (r.crit ? " 暴击💥" : ""), "line");
  commit(st, u.id);
  if (st.finished) finish();
  renderBattle();
  setTimeout(aiTurnIfNeeded, 360);
}

// 👹 敌人行动：怒气满放必杀 → 技能冷却好放技能 → 否则普攻
function applyEnemySkill(u, sk, allies, foes, bAtk, bDmg) {
  if (sk.heal || sk.shieldPct || sk.shield) {
    if (sk.heal) {
      allies.forEach((a) => healUnit(st, a.id, Math.round(a.maxHp * (Number(sk.heal) || 15) / 100)));
      pushLog("💚 " + u.name + "「" + sk.name + "」治疗全体", "line");
    }
    if (sk.shieldPct) {
      allies.forEach((a) => addShield(st, a.id, Math.round(a.maxHp * (Number(sk.shieldPct) || 0) / 100)));
      pushLog("🛡 " + u.name + "「" + sk.name + "」全队获得护盾", "line");
    } else if (sk.shield) {
      allies.forEach((a) => addShield(st, a.id, Number(sk.shield) || 40));
      pushLog("🛡 " + u.name + "「" + sk.name + "」全队获得护盾", "line");
    }
    if (sk.summon) {
      const e = enemyAt(sk.summon, st.__lv || 1);
      if (e) {
        st.units.push({ id: "f_s" + st.units.length, name: e.name, side: "B", spd: e.stats.spd, power: 0, hp: e.stats.hp, maxHp: e.stats.hp,
          atk: e.stats.atk, def: e.stats.def, res: e.stats.res, critRate: e.stats.critRate, critDmg: e.stats.critDmg,
          __skills: e.skills || [], __rageGain: e.rageGain || 25, __back: false, __row: 2, __col: 0 });
        pushLog("📢 " + u.name + "「" + sk.name + "」召唤了 " + e.name, "line");
      }
    }
    return;
  }
  if (sk.buff) {
    const label = sk.buff.atkPct ? "攻击 +" + sk.buff.atkPct + "%" : ("伤害 +" + (sk.buff.dmgPct || 0) + "%");
    allies.forEach((a) => { a.__buff = { atkPct: Number(sk.buff.atkPct) || 0, dmgPct: Number(sk.buff.dmgPct) || 0, turns: 3 }; });
    pushLog("📣 " + u.name + "「" + sk.name + "」全队 " + label + "（3 回合）", "line");
    return;
  }
  const targets = sk.aoe ? foes : [isRangedUnit(u) ? foes[Math.floor(Math.random() * foes.length)] : foes[0]];
  const hits = Number(sk.hits) || 1;
  targets.forEach((t) => {
    let total = 0, crit = false;
    for (let i = 0; i < hits; i++) {
      if (t.hp <= 0) break;
      const r = damage(st, u.id, t.id, { atk: bAtk, mult: (Number(sk.mult) || 100) * bDmg, critRate: u.critRate, critDmg: u.critDmg,
        kind: sk.kind === "normal" ? "normal" : "skill", dmgType: sk.spell ? "spell" : "phys", style: isRangedUnit(u) ? "ranged" : "melee" });
      total += r.dmg; crit = crit || r.crit;
    }
    pushLog("👹 " + u.name + "「" + sk.name + "」→ " + t.name + " " + total + (crit ? " 暴击💥" : ""), "line");
    if (sk.burn && t.hp > 0) applyStatus(st, u.id, t.id, "burn", Math.round(u.atk * 0.15), 2, "灼烧");
  });
}

function enemyAct(u) {
  if (!st || st.finished) return;
  if (isStunned(u)) {
    pushLog("💫 " + u.name + " 被控住，跳过", "line");
    commit(st, u.id);
    renderBattle();
    setTimeout(aiTurnIfNeeded, 300);
    return;
  }
  u.cd = Math.max(0, (Number(u.cd) || 0) - 1);
  if (u.__buff) { u.__buff.turns = (u.__buff.turns || 0) - 1; if (u.__buff.turns <= 0) u.__buff = null; }
  const bAtk = u.atk * (1 + ((u.__buff && u.__buff.atkPct) || 0) / 100);
  const bDmg = 1 + ((u.__buff && u.__buff.dmgPct) || 0) / 100;
  const list = validTargets(u);
  if (!list.length) return;
  const allies = aliveSide(u.side);
  const skills = u.__skills || [];
  const ult = skills.find((s) => s.kind === "ult");
  const skill = skills.find((s) => s.kind === "skill");
  const normal = skills.find((s) => s.kind === "normal") || { name: "普攻", mult: 100, kind: "normal" };
  u.rage = Number(u.rage) || 0;

  let used = normal;
  if (ult && u.rage >= 100 && !isSilenced(u)) { used = ult; u.rage = 0; pushLog("💥 " + u.name + " 怒气爆发！", "line"); }
  else if (skill && (u.cd || 0) <= 0 && !isSilenced(u)) { used = skill; u.cd = Number(skill.cd) || 0; u.rage = Math.min(100, u.rage + (Number(u.__rageGain) || 25)); }
  else { u.rage = Math.min(100, u.rage + (Number(u.__rageGain) || 25)); }

  applyEnemySkill(u, used, allies, list, bAtk, bDmg);
  commit(st, u.id);
  if (st.finished) finish();
  renderBattle();
  setTimeout(aiTurnIfNeeded, 360);
}

function aiTurnIfNeeded() {
  if (!st || st.finished) return;
  if (roomId && amHost) {
    // 联机模式：等对手提交；超时 20 秒由房主代打
    const a0 = nextActor(st);
    if (a0 && a0.side === "B" && window.__guestControls) {
      if (!window.__waitSince || window.__waitUnit !== a0.id) { window.__waitSince = Date.now(); window.__waitUnit = a0.id; }
      const waited = Date.now() - window.__waitSince;
      if (waited < 20000) { setTimeout(pullIntents, 350); return; }
      window.__waitSince = 0;
      pushLog("⏳ " + a0.name + " 超时未出手，房主代打", "line");
    }
  }  const a = nextActor(st);
  if (!a) return;
  // 🤖 托管：我方自动行动
  if (a.id === "me") {
    if (st.__auto) { setTimeout(() => doAct("normal"), 420); return; }
    renderBattle(); return;
  }
  if (a.side === "A") { autoUnitAct(a); return; }
  if (a.side === "B") { enemyAct(a); return; }
}

function finish() {
  const ch = activeChar();
  if (!st || !st.finished || st.__done) return;
  st.__done = true;
  // 🍱 战前准备：吃完这场就没了（胜败都清）
  if (st.__meal) { store.flags = store.flags || {}; store.flags.meal = null; }
  if (st.winner !== "A") { pushLog("💀 战斗失败"); save(); return; }
  // 🧬 用原创角色出战：经验给这个原创角色；金币/掉落/解锁照常给存档
  if (st.__origId) {
    const o = ORIGINALS.find((x) => x.id === st.__origId);
    if (o) {
      store.orig = store.orig || {};
      const cur = store.orig[o.id] || { lv: 1, exp: 0 };
      const gain = 120;
      cur.exp = (Number(cur.exp) || 0) + gain;
      let lvUp = 0;
      while (cur.lv < CHAR.maxLevel && cur.exp >= CHAR.expNeed(cur.lv)) { cur.exp -= CHAR.expNeed(cur.lv); cur.lv++; lvUp++; }
      store.orig[o.id] = cur;
      if (lvUp > 0) sysPost("🧬 " + o.name + " 升级到 Lv" + cur.lv);
      pushLog("🧬 " + o.name + " 经验 +" + gain + "（当前 Lv" + cur.lv + (lvUp ? " ↑升级" : "") + "）");
      addReceipt(store, "原创", o.name, { note: "原创角色经验 +" + gain });
    }
  }
  const s = STAGES.find((x) => x.id === st.__stage) || STAGES[0];
  const gold = Number(s.gold != null ? s.gold : (120 + s.foe.lv * 8));
  const exp = Number(s.exp != null ? s.exp : (40 + s.foe.lv * 6));
  store.gold = (Number(store.gold) || 0) + gold;
  if (!st.__origId) store.exp = (Number(store.exp) || 0) + exp; // 原创出战经验只给原创角色
  // 🔓 逐关解锁进度（每个副本独立）
  store.flags = store.flags || {};
  {
    const k = dungeonKey(s);
    const n = stageNo(s);
    const map = store.flags.cleared || (store.flags.cleared = {});
    if (n > (Number(map[k]) || 0)) {
      map[k] = n;
      if (k === "exp") store.flags.expCleared = n;
      pushLog("🔓 已解锁下一关", "line");
      sysPost("🎉 " + (((store.chars || []).find((c) => c.id === store.activeChar) || {}).name || "有人") + " 首次通关「" + s.name + "」");
    }
  }
  // 🎁 掉落
  const rnd = (a) => a[0] + Math.floor(Math.random() * (a[1] - a[0] + 1));
  const dp = s.drop || { shards: [5, 8], stone: [1, 2], gearChance: 5 };
  const shards = Array.isArray(dp.shards) ? rnd(dp.shards) : 0;
  const stone = Array.isArray(dp.stone) ? rnd(dp.stone) : 0;
  store.flags = store.flags || {};
  if (shards) store.flags.shards = (Number(store.flags.shards) || 0) + shards;
  if (stone) store.flags.stone = (Number(store.flags.stone) || 0) + stone;
  // 🎖️ 资历手稿 / 资质勋章：通关掉落（勋章按概率）
  const ms = Math.max(0, Number(dp.manuscript) || 0);
  if (ms) store.flags.manuscript = (Number(store.flags.manuscript) || 0) + ms;
  const mdBase = Math.max(0, Number(dp.medal) || 0);
  const md = (mdBase && Math.random() * 100 < (Number(dp.medalChance) || 0)) ? mdBase : 0;
  if (md) store.flags.medal = (Number(store.flags.medal) || 0) + md;
  const bst = Math.max(0, Number(dp.bstone) || 0);
  if (bst) store.flags.bstone = (Number(store.flags.bstone) || 0) + bst;
  const drops = [];
  if (shards) drops.push({ name: "碎片", count: shards });
  if (stone) drops.push({ name: "强化石", count: stone });
  if (bst) drops.push({ name: "突破石", count: bst });
  if (ms) drops.push({ name: "资历手稿", count: ms });
  if (md) drops.push({ name: "资质鉴定勋章", count: md });
  if (Math.random() * 100 < (dp.gearChance || 0)) {
    const pool = s.foe.lv >= 40 ? [WEAPONS, ARMORS, ACCESSORIES] : [ARMORS, ACCESSORIES];
    const list = pool[Math.floor(Math.random() * pool.length)];
    const def = list[Math.floor(Math.random() * list.length)];
    const cat = list === WEAPONS ? "weapon" : (list === ARMORS ? "armor" : "accessory");
    store.items.push(makeItem(cat, def));
    drops.push({ name: def.name, count: 1 });
  }
  // 🏮 庆典试炼：每周记录
  if (String(s.id).indexOf("fest") === 0) store.flags.festWeek = weekKey();
  addReceipt(store, "战斗", s.name, { gold, items: drops });
  bumpDaily(store, "battles");
  store.flags.wins = (Number(store.flags.wins) || 0) + 1;
  // 🤖 同行队伍的原创角色也拿经验
  if (st.__party && st.__party.length) {
    store.orig = store.orig || {};
    st.__party.forEach((id) => {
      const o = ORIGINALS.find((x) => x.id === id);
      if (!o) return;
      const cur = store.orig[id] || { lv: 1, exp: 0 };
      cur.exp = (Number(cur.exp) || 0) + 120;
      while (cur.lv < CHAR.maxLevel && cur.exp >= CHAR.expNeed(cur.lv)) { cur.exp -= CHAR.expNeed(cur.lv); cur.lv++; }
      store.orig[id] = cur;
      pushLog("🤖 " + o.name + " 经验 +120（Lv" + cur.lv + "）", "line");
    });
  }
  st.__reward = { gold, exp, stage: s.name, drops };
  pushLog("🏆 胜利：金币 +" + gold + " · 经验 +" + exp + " · " + drops.map((d) => d.name + "×" + d.count).join("、"));
  save();
}

$("btnSave").onclick = () => save();
(async () => {
  await load();
  // 联机：URL 里带 room → 从房间读状态
  const q = new URLSearchParams(location.search);
  roomId = q.get("room") || "";
  if (roomId) {
    try {
      const got = await getRoom(roomId);
      if (got) {
        amHost = got.room.host === box;
        if (!amHost && got.room.state) renderSpectator(got.room.state);
        if (!amHost && !got.room.state) {
          view().innerHTML = '<div class="card"><div class="card-title">等待房主开战…</div>' +
            '<div class="hint">房主开战后这里会自动切到观战/出手界面，不用刷新。</div></div>';
        }
        if (amHost) { const okRestore = await tryRestore(); if (!okRestore) renderPick(); }
        setInterval(async () => {
          if (amHost) return;
          try {
            const g2 = await getRoom(roomId);
            if (g2 && g2.room.state && g2.room.seq !== seq) {
              seq = g2.room.seq; lastStateAt = Date.now();
              renderSpectator(g2.room.state);
            } else if (lastStateAt && Date.now() - lastStateAt > 20000) {
              const tag = document.getElementById("hostOffline");
              if (tag) tag.style.display = "inline-block";
            }
          } catch (e) {}
        }, 500);
      }
    } catch (e) {}
  }
})();

// 👀 观战视图（只读）
let seq = 0, lastStateAt = 0;
function renderSpectator(state) {
  const meU = state.units.find((u) => u.id === "me") || state.units[0];
  const foeU = state.units.find((u) => u.id !== meU.id) || state.units[1];
  const bar = (u) => {
    const pct = Math.max(0, Math.min(100, Math.round(u.hp / u.maxHp * 100)));
    return '<div class="bar' + (pct <= 25 ? '' : ' full') + '"><i style="width:' + pct + '%"></i></div>' +
      '<div class="hint">' + fmt(u.hp) + ' / ' + fmt(u.maxHp) + (u.cd ? ' · 冷却 ' + u.cd : '') +
      (u.statuses && u.statuses.length ? ' · ' + u.statuses.map((s) => (s.label || s.key) + (s.turns ? '(' + s.turns + ')' : '')).join('、') : '') + '</div>';
  };
  const myTurn = !amHost && !state.finished && state.turn === foeU.id;
  const myUnit = (!amHost && st && st.__myUnit) ? st.__myUnit : null;
  const myTurnReal = !amHost && !state.finished && (!myUnit || state.turn === myUnit) && state.turn !== null;
  const ctrlUnit = myUnit && state.units ? state.units.find((u) => u.id === myUnit) : null;
  const A = state.units.filter((u) => u.side === "A");
  const B = state.units.filter((u) => u.side !== "A");
  const listHtml = (arr, label, color) => '<div class="card-title" style="color:' + color + ';margin-top:8px;">' + label + '（' + arr.length + '）</div>' +
    arr.map((u) => '<div class="row"><span class="k">' + (state.turn === u.id ? "▶ " : "") + esc(u.name) + ' <span class="tag">Lv' + (u.lv || 1) + ' · 速' + Math.round(u.spd) + '</span>' +
      (u.cd ? ' <span class="tag">冷却 ' + u.cd + '</span>' : '') +
      (u.rage >= 100 ? ' <span class="tag" style="color:#ffd666;">怒气满</span>' : '') +
      ((u.statuses || []).length ? '<div class="hint">' + u.statuses.map((s) => (s.label || s.key) + (s.turns ? '(' + s.turns + ')' : '')).join('、') + '</div>' : '') +
      '</span><span class="v">' + u.hp + '/' + u.maxHp + '</span></div>' + bar(u)).join("");
  view().innerHTML =
    '<div class="card"><div class="card-title">' + (amHost ? "👀 观战中" : (myTurnReal ? "⚡ 轮到你（" + esc(ctrlUnit ? ctrlUnit.name : "你的单位") + "）" : "👀 等待")) +
      ' · 回合 ' + (state.round || 1) + (state.finished ? (state.winner === "A" ? " · 🏆 蓝方胜" : " · 🏆 红方胜") : '') + '</div>' +
      listHtml(A, "🔵 蓝方", "#6ea8fe") + listHtml(B, "🔴 红方", "#ff9b9b") +
      '<div id="hostOffline" style="display:none;margin-top:6px;font-size:11px;color:#ff9b9b;">⚠️ 主机 20 秒没有更新，可能掉线了</div>' +
      (myTurnReal
        ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">' +
            '<button data-intent="normal" style="flex:1;min-width:100px;height:36px;">⚔️ 普攻</button>' +
            '<button data-intent="skill" style="flex:1;min-width:100px;height:36px;" ' + ((ctrlUnit && ctrlUnit.cd > 0) ? 'disabled' : '') + '>🥋 招式' + ((ctrlUnit && ctrlUnit.cd > 0) ? ' 冷却 ' + ctrlUnit.cd : '') + '</button>' +
            '<button data-intent="ult" style="flex:1;min-width:100px;height:36px;" ' + ((ctrlUnit && ctrlUnit.rage < 100) ? 'disabled' : '') + '>💥 必杀 ' + Math.round((ctrlUnit && ctrlUnit.rage) || 0) + '/100</button>' +
            '<button data-intent="defend" style="flex:1;min-width:100px;height:36px;">🛡️ 防御</button>' +
          '</div>'
        : '<div class="hint" style="margin-top:6px;">' + (myUnit ? "等自己的单位出手" : "你在观战（房间已满或没分到单位）") + '；数值由房主计算。</div>') + '</div>' +
    '<div class="card"><div class="card-title">战斗日志</div><div class="log">' +
      (state.log || []).map((l) => l.kind === "hdr"
        ? '<div style="color:#ffd666;font-weight:700;margin:6px 0 2px;">' + esc(l.text) + '</div>'
        : '<div class="act">' + esc(l.text) + ((l.subs || []).length ? l.subs.map((x) => '<div class="sub">↳ ' + esc(x) + '</div>').join("") : "") + '</div>').join("") +
    '</div></div>';

  view().querySelectorAll("[data-intent]").forEach((b) => b.onclick = async () => {
    b.disabled = true;
    const r = await pushIntent(roomId, { by: box, unitId: myUnit || (ctrlUnit && ctrlUnit.id) || foeU.id, act: b.dataset.intent });
    if (!r.ok) { b.disabled = false; return; }
  });
}

function pushLogLocal(text) {
  log.push({ text, kind: "line" });
}
