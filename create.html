<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲得慌RPG v2</title>
<link rel="stylesheet" href="css/app.css?v=c6880e77">
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="index.html">← 返回</a><span class="tag" id="boxTag">—</span><span class="tag">v2.0.0</span>
    <button id="btnSwitchBox" style="font-size:11px;">🔁 换位号</button>
    <button id="btnSave" style="margin-left:auto;">💾 保存</button></div>
  <div class="nav">
    <button data-tab="char" class="on">🧑 我的角色</button>
    <button data-tab="talent">🌳 天赋</button>
    <button data-tab="cult">⚒ 培养</button>
    <button data-tab="orig">🧬 原创</button>
    <button data-tab="store">🎒 仓库</button>
  </div>
  <div id="view"></div>
  <div id="toast" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:#1b1b2e;border:1px solid #3a3a5c;font-size:12.5px;display:none;"></div>
</div>

<script type="module">
import { newStore, newChar, cloudGet, cloudSave, cloudList, cacheSave, cacheLoad, esc, fmt, addReceipt, hashPw, dailyOf, bumpDaily } from "./js/core.js?v=13807141";
import { WEAPONS, ARMORS, ACCESSORIES, CONSUMABLES, CHAR, SHOP_PRICE, BREAKS, BIRTH, PRESETS, TALENT_TREES, talentPointsOf, TALENT_TIER_LV, CONTENT_READY, DAILY_QUESTS, DAILY_BONUS, ACHIEVEMENTS, WEEK_REWARD } from "./js/data.js?v=90fd0341";
import { charFinal, charPower, itemBonus, mainKeysOf, gradeOf, aptitudeOf, talentBonus, talentSpentInTree, talentSpentInBranch, powerOf } from "./js/power.js?v=d92ed317";
import { GRADE, APTITUDE } from "./js/data.js?v=90fd0341";
import { makeItem, findItem, equip, unequip, cultCheck, cultApply, refineCheck, refineApply, promoteCheck, promoteApply, dismantle, sell, sellPrice, isEquip, inheritCheck, inheritApply } from "./js/items.js?v=a6c2aa88";
import { ORIGINALS, pullOriginals, originalFinal, ORIGINAL_GEAR, ORIG_GEAR_CULT, origUnlocked } from "./js/originals.js?v=0167d36b";

let box = "", store = null, updatedAt = "", tab = "char", tt = 0;
const $ = (id) => document.getElementById(id);
const view = () => $("view");
const activeChar = () => (store && store.chars || []).find((c) => c.id === store.activeChar) || (store && store.chars || [])[0] || null;

function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg; t.style.display = "block";
  t.style.color = bad ? "#ff9b9b" : "#eaeaea";
  t.style.borderColor = bad ? "#ff9b9b" : "#3a3a5c";
  clearTimeout(tt); tt = setTimeout(() => { t.style.display = "none"; }, 2200);
}
function readBox() {
  try { if (localStorage.getItem("rpg2:host") === "1") return "zynSD117"; if (localStorage.getItem("rpg2:hostBox") === "zynSD117") return "zynSD117"; } catch (e) {}
  const q = new URLSearchParams(location.search);
  if (q.get("box")) return q.get("box");
  const m = /box=([^&]+)/.exec(location.hash || "");
  if (m) return decodeURIComponent(m[1]);
  return localStorage.getItem("rpg2:box") || "";
}

// 🔁 换位号：清掉本机记忆，回首页重新填
$("btnSwitchBox").onclick = () => {
  const v = prompt("输入你的账号ID（3~16 位字母/数字/下划线）。\n换了只是切换本机登录的账号，云端存档不会丢。", box || "");
  if (v === null) return;
  const s = String(v).trim();
  if (!/^[A-Za-z0-9_-]{3,16}$/.test(s)) return alert("只能用字母、数字、下划线，长度 3~16");
  try { localStorage.setItem("rpg2:box", s); sessionStorage.removeItem("rpg2:pw:" + s); } catch (e) {}
  location.href = "create.html?box=" + encodeURIComponent(s) + "&tab=char";
};

async function load() {
  box = readBox();
  if (!box) {
    // 新玩家：自己起账号ID（3~16 位字母/数字/下划线）
    let id = "";
    while (!id) {
      const v = prompt("给自己起个账号ID（3~16 位，字母/数字/下划线）");
      if (v === null) { view().innerHTML = card("👤 先起个账号ID", '<div class="hint">刷新页面重新开始。</div>'); return; }
      const s = String(v).trim();
      if (!/^[A-Za-z0-9_-]{3,16}$/.test(s)) { alert("只能用字母、数字、下划线，长度 3~16"); continue; }
      id = s;
    }
    box = id;
    // 顺手起个账号昵称（大厅/聊天展示用，可跳过）
    let nick = "";
    try { nick = prompt("再起个账号昵称（大厅/聊天显示，可留空）") || ""; } catch (e) {}
    try { if (nick.trim()) localStorage.setItem("rpg2:nick", nick.trim().slice(0, 12)); } catch (e) {}
  }
  // 位号记在本机：之后从任何页面进来都不用再带 ?box=
  try { localStorage.setItem("rpg2:box", box); } catch (e) {}
  $("boxTag").textContent = box;
  const cached = cacheLoad(box);
  let exists = false;
  try {
    const row = await cloudGet(box);
    if (row && row.store && Number(row.store.v) === 2) {
      exists = true;
      let isHostBox = false;
      try { isHostBox = localStorage.getItem("rpg2:host") === "1"; } catch (e) {}
      const pw = isHostBox ? "" : (row.store.__pw || "");
      if (pw) {
        // 同一次浏览里记住已通过的口令
        let memo = "";
        try { memo = sessionStorage.getItem("rpg2:pw:" + box) || ""; } catch (e) {}
        if (memo && memo === pw) { store = row.store; updatedAt = row.updated_at || ""; }
        else {
          const tip = "这个位号设了口令，请输入口令（忘记就无法取回）";
          for (let i = 0; i < 3; i++) {
            const input = prompt(tip);
            if (input == null) { store = null; return; }
            if ((await hashPw(input)) === pw) {
              try { sessionStorage.setItem("rpg2:pw:" + box, pw); } catch (e) {}
              store = row.store; updatedAt = row.updated_at || ""; break;
            }
            toast("口令不对（还有 " + (2 - i) + " 次）", true);
          }
          if (!store) { view().innerHTML = '<div class="card"><div class="hint">口令验证失败，无法进入这个位号。</div></div>'; return; }
        }
      } else {
        store = row.store;
        updatedAt = row.updated_at || "";
        if (!isHostBox) {
          const set = confirm("这个位号还没设口令。要不要现在设一个？（推荐，防止别人用你的档）");
          if (set) {
            const p1 = prompt("设置口令（4~20 位）");
            if (p1 && p1.length >= 4) {
              store.__pw = await hashPw(p1);
              await save();
              toast("口令已设置，请记牢");
            }
          }
        }
      }
    } else if (row && row.store) {
      exists = true;
      toast("旧版存档（v1）：新版先新建角色", true);
    }
  } catch (e) {
    if (cached) { store = cached.store; toast("离线：用本机缓存", true); }
  }
  if (!store && cached && Number(cached.store.v) === 2) { store = cached.store; exists = true; }
  if (!store && !exists) {
    // 全新位号：直接开好新档，落在建角页
    store = newStore();
    ensureSeed(false);
    await save();
    toast("🆕 新位号 " + box + " 已开好，先捏个角色吧");
  }
  if (store) ensureSeed();
  if (store) {
    if (!store.account) store.account = { id: box, nick: "" };
    if (store.account.nick) { try { localStorage.setItem("rpg2:nick", store.account.nick); } catch (e) {} }
    const nickShow = store.account.nick || "";
    $("boxTag").textContent = nickShow ? (nickShow + " · " + box) : box;
  }
  // 🧹 一次性清理：移除测试角色 Zyn（含本机缓存）
  if (store && Array.isArray(store.chars)) {
    const kept = store.chars.filter((c) => !String(c.name || "").toLowerCase().includes("zyn"));
    if (kept.length !== store.chars.length) {
      store.chars = kept;
      if (!store.chars.some((c) => c.id === store.activeChar)) store.activeChar = (store.chars[0] || {}).id || "";
      await save();
    }
  }
}

function ensureSeed(withDefaultChar = true) {
  if (!store.flags) store.flags = {};
  if (!store.flags.__seed) {
    store.gold = 3000; store.flags.stone = 0; store.flags.shards = 0; store.flags.bstone = 0;
    store.flags.__seed = 1;
  }
  // 📬 欢迎邮件（每个存档一封）
  if (!Array.isArray(store.mail)) store.mail = [];
  if (!store.flags.__mailSeed) {
    store.mail.push({ id: "m_welcome", title: "欢迎加入冒险者协会", body: "这是你的第一封信：协会先给你一笔启动金，去登记表捏个角色吧。", gold: 1000, claimed: false, at: Date.now() });
    store.flags.__mailSeed = 1;
  }
  if (withDefaultChar && !store.chars.length) {
    store.chars.push(newChar("Zyn"));
    store.chars[0].equip.weapon = Object.assign({}, WEAPONS[0], { lv: 1, star: 1 });
    store.activeChar = store.chars[0].id;
  }
}

async function save() {
  if (!box || !store) return false;
  store.__at = Date.now();
  cacheSave(box, store);
  try {
    const r = await cloudSave(box, store, updatedAt || null, activeChar() ? activeChar().name : "");
    if (!r.ok) { toast("保存未生效：" + r.reason, true); return false; }
    updatedAt = (r.row && r.row.updated_at) || updatedAt;
    toast("已保存");
    return true;
  } catch (e) { toast("保存失败：" + e.message, true); return false; }
}

const row = (k, v) => '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
const card = (t, inner) => '<div class="card"><div class="card-title">' + t + '</div>' + inner + '</div>';

function eqCard(ch, kind, label) {
  const d = ch.equip[kind];
  if (!d) return '<div style="flex:1;min-width:150px;padding:9px 10px;border-radius:9px;background:#101020;border:1px dashed #3a3a5c;">' +
    '<div style="font-size:11px;color:#6a6a86;">' + label + '</div><div style="font-size:12px;color:#5a5a78;margin-top:4px;">未装备</div></div>';
  return '<div style="flex:1;min-width:150px;padding:9px 10px;border-radius:9px;background:#12182a;border:1px solid ' + ((RARITY_COLOR[d.rarity] || "#2f4a6a") + "88") + ';">' +
    '<div style="font-size:11px;color:#6a6a86;">' + label + '</div>' +
    '<div style="font-size:12.5px;font-weight:600;margin-top:3px;color:' + (RARITY_COLOR[d.rarity] || "#eaeaea") + ';">' + esc(d.name) + '</div>' +
    '<div style="font-size:10.5px;color:#8a8ab0;margin-top:2px;">' + (d.rarity || "") + ' · ' + (d.star || 1) + '★ · Lv' + (d.lv || 1) + '</div>' +
    '<div style="margin-top:6px;display:flex;gap:6px;"><button data-eqdetail="' + kind + '" style="height:24px;font-size:11px;">详情</button>' +
    '<button data-unequip="' + kind + '" style="height:24px;font-size:11px;">脱下</button></div></div>';
}

function attrRow(label, key, ch) {
  const free = Number(ch.free) || 0;
  const growthCap = Number(BIRTH.specLevelCap) || 70;
  const base = (ch.specBase && Number(ch.specBase[key])) || 0;
  const growth = Math.max(0, (Number(ch[key]) || 0) - base);
  return '<div class="row"><span class="k">' + label + '</span><span class="v">' + growth +
    ' <span class="hint">/ ' + growthCap + '</span>' +
    ' <button class="mini" style="height:22px;padding:0 8px;font-size:11px;margin-left:6px;" data-attr="' + key + '" ' +
    (free > 0 && growth < growthCap ? '' : 'disabled') + '>＋</button></span></div>';
}

function receiptsHtml() {
  const list = (store.receipts || []).slice(-8).reverse();
  if (!list.length) return '<div class="hint">还没有记录</div>';
  return list.map((r) => {
    const t = new Date(r.at);
    const hh = String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
    const gold = Number(r.gold) || 0;
    const items = (r.items || []).map((i) => i.name + "×" + (i.count || 1)).join("、");
    return '<div class="row"><span class="k">' + hh + ' · ' + esc(r.kind) + ' ' + esc(r.title) +
      (items ? '<div class="hint">' + esc(items) + '</div>' : '') + '</span>' +
      '<span class="v" style="color:' + (gold >= 0 ? "#7ee787" : "#ff9b9b") + '">' + (gold ? (gold > 0 ? "+" : "") + fmt(gold) + " 金" : "") + '</span></div>';
  }).join("");
}

// 📋 装备详情弹窗（v2）：把一件装备的「基础 + 词条 + 招式」全列出来
// 稀有度配色：R 蓝 / SR 紫 / SSR 金 / UR 红
const RARITY_COLOR = { R: "#6ea8fe", SR: "#c9a0ff", SSR: "#ffd666", UR: "#ff6b6b" };
const ITEM_NAMES = { atk: "攻击", hp: "生命", def: "防御", res: "法抗", spd: "速度", critRate: "暴击率", critDmg: "暴击伤害", atkPct: "攻击加成", hpPct: "生命加成", defPct: "防御加成", resPct: "法抗加成", ragePct: "怒气获取", dmgCut: "减伤", thorns: "反伤", str: "力量", intel: "智力", tech: "技巧", agi: "敏捷", strPct: "力量加成", intelPct: "智力加成", techPct: "技巧加成", agiPct: "敏捷加成", physPct: "物理伤害", spellPct: "法术伤害", normalPct: "普攻伤害", skillPct: "技能伤害", ultPct: "必杀伤害", physPen: "物理穿透", spellPen: "法术穿透", meleePct: "近战伤害", rangedPct: "远程伤害", focusPct: "法器伤害", cdReduce: "冷却缩减", rageOnSkill: "招式回怒", rageOnKill: "击杀回怒", rageStart: "初始怒气", block: "格挡", tenacity: "韧性", lowHpCut: "残血减伤", statusPower: "状态强度", statusHit: "状态命中", statusResist: "状态抗性", penetrate: "穿透", doubleStrike: "连击", chase: "追击", counter: "反击", dualborn: "双生", charge: "蓄势", reverse: "逆流", fate: "天命", splash: "溅射", stun: "眩晕", silence: "沉默", freeze: "冰冻", noheal: "禁疗", disarm: "缴械", taunt: "嘲讽", purify: "净化" };
const ITEM_UNITS = { critRate: "%", critDmg: "%", atkPct: "%", hpPct: "%", defPct: "%", resPct: "%", ragePct: "%", dmgCut: "%", thorns: "%", strPct: "%", intelPct: "%", techPct: "%", agiPct: "%", physPct: "%", spellPct: "%", normalPct: "%", skillPct: "%", ultPct: "%", physPen: "%", spellPen: "%", meleePct: "%", rangedPct: "%", focusPct: "%", block: "%", tenacity: "%", lowHpCut: "%", statusPower: "%", statusHit: "%", statusResist: "%", penetrate: "%", doubleStrike: "%", chase: "%", counter: "%", dualborn: "%", splash: "%" };

// 🔍 装备详情（只读）：基础 + 词条分组 + 对比当前装备
function showItemDetail(it) {
  if (!it || !it.data) return;
  const d = it.data;
  const ch = activeChar();
  const slotKey = it.cat === "armor" ? (d.part === "bottom" ? "armor2" : "armor") : it.cat;
  const cur = ch && ch.equip && ch.equip[slotKey];
  const b = itemBonus(it);
  const cb = cur ? itemBonus({ cat: it.cat, data: cur }) : null;
  const rc = RARITY_COLOR[d.rarity] || "#8a8ab0";

  const GROUPS = [
    { title: "基础与加成", keys: ["atk", "hp", "def", "res", "spd", "atkPct", "hpPct", "defPct", "resPct", "critRate", "critDmg", "dmgCut", "thorns", "ragePct"] },
    { title: "专精", keys: ["str", "intel", "tech", "agi", "strPct", "intelPct", "techPct", "agiPct"] },
    { title: "伤害类型", keys: ["physPct", "spellPct", "normalPct", "skillPct", "ultPct", "physPen", "spellPen", "meleePct", "rangedPct", "focusPct"] },
    { title: "战斗词条", keys: ["cdReduce", "rageOnSkill", "rageOnKill", "rageStart", "block", "tenacity", "lowHpCut", "statusPower", "statusHit", "statusResist", "penetrate", "doubleStrike", "chase", "counter", "dualborn", "charge", "reverse", "fate", "splash", "stun", "silence", "freeze", "noheal", "disarm", "taunt", "purify"] }
  ];
  const val = (k, v) => Math.round(Number(v) || 0) + (ITEM_UNITS[k] || "");
  const mainKeys = mainKeysOf(it);
  const mainRows = mainKeys.filter((k) => Number(b[k]) > 0).map((k) =>
    '<div class="row"><span class="k">' + (ITEM_NAMES[k] || k) + '</span><span class="v" style="color:#ffd666;">+' + val(k, b[k]) + '</span></div>').join("");
  const mainHtml = mainRows ? '<div class="hint" style="margin-top:8px;font-weight:700;color:#ffd666;">主属性（部位基础）</div>' + mainRows : "";
  const groupsHtml = GROUPS.map((g) => {
    const rows = g.keys.filter((k) => Number(b[k]) > 0 && mainKeys.indexOf(k) < 0).map((k) => {
      const mine = Number(b[k]) || 0;
      let cmp = "";
      if (cb) {
        const other = Number(cb[k]) || 0;
        const diff = mine - other;
        if (Math.abs(diff) > 1e-9) cmp = ' <span class="hint" style="color:' + (diff > 0 ? "#7ee787" : "#ff9b9b") + ';">（现有 ' + val(k, other) + (diff > 0 ? " ↑" : " ↓") + '）</span>';
        else if (other > 0) cmp = ' <span class="hint">（现有 ' + val(k, other) + '）</span>';
      }
      return '<div class="row"><span class="k">' + (ITEM_NAMES[k] || k) + '</span><span class="v" style="color:' + rc + ';">' + (FLAG_TEXT[k] ? '✔ 已获得' : ('+' + val(k, mine))) + cmp + '</span></div>';
    }).join("");
    return rows ? '<div class="hint" style="margin-top:8px;font-weight:700;color:#8fd8ff;">' + g.title + '</div>' + rows : "";
  }).join("");

  // 招式组：普攻 / 技能（R 以上有）/ 必杀
  const skill = '<div class="hint" style="margin-top:10px;font-weight:700;color:#8fd8ff;">招式</div>' +
    '<div class="row"><span class="k">普攻</span><span class="v">' + (Number(d.aMult) || 100) + '%' + ((Number(d.aHits) || 1) > 1 ? ' ×' + (Number(d.aHits) || 1) + ' 段' : '') + ' · ' + (d.dmgType === "spell" ? "法术" : "物理") + '</span></div>' +
    (d.sSupport
      ? '<div class="row"><span class="k">技能（辅助）</span><span class="v">「' + esc(d.sName || "—") + '」· CD ' + (d.sCd || 3) + ' · 回怒 ' + (d.sRage || 0) + '%</span></div>'
      : (d.sMult
        ? '<div class="row"><span class="k">技能</span><span class="v">「' + esc(d.sName || "—") + '」' + d.sMult + '%' + (d.sHits > 1 ? ' ×' + d.sHits : '') +
          ' · CD ' + (d.sCd || 2) + ' · 回怒 ' + (d.sRage || 0) + '%</span></div>' +
          (d.hitStatus ? '<div class="row"><span class="k">　└ 附带</span><span class="v" style="color:#ff9b6b;">' + esc(d.hitStatusName || d.hitStatus) + ' ' + (d.hitStatusV || 0) + '% · ' + (d.hitStatusTurns || 2) + ' 回合</span></div>' : '')
        : '<div class="row"><span class="k">技能</span><span class="v" style="color:#6a6a86;">R 阶没有技能（SR 起才有）</span></div>')) +
    '<div class="row"><span class="k">必杀</span><span class="v">' + (Number(d.uMult) || 250) + '%' + ((Number(d.uHits) || 1) > 1 ? ' ×' + (Number(d.uHits) || 1) + ' 段' : '') + ' · ' + (d.dmgType === "spell" ? "法术" : "物理") + ' · 怒气满 100 时可用</span></div>';

  const meta = (d.style ? (d.style === "melee" ? "近战" : d.style === "ranged" ? "远程" : "法器") : "—") +
    " · " + (d.dmgType === "spell" ? "法术" : "物理");

  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;display:flex;align-items:center;justify-content:center;";
  ov.innerHTML = '<div class="card" style="width:min(480px,92vw);max-height:82vh;overflow:auto;margin:0;border-color:' + rc + ';box-shadow:0 0 22px ' + rc + '55;">' +
    '<div class="card-title" style="color:' + rc + ';font-size:15px;">' + esc(d.name || "装备") +
      ' <span class="tag" style="color:' + rc + ';border-color:' + rc + ';">' + (d.rarity || "") + ' · ' + (d.star || 1) + '★ · Lv' + (d.lv || 1) + '</span></div>' +
    '<div class="hint">' + meta + (cur ? '　|　对比：' + esc(cur.name || "当前装备") : '　|　未装备同类') + '</div>' +
    (d.desc ? '<div class="hint" style="margin-top:4px;color:#9aa4b8;">' + esc(d.desc) + '</div>' : '') +
    mainHtml +
    (groupsHtml || '<div class="hint" style="margin-top:8px;">没有属性加成</div>') +
    skill +
    '<div class="hint" style="margin-top:10px;">强化 / 升星 / 继承 请到「⚒ 培养」页操作。</div>' +
    '<div style="margin-top:10px;"><button id="dpClose" style="width:100%;">关闭</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#dpClose").onclick = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
}

function createCharacter(name, weaponId, armorId, accId, attrs, basic) {
  const ch = newChar(name);
  const SC = Number(BIRTH.specCap) || 20, BC = Number(BIRTH.basicCap) || 30;
  if (attrs) {
    ch.str = Math.min(SC, Math.max(0, attrs.str || 0));
    ch.intel = Math.min(SC, Math.max(0, attrs.intel || 0));
    ch.tech = Math.min(SC, Math.max(0, attrs.tech || 0));
    ch.agi = Math.min(SC, Math.max(0, attrs.agi || 0));
  }
  if (basic) ch.basic = {
    hp: Math.min(BC, Math.max(0, basic.hp || 0)),
    atk: Math.min(BC, Math.max(0, basic.atk || 0)),
    def: Math.min(BC, Math.max(0, basic.def || 0)),
    res: Math.min(BC, Math.max(0, basic.res || 0))
  };
  // 记录建角时的专精基线，用来区分「建角点」和「升级成长点」
  ch.specBase = { str: ch.str, intel: ch.intel, tech: ch.tech, agi: ch.agi };
  ch.grade = "D"; ch.apt = 1; ch.breaks = 0; ch.free = 0;
  const w = WEAPONS.find((x) => x.id === weaponId) || WEAPONS[0];
  const ar = ARMORS.find((x) => x.id === armorId) || ARMORS[0];
  const ac = ACCESSORIES.find((x) => x.id === accId) || ACCESSORIES[0];
  ch.equip.weapon = Object.assign({}, w, { lv: 1, star: 1, born: w.rarity });
  const arSlot = ar.part === "bottom" ? "armor2" : "armor";
  ch.equip[arSlot] = Object.assign({}, ar, { lv: 1, star: 1, born: ar.rarity });
  ch.equip.accessory = Object.assign({}, ac, { lv: 1, star: 1, born: ac.rarity });
  store.chars.push(ch);
  store.activeChar = ch.id;
  addReceipt(store, "建角", ch.name, {
    items: [{ name: w.name, count: 1 }, { name: ar.name, count: 1 }, { name: ac.name, count: 1 }],
    note: "初始装备"
  });
}

function ccState() {
  const D = { name: "", weapon: WEAPONS[0].id, armor: ARMORS[0].id, acc: ACCESSORIES[0].id,
    str: 0, agi: 0, intel: 0, tech: 0, hp: 0, atk: 0, def: 0, res: 0 };
  window.__cc = Object.assign({}, D, window.__cc || {});
  return window.__cc;
}

// 📜 建角：冒险者协会「入会登记表」（一页填完，交表盖章）
function buildCreateScreen() {
  const state = ccState();
  const free = () => BIRTH.specPoints - (state.str + state.agi + state.intel + state.tech);
  const basicFree = () => BIRTH.basicPoints - (state.hp + state.atk + state.def + state.res);
  const hasChars = !!(store && store.chars && store.chars.length);
  const dd = new Date();
  const dateStr = dd.getFullYear() + " 年 " + (dd.getMonth() + 1) + " 月 " + dd.getDate() + " 日";

  const pickRow = (k, label, list, cur, sub) => '<div class="g-gear-block">' +
    '<div class="g-gear-label">' + label + '</div>' +
    '<div class="g-gear-grid">' +
    list.map((x) => {
      const on = cur === x.id;
      const rc = RARITY_COLOR[x.rarity] || "#8a7a55";
      return '<button class="g-gear' + (on ? " on" : "") + '" data-pick="' + k + ':' + x.id + '"' +
        (on ? ' style="border-color:' + rc + ';box-shadow:inset 0 0 0 2px ' + rc + ';"' : '') + '>' +
        '<span class="g-gear-name" style="color:' + rc + ';">' + esc(x.name) + '</span>' +
        '<span class="g-gear-tag">' + (x.rarity || "") + '</span>' +
        '<span class="g-gear-sub">' + sub(x) + '</span></button>';
    }).join("") + '</div></div>';

  const basicLine = (k, label) => '<div class="g-attr"><span class="g-k">' + label + '</span><div class="g-ctrl">' +
    '<button class="g-step" data-basic="' + k + ':-1"' + (state[k] <= 0 ? " disabled" : "") + '>－</button>' +
    '<input class="g-num-in" type="number" min="0" max="' + BIRTH.basicCap + '" value="' + state[k] + '" data-basic-num="' + k + '">' +
    '<button class="g-step" data-basic="' + k + ':1"' + (basicFree() <= 0 || state[k] >= BIRTH.basicCap ? " disabled" : "") + '>＋</button>' +
    '</div><span class="g-hint">+' + (state[k] * BIRTH.basicPct) + '%　/ 上限 ' + BIRTH.basicCap + ' 点（+' + (BIRTH.basicCap * BIRTH.basicPct) + '%）</span></div>';

  const specLine = (k, label) => {
    const eff = BIRTH.specEffect[k === "intel" ? "int" : k];
    return '<div class="g-attr"><span class="g-k">' + label + '</span><div class="g-ctrl">' +
    '<button class="g-step" data-attr="' + k + ':-1"' + (state[k] <= 0 ? " disabled" : "") + '>－</button>' +
    '<input class="g-num-in" type="number" min="0" max="' + BIRTH.specCap + '" value="' + state[k] + '" data-attr-num="' + k + '">' +
    '<button class="g-step" data-attr="' + k + ':1"' + (free() <= 0 || state[k] >= BIRTH.specCap ? " disabled" : "") + '>＋</button>' +
    '</div><span class="g-hint">' + (eff ? "每点 +" + eff : "") + '　/ 上限 ' + BIRTH.specCap + ' 点</span></div>';
  };

  const gearSub = (x) => {
    const p = [];
    const ml = { atk: "攻击", hp: "生命", def: "防御", res: "法抗", spd: "速度", critRate: "暴击", critDmg: "暴伤" };
    Object.keys(x.main || {}).forEach((k) => p.push((ml[k] || k) + " +" + x.main[k]));
    if (x.def) p.push("防御 +" + x.def);
    if (x.res) p.push("法抗 +" + x.res);
    if (x.hp) p.push("生命 +" + x.hp);
    if (x.spd) p.push("速度 +" + x.spd);
    if (x.atkPct) p.push("攻击 +" + x.atkPct + "%");
    if (x.critRate) p.push("暴击 +" + x.critRate + "%");
    if (x.critDmg) p.push("暴伤 +" + x.critDmg + "%");
    if (x.dmgCut) p.push("减伤 " + x.dmgCut + "%");
    if (x.thorns) p.push("反伤 " + x.thorns + "%");
    return p.join(" · ") || "无加成";
  };

  // 武器卡片：方式·类型 / 普攻·必杀倍率 / 自带加成
  const weaponSub = (x) => {
    const st = x.style === "ranged" ? "远程" : x.style === "focus" ? "法器" : "近战";
    const tp = x.dmgType === "spell" ? "法术" : "物理";
    const bonus = [];
    if (x.main && x.main.atk) bonus.push("攻击 +" + x.main.atk);
    if (x.atk) bonus.push("攻击 +" + x.atk);
    if (x.critRate) bonus.push("暴击 +" + x.critRate + "%");
    if (x.spd) bonus.push("速度 +" + x.spd);
    if (x.res) bonus.push("法抗 +" + x.res);
    if (x.dmgCut) bonus.push("减伤 " + x.dmgCut + "%");
    if (x.thorns) bonus.push("反伤 " + x.thorns + "%");
    return st + " · " + tp + (bonus.length ? "<br>" + bonus.join(" · ") : "");
  };

  view().innerHTML = '<div class="gform">' +
    '<div class="g-org">闲得慌 · 冒险者协会</div>' +
    '<h1>入会登记表</h1>' +
    '<div class="g-meta"><span>受理编号：' + esc(box) + '</span><span>登记日期：' + dateStr + '</span></div>' +

    '<div class="g-sec">一、申请人信息</div>' +
    '<div class="g-row"><span class="g-k">姓　　名</span><div class="g-v"><input class="g-in" id="cName" maxlength="16" placeholder="请填写（最多 16 字）" value="' + esc(state.name) + '"></div></div>' +
    '<div class="g-row"><span class="g-k">申请类别</span><div class="g-v">新入会 · 初始装备三件 · 属性自行申报</div></div>' +

    (CONTENT_READY
      ? '<div class="g-sec">二、装备志愿（每类选一件）</div>' +
        pickRow("weapon", "武　器", WEAPONS.filter((x) => x.rarity === "R"), state.weapon, weaponSub) +
        pickRow("armor", "防　具", ARMORS.filter((x) => x.rarity === "R"), state.armor, gearSub) +
        pickRow("acc", "饰　品", ACCESSORIES.filter((x) => x.rarity === "R"), state.acc, gearSub)
      : '<div class="g-sec">二、初始装备</div>' +
        '<div class="g-row"><span class="g-k">装　备</span><div class="g-v">内容待定，先由协会配发默认装备</div></div>') +

    '<div class="g-sec">三、属性申报（基础 ' + BIRTH.basicPoints + ' 点 / 专精 ' + BIRTH.specPoints + ' 点）</div>' +
    '<div class="g-row"><span class="g-k">参考模板</span><div class="g-v g-picks">' +
      PRESETS.map((p) => '<button class="g-preset" data-preset="' + p.id + '">' + p.name + '</button>').join("") +
    '</div></div>' +
    basicLine("hp", "生　命") + basicLine("atk", "攻　击") + basicLine("def", "防　御") + basicLine("res", "法　抗") +
    specLine("str", "力　量") + specLine("intel", "智　力") + specLine("tech", "技　巧") + specLine("agi", "敏　捷") +
    '<div class="g-rest">基础剩余 <b>' + basicFree() + '</b> 点　·　专精剩余 <b>' + free() + '</b> 点' +
      ((free() > 0 || basicFree() > 0) ? '（点「参考模板」可一键填满）' : '') + '</div>' +

    '<div class="g-sec">四、申请人承诺</div>' +
    '<div class="g-note">本人自愿加入闲得慌冒险者协会，遵守协会章程，如实申报属性。所填资料经协会盖章受理后生效；姓名与装备日后仍可更改，属性点可凭升级与突破继续追加。</div>' +

    '<div class="g-actions">' +
      (hasChars ? '<button class="g-cancel" id="ccCancel">取消</button>' : '') +
      '<button class="g-submit" id="btnCreate">提交申请</button>' +
    '</div>' +
  '</div>';

  if ($("cName")) $("cName").oninput = () => { state.name = $("cName").value; };
  view().querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => {
    const [k, id] = b.dataset.pick.split(":");
    state[k] = id;
    render();
  });
  view().querySelectorAll("[data-basic]").forEach((b) => b.onclick = () => {
    const [k, d] = b.dataset.basic.split(":");
    const next = state[k] + Number(d);
    if (next < 0 || next > BIRTH.basicCap) return;
    if (Number(d) > 0 && basicFree() <= 0) return;
    state[k] = next;
    render();
  });
  view().querySelectorAll("[data-attr]").forEach((b) => b.onclick = () => {
    const [k, d] = b.dataset.attr.split(":");
    const next = state[k] + Number(d);
    if (next < 0 || next > BIRTH.specCap) return;
    if (Number(d) > 0 && free() <= 0) return;
    state[k] = next;
    render();
  });
  // 直接填数字
  const commitNum = (k, raw, kind) => {
    const cap = kind === "basic" ? BIRTH.basicCap : BIRTH.specCap;
    const left = kind === "basic" ? basicFree() + state[k] : free() + state[k];
    let v = Math.floor(Number(raw));
    if (!Number.isFinite(v)) v = state[k];
    v = Math.max(0, Math.min(cap, v));
    v = Math.min(v, left);
    state[k] = v;
    render();
  };
  view().querySelectorAll("[data-basic-num]").forEach((inp) => {
    inp.onchange = () => commitNum(inp.dataset.basicNum, inp.value, "basic");
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } };
  });
  view().querySelectorAll("[data-attr-num]").forEach((inp) => {
    inp.onchange = () => commitNum(inp.dataset.attrNum, inp.value, "spec");
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } };
  });
  view().querySelectorAll("[data-preset]").forEach((b) => b.onclick = () => {
    const p = PRESETS.find((x) => x.id === b.dataset.preset);
    if (!p) return;
    const spec = Object.assign({}, p.spec);
    if (spec.int != null) { spec.intel = spec.int; delete spec.int; }  // 模板用 int，存档用 intel
    Object.assign(state, p.basic, spec);
    render();
    toast("已套用：" + p.name);
  });
  if ($("ccCancel")) $("ccCancel").onclick = () => { window.__creating = 0; window.__cc = null; render(); };
  if ($("btnCreate")) $("btnCreate").onclick = async () => {
    const name = (state.name || "").trim();
    if (!name) return toast("先填个名字再交表", true);
    const left = free() + basicFree();
    if (left > 0 && !confirm("还有 " + left + " 点没申报，直接交表吗？")) return;
    const w = state.weapon, ar = state.armor, ac = state.acc;
    const attrs = { str: state.str, agi: state.agi, intel: state.intel, tech: state.tech };
    const basic = { hp: state.hp, atk: state.atk, def: state.def, res: state.res };
    $("btnCreate").disabled = true;
    // 盖章 → 归档
    const wrap = document.createElement("div");
    wrap.className = "g-stamp-wrap";
    wrap.innerHTML = '<div class="g-stamp">已受理</div><div class="g-stamp-tip">受理编号 ' + esc(box) + ' · 正在归档…</div>';
    document.body.appendChild(wrap);
    setTimeout(async () => {
      createCharacter(name, w, ar, ac, attrs, basic);
      window.__cc = null;
      window.__creating = 0;
      await save();
      wrap.remove();
      render();
      toast("🎉 「" + name + "」登记成功，欢迎加入协会");
    }, 1000);
  };
}

// ⚡ 突破行：显示节点进度 + 突破按钮
function breakRow(ch) {
  const done = Math.max(0, Number(ch.breaks) || 0);
  const next = BREAKS[done] || null;
  const dots = BREAKS.map((b, i) => '<span style="color:' + (i < done ? "#7ee787" : (i === done ? "#ffd666" : "#3a3a5c")) + ';">●</span>' +
    (i < BREAKS.length - 1 ? '<span style="color:#2f2f4a;">──</span>' : '')).join("");
  if (!next) {
    return '<div style="margin-top:8px;padding:8px 10px;border-radius:9px;background:#101020;border:1px dashed #3a3a5c;">' +
      '<div class="hint">突破 ' + BREAKS.map((b) => b.at).join(" ▸ ") + '　' + dots + '</div>' +
      '<div class="hint" style="color:#7ee787;margin-top:4px;">已全部突破（+15% 全属性）</div></div>';
  }
  const lv = Number(ch.lv) || 1;
  const near = lv >= next.at;
  const stone = Number((store.flags || {}).stone) || 0;
  const canDo = near && stone >= next.stone && (Number(store.gold) || 0) >= next.gold;
  return '<div style="margin-top:8px;padding:8px 10px;border-radius:9px;background:#101020;border:1px solid #2f2f4a;">' +
    '<div class="hint">突破 ' + BREAKS.map((b) => b.at).join(" ▸ ") + '　' + dots + '</div>' +
    '<div class="hint" style="margin-top:4px;">下一次：Lv' + next.at + '（' + (near ? "已到" : "还需 " + (next.at - lv) + " 级") +
      '）· 突破石 ' + next.stone + '（有 ' + stone + '）· 金 ' + fmt(next.gold) + '</div>' +
    '<div class="hint" style="margin-top:2px;">突破奖励：全属性 +' + next.bonus + '%，属性点 +' + next.points + '，等级上限 → ' + next.capTo + '</div>' +
    '<button id="btnBreak" style="margin-top:6px;height:30px;border-color:' + (canDo ? "#7ee787" : "#3a3a5c") + ';color:' + (canDo ? "#7ee787" : "#6a6a86") + ';"' + (canDo ? '' : ' disabled') + '>⚡ 突破</button>' +
    '</div>';
}

// 🎖️ 资历评级 / 🎯 资质评估 卡片
function gradeCard(ch) {
  const g = gradeOf(ch), a = aptitudeOf(ch);
  const nextG = GRADE[GRADE.indexOf(g) + 1] || null;
  const nextA = APTITUDE[APTITUDE.indexOf(a) + 1] || null;
  const ms = Number((store.flags || {}).manuscript) || 0;
  const md = Number((store.flags || {}).medal) || 0;
  const canG = nextG && ms >= nextG.cost;
  const canA = nextA && md >= nextA.cost;
  return card("资历与资质",
    '<div class="row"><span class="k">资历评级</span><span class="v" style="color:' + g.color + ';font-weight:800;letter-spacing:1px;">' + g.key +
      ' <span class="hint">（全属性 ×' + g.mult.toFixed(2) + '）</span></span></div>' +
    (nextG
      ? '<div class="row"><span class="k">升资历 → <b style="color:' + nextG.color + ';">' + nextG.key + '</b></span><span class="v">' +
        '<span style="color:#ffd666;">📜 ' + nextG.cost + '/有 ' + ms + '</span> ' +
        '<button data-grade="1" ' + (canG ? '' : 'disabled') + '>晋升</button></span></div>'
      : '<div class="hint">已到最高资历（红 SS）</div>') +
    '<div class="row" style="margin-top:6px;"><span class="k">资质评估</span><span class="v" style="color:#ffd666;">' + a.star + '★ ' +
      '<span class="hint">（全属性 ×' + a.mult.toFixed(2) + '）</span></span></div>' +
    (nextA
      ? '<div class="row"><span class="k">升资质 → ' + nextA.star + '★</span><span class="v">' +
        '<span style="color:#ffd666;">🎖️ ' + nextA.cost + '/有 ' + md + '</span> ' +
        '<button data-apt="1" ' + (canA ? '' : 'disabled') + '>评估</button></span></div>'
      : '<div class="hint">已到最高资质（7★）</div>'));
}

// 📊 玩家角色属性加成明细
function charBreakdown(ch) {
  const noGear = JSON.parse(JSON.stringify(ch));
  noGear.equip = {};
  const a = charFinal(noGear), b = charFinal(ch);
  const rows = [["攻击", "atk"], ["生命", "hp"], ["防御", "def"], ["法抗", "res"], ["速度", "spd"]];
  const th = '<th style="padding:4px 6px;text-align:right;">';
  let html = '<table style="width:100%;border-collapse:collapse;font-size:12px;"><tr style="color:#8a8ab0;font-size:10.5px;text-align:left;"><th style="padding:4px;">来源</th>' +
    rows.map((r) => th + r[0] + '</th>').join("") + '</tr>';
  const line = (label, fn, color) => '<tr style="border-top:1px solid #1a2438;"><td class="hint" style="padding:6px 4px;">' + label + '</td>' +
    rows.map((r) => '<td style="padding:6px;text-align:right;color:' + (color || "#dbe4f3") + ';">' + Math.round(fn(r[1]) * 10) / 10 + '</td>').join("") + '</tr>';
  html += line("角色本体（等级/突破/资历/专精）", (k) => a[k]);
  html += line("装备加成", (k) => b[k] - a[k], "#ffb347");
  html += '<tr style="border-top:1px solid #2c3d5e;"><td style="padding:7px 4px;font-weight:700;">合计</td>' +
    rows.map((r) => '<td style="padding:7px 6px;text-align:right;font-weight:800;color:#6ea8fe;">' + (Math.round(b[r[1]] * 10) / 10) + '</td>').join("") + '</tr></table>';
  const eq = Object.keys(ch.equip || {}).map((slot) => {
    const it = ch.equip[slot];
    if (!it) return "";
    const bo = itemBonus(it);
    const bits = Object.keys(bo).filter((k) => Number(bo[k]) > 0).slice(0, 4)
      .map((k) => ({ atk: "攻", hp: "生", def: "防", res: "抗", spd: "速", critRate: "暴击", critDmg: "暴伤" }[k] || k) + "+" + Math.round(bo[k])).join(" · ");
    return '<div class="hint">🗡 ' + esc(it.data.name) + '：' + esc(bits) + '</div>';
  }).join("");
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:999;padding:12px;";
  ov.innerHTML = '<div class="card" style="max-width:560px;width:100%;max-height:86vh;overflow:auto;">' +
    '<div class="card-title">📊 加成明细 · ' + esc(ch.name) + '</div>' +
    '<div class="hint" style="margin-bottom:6px;">Lv' + (ch.lv || 1) + ' · 突破 ' + (ch.breaks || 0) + '</div>' +
    html + (eq ? '<div style="margin-top:8px;"><div class="hint" style="font-weight:700;">装备来源</div>' + eq + '</div>' : "") +
    '<div style="margin-top:10px;"><button id="bdClose" style="width:100%;">关闭</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#bdClose").onclick = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
}

function renderChar() {
  const ch = activeChar();
  if (!ch || window.__creating) {
    window.__creating = 1;
    buildCreateScreen();
    return;
  }
  // 老存档没有基线：按建角上限估算，保证成长显示不爆
  if (!ch.specBase) {
    const cap = Number(BIRTH.specCap) || 24;
    ch.specBase = {
      str: Math.min(Number(ch.str) || 0, cap),
      intel: Math.min(Number(ch.intel) || 0, cap),
      tech: Math.min(Number(ch.tech) || 0, cap),
      agi: Math.min(Number(ch.agi) || 0, cap)
    };
  }
  const f = charFinal(ch), pw = charPower(ch);
  const need = CHAR.expNeed(ch.lv);
  const pct = Math.min(100, Math.round(((store.exp || 0) / need) * 100));
  const canLv = ch.lv < CHAR.maxLevel && (store.exp || 0) >= need;
  const spec = Math.round(((ch.str || 0) * CHAR.spec.str + (ch.agi || 0) * CHAR.spec.agi + (ch.intel || 0) * CHAR.spec.intel + (ch.tech || 0) * CHAR.spec.tech) * 10) / 10;

  view().innerHTML =
    card("角色 · 可切换",
      '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
      store.chars.map((c) => '<button data-char="' + c.id + '" style="padding:6px 10px;border-color:' + (c.id === ch.id ? "#6ea8fe" : "#3a3a5c") + ';' +
        'color:' + (c.id === ch.id ? "#cfe6ff" : "#eaeaea") + ';">' + (c.id === ch.id ? "● " : "") + esc(c.name) +
        ' <span class="hint">Lv' + (c.lv || 1) + '</span></button>').join("") +
      '<button id="btnNewChar" style="padding:6px 10px;border-color:#7ee787;color:#7ee787;">＋ 新建角色</button>' +
      (store.chars.length ? '<button id="btnDelChar" style="padding:6px 10px;border-color:#ff6b6b;color:#ff6b6b;">🗑 删除此角色</button>' : '') +
      '</div>') +
    '<div class="card">' +
      '<div class="row"><span class="k">等级</span><span class="v" style="color:#ffd666;font-size:18px;">Lv' + ch.lv + (ch.lv >= CHAR.maxLevel ? ' · 满级' : '') + '</span></div>' +
      '<div class="bar' + (pct >= 100 ? ' full' : '') + '" style="margin:6px 0;"><i style="width:' + pct + '%"></i></div>' +
      '<div class="hint">经验 ' + fmt(store.exp || 0) + ' / ' + fmt(need) + '</div>' +
      breakRow(ch) +
      (ch.lv < CHAR.maxLevel ? '<div style="margin-top:8px;"><button id="btnLv" ' + (canLv ? '' : 'disabled') + '>⬆️ 升级到 Lv' + (ch.lv + 1) + '</button></div>' : '') +
    '</div>' +
    card("综合战力（含装备）", '<div style="font-size:26px;font-weight:800;color:#6ea8fe;">' + fmt(pw) + '</div>') +
    gradeCard(ch) +
    card("属性（含装备）", row("攻击", Math.round(f.atk)) + row("生命", Math.round(f.hp)) + row("防御", Math.round(f.def)) +
      row("法抗", Math.round(f.res)) + row("速度", Math.round(f.spd * 10) / 10) +
      row("暴击率", Math.round(f.critRate) + "%") + row("暴击伤害", Math.round(f.critDmg) + "%") +
      '<div style="margin-top:8px;"><button id="btnCharBreakdown">📊 加成明细</button></div>') +
    card("天赋与专精", row("专精换算", "+" + spec) +
      attrRow("力量", "str", ch) + attrRow("敏捷", "agi", ch) + attrRow("智力", "intel", ch) + attrRow("技巧", "tech", ch) +
      '<div class="hint" style="margin-top:6px;">剩余可分配点数：<b style="color:' + ((ch.free || 0) > 0 ? "#7ee787" : "#6a6a86") + ';">' + (ch.free || 0) + '</b>（每次升级 +2）</div>') +
    card("装备栏", '<div style="display:flex;gap:8px;flex-wrap:wrap;">' + eqCard(ch, "weapon", "⚔️ 武器") + eqCard(ch, "armor", "🛡️ 上装") + eqCard(ch, "armor2", "🛡️ 下装") + eqCard(ch, "accessory", "💍 饰品") + '</div>') +
    card("操作", '<button id="btnRename">✏️ 改名字</button><button id="btnNick">🏷 改账号昵称</button>') +
    card("最近收据", receiptsHtml());

  if ($("btnRename")) $("btnRename").onclick = async () => {
    const nn = prompt("新的角色名", ch.name);
    if (!nn || nn === ch.name) return;
    ch.name = nn.trim().slice(0, 16);
    addReceipt(store, "改名", ch.name);
    await save(); render();
  };

  view().querySelectorAll("[data-char]").forEach((b) => b.onclick = async () => {
    if (b.dataset.char === ch.id) return;
    store.activeChar = b.dataset.char;
    await save();
    render();
  });
  if ($("btnCharBreakdown")) $("btnCharBreakdown").onclick = () => charBreakdown(ch);
  if ($("btnNewChar")) $("btnNewChar").onclick = () => {
    window.__cc = null;
    window.__creating = 1;
    buildCreateScreen();
  };
  if ($("btnDelChar")) $("btnDelChar").onclick = async () => {
    if (!confirm("删除角色「" + ch.name + "」？装备会一起没，不可恢复。")) return;
    store.chars = store.chars.filter((c) => c.id !== ch.id);
    if (!store.chars.length) {
      store.activeChar = "";
      await save();
      window.__cc = null;
      window.__creating = 1;
      buildCreateScreen();
      toast("已删除角色，请新建一个");
      return;
    }
    if (store.activeChar === ch.id) store.activeChar = store.chars[0].id;
    await save(); render(); toast("已删除角色");
  };

  view().querySelectorAll("[data-grade]").forEach((b) => b.onclick = async () => {
    const g = gradeOf(ch), next = GRADE[GRADE.indexOf(g) + 1];
    if (!next) return;
    store.flags = store.flags || {};
    const ms = Number(store.flags.manuscript) || 0;
    if (ms < next.cost) return toast("资历手稿不够（需要 " + next.cost + "）", true);
    store.flags.manuscript = ms - next.cost;
    ch.grade = next.key;
    addReceipt(store, "晋升", ch.name + " 资历 → " + next.name + " " + next.key, { items: [{ name: "资历手稿", count: -next.cost }] });
    await save(); render();
    toast("🎖️ 资历晋升：" + next.name + " " + next.key);
  });
  view().querySelectorAll("[data-apt]").forEach((b) => b.onclick = async () => {
    const a = aptitudeOf(ch), next = APTITUDE[APTITUDE.indexOf(a) + 1];
    if (!next) return;
    store.flags = store.flags || {};
    const md = Number(store.flags.medal) || 0;
    if (md < next.cost) return toast("资质鉴定勋章不够（需要 " + next.cost + "）", true);
    store.flags.medal = md - next.cost;
    ch.apt = next.star;
    addReceipt(store, "评估", ch.name + " 资质 → " + next.star + "★", { items: [{ name: "资质鉴定勋章", count: -next.cost }] });
    await save(); render();
    toast("🎯 资质评估：" + next.star + "★");
  });
  if ($("btnBreak")) $("btnBreak").onclick = async () => {
    const done = Math.max(0, Number(ch.breaks) || 0);
    const next = BREAKS[done];
    if (!next) return;
    if ((Number(ch.lv) || 1) < next.at) return toast("还没到突破等级", true);
    store.flags = store.flags || {};
    const stone = Number(store.flags.stone) || 0;
    if (stone < next.stone) return toast("突破石不够（需要 " + next.stone + "）", true);
    if ((Number(store.gold) || 0) < next.gold) return toast("金币不够（需要 " + next.gold + "）", true);
    store.flags.stone = stone - next.stone;
    store.gold -= next.gold;
    ch.breaks = done + 1;
    ch.tp = (Number(ch.tp) || 0) + 2;
    ch.free = (Number(ch.free) || 0) + next.points;
    addReceipt(store, "突破", ch.name + " 第 " + ch.breaks + " 突", { gold: -next.gold, items: [{ name: "突破石", count: -next.stone }], note: "全属性 +" + next.bonus + "% · 属性点 +" + next.points });
    await save(); render();
    toast("⚡ 突破成功：全属性 +" + next.bonus + "%，属性点 +" + next.points);
  };
  if ($("btnLv")) $("btnLv").onclick = async () => {
    // 到突破节点必须先突破
    const done = Math.max(0, Number(ch.breaks) || 0);
    const next = BREAKS[done];
    if (next && (Number(ch.lv) || 1) >= next.at) return toast("先突破才能继续升级（Lv" + next.at + "）", true);
    store.exp -= need; ch.lv += 1;
    ch.tp = (Number(ch.tp) || 0) + 1;
    bumpDaily(store, "levels");
    ch.free = (Number(ch.free) || 0) + 2;
    addReceipt(store, "升级", ch.name + " → Lv" + ch.lv, { note: "获得 2 点属性点" });
    await save(); render();
  };
  view().querySelectorAll("[data-attr]").forEach((b) => b.onclick = async () => {
    const free = Number(ch.free) || 0;
    if (free <= 0) return toast("没有可分配点数", true);
    const key = b.dataset.attr;
    const base = (ch.specBase && Number(ch.specBase[key])) || 0;
    const growthCap = Number(BIRTH.specLevelCap) || 70;
    if ((Number(ch[key]) || 0) - base >= growthCap) return toast("这一项成长加点已到上限 " + growthCap, true);
    ch[key] = (Number(ch[key]) || 0) + 1;
    ch.free = free - 1;
    await save(); render();
  });
  view().querySelectorAll("[data-eqdetail]").forEach((b) => b.onclick = () => {
    const k = b.dataset.eqdetail, dd = ch.equip && ch.equip[k];
    if (dd) showItemDetail({ cat: k, data: dd });
  });
  view().querySelectorAll("[data-unequip]").forEach((b) => b.onclick = async () => {
    const r = unequip(store, ch.id, b.dataset.unequip);
    if (!r.ok) return toast(r.why, true);
    await save(); render();
  });
}

// 🌳 天赋树（职业分支版）：上方定位 → 分支链列 → 阶×分支矩阵 → 详情
const EFF_LABELS = {
  atkPct: "攻击", hpPct: "生命", defPct: "防御", resPct: "法抗", spdPct: "速度",
  atk: "攻击", hp: "生命", def: "防御", res: "法抗", spd: "速度",
  critRate: "暴击率", critDmg: "暴击伤害", dmgCut: "减伤", block: "格挡", tenacity: "韧性",
  lowHpCut: "残血减伤", cdReduce: "冷却缩减", rageStart: "初始怒气",
  statusPower: "状态强度", statusHit: "状态命中", statusResist: "状态抗性",
  penetrate: "穿透", doubleStrike: "连击", chase: "追击", dualborn: "双生",
  counter: "反击", reverse: "逆流", taunt: "嘲讽", fate: "天命", splash: "溅射",
  charge: "蓄势", sunderBoost: "破防强度", rageOnSkill: "招式回怒", rageOnKill: "击杀回怒", ragePct: "怒气获取"
};
const EFF_NOPCT = new Set(["cdReduce", "rageStart", "rageOnKill", "atk", "hp", "def", "res", "spd"]);
// 这些是「开关型」机制，数值只代表开启，不显示成百分比
const FLAG_TEXT = {
  reverse: "逆流（生命 <25% 时攻击 +40%、受击减伤 20%）",
  fate: "天命（每场第一次致死伤害无效）",
  charge: "蓄势（防御后下一次攻击 +60%）",
  taunt: "嘲讽（受击时强制目标攻击自己 1 回合）"
};
const CN_NUM = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩", "⑪", "⑫", "⑬", "⑭"];
function effText(eff) {
  return Object.keys(eff).map((k) => {
    if (FLAG_TEXT[k]) return FLAG_TEXT[k];
    const u = k === "cdReduce" ? " 回合" : (EFF_NOPCT.has(k) ? "" : "%");
    return (EFF_LABELS[k] || k) + " +" + eff[k] + u;
  }).join(" · ");
}

function renderTalent() {
  const ch = activeChar();
  if (!ch) { window.__creating = 1; buildCreateScreen(); return; }
  ch.talent = ch.talent || { path: "", points: {} };
  if (!ch.talent.points) ch.talent.points = {};
  if (ch.tp == null) ch.tp = talentPointsOf(ch);

  const valid = new Set();
  TALENT_TREES.forEach((t) => {
    (t.branches || []).forEach((b) => b.nodes.forEach((n) => valid.add(n.id)));
    if (t.active) valid.add(t.active.id);
  });
  if (Object.keys(ch.talent.points).some((k) => !valid.has(k))) ch.talent.points = {};

  const spent = Object.keys(ch.talent.points).length;
  const left = Math.max(0, Number(ch.tp) - spent);
  const tb = talentBonus(ch);
  const tbParts = Object.keys(EFF_LABELS).filter((k) => Number(tb[k]) > 0)
    .map((k) => EFF_LABELS[k] + " +" + (Math.round(tb[k] * 10) / 10) + (k === "cdReduce" ? " 回合" : k === "rageStart" ? "" : "%"));

  const counts = {};
  TALENT_TREES.forEach((t) => { counts[t.id] = talentSpentInTree(ch, t.id); });
  let cur = window.__talentTree || ch.talent.path;
  if (!TALENT_TREES.some((t) => t.id === cur)) {
    cur = TALENT_TREES.slice().sort((a, b) => counts[b.id] - counts[a.id])[0].id;
  }
  window.__talentTree = cur;
  ch.talent.path = cur;
  const tree = TALENT_TREES.find((t) => t.id === cur);
  const branches = tree.branches || [];
  const lv = Number(ch.lv) || 1;

  // ① 定位选项
  const tabs = '<div class="card" style="padding:12px 14px;">' +
    '<div class="card-title" style="margin-bottom:8px;">🌳 天赋 · 先选定位</div>' +
    '<div class="tree-tabs">' +
    TALENT_TREES.map((t) => {
      const on = t.id === cur;
      return '<button data-tree="' + t.id + '" class="' + (on ? "on" : "") + '" style="border-color:' + (on ? t.color : "#3a3a5c") + ';color:' + (on ? t.color : "#eaeaea") + ';">' +
        t.name + ' <span class="tag">' + counts[t.id] + '</span></button>';
    }).join("") +
    '</div>' +
    '<div class="hint" style="margin-top:6px;">可用 <b style="color:' + (left > 0 ? "#7ee787" : "#8a8ab0") + ';">' + left + '</b> / 共 ' + Number(ch.tp) + ' 点（升级 +1、突破 +2）</div>' +
    (tbParts.length ? '<div class="hint">当前加成：' + tbParts.join(" · ") + '</div>' : '') +
    (spent > 0 ? '<div style="margin-top:8px;"><button id="btnTpReset">↺ 洗点（' + (spent * 100) + ' 金币）</button></div>' : '') +
    '</div>';

  // ② 分支链（表头）+ 阶 × 分支 矩阵（用 table，避免 grid 在窄屏挤歪）
  const headCell = (b) => {
    return '<th style="padding:6px 2px 8px;font-size:13px;color:' + tree.color + ';font-weight:700;border-bottom:1px solid #2f2f4a;text-align:center;">' +
      '<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + b.name + '</div></th>';
  };
  const rows = [];
  for (let i = 0; i < TALENT_TIER_LV.length; i++) {
    const cells = branches.map((b) => {
      const n = b.nodes[i];
      if (!n) return '<td></td>';
      const bSpent = talentSpentInBranch(ch, tree.id, b.id);
      const has = !!ch.talent.points[n.id];
      const lvLock = lv < b.unlockLv;
      const tierLock = lv < (TALENT_TIER_LV[i] || 1);
      const lock = lvLock || tierLock;
      const can = !has && !lock && left > 0;
      const mark = has ? "●" : (lock ? "🔒" : (can ? "○" : "·"));
      const col = has ? tree.color : (lock ? "#5a5a78" : (can ? "#cfe6ff" : "#3a3a5c"));
      return '<td style="padding:2px;">' +
        '<button ' + (can ? 'data-tp="' + n.id + '"' : 'data-prev="' + n.id + '"') + ' style="width:100%;height:66px;padding:3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:8px;border:1px solid ' +
        (has ? tree.color : (can ? "#4a6a9a" : "#2f2f4a")) + ';background:' + (has ? tree.color + "22" : "#101020") + ';color:' + col + ';cursor:pointer;" title="点击看完整效果">' +
        '<span style="font-size:12.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;">' + mark + ' ' + n.name + '</span>' +
        '<span style="font-size:11px;line-height:1.2;color:' + (has ? "#cfe6ff" : "#8a97b8") + ';max-height:28px;overflow:hidden;text-align:center;">' + effText(n.eff) + '</span></button></td>';
    }).join("");
    rows.push('<tr><th style="padding:2px 4px;font-size:12px;color:#a8b0c8;font-weight:600;border-bottom:1px dotted #23233a;white-space:nowrap;text-align:left;">' +
      (i + 1) + '阶<div class="hint" style="font-size:10px;">Lv' + TALENT_TIER_LV[i] + '</div></th>' + cells + '</tr>');
  }
  const grid = '<table style="width:100%;border-collapse:collapse;table-layout:fixed;margin-top:8px;">' +
    '<colgroup><col style="width:40px;">' + branches.map(() => '<col>').join("") + '</colgroup>' +
    '<thead><tr><th></th>' + branches.map(headCell).join("") + '</tr></thead>' +
    '<tbody>' + rows.join("") + '</tbody></table>';

  // ④ 职业主动技
  const act = tree.active;
  const actHas = !!(act && ch.talent.points[act.id]);
  const actCan = act && !actHas && left > 0 && counts[tree.id] >= act.need;
  const actRow = act ? '<div class="row" style="margin-top:12px;"><span class="k">⚡ 主动技 · ' + act.name + '</span><span class="v">' +
    '<span class="hint">' + act.desc + ' · CD ' + act.cd + ' 回合' + (actHas ? '' : ' · 需本定位 ' + act.need + ' 点') + '</span> ' +
    (actHas ? '<span class="tag" style="color:' + tree.color + ';">已解锁</span>'
            : '<button data-tp="' + act.id + '" ' + (actCan ? '' : 'disabled') + '>解锁</button>') + '</span></div>' : '';

  view().innerHTML = tabs +
    '<div class="card"><div class="card-title" style="color:' + tree.color + ';">' + tree.name + ' · ' + tree.role +
    ' <span class="tag">本定位 ' + counts[tree.id] + ' 点</span></div>' +
    '<div class="hint">天赋 Lv5 开放；三条分支都从 Lv5 起可用，14 阶每 5 级开放一阶（Lv5→70）；到等级就能点，未解锁的节点可以点开预览。</div>' +
    (lv < 5 ? '<div class="hint" style="color:#ffd666;">当前 Lv' + lv + '，到 Lv5 才能开始点天赋</div>' : '') + grid +
    (actRow ? actRow : '') + '</div>';

  const allNodes = [];
  TALENT_TREES.forEach((t) => {
    (t.branches || []).forEach((b) => b.nodes.forEach((n) => allNodes.push(Object.assign({ tree: t.id }, n))));
    if (t.active) allNodes.push(Object.assign({ tree: t.id }, t.active));
  });

  view().querySelectorAll("[data-tree]").forEach((b) => b.onclick = () => {
    window.__talentTree = b.dataset.tree;
    render();
  });

  // 🔍 节点预览：未解锁也能点开看效果
  const previewNode = (id) => {
    const node = allNodes.find((n) => n.id === id);
    if (!node) return;
    const t = TALENT_TREES.find((x) => x.id === node.tree);
    let br = null, idx = -1;
    (t.branches || []).forEach((b) => {
      const i = b.nodes.findIndex((n) => n.id === node.id);
      if (i >= 0) { br = b; idx = i; }
    });
    const need = node.unlockLv != null ? node.unlockLv : (TALENT_TIER_LV[idx] || 1);
    const has = !!ch.talent.points[node.id];
    const lvOk = (Number(ch.lv) || 1) >= need;
    const bSpent = br ? talentSpentInBranch(ch, t.id, br.id) : 0;
    const chainOk = idx <= 0 || !!(br && ch.talent.points[br.nodes[idx - 1].id]);
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;display:flex;align-items:center;justify-content:center;";
    ov.innerHTML = '<div class="card" style="width:min(420px,92vw);margin:0;border-color:' + t.color + ';">' +
      '<div class="card-title" style="color:' + t.color + ';font-size:15px;">' + node.name +
        ' <span class="tag" style="color:' + t.color + ';border-color:' + t.color + ';">' + t.role + '</span></div>' +
      '<div class="hint">' + t.name + ' · ' + (br ? br.name + ' · 第 ' + (idx + 1) + ' 阶' : '主动技') +
        '　|　需要 Lv' + need + '</div>' +
      '<div class="hint" style="margin-top:8px;color:#eaeaea;">' + effText(node.eff) + '</div>' +
      (node.mech ? '<div class="hint" style="margin-top:6px;color:#ffd666;">⚙ 第 14 阶机制：' + (br && br.style ? br.style : '专属效果') + '</div>' : '') +
      '<div class="hint" style="margin-top:8px;">' + (has ? '状态：已学会' :
        (!lvOk ? '状态：未解锁（还差 ' + (need - (Number(ch.lv) || 1)) + ' 级）' :
          (left > 0 ? '状态：可以学习' : '状态：天赋点不足'))) + '</div>' +
      '<div style="margin-top:10px;"><button id="pvClose" style="width:100%;">关闭</button></div></div>';
    document.body.appendChild(ov);
    ov.querySelector("#pvClose").onclick = () => ov.remove();
    ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  };
  view().querySelectorAll("[data-prev]").forEach((b) => b.onclick = () => previewNode(b.dataset.prev));

  view().querySelectorAll("[data-tp]").forEach((b) => b.onclick = async () => {
    const node = allNodes.find((n) => n.id === b.dataset.tp);
    if (!node) return;
    if (spent >= Number(ch.tp)) return toast("天赋点不够", true);
    if (node.need != null && talentSpentInTree(ch, node.tree) < node.need) return toast("本定位点数不够（需 " + node.need + "）", true);
    if (node.unlockLv == null) {
      const t = TALENT_TREES.find((x) => x.id === node.tree);
      const br = (t.branches || []).find((x) => x.nodes.some((n) => n.id === node.id));
      const idx = br.nodes.findIndex((n) => n.id === node.id);
      if (idx >= 0 && (Number(ch.lv) || 1) < (TALENT_TIER_LV[idx] || 1)) return toast("到 Lv" + TALENT_TIER_LV[idx] + " 才能点这一阶", true);
    }
    ch.talent.points[node.id] = 1;
    addReceipt(store, "天赋", node.name, { note: "学习天赋节点" });
    await save();
    render();
    toast("🌳 学会：" + node.name);
  });
  if ($("btnTpReset")) $("btnTpReset").onclick = async () => {
    const cost = spent * 100;
    if (!confirm("洗点要花 " + cost + " 金币（已花点数 × 100），确定？")) return;
    if ((Number(store.gold) || 0) < cost) return toast("金币不够（需 " + cost + "）", true);
    store.gold -= cost;
    ch.talent.points = {};
    addReceipt(store, "洗点", ch.name, { gold: -cost, note: "重置全部天赋" });
    await save();
    render();
    toast("已洗点，花费 " + cost + " 金币");
  };
}

// 🏆 排行榜：读云端存档，按战力排序（前 20）
async function renderRank() {
  view().innerHTML = '<div class="card"><div class="card-title">🏆 排行榜</div><div class="hint">读取云端存档中…</div></div>';
  let rows = [];
  try { rows = await cloudList(200); } catch (e) { rows = []; }
  const candidates = rows
    .filter((r) => r && r.store && Number(r.store.v) === 2 && String(r.box).indexOf("__") !== 0)
    .map((r) => {
      const st = r.store;
      const chars = st.chars || [];
      const ch = chars.find((c) => c.id === st.activeChar) || chars[0];
      return ch ? {
        box: String(r.box), name: ch.name || "无名", lv: Number(ch.lv) || 1,
        power: charPower(ch), grade: gradeOf(ch).key, color: gradeOf(ch).color
      } : null;
    })
    .filter(Boolean);
  // 同名合并：保留战力最高的一个，避免同一角色重复占榜
  const map = new Map();
  candidates.forEach((r) => {
    const prev = map.get(r.name);
    if (!prev) { map.set(r.name, Object.assign({ dup: 1 }, r)); }
    else if (r.power > prev.power) { map.set(r.name, Object.assign({ dup: prev.dup + 1 }, r)); }
    else { prev.dup += 1; }
  });
  const players = Array.from(map.values()).sort((a, b) => b.power - a.power);
  // 🧬 原创角色并入「可游玩角色」总榜
  const origs = ORIGINALS.map((o) => {
    const prog = (store.orig || {})[o.id] || {};
    return {
      type: "orig", id: o.id, name: prog.name || o.name, title: o.title || "", role: o.role || "", rare: !!o.rare,
      power: originalFinal(o, prog).power
    };
  });
  const all = players.map((r) => Object.assign({ type: "player" }, r)).concat(origs).sort((a, b) => b.power - a.power);
  const top = all.slice(0, 20);

  const meBox = box;
  const myRank = all.findIndex((r) => r.type === "player" && r.box === meBox) + 1;
  const wk = (() => {
    const d = new Date();
    const one = new Date(d.getFullYear(), 0, 1);
    const days = Math.floor((d - one) / 86400000);
    const w = Math.ceil((days + one.getDay() + 1) / 7);
    return d.getFullYear() + "-W" + String(w).padStart(2, "0");
  })();
  const reward = WEEK_REWARD.find((x) => myRank > 0 && myRank <= x.maxRank);
  const wf = (store.flags && store.flags.week && store.flags.week.key === wk) ? store.flags.week : { key: wk, claimed: false };

  const weekHtml = '<div class="row" style="margin-top:8px;"><span class="k">本周排名</span><span class="v">' + (myRank ? "#" + myRank : "未上榜") + '</span></div>' +
    (reward
      ? '<div class="row"><span class="k">周榜奖励</span><span class="v"><span style="color:#ffd666;">' + reward.gold + ' 金</span> ' +
        (wf.claimed ? '<span class="hint">本周已领</span>' : '<button data-week="1">领取</button>') + '</span></div>'
      : '<div class="hint">进前 10 名可领周榜奖励（每周一次）</div>');

  view().innerHTML =
    card("🏆 可游玩角色 · 战力榜",
      '<div class="hint" style="margin-bottom:6px;">包含玩家自创角色（🧑）与原创角色（🧬），按综合战力排序。点原创角色可查看完整面板。</div>' +
      (top.length
        ? '<table style="width:100%;border-collapse:collapse;">' +
          '<tr style="color:#8a8ab0;font-size:10.5px;text-align:left;"><th style="padding:4px 2px;">#</th><th>名字</th><th>类型</th><th style="text-align:right;">战力</th></tr>' +
          top.map((r, i) => {
            const isOrig = r.type === "orig";
            const nameCell = isOrig
              ? '<b style="color:#ffb347;">' + esc(r.name) + '</b>' + (r.title ? ' <span class="hint">' + esc(r.title) + '</span>' : '') + (r.rare ? ' <span class="tag">稀有</span>' : '')
              : '<b style="color:' + r.color + ';">' + esc(r.name) + '</b>' + (r.dup > 1 ? ' <span class="hint">同名 ×' + r.dup + '</span>' : '');
            return '<tr' + (isOrig ? ' data-origcard="' + r.id + '"' : "") + ' style="border-top:1px dashed #23233a;' +
              (r.type === "player" && r.box === meBox ? "background:#1b2740;" : "") + (isOrig ? "cursor:pointer;" : "") + '">' +
              '<td style="padding:6px 2px;font-size:11px;color:' + (i < 3 ? "#ffd666" : "#8a8ab0") + ';">' + (i + 1) + '</td>' +
              '<td style="font-size:12.5px;">' + nameCell + '</td>' +
              '<td style="font-size:10.5px;color:' + (isOrig ? "#ffb347" : "#6ea8fe") + ';">' + (isOrig ? "🧬 原创" : "🧑 玩家") + '</td>' +
              '<td style="text-align:right;font-size:12px;color:' + (isOrig ? "#ffb347" : "#6ea8fe") + ';font-weight:700;">' + fmt(r.power) + '</td></tr>';
          }).join("") +
          '</table>'
        : '<div class="hint">还没有可排行的角色（或云端暂时不可用）。</div>') +
      weekHtml +
      '<div class="hint" style="margin-top:8px;">玩家角色只统计最近更新的 200 个位号；原创角色来自主机发布。</div>');

  view().querySelectorAll("[data-origcard]").forEach((tr) => tr.onclick = () => {
    const o = ORIGINALS.find((x) => x.id === tr.dataset.origcard);
    if (o) openOrigCard(o);
  });

  view().querySelectorAll("[data-week]").forEach((b) => b.onclick = async () => {
    if (!reward || wf.claimed) return;
    store.flags = store.flags || {};
    store.flags.week = { key: wk, claimed: true };
    store.gold = (Number(store.gold) || 0) + reward.gold;
    addReceipt(store, "排行", "周榜奖励", { gold: reward.gold });
    await save(); render(); toast("周榜奖励 +" + reward.gold + " 金");
  });
}

// 📅 日常任务：每天 3 个，完成领金币，全勤额外奖励
// 成就进度（kind 对应 data.js 的 ACHIEVEMENTS）
function achProgress(a, ch) {
  const st = store, f = (st.flags || {});
  if (!ch) return 0;
  switch (a.kind) {
    case "lv": return Number(ch.lv) || 1;
    case "wins": return Number(f.wins) || 0;
    case "gold": return Number(st.gold) || 0;
    case "gearLv": return (st.items || []).reduce((m, it) => Math.max(m, Number((it.data || {}).lv) || 1), 1);
    case "gearStar": return (st.items || []).reduce((m, it) => Math.max(m, Number((it.data || {}).star) || 1), 1);
    case "items": return (st.items || []).length;
    case "breaks": return Number(ch.breaks) || 0;
    case "grade": return Math.max(0, GRADE.findIndex((g) => g.key === (ch.grade || "D")));
    case "apt": return Number(ch.apt) || 1;
  }
  return 0;
}

function renderDaily() {
  const d = dailyOf(store);
  const claimed = d.claimed || [];
  const allDone = DAILY_QUESTS.every((q) => (Number(d[q.key]) || 0) >= q.target);
  const rows = DAILY_QUESTS.map((q) => {
    const cur = Number(d[q.key]) || 0;
    const done = cur >= q.target;
    const got = claimed.indexOf(q.id) >= 0;
    return '<div class="row"><span class="k">' + q.name + '<div class="hint">进度 ' + Math.min(cur, q.target) + ' / ' + q.target + '</div></span>' +
      '<span class="v"><span style="color:#ffd666;">' + q.gold + ' 金</span> ' +
      (got ? '<span class="hint">已领取</span>' : '<button data-claim="' + q.id + '" ' + (done ? '' : 'disabled') + '>领取</button>') +
      '</span></div>';
  }).join("");
  const bonusHtml = allDone
    ? (d.bonus ? '<div class="hint" style="color:#7ee787;">全勤奖励已领取</div>'
               : '<div class="row"><span class="k">🏅 全勤奖励</span><span class="v"><span style="color:#ffd666;">' + DAILY_BONUS + ' 金</span> <button data-claim="bonus">领取</button></span></div>')
    : '<div class="hint">三个任务都完成后可领全勤奖励 ' + DAILY_BONUS + ' 金</div>';
  const ch = activeChar();
  const f = store.flags || {};
  const claimedAch = f.achClaimed || [];
  const mails = store.mail || [];
  const mailHtml = mails.length
    ? mails.map((m, i) => '<div class="row"><span class="k">📬 ' + esc(m.title) + '<div class="hint">' + esc(m.body) + '</div></span><span class="v">' +
        (m.claimed ? '<span class="hint">已领取</span>'
                   : '<span style="color:#ffd666;">' + (Number(m.gold) || 0) + ' 金</span> <button data-mail="' + i + '">领取</button>') + '</span></div>').join("")
    : '<div class="hint">没有邮件</div>';
  const achHtml = ACHIEVEMENTS.map((a) => {
    const cur = achProgress(a, ch);
    const done = cur >= a.value;
    const got = claimedAch.indexOf(a.id) >= 0;
    return '<div class="row"><span class="k">' + a.name + '<div class="hint">' + a.desc + '（' + Math.min(cur, a.value) + '/' + a.value + '）</div></span>' +
      '<span class="v"><span style="color:#ffd666;">' + a.gold + ' 金</span> ' +
      (got ? '<span class="hint">已领取</span>' : '<button data-ach="' + a.id + '" ' + (done ? '' : 'disabled') + '>领取</button>') + '</span></div>';
  }).join("");

  view().innerHTML = card("📅 日常任务 · " + d.day,
    '<div class="hint">每天 0 点重置（按本机日期）。</div>' + rows + bonusHtml) +
    card("📬 邮件", mailHtml) +
    card("🏅 成就（" + claimedAch.length + '/' + ACHIEVEMENTS.length + "）", achHtml);

  view().querySelectorAll("[data-mail]").forEach((b) => b.onclick = async () => {
    const m = mails[Number(b.dataset.mail)];
    if (!m || m.claimed) return;
    m.claimed = true;
    store.gold = (Number(store.gold) || 0) + (Number(m.gold) || 0);
    addReceipt(store, "邮件", m.title, { gold: Number(m.gold) || 0 });
    await save(); render(); toast("领取成功");
  });

  view().querySelectorAll("[data-ach]").forEach((b) => b.onclick = async () => {
    const a = ACHIEVEMENTS.find((x) => x.id === b.dataset.ach);
    if (!a) return;
    if (achProgress(a, ch) < a.value) return toast("还没达成", true);
    const cl = (store.flags.achClaimed = store.flags.achClaimed || []);
    if (cl.indexOf(a.id) >= 0) return;
    cl.push(a.id);
    store.gold = (Number(store.gold) || 0) + a.gold;
    addReceipt(store, "成就", a.name, { gold: a.gold });
    await save(); render(); toast("🏅 " + a.name + " +" + a.gold + " 金");
  });

  view().querySelectorAll("[data-claim]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.claim;
    if (id === "bonus") {
      if (d.bonus) return;
      d.bonus = 1;
      store.gold = (Number(store.gold) || 0) + DAILY_BONUS;
      addReceipt(store, "任务", "全勤奖励", { gold: DAILY_BONUS });
      await save(); render(); toast("全勤奖励 +" + DAILY_BONUS + " 金");
      return;
    }
    const q = DAILY_QUESTS.find((x) => x.id === id);
    if (!q) return;
    if ((Number(d[q.key]) || 0) < q.target) return toast("还没完成", true);
    if ((d.claimed || []).indexOf(id) >= 0) return;
    d.claimed = d.claimed || [];
    d.claimed.push(id);
    store.gold = (Number(store.gold) || 0) + q.gold;
    addReceipt(store, "任务", q.name, { gold: q.gold });
    await save(); render(); toast("任务奖励 +" + q.gold + " 金");
  });
}

// ⚒ 装备培养：强化 / 升星 / 继承（装备栏 + 仓库都能养）
function renderCult() {
  const ch = activeChar();
  if (!ch) { window.__creating = 1; buildCreateScreen(); return; }
  const entries = [];
  ["weapon", "armor", "armor2", "accessory"].forEach((k) => {
    const d = ch.equip && ch.equip[k];
    if (d) entries.push({ key: "eq:" + k, d, where: "已装备", id: null, lock: false });
  });
  (store.items || []).forEach((it) => {
    if (isEquip(it)) entries.push({ key: "it:" + it.id, d: it.data || {}, where: "仓库", id: it.id, lock: !!it.lock });
  });

  const resolve = (key) => (key.indexOf("eq:") === 0 ? { data: ch.equip[key.slice(3)] } : findItem(store, key.slice(3)));

  const row = (e) => {
    const it = resolve(e.key);
    if (!it || !it.data) return "";
    const chk = cultCheck(it, "level", store);
    const star = cultCheck(it, "star", store);
    const rc = RARITY_COLOR[e.d.rarity] || "#23233a";
    return '<div style="border:1px solid ' + rc + '66;border-radius:10px;padding:10px;margin:8px 0;">' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +

        '<span class="tag">' + (e.d.rarity || "") + ' · ' +
        (e.d.rarity === "UR" ? "🔥" + (Number(e.d.fire) || 1) : (e.d.star || 1) + "★") +
        ' · Lv' + (e.d.lv || 1) + ' · 精炼 ' + (Number(e.d.refine) || 1) + '</span>' +
        '<span class="tag">' + e.where + '</span></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">' +
        '<button data-cult2="' + e.key + '" ' + (chk.ok ? '' : 'disabled') + '>强化 +1' +

        '<button data-star2="' + e.key + '" ' + (star.ok ? '' : 'disabled') + '>' +

        (() => {

          return '<button data-refine2="' + e.key + '" ' + (rf.ok ? '' : 'disabled') + '>精炼 +1' +
            (rf.ok ? '（' + rf.gold + ' 金 / 碎片 ' + rf.shards + '）' : (Number(e.d.refine) >= 10 ? '（已满）' : '')) + '</button>';
        })() +
        (() => {
          const pm = promoteCheck(it, store);

          const next = order[i + 1];

  view().querySelectorAll("[data-star2]").forEach((b) => b.onclick = async () => {

    if (!r.ok) return toast(r.why, true);

  view().querySelectorAll("[data-inh]").forEach((b) => b.onclick = () => openInherit(b.dataset.inh));
  view().querySelectorAll("[data-promote]").forEach((b) => b.onclick = async () => {
    const it = resolve(b.dataset.promote);
    if (!it) return toast("找不到装备", true);
    const r = promoteApply(store, it);
    if (!r.ok) return toast(r.why, true);
    addReceipt(store, "升阶", it.data.name + " → " + r.next, { note: "品质提升" });
    await save(); render();

  view().querySelectorAll("[data-refine2]").forEach((b) => b.onclick = async () => {
    const it = resolve(b.dataset.refine2);

// ⚒ 原创角色培养（与玩家同构：强化 / 升星 / 精炼 / 升阶 / 觉醒）
function renderOrigCult() {
  if (!ORIGINALS.length) {
    view().innerHTML = card("⚒ 培养", '<div class="hint">还没有原创角色。</div>');
    return;
  }
  const selId = (window.__origSel && ORIGINALS.some((o) => o.id === window.__origSel)) ? window.__origSel : ORIGINALS[0].id;
  window.__origSel = selId;
  const o = ORIGINALS.find((x) => x.id === selId);
  if (!store) store = { v: 2, items: [], chars: [], orig: {}, gold: 0, exp: 0, flags: {} };
  if (!store.orig) store.orig = {};
  const prog = store.orig[o.id] || (store.orig[o.id] = { lv: 1, exp: 0, breaks: 0 });
  if (!prog.gear) prog.gear = {};
  const gg = ORIGINAL_GEAR[o.id] || {};
  const SLOTN = { weapon: "武器", armor: "上装", armor2: "下装", accessory: "饰品" };
  const tabs = ORIGINALS.map((x) => '<button data-osel="' + x.id + '"' + (x.id === selId ? ' class="on"' : '') + '>' + esc(x.name) + '</button>').join("");
  const res = '<div class="hint" style="margin-bottom:8px;">金币 ' + fmt(store.gold || 0) + ' · 强化石 ' + (store.flags.stone || 0) +
    ' · 碎片 ' + (store.flags.shards || 0) + ' · 突破石 ' + (store.flags.bstone || 0) + '</div>';
  const GI = { weapon: "🗡", armor: "🛡", armor2: "👖", accessory: "💍" };
  const body = Object.keys(SLOTN).map((slot) => {
    const it = gg[slot] || {};
    if (!it.name) return "";
    const gs = prog.gear[slot] || (prog.gear[slot] = { lv: 1, star: 1 });
    const lv = Number(gs.lv) || 1, star = Number(gs.star) || 1;
    const ref = Number(gs.refine) || 0, adv = Number(gs.advance) || 0, awk = Number(gs.awaken) || 0;
    const stN = Number(store.flags.stone) || 0, shN = Number(store.flags.shards) || 0;
    const bsN = Number(store.flags.bstone) || 0, gN = Number(store.gold) || 0;
    const cLv = { s: 3 + 2 * lv, g: 80 * lv }, cStar = { s: 10 * star, g: 300 * star };
    const cRef = { s: 5 + 3 * ref, g: 300 + 200 * ref }, cAdv = { s: 30 + 15 * adv, g: 2000 + 1200 * adv };
    const cAwk = { b: 20 + 15 * awk };
    const okLv = lv < ORIG_GEAR_CULT.maxLv && stN >= cLv.s && gN >= cLv.g;
    const okStar = star < ORIG_GEAR_CULT.maxStar && shN >= cStar.s && gN >= cStar.g;
    const okRef = shN >= cRef.s && gN >= cRef.g;
    const okAdv = adv < 5 && stN >= cAdv.s && gN >= cAdv.g;
    const okAwk = awk < 3 && bsN >= cAwk.b;
    return card((GI[slot] || "🗡") + " " + esc(it.name) + "（" + (it.rarity || "") + " · " + SLOTN[slot] + "）",
      '<div class="hint" style="margin-bottom:6px;">Lv' + lv + ' / ★' + star +
        (ref ? ' · 精炼 ' + ref : '') + (adv ? ' · ' + adv + ' 阶' : '') + (awk ? ' · 觉醒 ' + awk : '') + '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
        '<button data-og="' + slot + ':lv"' + (okLv ? '' : ' disabled') + '>强化 Lv' + lv + '→' + (lv + 1) + '</button>' +
        '<button data-og="' + slot + ':star"' + (okStar ? '' : ' disabled') + '>升星 ★' + star + '→' + (star + 1) + '</button>' +
        '<button data-og="' + slot + ':refine"' + (okRef ? '' : ' disabled') + '>精炼 ' + ref + '→' + (ref + 1) + '</button>' +
        '<button data-og="' + slot + ':advance"' + (okAdv ? '' : ' disabled') + '>升阶 ' + adv + '→' + (adv + 1) + '</button>' +
        '<button data-og="' + slot + ':awakenG"' + (okAwk ? '' : ' disabled') + '>觉醒 ' + awk + '→' + (awk + 1) + '</button>' +
      '</div>');
  }).join("");
  view().innerHTML = '<div class="tree-tabs">' + tabs + '</div>' + res + (body || card("⚒ 培养", '<div class="hint">这名角色还没有专属装备。</div>'));

  view().querySelectorAll("[data-osel]").forEach((b) => b.onclick = () => { window.__origSel = b.dataset.osel; render(); });
  view().querySelectorAll("[data-og]").forEach((b) => b.onclick = async () => {
    const parts = b.dataset.og.split(":");
    const slot = parts[0], act = parts[1];
    const gs = prog.gear[slot] || (prog.gear[slot] = { lv: 1, star: 1 });
    if (!store.flags) store.flags = {};
    const gold = () => Number(store.gold) || 0;
    if (act === "lv") {
      const lv = Number(gs.lv) || 1;
      if (lv >= ORIG_GEAR_CULT.maxLv) return toast("已满级", true);
      const cs = ORIG_GEAR_CULT.lvStone(lv), cg = ORIG_GEAR_CULT.lvGold(lv);
      if ((store.flags.stone || 0) < cs) return toast("强化石不足（需 " + cs + "）", true);
      if (gold() < cg) return toast("金币不足（需 " + cg + "）", true);
      store.flags.stone -= cs; store.gold -= cg; gs.lv = lv + 1;
    } else if (act === "star") {
      const star = Number(gs.star) || 1;
      if (star >= ORIG_GEAR_CULT.maxStar) return toast("已满星", true);
      const cs = ORIG_GEAR_CULT.starShards(star), cg = ORIG_GEAR_CULT.starGold(star);
      if ((store.flags.shards || 0) < cs) return toast("碎片不足（需 " + cs + "）", true);
      if (gold() < cg) return toast("金币不足（需 " + cg + "）", true);
      store.flags.shards -= cs; store.gold -= cg; gs.star = star + 1;
    } else if (act === "refine") {
      const n = Number(gs.refine) || 0;
      const cs = 5 + 3 * n, cg = 300 + 200 * n;
      if ((store.flags.shards || 0) < cs) return toast("碎片不足（需 " + cs + "）", true);
      if (gold() < cg) return toast("金币不足（需 " + cg + "）", true);
      store.flags.shards -= cs; store.gold -= cg; gs.refine = n + 1;
    } else if (act === "advance") {
      const n = Number(gs.advance) || 0;
      if (n >= 5) return toast("已满阶", true);
      const cs = 30 + 15 * n, cg = 2000 + 1200 * n;
      if ((store.flags.stone || 0) < cs) return toast("强化石不足（需 " + cs + "）", true);
      if (gold() < cg) return toast("金币不足（需 " + cg + "）", true);
      store.flags.stone -= cs; store.gold -= cg; gs.advance = n + 1;
    } else {
      const n = Number(gs.awaken) || 0;
      if (n >= 3) return toast("已满觉醒", true);
      const cb = 20 + 15 * n;
      if ((store.flags.bstone || 0) < cb) return toast("突破石不足（需 " + cb + "）", true);
      store.flags.bstone -= cb; gs.awaken = n + 1;
      if (!prog.bonus) prog.bonus = {};
      prog.bonus.ultPct = (Number(prog.bonus.ultPct) || 0) + 3;
    }
    await save(); render();
  });
}
