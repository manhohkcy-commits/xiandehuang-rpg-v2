// 🏆 排行榜：读云端存档，按战力排序（前 20）
async function renderRank() {
  view().innerHTML = '<div class="card"><div class="card-title">🏆 排行榜</div><div class="hint">读取云端存档中…</div></div>';
  let rows = [];
  try { rows = await cloudList(200); } catch (e) { rows = []; }
  const candidates = rows
    .filter((r) => r && r.store && Number(r.store.v) === 2 && String(r.box).indexOf("__") !== 0)
    .map((r) => {
      const st = r.store;
      const chars = st.chars || [];
      const ch = chars.find((c) => c.id === st.activeChar) || chars[0];
      return ch ? {
        box: String(r.box), name: ch.name || "无名", lv: Number(ch.lv) || 1,
        power: charPower(ch), grade: gradeOf(ch).key, color: gradeOf(ch).color
      } : null;
    })
    .filter(Boolean);
  // 同名合并：保留战力最高的一个，避免同一角色重复占榜
  const map = new Map();
  candidates.forEach((r) => {
    const prev = map.get(r.name);
    if (!prev) { map.set(r.name, Object.assign({ dup: 1 }, r)); }
    else if (r.power > prev.power) { map.set(r.name, Object.assign({ dup: prev.dup + 1 }, r)); }
    else { prev.dup += 1; }
  });
  const players = Array.from(map.values()).sort((a, b) => b.power - a.power);
  // 🧬 原创角色并入「可游玩角色」总榜
  // 每次渲染都重新取主机存档的原创进度（不缓存，避免显示旧值）
  {
    let progMap = (store.orig || {});
    try {
      const hr = await cloudGet(HOST_BOX || "zynSD117");
      const hp = hr && hr.store && hr.store.orig;
      if (hp && Object.keys(hp).length) progMap = hp;
    } catch (e) {}
    if (!Object.keys(progMap).length && window.__ORIG_PROG) progMap = window.__ORIG_PROG;
    window.__ORIG_PROG = progMap;
  }
  const origs = ORIGINALS.map((o) => {
    const prog = (window.__ORIG_PROG || {})[o.id] || (store.orig || {})[o.id] || {};
    return {
      type: "orig", id: o.id, name: prog.name || o.name, title: o.title || "", role: o.role || "", rare: !!o.rare,
      power: originalFinal(o, prog).power,
      lv: Number(prog.lv) || 1,
      color: (function () { const gv = prog.grade; const g = (typeof gv === "number") ? GRADE[gv] : (GRADE.find((x) => x.key === gv) || GRADE[0]); return (g || GRADE[0]).color || "#ffb347"; })()
    };
  });
  const all = players.map((r) => Object.assign({ type: "player" }, r)).concat(origs).sort((a, b) => b.power - a.power);
  const top = all.slice(0, 20);

  const meBox = box;
  const myRank = all.findIndex((r) => r.type === "player" && r.box === meBox) + 1;
  const wk = (() => {
    const d = new Date();
    const one = new Date(d.getFullYear(), 0, 1);
    const days = Math.floor((d - one) / 86400000);
    const w = Math.ceil((days + one.getDay() + 1) / 7);
    return d.getFullYear() + "-W" + String(w).padStart(2, "0");
  })();
  const reward = WEEK_REWARD.find((x) => myRank > 0 && myRank <= x.maxRank);
  const wf = (store.flags && store.flags.week && store.flags.week.key === wk) ? store.flags.week : { key: wk, claimed: false };

  const weekHtml = '<div class="row" style="margin-top:8px;"><span class="k">本周排名</span><span class="v">' + (myRank ? "#" + myRank : "未上榜") + '</span></div>' +
    (reward
      ? '<div class="row"><span class="k">周榜奖励</span><span class="v"><span style="color:#ffd666;">' + reward.gold + ' 金</span> ' +
        (wf.claimed ? '<span class="hint">本周已领</span>' : '<button data-week="1">领取</button>') + '</span></div>'
      : '<div class="hint">进前 10 名可领周榜奖励（每周一次）</div>');

  view().innerHTML =
    card("🏆 可游玩角色 · 战力榜",
      '<div class="hint" style="margin-bottom:6px;">包含玩家自创角色（🧑）与原创角色（🧬），按综合战力排序。点原创角色可查看完整面板。</div>' +
  '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">' +
    '<button id="btnRankRefresh" style="font-size:11px;border-color:#6ea8fe;color:#cfe6ff;">🔄 刷新榜单</button>' +
    '<span class="hint">最后更新 ' + new Date().toLocaleTimeString("zh-CN", { hour12: false }) + '</span>' +
  '</div>' +
      (top.length
        ? '<table style="width:100%;border-collapse:collapse;">' +
          '<tr style="color:#8a8ab0;font-size:10.5px;text-align:left;"><th style="padding:4px 2px;">#</th><th>名字</th><th>类型</th><th>等级</th><th style="text-align:right;">战力</th></tr>' +
          top.map((r, i) => {
            const isOrig = r.type === "orig";
            const nameCell = isOrig
              ? '<b style="color:' + (r.color || "#ffb347") + ';">' + esc(r.name) + '</b> <span class="tag" style="border-color:#ffb347;color:#ffb347;">原创</span>' + (r.rare ? ' <span class="tag">稀有</span>' : '')
              : '<b style="color:' + r.color + ';">' + esc(r.name) + '</b>' + (r.dup > 1 ? ' <span class="hint">同名 ×' + r.dup + '</span>' : '');
            return '<tr' + (isOrig ? ' data-origcard="' + r.id + '"' : ' data-rankbox="' + r.box + '"') + ' style="border-top:1px dashed #23233a;cursor:pointer;' +
              (r.type === "player" && r.box === meBox ? "background:#1b2740;" : "") + '">' +
              '<td style="padding:6px 2px;font-size:11px;color:' + (i < 3 ? "#ffd666" : "#8a8ab0") + ';">' + (i + 1) + '</td>' +
              '<td style="font-size:12.5px;">' + nameCell + '</td>' +
              '<td style="font-size:10.5px;color:' + (isOrig ? "#ffb347" : "#6ea8fe") + ';">' + (isOrig ? "🧬 原创" : "🧑 玩家") + '</td>' +
        '<td style="font-size:11px;color:#8a8ab0;">Lv' + (r.lv || 1) + '</td>' +
              '<td style="text-align:right;font-size:12px;color:' + (isOrig ? "#ffb347" : "#6ea8fe") + ';font-weight:700;">' + fmt(r.power) + '</td></tr>';
          }).join("") +
          '</table>'
        : '<div class="hint">还没有可排行的角色（或云端暂时不可用）。</div>') +
      weekHtml +
      '<div class="hint" style="margin-top:8px;">玩家角色只统计最近更新的 200 个位号；原创角色来自主机发布。</div>');

  view().querySelectorAll("[data-rankbox]").forEach((tr) => tr.onclick = async () => {
    const bx = tr.dataset.rankbox;
    try {
      const row = await cloudGet(bx);
      const s = row && row.store;
      const ch2 = s && ((s.chars || []).find((x) => x.id === s.activeChar) || (s.chars || [])[0]);
      if (!ch2) return toast("读不到该角色", true);
      openCharPanel(ch2);
    } catch (e) { toast("读取失败：" + (e && e.message || e), true); }
  });
  view().querySelectorAll("[data-origcard]").forEach((tr) => tr.onclick = () => {
    const o = ORIGINALS.find((x) => x.id === tr.dataset.origcard);
    if (o) openOrigCard(o);
  });

  if ($("btnRankRefresh")) $("btnRankRefresh").onclick = () => renderRank();
  view().querySelectorAll("[data-week]").forEach((b) => b.onclick = async () => {
    if (!reward || wf.claimed) return;
    store.flags = store.flags || {};
    store.flags.week = { key: wk, claimed: true };
    store.gold = (Number(store.gold) || 0) + reward.gold;
    addReceipt(store, "排行", "周榜奖励", { gold: reward.gold });
    await save(); render(); toast("周榜奖励 +" + reward.gold + " 金");
  });
}

// 📅 日常任务：每天 3 个，完成领金币，全勤额外奖励
// 成就进度（kind 对应 data.js 的 ACHIEVEMENTS）
function achProgress(a, ch) {
  const st = store, f = (st.flags || {});
  if (!ch) return 0;
  switch (a.kind) {
    case "lv": return Number(ch.lv) || 1;
    case "wins": return Number(f.wins) || 0;
    case "gold": return Number(st.gold) || 0;
    case "gearLv": return (st.items || []).reduce((m, it) => Math.max(m, Number((it.data || {}).lv) || 1), 1);
    case "gearStar": return (st.items || []).reduce((m, it) => Math.max(m, Number((it.data || {}).star) || 1), 1);
    case "items": return (st.items || []).length;
    case "breaks": return Number(ch.breaks) || 0;
    case "grade": return Math.max(0, GRADE.findIndex((g) => g.key === (ch.grade || "D")));
    case "apt": return Number(ch.apt) || 1;
  }
  return 0;
}

function renderDaily() {
  const d = dailyOf(store);
  const claimed = d.claimed || [];
  const allDone = DAILY_QUESTS.every((q) => (Number(d[q.key]) || 0) >= q.target);
  const rows = DAILY_QUESTS.map((q) => {
    const cur = Number(d[q.key]) || 0;
    const done = cur >= q.target;
    const got = claimed.indexOf(q.id) >= 0;
    return '<div class="row"><span class="k">' + q.name + '<div class="hint">进度 ' + Math.min(cur, q.target) + ' / ' + q.target + '</div></span>' +
      '<span class="v"><span style="color:#ffd666;">' + q.gold + ' 金</span> ' +
      (got ? '<span class="hint">已领取</span>' : '<button data-claim="' + q.id + '" ' + (done ? '' : 'disabled') + '>领取</button>') +
      '</span></div>';
  }).join("");
  const bonusHtml = allDone
    ? (d.bonus ? '<div class="hint" style="color:#7ee787;">全勤奖励已领取</div>'
               : '<div class="row"><span class="k">🏅 全勤奖励</span><span class="v"><span style="color:#ffd666;">' + DAILY_BONUS + ' 金</span> <button data-claim="bonus">领取</button></span></div>')
    : '<div class="hint">三个任务都完成后可领全勤奖励 ' + DAILY_BONUS + ' 金</div>';
  const ch = activeChar();
  const f = store.flags || {};
  const claimedAch = f.achClaimed || [];
  const mails = store.mail || [];
  const mailHtml = mails.length
    ? mails.map((m, i) => '<div class="row"><span class="k">📬 ' + esc(m.title) + '<div class="hint">' + esc(m.body) + '</div></span><span class="v">' +
        (m.claimed ? '<span class="hint">已领取</span>'
                   : '<span style="color:#ffd666;">' + (Number(m.gold) || 0) + ' 金</span> <button data-mail="' + i + '">领取</button>') + '</span></div>').join("")
    : '<div class="hint">没有邮件</div>';
  const achHtml = ACHIEVEMENTS.map((a) => {
    const cur = achProgress(a, ch);
    const done = cur >= a.value;
    const got = claimedAch.indexOf(a.id) >= 0;
    return '<div class="row"><span class="k">' + a.name + '<div class="hint">' + a.desc + '（' + Math.min(cur, a.value) + '/' + a.value + '）</div></span>' +
      '<span class="v"><span style="color:#ffd666;">' + a.gold + ' 金</span> ' +
      (got ? '<span class="hint">已领取</span>' : '<button data-ach="' + a.id + '" ' + (done ? '' : 'disabled') + '>领取</button>') + '</span></div>';
  }).join("");

  view().innerHTML = card("📅 日常任务 · " + d.day,
    '<div class="hint">每天 0 点重置（按本机日期）。</div>' + rows + bonusHtml) +
    card("📬 邮件", mailHtml) +
    card("🏅 成就（" + claimedAch.length + '/' + ACHIEVEMENTS.length + "）", achHtml);

  view().querySelectorAll("[data-mail]").forEach((b) => b.onclick = async () => {
    const m = mails[Number(b.dataset.mail)];
    if (!m || m.claimed) return;
    m.claimed = true;
    store.gold = (Number(store.gold) || 0) + (Number(m.gold) || 0);
    addReceipt(store, "邮件", m.title, { gold: Number(m.gold) || 0 });
    await save(); render(); toast("领取成功");
  });

  view().querySelectorAll("[data-ach]").forEach((b) => b.onclick = async () => {
    const a = ACHIEVEMENTS.find((x) => x.id === b.dataset.ach);
    if (!a) return;
    if (achProgress(a, ch) < a.value) return toast("还没达成", true);
    const cl = (store.flags.achClaimed = store.flags.achClaimed || []);
    if (cl.indexOf(a.id) >= 0) return;
    cl.push(a.id);
    store.gold = (Number(store.gold) || 0) + a.gold;
    addReceipt(store, "成就", a.name, { gold: a.gold });
    await save(); render(); toast("🏅 " + a.name + " +" + a.gold + " 金");
  });
}

function renderCult() {
  const ch = activeChar();
  if (!ch) { window.__creating = 1; buildCreateScreen(); return; }
  const entries = [];
  ["weapon", "armor", "armor2", "accessory"].forEach((k) => {
    const d = ch.equip && ch.equip[k];
    if (d) entries.push({ key: "eq:" + k, d, where: "已装备", id: null, lock: false });
  });
  (store.items || []).forEach((it) => {
    if (isEquip(it)) entries.push({ key: "it:" + it.id, d: it.data || {}, where: "仓库", id: it.id, lock: !!it.lock });
  });
  const resolve = (key) => {
    if (key.indexOf("eq:") === 0) {
      const slot = key.slice(3);
      const raw = ch.equip[slot];
      if (!raw) return null;
      const d = raw.data ? raw.data : raw;
      return { id: raw.id || ("eq_" + slot), cat: raw.cat || (slot === "armor2" ? "armor" : slot), data: d, __eq: true, __slot: slot };
    }
    const it = findItem(store, key.slice(3));
    if (it && it.data && it.data.data) return { id: it.id, cat: it.cat, data: it.data.data };
    return it;
  };
  const row = (e) => {
    const it = resolve(e.key);
    if (!it || !it.data) return "";
    const chk = cultCheck(it, "level", store);
    const star = cultCheck(it, "star", store);
    const rc = RARITY_COLOR[e.d.rarity] || "#23233a";
    const bt = Number(e.d.bt) || 0;
    const cap = 25 + bt * 25;
    const bkCfg = (CULT.eqBreak || [])[bt];
    const canBk = bkCfg && bt < 5 && (Number(e.d.lv) || 1) >= cap && (Number(store.flags.stone) || 0) >= bkCfg.stone && (Number(store.gold) || 0) >= bkCfg.gold;
    return '<div style="border:1px solid ' + rc + '66;border-radius:10px;padding:10px;margin:8px 0;">' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
      '<span style="font-weight:600;cursor:pointer;text-decoration:underline dotted;color:' + rc + ';" data-cultdetail="' + e.key + '">' + esc(e.d.name || "装备") + '</span>' +
      '<span class="tag">' + (e.d.rarity || "") + ' · ' + (e.d.rarity === "UR" ? "🔥" + (Number(e.d.fire) || 1) : (e.d.star || 1) + "★") + ' · Lv' + (e.d.lv || 1) + ' / 上限 ' + cap + '（突破 ' + bt + '/5）</span>' +
      '<span class="tag">' + e.where + '</span></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">' +
      '<button data-cult2="' + e.key + '"' + (chk.ok ? '' : ' style="opacity:.45;"') + '>强化 +1' + (chk.ok ? '（' + chk.gold + ' 金 / ' + chk.stone + ' 石）' : '（' + (chk.why || '') + '）') + '</button>' +
      (bkCfg ? '<button data-brk2="' + e.key + '"' + (canBk ? '' : ' style="opacity:.45;"') + '>突破（上限 → ' + (25 + (bt + 1) * 25) + ' · 强化石 ' + bkCfg.stone + ' / 金 ' + fmt(bkCfg.gold) + '）</button>' : '') +
      '<button data-star2="' + e.key + '"' + (star.ok ? '' : ' style="opacity:.45;"') + '>' + (star.ok ? '升星 → ' + star.to + '★（' + (star.rarity || '') + ' 碎片 ' + star.shards + '）' : (star.why || '已满星')) + '</button>' +
      '<button disabled style="opacity:.45;">精炼（未开放）</button>' +
      (() => {
        const pm = promoteCheck(it, store);
        const order = ["R", "SR", "SSR", "UR"];
        const i2 = order.indexOf(e.d.rarity);
        if (e.d.rarity === "UR") return "";
        if ((Number(e.d.star) || 1) < 5 || i2 < 0) return "";
        const next = order[i2 + 1];
        const label = next === "UR" ? "⬆️ 升阶 → UR1🔥" : "⬆️ 升阶 → " + next;
        return '<button data-promote="' + e.key + '"' + (pm.ok ? '' : ' style="opacity:.45;"') + ' style="border-color:#ffb347;color:#ffb347;">' + label + (pm.ok ? '（碎片 ' + pm.shards + ' / ' + pm.gold + ' 金）' : '') + '</button>';
      })() +
      (e.id && !e.lock ? '<button data-inh="' + e.id + '">🔁 继承到…</button>' : '') +
      '</div></div>';
  };
  view().innerHTML = card("⚒ 装备培养",
    '<div class="hint">强化 Lv1~150（每 25 级一次突破）、升星 1~5★、升阶、继承同部位。装备栏里的也能直接培养。</div>' +
    (entries.length ? entries.map(row).join('') : '<div class="hint">还没有装备。</div>')) + synthHtml();
  const act = async (key, kind) => {
    try {
      const it = resolve(key);
      if (!it || !it.data) return toast("找不到装备", true);
      const r = cultApply(store, it, kind);
      if (!r || !r.ok) return toast((r && r.why) || "无法执行", true);
      if (kind === "level") { bumpDaily(store, "cults"); addReceipt(store, "培养", it.data.name + " → Lv" + r.lv); }
      else addReceipt(store, "装备突破", it.data.name + " → 上限 " + r.cap, { gold: -r.gold });
      await save(); render();
      if (kind === "break") toast("🔓 突破成功：强化上限 " + r.cap);
    } catch (err) { toast("出错：" + (err && err.message || err), true); }
  };
  view().querySelectorAll("[data-cult2]").forEach((b) => b.onclick = () => act(b.dataset.cult2, "level"));

  view().querySelectorAll("[data-brk2]").forEach((b) => b.onclick = async () => {
    const it = resolve(b.dataset.brk2);
    if (!it) return toast("找不到装备", true);
    const r = cultApply(store, it, "break");
    if (!r.ok) return toast(r.why, true);
    addReceipt(store, "装备突破", it.data.name + " → 上限 " + r.cap, { gold: -r.gold });
    await save(); render();
    toast("🔓 突破成功：强化上限 " + r.cap);
  });
  view().querySelectorAll("[data-star2]").forEach((b) => b.onclick = async () => {
    const it = resolve(b.dataset.star2);
    if (!it) return toast("找不到装备", true);
    const r = cultApply(store, it, "star");
    if (!r.ok) return toast(r.why, true);
    bumpDaily(store, "cults");
    await save(); render();
  });
  view().querySelectorAll("[data-inh]").forEach((b) => b.onclick = () => openInherit(b.dataset.inh));
  view().querySelectorAll("[data-promote]").forEach((b) => b.onclick = async () => {
    const it = resolve(b.dataset.promote);
    if (!it) return toast("找不到装备", true);
    const r = promoteApply(store, it);
    if (!r.ok) return toast(r.why, true);
    addReceipt(store, "升阶", it.data.name + " → " + r.next, { note: "品质提升" });
    await save(); render();
    toast("⬆️ 升阶成功：" + r.next + "（保持 5★）");
  });
  view().querySelectorAll("[data-refine2]").forEach((b) => b.onclick = async () => {
    const it = resolve(b.dataset.refine2);
    if (!it) return toast("找不到装备", true);
    const r = refineApply(store, it);
    if (!r.ok) return toast(r.why, true);
    addReceipt(store, "精炼", it.data.name + " → 精炼 " + r.refine);
    await save(); render();
    toast("🔧 精炼成功：Lv" + r.refine);
  });
  // 材料合成卡由 renderCult 统一渲染，这里不再重新赋值
  view().querySelectorAll("[data-travel]").forEach((b) => b.onclick = async () => {
    if (!travelerOpen()) return toast("旅商还没开摊", true);
    const stock = travelerStock();
    const it = stock.find((x) => x.key === b.dataset.travel);
    if (!it) return toast("货品已轮换", true);
    const day = new Date().toISOString().slice(0, 10);
    store.flags.travelerBuys = store.flags.travelerBuys || {};
    const bought = store.flags.travelerBuys[day] = store.flags.travelerBuys[day] || {};
    if (bought[it.key]) return toast("今天已经买过了", true);
    if ((Number(store.gold) || 0) < it.price) return toast("金币不够", true);
    store.gold -= it.price;
    store.items.push(makeItem(it.cat, it.def));
    bought[it.key] = 1;
    addReceipt(store, "旅商", it.def.name, { gold: -it.price });
    await save(); render();
    toast("🛒 买到 " + it.def.name);
  });
  view().querySelectorAll("[data-synth]").forEach((b) => b.onclick = async () => {
    const [a, b2] = b.dataset.synth.split(">");
    const f = (store.flags = store.flags || {});
    const have = Number(f[a]) || 0;
    if (have < 3) return toast("数量不足", true);
    f[a] = have - 3;
    f[b2] = (Number(f[b2]) || 0) + 1;
    await save(); render();
    toast("🧪 合成成功");
  });
  view().querySelectorAll("[data-cultdetail]").forEach((b) => b.onclick = () => {
    const key = b.dataset.cultdetail;
    if (key.indexOf("eq:") === 0) {
      const k = key.slice(3);
      if (ch.equip[k]) showItemDetail({ cat: k, data: ch.equip[k] });
    } else {
      const it = findItem(store, key.slice(3));
      if (it) showItemDetail(it);
    }
  });
}

// ⚒ 原创角色培养（与玩家同构：强化 / 升星 / 精炼 / 升阶 / 觉醒）

// 🧪 材料合成：3 低档 → 1 高档
const SYNTH_PAIRS = [
  ["ms1", "ms2", "初级手稿", "中级手稿"],
  ["ms2", "ms3", "中级手稿", "高级手稿"],
  ["md1", "md2", "青铜勋章", "白银勋章"],
  ["md2", "md3", "白银勋章", "黄金勋章"],
  ["cert1", "cert2", "新手突破证书", "入门突破证书"],
  ["cert2", "cert3", "入门突破证书", "精英突破证书"],
  ["cert3", "cert4", "精英突破证书", "大师突破证书"]
];
function synthHtml() {
  const f = store.flags || {};
  const rows = SYNTH_PAIRS.map(([a, b, na, nb]) => {
    const have = Number(f[a]) || 0;
    return '<div class="row"><span class="k">' + na + ' ×3 → ' + nb + ' ×1</span><span class="v">' +
      '<span class="hint">有 ' + have + '</span> <button data-synth="' + a + '>' + b + '" ' + (have >= 3 ? '' : 'disabled') + '>合成</button></span></div>';
  }).join("");
  return card("🧪 材料合成", rows + '<div class="hint">低档材料可 3:1 合成为高档，不会浪费。</div>');
}

function renderOrigCult() {
  if (!ORIGINALS.length) {
    view().innerHTML = card("⚒ 培养", '<div class="hint">还没有原创角色。</div>');
    return;
  }
  const selId = (window.__origSel && ORIGINALS.some((o) => o.id === window.__origSel)) ? window.__origSel : ORIGINALS[0].id;
  window.__origSel = selId;
  const o = ORIGINALS.find((x) => x.id === selId);
  if (!store) store = { v: 2, items: [], chars: [], orig: {}, gold: 0, exp: 0, flags: {} };
  if (!store.orig) store.orig = {};
  const prog = store.orig[o.id] || (store.orig[o.id] = { lv: 1, exp: 0, breaks: 0 });
  if (!prog.gear) prog.gear = {};
  const gg = ORIGINAL_GEAR[o.id] || {};
  const SLOTN = { weapon: "武器", armor: "上装", armor2: "下装", accessory: "饰品" };
  const tabs = ORIGINALS.map((x) => '<button data-osel="' + x.id + '"' + (x.id === selId ? ' class="on"' : '') + '>' + esc(x.name) + '</button>').join("");
  const res = '<div class="hint" style="margin-bottom:8px;">金币 ' + fmt(store.gold || 0) + ' · 强化石 ' + (store.flags.stone || 0) +
    ' · 碎片 ' + (store.flags.shards || 0) + ' · 突破石 ' + (store.flags.bstone || 0) + ' · 证书 ' + matTotal("cert") + '</div>';
  const GI = { weapon: "🗡", armor: "🛡", armor2: "👖", accessory: "💍" };
  const body = Object.keys(SLOTN).map((slot) => {
    const it = gg[slot] || {};
    if (!it.name) return "";
    const gs = prog.gear[slot] || (prog.gear[slot] = { lv: 1, star: 1 });
    const lv = Number(gs.lv) || 1, star = Number(gs.star) || 1;
    const ref = Number(gs.refine) || 0, adv = Number(gs.advance) || 0, awk = Number(gs.awaken) || 0;
    const SHARD_KEY = { R: "shardR", SR: "shardSR", SSR: "shardSSR", UR: "shardSSR" };
  const shardKey = SHARD_KEY[it.rarity] || "shardSR";
  const shN = Number(store.flags[shardKey]) || 0;
  const refN = Number(store.flags.refineStone) || 0;
  const stN = Number(store.flags.stone) || 0;
    const bsN = matTotal("cert") || 0, gN = Number(store.gold) || 0;
    const _bt = Number((prog.gear && prog.gear[slot] && prog.gear[slot].bt) || 0);
    const _cap = 25 + _bt * 25;
    const cLv = { s: 2 + 2 * lv, g: 60 * lv }, cStar = { s: 60 * star, g: 300 * star };
    const BREAK_G = [{ s: 18, g: 3000 }, { s: 45, g: 8000 }, { s: 75, g: 16000 }, { s: 115, g: 30000 }, { s: 165, g: 50000 }];
    const cBtk = BREAK_G[_bt] || null;
    const bsN2 = Number(store.flags.bstone) || 0;
    const okBtk = !!cBtk && lv >= _cap && bsN2 >= cBtk.s && gN >= cBtk.g;
    const cRef = { r: 2 + ref, g: 300 + 200 * ref };
  const ADV_COST = { R: { s: 200, g: 2000 }, SR: { s: 500, g: 6000 }, SSR: { s: 1200, g: 18000 }, UR: { s: 1200, g: 18000 } };
  const cAdv = ADV_COST[it.rarity || "SSR"] || ADV_COST.SSR;
    const cAwk = { s: [150, 250, 400][awk] || 400, k: [3, 5, 8][awk] || 8 };   // UC 觉醒：碎片 + 觉醒石
    const okLv = lv < _cap && stN >= cLv.s && gN >= cLv.g;
    const okStar = star < ORIG_GEAR_CULT.maxStar && shN >= cStar.s && gN >= cStar.g;
    const okRef = refN >= cRef.r && gN >= cRef.g;
    const okAdv = adv < 1 && shN >= cAdv.s && gN >= cAdv.g;
    const awkN = Number(store.flags.awakenStone) || 0;
  const okAwk = adv >= 1 && awk < 3 && shN >= cAwk.s && awkN >= cAwk.k;
    return card((GI[slot] || "🗡") + " " + esc(it.name) + "（" + (it.rarity || "") + " · " + SLOTN[slot] + "）",
      '<div class="hint" style="margin-bottom:6px;">Lv' + lv + ' / 上限 ' + _cap + '（突破 ' + _bt + '/5） / ★' + star +
        (ref ? ' · 精炼 ' + ref : '') + (adv ? ' · ' + adv + ' 阶' : '') + (awk ? ' · 觉醒 ' + awk : '') + '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
        '<button data-og="' + slot + ':lv"' + (okLv ? '' : ' disabled style="opacity:.45;"') + '>强化 Lv' + lv + '→' + (lv + 1) +
          '（强化石 ' + cLv.s + ' / 金 ' + fmt(cLv.g) + '）</button>' +
        (cBtk ? '<button data-og="' + slot + ':breakG"' + (okBtk ? '' : ' disabled style="opacity:.45;"') + '>突破（上限 → ' + (25 + (_bt + 1) * 25) + ' · 突破石 ' + cBtk.s + ' / 金 ' + fmt(cBtk.g) + '）</button>' : '') +
        '<button data-og="' + slot + ':star"' + (okStar ? '' : ' disabled style="opacity:.45;"') + '>升星 ★' + star + '→' + (star + 1) +
          '（' + ({ shardR: "R", shardSR: "SR", shardSSR: "SSR" })[shardKey] + '碎片 ' + cStar.s + ' / 金 ' + fmt(cStar.g) + '）</button>' +
        '<button disabled style="opacity:.45;">精炼（未开放）</button>' +
        '<button data-og="' + slot + ':advance"' + (okAdv ? '' : ' disabled style="opacity:.45;"') + (adv >= 1 ? '>升阶 已完成' : '>升阶 ' + (it.rarity || "SSR") + '→UR') +
          '（' + ({ shardR: "R", shardSR: "SR", shardSSR: "SSR" })[shardKey] + '碎片 ' + cAdv.s + ' / 金 ' + fmt(cAdv.g) + '）</button>' +
        '<button data-og="' + slot + ':awakenG"' + (okAwk ? '' : ' disabled style="opacity:.45;"') + '>觉醒 ' + awk + '→' + (awk + 1) + (adv < 1 ? '（先升阶到 UR）' : '（' + ({ shardR: "R", shardSR: "SR", shardSSR: "SSR" })[shardKey] + '碎片 ' + cAwk.s + ' + 觉醒石 ' + cAwk.k + '）') + '</button>' +
      '</div>');
  }).join("");
  view().innerHTML = '<div class="tree-tabs">' + tabs + '</div>' + res + (body || card("⚒ 培养", '<div class="hint">这名角色还没有专属装备。</div>'));

  view().querySelectorAll("[data-osel]").forEach((b) => b.onclick = () => { window.__origSel = b.dataset.osel; render(); });
  view().querySelectorAll("[data-og]").forEach((b) => b.onclick = async () => {
    const parts = b.dataset.og.split(":");
    const _gdef = (ORIGINAL_GEAR[o.id] || o.gearObj || {})[parts[0]] || {};
    const _sKey = ({ R: "shardR", SR: "shardSR", SSR: "shardSSR", UR: "shardSSR" })[_gdef.rarity || "SSR"] || "shardSR";
    const _sHave = () => Number(store.flags[_sKey]) || 0;
    const slot = parts[0], act = parts[1];
    const gs = prog.gear[slot] || (prog.gear[slot] = { lv: 1, star: 1 });
    if (!store.flags) store.flags = {};
    const gold = () => Number(store.gold) || 0;
    if (act === "breakG") {
      const bt = Number(gs.bt) || 0;
      const list = [{ s: 18, g: 3000 }, { s: 45, g: 8000 }, { s: 75, g: 16000 }, { s: 115, g: 30000 }, { s: 165, g: 50000 }];
      const cfg = list[bt];
      if (!cfg) return toast("突破已满（Lv150）", true);
      if ((Number(gs.lv) || 1) < 25 + bt * 25) return toast("先强化到当前上限", true);
      if ((Number(store.flags.bstone) || 0) < cfg.s) return toast("突破石不足（需 " + cfg.s + "）", true);
      if (gold() < cfg.g) return toast("金币不足", true);
      store.flags.bstone -= cfg.s; store.gold -= cfg.g; gs.bt = bt + 1;
      await save(); render(); toast("🔓 突破成功：上限 " + (25 + (bt + 1) * 25));
      return;
    }
    if (act === "lv") {
      const lv = Number(gs.lv) || 1;
      if (lv >= ORIG_GEAR_CULT.maxLv) return toast("已满级", true);
      const cs = ORIG_GEAR_CULT.lvStone(lv), cg = ORIG_GEAR_CULT.lvGold(lv);
      if (((store.flags.stone || 0) < cs)) return toast("强化石不足（需 " + cs + "）", true);
      if (gold() < cg) return toast("金币不足（需 " + cg + "）", true);
      store.flags.stone -= cs; store.gold -= cg; gs.lv = lv + 1;
    } else if (act === "star") {
      const star = Number(gs.star) || 1;
      if (star >= ORIG_GEAR_CULT.maxStar) return toast("已满星", true);
      const cs = ORIG_GEAR_CULT.starShards(star), cg = ORIG_GEAR_CULT.starGold(star);
      if (_sHave() < cs) return toast("碎片不足（需 " + cs + "）", true);
      if (gold() < cg) return toast("金币不足（需 " + cg + "）", true);
      store.flags[_sKey] = _sHave() - cs; store.gold -= cg; gs.star = star + 1;
    } else if (act === "refine") {
      const n = Number(gs.refine) || 0;
      const cs = 5 + 3 * n, cg = 300 + 200 * n;
      if (_sHave() < cs) return toast("碎片不足（需 " + cs + "）", true);
      if (gold() < cg) return toast("金币不足（需 " + cg + "）", true);
      store.flags[_sKey] = _sHave() - cs; store.gold -= cg; gs.refine = n + 1;
    } else if (act === "advance") {
      const n = Number(gs.advance) || 0;
      if (n >= 1) return toast("已升阶", true);
      const _advTable = { R: { s: 200, g: 2000 }, SR: { s: 500, g: 6000 }, SSR: { s: 1200, g: 18000 }, UR: { s: 1200, g: 18000 } };
      const _advNow = _advTable[_gdef.rarity || "SSR"] || _advTable.SSR;
      const cs = _advNow.s, cg = _advNow.g;
      if (_sHave() < cs) return toast("碎片不足（需 " + cs + "）", true);
      if (gold() < cg) return toast("金币不足（需 " + cg + "）", true);
      store.flags[_sKey] = _sHave() - cs; store.gold -= cg; gs.advance = n + 1;
    } else {
      const n = Number(gs.awaken) || 0;
      if ((Number(gs.advance) || 0) < 1) return toast("先升阶到 UR 才能觉醒", true);
      if (n >= 3) return toast("已满觉醒", true);
      const cbS = [150, 250, 400][n] || 400, cbK = [3, 5, 8][n] || 8;
      if (_sHave() < cbS) return toast("碎片不足（需 " + cbS + "）", true);
      const awN = Number(store.flags.awakenStone) || 0;
      if (awN < cbK) return toast("觉醒石不足（需 " + cbK + "，暂未开放产出）", true);
      store.flags[_sKey] = _sHave() - cbS;
      store.flags.awakenStone = awN - cbK;
      gs.awaken = n + 1;
      if (!prog.bonus) prog.bonus = {};
      prog.bonus.ultPct = (Number(prog.bonus.ultPct) || 0) + 3;
    }
    await save(); render();
  });
}

// 📊 原创角色属性加成明细
function origBreakdown(o, prog) {
  const s = o.stats || {};
  const lv = Number(prog.lv) || 1, br = Math.min(5, Number(prog.breaks) || 0);
  const gi = Math.max(0, Math.min(GRADE.length - 1, Number(prog.grade) || 0));
  const ai = Math.max(1, Math.min(APTITUDE.length, Number(prog.apt) || 1));
  const lvk = (1 + 0.04 * (lv - 1)) * (1 + 0.03 * br);
  const gm = (GRADE[gi].mult || 1) * ((APTITUDE[ai - 1] || {}).mult || 1);
  {
    const _allowGrow = Math.floor((Number(prog.lv) || 1) / 5) * 2 + (Number(prog.breaks) || 0) * 5;
    const _keys = ["str", "intel", "tech", "agi"];
    if (!prog.spec) prog.spec = {};
    let _spent = _keys.reduce((a, k) => a + (Number(prog.spec[k]) || 0), 0) + (Number(prog.free) || 0);
    if (_spent > _allowGrow) {
      let over = _spent - _allowGrow;
      while (over > 0) {
        const k = _keys.slice().sort((a, b) => (Number(prog.spec[b]) || 0) - (Number(prog.spec[a]) || 0))[0];
        const v = Number(prog.spec[k]) || 0;
        if (v <= 0) break;
        const cut = Math.min(v, over);
        prog.spec[k] = v - cut; over -= cut;
      }
      prog.free = Math.max(0, _allowGrow - _keys.reduce((a, k) => a + (Number(prog.spec[k]) || 0), 0));
      try { save(); } catch (e) {}
    }
  }
  const sp = prog.spec || {};
  const SPEC = { atk: (Number(sp.str) || 0) * 2, spd: (Number(sp.agi) || 0) * 0.05, res: (Number(sp.intel) || 0) * 1.5, def: (Number(sp.tech) || 0) * 0.5 };
  const g = ORIGINAL_GEAR[o.id] || {};
  const gl = prog.gear || {};
  const gear = { atk: 0, hp: 0, def: 0, res: 0, spd: 0 };
  Object.keys(g).forEach((slot) => {
    const it = g[slot] || {}, st = gl[slot] || {};
    const m = (1 + 0.02 * ((st.lv || 1) - 1)) * (1 + 0.12 * ((st.star || 1) - 1)) * (1 + 0.05 * (st.advance || 0)) * (1 + 0.03 * (st.refine || 0));
    ["atk", "hp", "def", "res", "spd"].forEach((k) => { gear[k] += (Number(it[k]) || 0) * m; });
  });
  const base = { atk: Number(s.atk) || 60, hp: Number(s.hp) || 500, def: Number(s.def) || 20, res: Number(s.res) || 15, spd: Number(s.spd) || 10 };
  const rows = [["攻击", "atk"], ["生命", "hp"], ["防御", "def"], ["法抗", "res"], ["速度", "spd"]];
  const th = '<th style="padding:4px 6px;text-align:right;">';
  let html = '<table style="width:100%;border-collapse:collapse;font-size:12px;"><tr style="color:#8a8ab0;font-size:10.5px;text-align:left;"><th style="padding:4px;">来源</th>' +
    rows.map((r) => th + r[0] + '</th>').join("") + '</tr>';
  const line = (label, fn, color) => '<tr style="border-top:1px solid #1a2438;"><td class="hint" style="padding:6px 4px;">' + label + '</td>' +
    rows.map((r) => {
      const v = fn(r[1]);
      return '<td style="padding:6px;text-align:right;color:' + (color || "#dbe4f3") + ';">' + (v > 0 ? "+" : "") + Math.round(v * 10) / 10 + '</td>';
    }).join("") + '</tr>';
  html += line("基础本体", (k) => base[k]);
  html += line("等级 / 突破", (k) => (k === "spd" ? 0.1 * (lv - 1) : base[k] * lvk - base[k]), "#8fd8ff");
  html += line("资历 / 资质", (k) => (k === "spd" ? 0 : base[k] * lvk * gm - base[k] * lvk), "#ffd666");
  html += line("专精加点", (k) => SPEC[k] || 0, "#7ee787");
  html += line("专属装备", (k) => gear[k], "#ffb347");
  html += '<tr style="border-top:1px solid #2c3d5e;"><td style="padding:7px 4px;font-weight:700;">合计</td>' +
    rows.map((r) => {
      const k = r[1];
        const v = (k === "spd" ? base.spd + 0.1 * (lv - 1) : base[k] * lvk * gm) + (SPEC[k] || 0) + gear[k];
      return '<td style="padding:7px 6px;text-align:right;font-weight:800;color:#6ea8fe;">' + (Math.round(v * 10) / 10) + '</td>';
    }).join("") + '</tr></table>';
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:999;padding:12px;";
  ov.innerHTML = '<div class="card" style="max-width:560px;width:100%;max-height:86vh;overflow:auto;">' +
    '<div class="card-title">📊 加成明细 · ' + esc(o.name) + '</div>' +
    '<div class="hint" style="margin-bottom:6px;">Lv' + lv + ' · 突破 ' + br + '/5 · 资历 ' + GRADE[gi].key + ' · 资质 ' + ai + '★</div>' +
    html + '<div style="margin-top:10px;"><button id="bdClose" style="width:100%;">关闭</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#bdClose").onclick = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
}

  view().innerHTML =
    '<div class="tree-tabs">' + tabs + '</div>' +
    card(esc(oname) + ' <span class="rare-badge' + (o.rare ? " gold" : "") + '">' + (o.rare ? "稀有原创" : "普通原创") + '</span>',
      '<div class="hint">专属装备 · 独立成长</div>') +

      '<div class="bar' + (pct >= 100 ? ' full' : '') + '" style="margin:6px 0;"><i style="width:' + pct + '%"></i></div>' +

    card("属性（含装备）",
      row("攻击", Math.round(atk)) + row("生命", Math.round(hp)) + row("防御", Math.round(def)) +
      row("法抗", Math.round(res)) + row("速度", Math.round(spd * 10) / 10) +

      '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">' +

      (() => {

        const G = GRADE[gi], A = APTITUDE[ai - 1];

            while (over > 0) {
              const k = _ks.slice().sort((a, b) => (Number(prog.spec[b]) || 0) - (Number(prog.spec[a]) || 0))[0];

  view().querySelectorAll("[data-specdec]").forEach((b) => b.onclick = async () => {

// 🛒 旅商商车：只在一段时间营业，货品每日轮换，限购
function travelerOpen(now) {
  const d = now || new Date();
  const h = d.getHours() + d.getMinutes() / 60;
  return (h >= 8 && h < 10) || (h >= 13 && h < 15) || (h >= 20 && h < 22);
}
function travelerNext(now) {
  const d = now || new Date();
  const h = d.getHours() + d.getMinutes() / 60;
  if (h < 8) return "今天 08:00 开摊";
  if (h < 10) return "营业中（10:00 收摊）";
  if (h < 13) return "今天 13:00 开摊";
  if (h < 15) return "营业中（15:00 收摊）";
  if (h < 20) return "今天 20:00 开摊";
  if (h < 22) return "营业中（22:00 收摊）";
  return "明天 08:00 开摊";
}
function travelerGen() {
  const now = new Date();
  let seed = Number(String(now.getFullYear()) + String(now.getMonth() + 1) + String(now.getDate()));
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483647; return Math.abs(seed); };
  const roll = (p) => (rnd() % 100) < p;

  // 🎲 品质权重（R~SR 货架 / SR~SSR 货架）
  const pickRarity = (table) => {
    const total = table.reduce((a, b) => a + b.w, 0);
    let r = rnd() % total;
    for (const t of table) { if (r < t.w) return t.r; r -= t.w; }
    return table[table.length - 1].r;
  };

  // 💰 基价：品质 × 种类（武器最贵，饰品其次，防具最便宜）
  const BASE = { R: { weapon: 9000, armor: 6000, accessory: 7000 }, SR: { weapon: 52000, armor: 36000, accessory: 42000 }, SSR: { weapon: 210000, armor: 160000, accessory: 180000 } };
  const float = () => 0.85 + (rnd() % 41) / 100;   // 0.85 ~ 1.25 浮动
  const priceOf = (cat, rarity) => {
    const base = ((BASE[rarity] || BASE.R)[cat]) || 8000;
    return Math.round(base * float() / 500) * 500;
  };

  const all = [].concat(
    WEAPONS.map((d) => ["weapon", d]),
    ARMORS.map((d) => ["armor", d]),
    ACCESSORIES.map((d) => ["accessory", d])
  );
  const used = new Set();
  const out = [];
  let n = 0;
  const take = (cat, rarity, group) => {
    const pool = all.filter(([c2, d]) => c2 === cat && d.rarity === rarity && !used.has(d.id));
    if (!pool.length) return;
    const [c3, d] = pool[rnd() % pool.length];
    used.add(d.id);
    out.push({ key: "tr" + (n++), cat: c3, def: d, price: priceOf(c3, rarity), group });
  };
  const anyOf = (rarity) => {
    const pool = all.filter(([, d]) => d.rarity === rarity && !used.has(d.id));
    if (!pool.length) return;
    const [c2, d] = pool[rnd() % pool.length];
    used.add(d.id);
    out.push({ key: "tr" + (n++), cat: c2, def: d, price: priceOf(c2, rarity), group: "low" });
  };

  // A 区：R~SR（7 格）
  const LOW = [{ r: "R", w: 70 }, { r: "SR", w: 30 }];
  for (let i = 0; i < 3; i++) anyOf(pickRarity(LOW));
  const slotPick = (cat, part, r) => {
    const pool = all.filter(([c2, d]) => c2 === cat && d.rarity === r && !used.has(d.id) && (!part || d.part === part));
    if (!pool.length) return;
    const [c2, d] = pool[rnd() % pool.length];
    used.add(d.id);
    out.push({ key: "tr" + (n++), cat: c2, def: d, price: priceOf(c2, r), group: "low" });
  };
  slotPick("weapon", null, pickRarity(LOW));
  slotPick("armor", "top", pickRarity(LOW));
  slotPick("armor", "bottom", pickRarity(LOW));
  slotPick("accessory", null, pickRarity(LOW));

  // B 区：SR~SSR（1 固定 SSR + 2 随机，可能缺货）
  const HIGH = [{ r: "SR", w: 75 }, { r: "SSR", w: 25 }];
  if (roll(65)) {
    const pool = all.filter(([, d]) => d.rarity === "SSR" && !used.has(d.id));
    if (pool.length) { const [c2, d] = pool[rnd() % pool.length]; used.add(d.id); out.push({ key: "tr" + (n++), cat: c2, def: d, price: priceOf(c2, "SSR"), group: "high" }); }
  }
  for (let i = 0; i < 2; i++) {
    if (!roll(60)) continue;
    const r = pickRarity(HIGH);
    const pool = all.filter(([, d]) => d.rarity === r && !used.has(d.id));
    if (pool.length) { const [c2, d] = pool[rnd() % pool.length]; used.add(d.id); out.push({ key: "tr" + (n++), cat: c2, def: d, price: priceOf(c2, r), group: "high" }); }
  }
  return out;
}
function travelerStock() {
  const day = new Date().toISOString().slice(0, 10);
  store.flags = store.flags || {};
  let t = store.flags.traveler;
  if (!t || t.day !== day) {
    const gen = travelerGen();
    t = store.flags.traveler = {
      day,
      stock: gen.map((x) => ({ key: x.key, cat: x.cat, id: x.def.id, price: x.price, group: x.group }))
    };
    try { save(); } catch (e) {}
  }
  const pool = [].concat(
    WEAPONS.map((d) => ["weapon", d]),
    ARMORS.map((d) => ["armor", d]),
    ACCESSORIES.map((d) => ["accessory", d])
  );
  const out = [];
  t.stock.forEach((x) => {
    const hit = pool.find(([c2, d]) => c2 === x.cat && d.id === x.id);
    if (hit) out.push({ key: x.key, cat: x.cat, def: hit[1], price: x.price, group: x.group });
  });
  return out;
}

function bindStoreTool(filtered) {
  const F = window.__stFilter, batch = window.__batch;
  view().querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { F.cat = b.dataset.f; render(); });
  view().querySelectorAll("[data-sort]").forEach((b) => b.onclick = () => { F.sort = b.dataset.sort; render(); });
  if ($("bOn")) $("bOn").onclick = () => { batch.on = true; batch.sel = {}; render(); };
  if ($("bExit")) $("bExit").onclick = () => { batch.on = false; batch.sel = {}; render(); };
  if ($("bAll")) $("bAll").onclick = () => {
    filtered.forEach((it) => { if (!it.lock) batch.sel[it.id] = 1; });
    render();
  };
  if ($("bRun")) $("bRun").onclick = async () => {
    const ids = Object.keys(batch.sel);
    if (!ids.length) return toast("还没选装备", true);
    if (!confirm("确定分解这 " + ids.length + " 件？（锁定的会跳过）")) return;
    let ok = 0, skip = 0;
    ids.forEach((id) => {
      const r = dismantle(store, id);
      if (r.ok) ok++; else skip++;
    });
    addReceipt(store, "批量分解", ok + " 件", { note: "跳过 " + skip });
    batch.on = false; batch.sel = {};
    await save(); render();
    toast("批量分解：成功 " + ok + " 件" + (skip ? "，跳过 " + skip : ""));
  };
  view().querySelectorAll("[data-pick]").forEach((c) => c.onchange = () => {
    if (c.checked) batch.sel[c.dataset.pick] = 1; else delete batch.sel[c.dataset.pick];
    render();
  });
  view().querySelectorAll("[data-inherit]").forEach((b) => b.onclick = () => openInherit(b.dataset.inherit));
  view().querySelectorAll("[data-detail]").forEach((b) => b.onclick = () => showItemDetail(findItem(store, b.dataset.detail)));
  view().querySelectorAll("[data-equip]").forEach((b) => b.onclick = async () => {
    const r = equip(store, activeChar().id, b.dataset.equip);
    if (!r.ok) return toast(r.why, true);
    await save(); render();
  });
  view().querySelectorAll("[data-cult]").forEach((b) => b.onclick = async () => {
    const it = findItem(store, b.dataset.cult), r = cultApply(store, it, "level");
    if (!r.ok) return toast(r.why, true);
    bumpDaily(store, "cults");
    addReceipt(store, "培养", it.data.name + " → Lv" + r.lv);
    await save(); render();
  });
  view().querySelectorAll("[data-star]").forEach((b) => b.onclick = async () => {
    const it = findItem(store, b.dataset.star), r = cultApply(store, it, "star");
    if (!r.ok) return toast(r.why, true);
    bumpDaily(store, "cults");
    await save(); render();
  });
  view().querySelectorAll("[data-lock]").forEach((b) => b.onclick = async () => {
    const it = findItem(store, b.dataset.lock); it.lock = !it.lock;
    await save(); render();
  });
  view().querySelectorAll("[data-sell]").forEach((b) => b.onclick = async () => {
    const it = findItem(store, b.dataset.sell);
    if (!confirm("出售「" + it.data.name + "」？")) return;
    const r = sell(store, b.dataset.sell);
    if (!r.ok) return toast(r.why, true);
    addReceipt(store, "出售", it.data.name, { gold: r.price });
    await save(); render();
  });
  view().querySelectorAll("[data-dis]").forEach((b) => b.onclick = async () => {
    const it = findItem(store, b.dataset.dis);
    if (!confirm("分解「" + it.data.name + "」？")) return;
    const r = dismantle(store, b.dataset.dis);
    if (!r.ok) return toast(r.why, true);
    addReceipt(store, "分解", it.data.name, { items: [{ name: "强化石", count: r.stone }] });
    await save(); render();
  });
}

// 🏪 每日货架：按日期生成固定一批（同一天所有人一样），买过就没了
function dayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
function shelfOf(store) {
  const day = dayKey();
  const f = (store.flags = store.flags || {});
  if (!f.shop || f.shop.day !== day) {
    // 用日期做种子，保证同一天稳定
    let seed = 0;
    for (const ch of day) seed = (seed * 31 + ch.charCodeAt(0)) % 100000;
    const pickN = (list, n) => {
      const out = [];
      // 🎚 货架抽取范围：R ~ SR（SR 还没设计时自然只剩 R）
      const allowed = list.filter((x) => x.rarity === "R" || x.rarity === "SR");
      const pool = (allowed.length ? allowed : list).slice();
      for (let i = 0; i < n && pool.length; i++) {
        seed = (seed * 1103515245 + 12345) % 2147483647;
        out.push(pool.splice(seed % pool.length, 1)[0]);
      }
      return out;
    };
    f.shop = {
      day,
      weapons: pickN(WEAPONS, 3).map((x) => x.id),
      armors: (() => {
        const top = pickN(ARMORS.filter((a) => a.part === "top"), 1)[0];
        const bot = pickN(ARMORS.filter((a) => a.part === "bottom"), 1)[0];
        return [top, bot].filter(Boolean).map((x) => x.id);
      })(),
      accessories: pickN(ACCESSORIES, 2).map((x) => x.id),
      bought: []
    };
  }
  return f.shop;
}
// 💹 装备每日物价浮动（±25%，按日期+装备 id 稳定）
function priceFactor(day, id) {
  let h = 0;
  const s = day + "|" + id;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1000;
  return 0.75 + (h % 51) / 100;   // 0.75 ~ 1.25
}
function shopPrice(cat, d) {
  const base = (SHOP_PRICE[cat] || {})[d.rarity] || 500;
  const f = priceFactor(dayKey(), d.id);
  const price = Math.max(5, Math.round(base * f / 5) * 5);
  return { base, price, pct: Math.round((f - 1) * 100) };
}

function shelfItems(store) {
  const sh = shelfOf(store);
  const pick = (list, ids) => list.filter((x) => ids.indexOf(x.id) >= 0);
  return {
    weapons: pick(WEAPONS, sh.weapons),
    armors: pick(ARMORS, sh.armors),
    accessories: pick(ACCESSORIES, sh.accessories),
    bought: sh.bought || []
  };
}

// 🔁 继承面板：选一件同部位、且培养更低的装备作为目标
function openInherit(fromId) {
  const src = findItem(store, fromId);
  if (!src) return;
  const targets = (store.items || []).filter((it) => it.id !== fromId && it.cat === src.cat && inheritCheck(store, fromId, it.id).ok);
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;display:flex;align-items:center;justify-content:center;";
  ov.innerHTML = '<div class="card" style="width:min(520px,94vw);max-height:80vh;overflow:auto;margin:0;">' +
    '<div class="card-title">🔁 继承：' + esc(src.data.name) + '（Lv' + (src.data.lv || 1) + ' · ' + (src.data.star || 1) + '★）</div>' +
    '<div class="hint">把培养搬到目标装备，源装备回到 Lv1/1★；同部位才能继承。</div>' +
    (targets.length
      ? targets.map((t) => {
          const c = inheritCheck(store, fromId, t.id).cost;
          return '<div class="row"><span class="k">' + esc(t.data.name) +
            '<div class="hint">Lv' + (t.data.lv || 1) + ' · ' + (t.data.star || 1) + '★ → Lv' + Math.max(t.data.lv || 1, src.data.lv || 1) +
            ' · ' + Math.max(t.data.star || 1, src.data.star || 1) + '★　费用 ' + c.gold + ' 金</div></span>' +
            '<span class="v"><button data-go="' + t.id + '">继承</button></span></div>';
        }).join("")
      : '<div class="hint">没有可继承的目标（同部位且培养更低）</div>') +
    '<div style="margin-top:10px;"><button id="inhClose" style="width:100%;">关闭</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#inhClose").onclick = () => ov.remove();
  ov.querySelectorAll("[data-go]").forEach((b) => b.onclick = async () => {
    const r = inheritApply(store, fromId, b.dataset.go);
    if (!r.ok) { toast(r.why, true); return; }
    addReceipt(store, "继承", src.data.name + " → " + findItem(store, b.dataset.go).data.name, { gold: -r.gold });
    ov.remove();
    await save(); render();
    toast("继承完成：目标 Lv" + r.lv + " · " + r.star + "★（花费 " + r.gold + " 金）");
  });
}

// 🏪 每日限购计数（按本地日期重置）
function shopDay() {
  store.flags = store.flags || {};
  const k = dayKey();
  const d = store.flags.shopDay;
  if (!d || d.day !== k) store.flags.shopDay = { day: k, count: {} };
  return store.flags.shopDay;
}

// 🍱 战前准备文案
function buffText(meal) {
  const b = (meal && meal.buff) || {};
  const p = [];
  if (b.hpPct) p.push("生命 +" + b.hpPct + "%");
  if (b.atkPct) p.push("攻击 +" + b.atkPct + "%");
  if (b.defPct) p.push("防御 +" + b.defPct + "%");
  if (b.spd) p.push("速度 +" + b.spd);
  return p.join(" · ") || "无加成";
}

function renderShop() {
  const tab = window.__shopTab || "gear";
  const shelf = shelfItems(store);
  const grp = (title, cat, list) => card(title, list.map((d) => {
    const sp = shopPrice(cat, d);
    const sold = shelf.bought.indexOf(d.id) >= 0;
    const trend = sp.pct === 0 ? '' : (sp.pct > 0
      ? ' <span class="hint" style="color:#ff9b9b;">↑' + sp.pct + '%</span>'
      : ' <span class="hint" style="color:#7ee787;">↓' + Math.abs(sp.pct) + '%</span>');
    return '<div class="row"><span class="k"><a href="javascript:void(0)" data-gd="' + d.id + '" style="color:inherit;text-decoration:underline;text-decoration-style:dotted;">' + esc(d.name) + '</a> <span class="tag">' + d.rarity + '</span></span>' +
      '<span class="v"><span style="color:#ffd666;">' + sp.price + ' 金</span>' + trend +
      ' <span class="hint" style="text-decoration:line-through;">' + sp.base + '</span> ' +
      (sold ? '<span class="hint">已售罄</span>' : '<button data-buy="' + cat + ':' + d.id + '">购买</button>') +
      '</span></div>';
  }).join("") || '<div class="hint">今天的货架空了</div>');

  const tabBar = '<div class="tree-tabs" style="margin-bottom:10px;">' +
    '<button data-shoptab="store"' + (tab === "store" ? ' class="on"' : '') + '>🏪 便利店</button>' +
    '<button data-shoptab="gear"' + (tab === "gear" ? ' class="on"' : '') + '>⚔️ 装备店</button>' +
    '<button data-shoptab="cart"' + (tab === "cart" ? ' class="on"' : '') + '>🛒 商车</button>' +
    '</div>';

  const storeHtml = tabBar +
    (store.flags && store.flags.meal
      ? '<div class="card"><div class="card-title">🍱 已准备</div><div class="hint">' + esc(store.flags.meal.name) + '：' + buffText(store.flags.meal) + '（下一场战斗生效）</div></div>'
      : "") +
    card("🏪 便利店 · 日常补给",
      CONSUMABLES.map((p) => {
        const own = Number((store.flags || {})[p.id]) || 0;
        const bought = Number(shopDay().count[p.id]) || 0;
        const left = p.limit ? Math.max(0, p.limit - bought) : null;
        const soldOut = left !== null && left <= 0;
        return '<div class="row"><span class="k">' + esc(p.name) +
          ' <span class="hint">持有 ' + own + (left !== null ? ' · 今日剩 ' + left + '/' + p.limit : '') + '</span>' +
          '<div class="hint">' + esc(p.desc) + '</div></span>' +
          '<span class="v"><span style="color:#ffd666;">' + p.price + ' 金</span> ' +
          (soldOut ? '<span class="hint">今日售罄</span>' : '<button data-buy="prop:' + p.id + '">购买</button>') +
          (p.meal && own > 0 ? ' <button data-eat="' + p.id + '" style="border-color:#7ee787;color:#7ee787;">食用</button>' : '') +
          '</span></div>';
      }).join(""));

  const gearHtml = tabBar +
    '<div class="card" style="padding:10px 12px;"><div style="display:flex;justify-content:space-between;align-items:center;">' +
      '<span style="font-size:11px;color:#8a8ab0;">⚔️ 今日货架（每天 0 点换新，卖完就没有）</span>' +
      '<span style="font-size:11px;color:#6a6a86;">' + dayKey() + '</span></div></div>' +
    grp("⚔️ 武器", "weapon", shelf.weapons) + grp("🛡️ 防具", "armor", shelf.armors) + grp("💍 饰品", "accessory", shelf.accessories) +
    card("♻️ 回收（把仓库里的装备换成金币）",
      (store.items || []).length
        ? (store.items || []).map((it) => {
            const d = it.data || {};
            return '<div class="row"><span class="k">' + (it.lock ? "🔒 " : "") + esc(d.name) +
              '<div class="hint">' + (d.rarity || "") + ' · ' + (d.star || 1) + '★ · Lv' + (d.lv || 1) + '</div></span>' +
              '<span class="v"><span style="color:#ffd666;">' + sellPrice(it) + ' 金</span> ' +
              (it.lock ? '<span class="hint">已锁定</span>' : '<button data-sellshop="' + it.id + '" style="border-color:#ffd666;color:#ffd666;">出售</button>') +
              '</span></div>';
          }).join("")
        : '<div class="hint">仓库里没有可卖的东西</div>');

  view().innerHTML = tab === "cart" ? (tabBar + travelerCard()) : (tab === "store" ? storeHtml : gearHtml);
  view().querySelectorAll("[data-gd]").forEach((a) => a.onclick = () => showGearDetail(findGear(a.dataset.gd)));
  view().querySelectorAll("[data-shoptab]").forEach((b) => b.onclick = () => {
    window.__shopTab = b.dataset.shoptab;
    render();
  });

  view().querySelectorAll("[data-eat]").forEach((b) => b.onclick = async () => {
    const p = CONSUMABLES.find((x) => x.id === b.dataset.eat);
    if (!p || !p.meal) return;
    store.flags = store.flags || {};
    const own = Number(store.flags[p.id]) || 0;
    if (own <= 0) return toast("还没买", true);
    store.flags[p.id] = own - 1;
    store.flags.meal = { id: p.id, name: p.name, buff: p.meal };
    addReceipt(store, "便利店", "食用 " + p.name, { note: "战前准备" });
    await save(); render();
    toast("🍱 已准备：" + p.name + "（下一场生效）");
  });

  view().querySelectorAll("[data-sellshop]").forEach((b) => b.onclick = async () => {
    const it = findItem(store, b.dataset.sellshop);
    if (!it) return;
    const price = sellPrice(it);
    if (!confirm("出售「" + it.data.name + "」得 " + price + " 金？")) return;
    const r = sell(store, b.dataset.sellshop);
    if (!r.ok) return toast(r.why, true);
    addReceipt(store, "出售", it.data.name, { gold: r.price });
    await save(); render();
  });

  view().querySelectorAll("[data-buy]").forEach((b) => b.onclick = async () => {
    const [cat, id] = b.dataset.buy.split(":");
    let def = null, price = 0;
    if (cat === "weapon") { def = WEAPONS.find((x) => x.id === id); price = shopPrice("weapon", def).price; }
    if (cat === "armor") { def = ARMORS.find((x) => x.id === id); price = shopPrice("armor", def).price; }
    if (cat === "accessory") { def = ACCESSORIES.find((x) => x.id === id); price = shopPrice("accessory", def).price; }
    if (cat === "material") {
      const mp = id === "manuscript" ? 350 : 600;
      const nm = id === "manuscript" ? "资历手稿" : "资质鉴定勋章";
      if ((Number(store.gold) || 0) < mp) return toast("金币不够", true);
      store.gold -= mp;
      store.flags = store.flags || {};
      store.flags[id] = (Number(store.flags[id]) || 0) + 1;
      addReceipt(store, "购买", nm, { gold: -mp });
      await save(); render(); return;
    }
    if (cat === "prop") {
      def = CONSUMABLES.find((x) => x.id === id); price = def.price;
      if (def.limit) {
        const sd = shopDay();
        const bought = Number(sd.count[id]) || 0;
        if (bought >= def.limit) return toast("今日限购已满（" + def.limit + " 件），明天再来", true);
      }
      if ((store.gold || 0) < price) return toast("金币不够", true);
      store.gold -= price;
      store.flags[id] = (store.flags[id] || 0) + 1;
      if (def.limit) {
        const sd = shopDay();
        sd.count[id] = (Number(sd.count[id]) || 0) + 1;
      }
      addReceipt(store, "购买", def.name, { gold: -price });
      await save(); render(); return;
    }
    if (!def) return;
    if ((store.gold || 0) < price) return toast("金币不够", true);
    store.gold -= price;
    store.items.push(makeItem(cat, def));
    try { shelfOf(store).bought.push(def.id); } catch (e) {}
    addReceipt(store, "购买", def.name, { gold: -price, items: [{ name: def.name, count: 1 }] });
    await save(); render();
  });
}

function render() {
  const hostMode = (() => { try { if (localStorage.getItem("rpg2:host") === "1") return true; } catch (e) {} return box === "zynSD117"; })();
  document.body.classList.toggle("host-mode", hostMode);
  if (!hostMode) {
    const b = document.querySelector('[data-tab="orig"]');
    if (b) b.style.display = "none";
    if (tab === "orig") tab = "char";
  } else {
    // 🧬 主机端：布局与玩家端一致，但角色是「原创角色」
    document.querySelectorAll('[data-tab]').forEach((b) => {
      if (b.dataset.tab === "char") b.textContent = "🧬 原创角色";
      if (b.dataset.tab === "orig") { b.style.display = "none"; return; }
      b.style.display = "";
    });
    if (tab === "orig") tab = "char";
    const sb = $("btnSwitchBox");
    if (sb) sb.style.display = "none";
    // 🚪 主机专属：到处看看（基地设施）
    if (!document.querySelector('[data-tab="base"]')) {
      const nav = document.querySelector(".nav");
      if (nav) {
        const b = document.createElement("button");
        b.setAttribute("data-tab", "base");
        b.textContent = "🚪 到处看看";
        b.onclick = () => { tab = "base"; render(); };
        nav.appendChild(b);
      }
    }
  }
  if (!store) {
    view().innerHTML =
      '<div class="card"><div class="card-title">这个位号里是旧版存档（v1）</div>' +
      '<div class="hint">新版不会读取也不会覆盖它。请选一种方式开始：</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">' +
        '<button id="btnLocal">💾 本机试用（不写云端）</button>' +
        '<button id="btnNewBox">🆕 换一个新位号正式玩</button>' +
      '</div></div>';
    const bLocal = document.getElementById("btnLocal");
    if (bLocal) bLocal.onclick = () => {
      store = newStore();
      ensureSeed();
      toast("本机试用：不会写云端，放心点");
      render();
    };
    const bNew = document.getElementById("btnNewBox");
    if (bNew) bNew.onclick = () => {
      const nb = prompt("输入一个新的位号（英文/数字，例如 zyn2）", "zyn2");
      if (!nb) return;
      localStorage.setItem("rpg2:box", nb);
      location.href = "create.html?box=" + encodeURIComponent(nb);
    };
    return;
  }
  document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  (store.chars || []).forEach((c) => { if (c.tp == null) c.tp = talentPointsOf(c); });
  // ♻️ 一次性：全部角色专精点回退（自由重分配）+ Lv20 封顶
  {
    let ch6 = false;
    (store.chars || []).forEach((ch7) => {
      if (ch7.specReset2) return;
      ch7.specReset2 = 1;
      const lv = Number(ch7.lv) || 1;
      if (lv > 20) {
        let refund = 0;
        for (let l = 20; l < lv; l++) refund += CHAR.expNeed(l);
        store.exp = (Number(store.exp) || 0) + refund;
        ch7.lv = 20;
      }
      const br = Number(ch7.breaks) || 0;
      const allow = (Number(BIRTH.specPoints) || 24) + Math.floor(ch7.lv / 5) * 2 + br * 5;
      // 专精清零 → 全部转为可分配点
      ch7.str = 0; ch7.intel = 0; ch7.tech = 0; ch7.agi = 0;
      ch7.free = allow;
      ch7.specBase = { str: 0, intel: 0, tech: 0, agi: 0 };
      // 天赋点重算；若已点节点超过上限，全部退回重选
      ch7.tp = talentPointsOf(ch7);
      const spentTp = Object.keys(ch7.talent && ch7.talent.points || {}).length;
      if (spentTp > ch7.tp) { ch7.talent.points = {}; ch7.talent.active2 = ""; }
      ch6 = true;
    });
    if (ch6) { try { save(); } catch (e) {} }
  }
  // 🔻 一次性：Lv20 封顶（突破材料未开放），退回经验与专精点
  {
    let changed5 = false;
    (store.chars || []).forEach((ch5) => {
      if (ch5.lvCap20) return;
      ch5.lvCap20 = 1;
      const lv = Number(ch5.lv) || 1;
      if (lv > 20) {
        let refund = 0;
        for (let l = 20; l < lv; l++) refund += CHAR.expNeed(l);
        store.exp = (Number(store.exp) || 0) + refund;
        ch5.lv = 20;
        // 专精按 Lv20 上限收敛
        const br = Number(ch5.breaks) || 0;
        const allow = (Number(BIRTH.specPoints) || 24) + Math.floor(20 / 5) * 2 + br * 5;
        const keys = ["str", "intel", "tech", "agi"];
        let spent = keys.reduce((a, k) => a + (Number(ch5[k]) || 0), 0);
        let over = spent - allow;
        while (over > 0) {
          const k = keys.slice().sort((a, b) => (Number(ch5[b]) || 0) - (Number(ch5[a]) || 0))[0];
          const v = Number(ch5[k]) || 0;
          if (v <= 0) break;
          const cut = Math.min(v, over);
          ch5[k] = v - cut; over -= cut;
        }
        ch5.free = Math.max(0, allow - keys.reduce((a, k) => a + (Number(ch5[k]) || 0), 0));
        // 天赋点按等级重算，超出的节点撤销
        ch5.tp = talentPointsOf(ch5);
        changed5 = true;
      }
    });
    if (changed5) { try { save(); } catch (e) {} }
  }
  // 🔁 一次性：把迁移时错误清零的剩余点数补回
  {
    let fix = false;
    (store.chars || []).forEach((ch4) => {
      if (ch4.specNorm !== 1) return;
      const lv = Number(ch4.lv) || 1, br = Number(ch4.breaks) || 0;
      const allow = (Number(BIRTH.specPoints) || 24) + Math.floor(lv / 5) * 2 + br * 5;
      const spent = ["str", "intel", "tech", "agi"].reduce((a, k) => a + (Number(ch4[k]) || 0), 0);
      ch4.free = Math.max(0, allow - spent);
      ch4.specNorm = 2;
      fix = true;
    });
    Object.keys(store.orig || {}).forEach((id) => {
      const pg = store.orig[id];
      if (!pg || pg.specNorm !== 1) return;
      const o = ORIGINALS.find((x) => x.id === id);
      if (!o) return;
      const lv = Number(pg.lv) || 1, br = Number(pg.breaks) || 0;
      const allowGrow = Math.floor(lv / 5) * 2 + br * 5;
      const cur = pg.spec || {};
      const spent = ["str", "intel", "tech", "agi"].reduce((a, k) => a + (Number(cur[k]) || 0), 0);
      pg.free = Math.max(0, allowGrow - spent);
      pg.specNorm = 2;
      fix = true;
    });
    if (fix) { try { save(); } catch (e) {} }
  }
  // ⚖️ 原创角色专精迁移（初创=角色设定值，成长=每5级2点 + 突破5点）
  {
    let ch3 = false;
    Object.keys(store.orig || {}).forEach((id) => {
      const o = ORIGINALS.find((x) => x.id === id);
      if (!o) return;
      const pg = store.orig[id];
      if (!pg || pg.specNorm) return;
      const sp = o.spec || {};
      const start = ["str", "intel", "tech", "agi"].reduce((a, k) => a + (Number(sp[k]) || 0), 0);
      const lv = Number(pg.lv) || 1, br = Number(pg.breaks) || 0;
      const allowedGrow = Math.floor(lv / 5) * 2 + br * 5;
      const cur = pg.spec || {};
      const keys = ["str", "intel", "tech", "agi"];
      let spent = keys.reduce((a, k) => a + (Number(cur[k]) || 0), 0) + (Number(pg.free) || 0);
      if (spent > allowedGrow) {
        let over = spent - allowedGrow;
        while (over > 0) {
          const k = keys.slice().sort((a, b) => (Number(cur[b]) || 0) - (Number(cur[a]) || 0))[0];
          const v = Number(cur[k]) || 0;
          if (v <= 0) break;
          const cut = Math.min(v, over);
          cur[k] = v - cut; over -= cut;
        }
        pg.free = 0;
        ch3 = true;
      }
      pg.spec = cur;
      pg.specNorm = 1;
      ch3 = true;
    });
    if (ch3) { try { save(); } catch (e) {} }
  }
  // ⚖️ 专精点迁移：按新公式（24 + 每5级2点 + 突破5点）统一老角色
  {
    let changed2 = false;
    (store.chars || []).forEach((ch3) => {
      if (ch3.specNorm) return;
      const lv = Number(ch3.lv) || 1, br = Number(ch3.breaks) || 0;
      const allowed = (Number(BIRTH.specPoints) || 24) + Math.floor(lv / 5) * 2 + br * 5;
      const keys = ["str", "intel", "tech", "agi"];
      let total = keys.reduce((s, k) => s + (Number(ch3[k]) || 0), 0) + (Number(ch3.free) || 0);
      if (total > allowed) {
        // 从点数最多的属性开始回收，直到符合上限
        let over = total - allowed;
        while (over > 0) {
          const k = keys.slice().sort((a, b) => (Number(ch3[b]) || 0) - (Number(ch3[a]) || 0))[0];
          const cur = Number(ch3[k]) || 0;
          if (cur <= 0) break;
          const cut = Math.min(cur, over);
          ch3[k] = cur - cut;
          over -= cut;
        }
        ch3.free = 0;
        changed2 = true;
      }
      ch3.specNorm = 1;
      if (!changed2) changed2 = true;
    });
    if (changed2) { try { save(); } catch (e) {} }
  }
  // 🎁 补发初始装备（老存档没有装备的角色）
  {
    let changed = false;
    (store.chars || []).forEach((ch2) => {
      if (!ch2.equip) ch2.equip = {};
      if (ch2.equip.weapon) return;
      const str = Number(ch2.str) || 0, agi = Number(ch2.agi) || 0, intel = Number(ch2.intel) || 0, tech = Number(ch2.tech) || 0;
      const top = Math.max(str, agi, intel, tech);
      const want = top === agi ? "ranged" : top === intel ? "focus" : top === tech ? "melee" : "melee";
      const pool = WEAPONS.filter((x) => x.rarity === "R" && (x.style || "melee") === want);
      const w = pool[0] || WEAPONS.find((x) => x.rarity === "R") || WEAPONS[0];
      const ar = ARMORS.find((x) => x.id === "a_cloth") || ARMORS[0];
      const ac = ACCESSORIES.find((x) => x.rarity === "R") || ACCESSORIES[0];
      ch2.equip.weapon = Object.assign({}, w, { lv: 1, star: 1, born: w.rarity });
      ch2.equip[(ar.part === "bottom") ? "armor2" : "armor"] = Object.assign({}, ar, { lv: 1, star: 1, born: ar.rarity });
      ch2.equip.accessory = Object.assign({}, ac, { lv: 1, star: 1, born: ac.rarity });
      changed = true;
    });
    if (changed) { try { save(); } catch (e) {} }
  }
  try {
    if (tab === "orig" && !ORIGINALS.length) pullOriginals().then(() => { try { render(); } catch (e) {} }).catch(() => {});
    if (hostMode && (tab === "char" || tab === "orig")) { renderOrig(); return; }
    if (hostMode && tab === "cult") { renderOrigCult(); return; }
    if (hostMode && tab === "talent") {
      view().innerHTML = card("🌳 天赋（原创角色）", '<div class="hint">按玩家端天赋树接入中；解锁阶段待配置。</div>');
      return;
    }
    if (hostMode && tab === "base") { renderBase(); return; }
    if (tab === "char") renderChar();
    else if (tab === "talent") renderTalent();
    else if (tab === "cult") renderCult();
    else if (tab === "orig") renderOrig();
    else if (tab === "rank") renderRank();
    else if (tab === "daily") renderDaily();
    else if (tab === "store") renderStore();
    else renderShop();
  } catch (e) {
    view().innerHTML = '<div class="card"><div class="card-title">页面出错</div><div class="hint">' + String(e && e.message || e) + '</div></div>';
  }
}

document.querySelectorAll("[data-tab]").forEach((b) => {
  b.onclick = () => { tab = b.dataset.tab; render(); };
});
$("btnSave").onclick = () => save();
document.addEventListener("click", async (e) => {
  const b = e.target && e.target.closest ? e.target.closest("#btnNick") : null;
  if (!b || !store) return;
  const v = prompt("账号昵称（最多 12 字，大厅/聊天显示）", (store.account && store.account.nick) || "");
  if (v === null) return;
  store.account = store.account || { id: box, nick: "" };
  store.account.nick = v.trim().slice(0, 12);
  try { localStorage.setItem("rpg2:nick", store.account.nick); } catch (err) {}
  await save(); render(); toast("昵称已改");
});

// 从首页带 tab 参数进来（任务 / 排行榜）
const bootTab = new URLSearchParams(location.search).get("tab");
if (bootTab && ["char", "talent", "cult", "orig", "store", "shop", "rank", "daily"].indexOf(bootTab) >= 0) tab = bootTab;

(async () => { await load(); try { await pullOriginals(); } catch (e) {} render(); })();
</script>

</script>
