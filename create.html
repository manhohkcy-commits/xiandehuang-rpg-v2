// 📊 原创角色属性加成明细
function origBreakdown(o, prog) {
  const s = o.stats || {};
  const lv = Number(prog.lv) || 1, br = Math.min(5, Number(prog.breaks) || 0);
  const gi = Math.max(0, Math.min(GRADE.length - 1, Number(prog.grade) || 0));
  const ai = Math.max(1, Math.min(APTITUDE.length, Number(prog.apt) || 1));
  const lvk = (1 + 0.04 * (lv - 1)) * (1 + 0.03 * br);
  const gm = (GRADE[gi].mult || 1) * ((APTITUDE[ai - 1] || {}).mult || 1);
  const sp = prog.spec || {};
  const SPEC = { atk: (Number(sp.str) || 0) * 2, spd: (Number(sp.agi) || 0) * 0.05, res: (Number(sp.intel) || 0) * 1.5, def: (Number(sp.tech) || 0) * 0.5 };
  const g = ORIGINAL_GEAR[o.id] || {};
  const gl = prog.gear || {};
  const gear = { atk: 0, hp: 0, def: 0, res: 0, spd: 0 };
  Object.keys(g).forEach((slot) => {
    const it = g[slot] || {}, st = gl[slot] || {};
    const m = (1 + 0.02 * ((st.lv || 1) - 1)) * (1 + 0.12 * ((st.star || 1) - 1)) * (1 + 0.05 * (st.advance || 0));
    ["atk", "hp", "def", "res", "spd"].forEach((k) => { gear[k] += (Number(it[k]) || 0) * m; });
  });
  const base = { atk: Number(s.atk) || 60, hp: Number(s.hp) || 500, def: Number(s.def) || 20, res: Number(s.res) || 15, spd: Number(s.spd) || 10 };
  const rows = [["攻击", "atk"], ["生命", "hp"], ["防御", "def"], ["法抗", "res"], ["速度", "spd"]];
  const th = '<th style="padding:4px 6px;text-align:right;">';
  let html = '<table style="width:100%;border-collapse:collapse;font-size:12px;"><tr style="color:#8a8ab0;font-size:10.5px;text-align:left;"><th style="padding:4px;">来源</th>' +
    rows.map((r) => th + r[0] + '</th>').join("") + '</tr>';
  const line = (label, fn, color) => '<tr style="border-top:1px solid #1a2438;"><td class="hint" style="padding:6px 4px;">' + label + '</td>' +
    rows.map((r) => {
      const v = fn(r[1]);
      return '<td style="padding:6px;text-align:right;color:' + (color || "#dbe4f3") + ';">' + (v > 0 ? "+" : "") + Math.round(v * 10) / 10 + '</td>';
    }).join("") + '</tr>';
  html += line("基础本体", (k) => base[k]);
  html += line("等级 / 突破", (k) => base[k] * lvk - base[k], "#8fd8ff");
  html += line("资历 / 资质", (k) => base[k] * lvk * gm - base[k] * lvk, "#ffd666");
  html += line("专精加点", (k) => SPEC[k] || 0, "#7ee787");
  html += line("专属装备", (k) => gear[k], "#ffb347");
  html += '<tr style="border-top:1px solid #2c3d5e;"><td style="padding:7px 4px;font-weight:700;">合计</td>' +
    rows.map((r) => {
      const k = r[1];
      const v = base[k] * lvk * gm + (SPEC[k] || 0) + gear[k];
      return '<td style="padding:7px 6px;text-align:right;font-weight:800;color:#6ea8fe;">' + (Math.round(v * 10) / 10) + '</td>';
    }).join("") + '</tr></table>';
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:999;padding:12px;";
  ov.innerHTML = '<div class="card" style="max-width:560px;width:100%;max-height:86vh;overflow:auto;">' +
    '<div class="card-title">📊 加成明细 · ' + esc(o.name) + '</div>' +
    '<div class="hint" style="margin-bottom:6px;">Lv' + lv + ' · 突破 ' + br + '/5 · 资历 ' + GRADE[gi].key + ' · 资质 ' + ai + '★</div>' +
    html + '<div style="margin-top:10px;"><button id="bdClose" style="width:100%;">关闭</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#bdClose").onclick = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
}

function renderOrig() {
  if (!ORIGINALS.length) {
    view().innerHTML = card("🧬 原创角色", '<div class="hint">还没有原创角色。等主机端设计并加入游戏后，这里会出现他们的面板。</div>');
    return;
  }
  const selId = (window.__origSel && ORIGINALS.some((o) => o.id === window.__origSel)) ? window.__origSel : ORIGINALS[0].id;
  window.__origSel = selId;
  const o = ORIGINALS.find((x) => x.id === selId);
  if (!store) store = { v: 2, items: [], chars: [], orig: {}, gold: 0, exp: 0, flags: {} };
  if (!store.orig) store.orig = {};
  const prog = store.orig[o.id] || { lv: 1, exp: 0, breaks: 0 };
  const lv = Number(prog.lv) || 1;
  const brk = Math.min(5, Number(prog.breaks) || 0);
  const oname = (prog && prog.name) || o.name;
  const need = CHAR.expNeed(lv);
  const pct = Math.min(100, Math.round(((Number(prog.exp) || 0) / need) * 100));
  const fin = originalFinal(o, prog, true, false); // 面板 = 本体 + 装备，不含培养加成
  const atk = fin.atk, hp = fin.hp, def = fin.def, res = fin.res, spd = fin.spd;
  const s = o.stats || {};
  const pw = fin.power;
  const BRK_COST = BREAKS.map((b) => ({ b: b.stone, g: b.gold, at: b.at }));
  const brkNext = brk < 5 ? BRK_COST[brk] : null;
  const tabs = ORIGINALS.map((x) => '<button data-osel="' + x.id + '"' + (x.id === selId ? ' class="on"' : '') + '>' + esc(x.name) + '</button>').join("");
  const SLOTN = { weapon: "武器", armor: "上装", armor2: "下装", accessory: "饰品" };
  const GI = { weapon: "🗡", armor: "🛡", armor2: "👖", accessory: "💍" };
  const gg = ORIGINAL_GEAR[o.id] || o.gearObj || {};
  const gearCount = Object.keys(SLOTN).filter((k) => (gg[k] || {}).name).length;
  const gear = Object.keys(SLOTN).map((k) => {
    const it = gg[k] || {};
    if (!it.name) return "";
    const gst = (prog.gear && prog.gear[k]) || { lv: 1, star: 1 };
    const glv = Math.max(1, Number(gst.lv) || 1), gst2 = Math.max(1, Number(gst.star) || 1);
    const bits = [];
    if (it.atk) bits.push("攻+" + it.atk);
    if (it.hp) bits.push("生+" + it.hp);
    if (it.def) bits.push("防+" + it.def);
    if (it.res) bits.push("抗+" + it.res);
    if (it.spd) bits.push("速+" + it.spd);
    if (it.critRate) bits.push("暴击+" + it.critRate + "%");
    if (it.critDmg) bits.push("暴伤+" + it.critDmg + "%");
    if (it.lifesteal) bits.push("吸血" + it.lifesteal + "%");
    if (it.ultPct) bits.push("必杀+" + it.ultPct + "%");
    return '<div class="' + (it.rarity === "SSR" ? "rarity-ssr" : it.rarity === "SR" ? "rarity-sr" : "") + '" style="padding:7px 6px;border-bottom:1px dashed #2a2418;border-radius:8px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
        '<span style="font-size:12.5px;">' + (GI[k] || "🗡") + ' <b>' + esc(it.name) + '</b> <span class="hint">' + (it.rarity || "") + '</span>' +
        ' <span style="color:#ffd666;font-size:11px;">Lv' + glv + ' ★' + gst2 + '</span></span>' +
        '<span style="display:flex;gap:4px;">' +
          '<button data-og="' + k + ':lv" style="font-size:10.5px;padding:3px 7px;">强化</button>' +
          '<button data-og="' + k + ':star" style="font-size:10.5px;padding:3px 7px;">升星</button>' +
        '</span></div>' +
      '<div class="hint" style="margin-top:2px;">' + esc(bits.join(" · ")) + '</div></div>';
  }).join("");

  view().innerHTML =
    '<div class="tree-tabs">' + tabs + '</div>' +
    card(esc(oname) + ' <span class="rare-badge' + (o.rare ? " gold" : "") + '">' + (o.rare ? "稀有原创" : "普通原创") + '</span>',
      '<div class="hint">专属装备 · 独立成长</div>') +
    card("等级",
      '<div class="row"><span class="k">等级</span><span class="v" style="color:#ffd666;font-size:18px;">Lv' + lv + (lv >= CHAR.maxLevel ? ' · 满级' : '') + '</span></div>' +
      '<div class="bar' + (pct >= 100 ? ' full' : '') + '" style="margin:6px 0;"><i style="width:' + pct + '%"></i></div>' +
      '<div class="hint">经验 ' + fmt(prog.exp || 0) + ' / ' + fmt(need) + '</div>' +
      '<div class="hint" style="margin-top:6px;">突破 ' + brk + '/5 · 每次全属性 +3%' +
        (brkNext ? '（下次需 Lv' + brkNext.at + ' · 突破石 ' + brkNext.b + ' + ' + fmt(brkNext.g) + ' 金）' : '（已满）') + '</div>' +
      '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">' +
        '<button id="btnOrigLevel"' + ((prog.exp || 0) >= need && lv < CHAR.maxLevel ? '' : ' disabled') + '>🔼 升级到 Lv' + (lv + 1) + '</button>' +
        '<button id="btnOrigBreak" ' + (brkNext ? '' : 'disabled') + '>⚡ 突破</button>' +
      '</div>') +
    card("综合战力",
      '<div style="font-size:24px;font-weight:800;color:#6ea8fe;">' + fmt(pw) + '</div>' +
      '<div class="hint">综合战力</div>') +
    card("属性（含装备）",
      row("攻击", Math.round(atk)) + row("生命", Math.round(hp)) + row("防御", Math.round(def)) +
      row("法抗", Math.round(res)) + row("速度", Math.round(spd * 10) / 10) +
      row("暴击率", (Number(fin.critRate) || 5) + "%") + row("暴击伤害", (Number(fin.critDmg) || 150) + "%") +
      '<div style="margin-top:8px;"><button id="btnOrigBreakdown">📊 加成明细</button></div>') +
    card("资历与资质",
      (() => {
        const gi = Math.max(0, Math.min(GRADE.length - 1, Number(prog.grade) || 0));
        const ai = Math.max(1, Math.min(APTITUDE.length, Number(prog.apt) || 1));
        const G = GRADE[gi], A = APTITUDE[ai - 1];
        const nG = GRADE[gi + 1], nA = APTITUDE[ai];
        const ms = Number(store.flags.manuscript) || 0, md = Number(store.flags.medal) || 0;
        const gold = Number(store.gold) || 0;
        const gCost = nG ? { ms: nG.cost, gold: 1000 * (gi + 1) } : null;
        const aCost = nA ? { md: nA.cost, gold: 800 * ai } : null;
        const canG = gCost && ms >= gCost.ms && gold >= gCost.gold;
        const canA = aCost && md >= aCost.md && gold >= aCost.gold;
        return row("资历评级", G.key + "（全属性 ×" + (G.mult || 1).toFixed(2) + "）") +
          row("资质评估", ai + "★（全属性 ×" + (A.mult || 1).toFixed(2) + "）") +
          '<div class="hint" style="margin-top:6px;">手稿 ' + ms + ' · 勋章 ' + md + '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">' +
          (nG ? '<button id="btnOrigGrade"' + (canG ? '' : ' disabled') + '>晋升 → ' + nG.key + '（手稿 ' + gCost.ms + ' · ' + fmt(gCost.gold) + ' 金）</button>'
              : '<button disabled>资历已满</button>') +
          (nA ? '<button id="btnOrigApt"' + (canA ? '' : ' disabled') + '>评估 → ' + (ai + 1) + '★（勋章 ' + aCost.md + ' · ' + fmt(aCost.gold) + ' 金）</button>'
              : '<button disabled>资质已满</button>') +
          '</div>';
      })()) +
    card("专精",
      (() => {
        const sp = prog.spec || {};
        const free = Number(prog.free) || 0;
        const line = (k, label, key) => {
          const base = Number((o.spec || {})[k]) || 0;
          const add = Number(sp[key]) || 0;
          return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 2px;">' +
            '<span class="hint">' + label + '</span>' +
            '<span style="display:flex;align-items:center;gap:6px;">' +
            (free > 0 ? '<button data-specdec="' + key + '"' + (add > 0 ? "" : " disabled") + ' style="padding:1px 8px;">−</button>' : "") +
            '<b style="min-width:46px;text-align:right;">' + (base + add) + '</b>' +
            (free > 0 ? '<button data-spec="' + key + '" style="padding:1px 8px;">＋</button>' : "") +
            '</span></div>';
        };
        return line("str", "力量", "str") + line("int", "智力", "intel") + line("tech", "技巧", "tech") + line("agi", "敏捷", "agi") +
          '<div class="hint" style="margin-top:4px;">剩余专精点：<b style="color:' + (free > 0 ? "#7ee787" : "#6a6a86") + ';">' + free + '</b>（每级 +2）</div>' +
          '<div class="hint" style="margin-top:2px;">力 +2攻 · 敏 +0.05速 · 智 +1.5抗 · 技 +0.5防</div>';
      })()) +
    card("装备栏",
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      Object.keys(SLOTN).map((k) => {
        const it2 = gg[k] || {};
        const st2 = (prog.gear && prog.gear[k]) || { lv: 1, star: 1 };
        return '<div data-eqslot="' + k + '" style="flex:1;min-width:100px;background:#12182a;border:1px solid #3a3a5c;border-radius:9px;padding:9px;cursor:pointer;">' +
          '<div class="hint">' + (GI[k] || "🗡") + ' ' + SLOTN[k] + '</div>' +
          (it2.name ? '<div style="font-size:12.5px;font-weight:700;color:#dbe4f3;">' + esc(it2.name) + '</div>' +
            '<div class="hint">' + (it2.rarity || "") + ' Lv' + (st2.lv || 1) + ' ★' + (st2.star || 1) + '</div>'
            : '<div class="hint">空</div>') + '</div>';
      }).join("") + '</div>') +
    card("操作", '<button id="btnOrigRename">✏️ 改名字</button><button id="btnNick">🏷 改账号昵称</button>') +
    card("最近收据", receiptsHtml()) +
    '<div class="hint" style="margin:8px 2px;">用这名原创角色打一场战斗可以涨经验（每胜 +120）。</div>' +
    '<div style="margin-bottom:8px;"><button id="btnPlayOrig" style="border-color:#ffb347;color:#ffb347;">⚔️ 用他出战</button></div>' +
    (o.notes ? card("备注", '<div class="hint">' + esc(o.notes) + '</div>') : "");

  view().querySelectorAll("[data-osel]").forEach((b) => b.onclick = () => { window.__origSel = b.dataset.osel; render(); });
  view().querySelectorAll("[data-specdec]").forEach((b) => b.onclick = async () => {
    const k = b.dataset.specdec;
    const cur = Number((prog.spec || {})[k]) || 0;
    if (cur <= 0) return;
    prog.spec[k] = cur - 1; prog.free = (Number(prog.free) || 0) + 1;
    store.orig[o.id] = prog; await save(); render();
  });
  if ($("btnOrigBreakdown")) $("btnOrigBreakdown").onclick = () => origBreakdown(o, prog);
  view().querySelectorAll("[data-spec]").forEach((b) => b.onclick = async () => {
    const k = b.dataset.spec;
    const free = Number(prog.free) || 0;
    if (free <= 0) return toast("没有剩余专精点", true);
    prog.spec = prog.spec || {};
    prog.spec[k] = (Number(prog.spec[k]) || 0) + 1;
    prog.free = free - 1;
    store.orig[o.id] = prog;
    await save(); render();
  });
  view().querySelectorAll("[data-eqslot]").forEach((b) => b.onclick = () => {
    const slot = b.dataset.eqslot;
    const it = gg[slot] || {};
    if (!it.name) return toast("这个位置还是空的", true);
    origGearDetail(it, slot, (prog.gear && prog.gear[slot]) || { lv: 1, star: 1 });
  });
  view().querySelectorAll("[data-of]").forEach((b) => b.onclick = async () => {
    const key = b.dataset.of;
    if (!origUnlocked(o.id, key, prog)) return toast("还没解锁（解锁阶段待配置）", true);
    if (key === "stat") {
      const cost = 500;
      if ((store.gold || 0) < cost) return toast("金币不足（需 " + cost + "）", true);
      if (!prog.bonus) prog.bonus = {};
      store.gold -= cost;
      prog.bonus.atk = (Number(prog.bonus.atk) || 0) + 2;
      prog.bonus.hp = (Number(prog.bonus.hp) || 0) + 8;
      await save(); render(); return toast("属性强化 +2 攻击 / +8 生命");
    }
    if (key === "refine") {
      const cost = 5;
      if ((store.flags.shards || 0) < cost) return toast("碎片不足（需 " + cost + "）", true);
      if (!prog.bonus) prog.bonus = {};
      store.flags.shards -= cost;
      prog.bonus.critDmg = (Number(prog.bonus.critDmg) || 0) + 1;
      await save(); render(); return toast("精炼 +1% 暴击伤害");
    }
    if (key === "advance") {
      const n = Number(prog.advance) || 0;
      if (n >= 5) return toast("升阶已满（5 阶）", true);
      const g = 2000 + n * 1500, s = 30 + n * 15;
      if ((store.gold || 0) < g) return toast("金币不足（需 " + g + "）", true);
      if ((store.flags.stone || 0) < s) return toast("强化石不足（需 " + s + "）", true);
      if (!prog.bonus) prog.bonus = {};
      store.gold -= g; store.flags.stone -= s;
      prog.advance = n + 1;
      prog.bonus.atk = (Number(prog.bonus.atk) || 0) + 10;
      prog.bonus.def = (Number(prog.bonus.def) || 0) + 3;
      await save(); render(); return toast("升阶 → " + (n + 1) + " 阶（+10 攻击 / +3 防御）");
    }
    if (key === "awaken") {
      const n = Number(prog.awaken) || 0;
      if (n >= 3) return toast("觉醒已满（3 星）", true);
      const b = 20 + n * 15;
      if ((store.flags.bstone || 0) < b) return toast("突破石不足（需 " + b + "）", true);
      if (!prog.bonus) prog.bonus = {};
      store.flags.bstone -= b;
      prog.awaken = n + 1;
      prog.bonus.hp = (Number(prog.bonus.hp) || 0) + 40;
      prog.bonus.ultPct = (Number(prog.bonus.ultPct) || 0) + 3;
      await save(); render(); return toast("觉醒 → " + (n + 1) + " 星（+40 生命 / 必杀 +3%）");
    }
    if (key === "shop") {
      toast("商店就在个人页的「商店」，装备可买后放入仓库");
      return;
    }
    toast("这个模块还要等配置");
  });
  view().querySelectorAll("[data-og]").forEach((b) => b.onclick = async () => {
    const parts = b.dataset.og.split(":");
    const slot = parts[0], act = parts[1];
    const p = store.orig[o.id] || (store.orig[o.id] = { lv: 1, exp: 0, breaks: 0 });
    if (!p.gear) p.gear = {};
    const gs2 = p.gear[slot] || (p.gear[slot] = { lv: 1, star: 1 });
    if (!store.flags) store.flags = {};
    if (act === "lv") {
      const lv2 = Number(gs2.lv) || 1;
      if (lv2 >= ORIG_GEAR_CULT.maxLv) return toast("这件已满级", true);
      const cs = ORIG_GEAR_CULT.lvStone(lv2), cg = ORIG_GEAR_CULT.lvGold(lv2);
      if ((store.flags.stone || 0) < cs) return toast("强化石不足（需 " + cs + "）", true);
      if ((store.gold || 0) < cg) return toast("金币不足（需 " + cg + "）", true);
      store.flags.stone -= cs; store.gold -= cg; gs2.lv = lv2 + 1;
    } else {
      const sr = Number(gs2.star) || 1;
      if (sr >= ORIG_GEAR_CULT.maxStar) return toast("这件已满星", true);
      const cs2 = ORIG_GEAR_CULT.starShards(sr), cg2 = ORIG_GEAR_CULT.starGold(sr);
      if ((store.flags.shards || 0) < cs2) return toast("碎片不足（需 " + cs2 + "）", true);
      if ((store.gold || 0) < cg2) return toast("金币不足（需 " + cg2 + "）", true);
      store.flags.shards -= cs2; store.gold -= cg2; gs2.star = sr + 1;
    }
    await save(); render();
  });
  if ($("btnPlayOrig")) $("btnPlayOrig").onclick = () => {
    try { localStorage.setItem("rpg2:playAs", o.id); } catch (e) {}
    location.href = "battle.html";
  };
  if ($("btnOrigGrade")) $("btnOrigGrade").onclick = async () => {
    const gi = Number(prog.grade) || 0;
    const nG = GRADE[gi + 1];
    if (!nG) return toast("资历已满", true);
    const ms = Number(store.flags.manuscript) || 0, gold = Number(store.gold) || 0;
    const cost = 1000 * (gi + 1);
    if (ms < nG.cost) return toast("资历手稿不足（需 " + nG.cost + "）", true);
    if (gold < cost) return toast("金币不足（需 " + fmt(cost) + "）", true);
    store.flags.manuscript = ms - nG.cost; store.gold = gold - cost;
    prog.grade = gi + 1; store.orig[o.id] = prog;
    await save(); render(); toast("🎖 资历晋升 → " + nG.key);
  };
  if ($("btnOrigApt")) $("btnOrigApt").onclick = async () => {
    const ai = Number(prog.apt) || 1;
    const nA = APTITUDE[ai];
    if (!nA) return toast("资质已满", true);
    const md = Number(store.flags.medal) || 0, gold = Number(store.gold) || 0;
    const cost = 800 * ai;
    if (md < nA.cost) return toast("资质勋章不足（需 " + nA.cost + "）", true);
    if (gold < cost) return toast("金币不足（需 " + fmt(cost) + "）", true);
    store.flags.medal = md - nA.cost; store.gold = gold - cost;
    prog.apt = ai + 1; store.orig[o.id] = prog;
    await save(); render(); toast("⭐ 资质评估 → " + (ai + 1) + "★");
  };
  if ($("btnOrigRename")) $("btnOrigRename").onclick = async () => {
    const v = prompt("新的名字（最多 12 字）", oname);
    if (!v) return;
    prog.name = v.trim().slice(0, 12) || oname;
    store.orig[o.id] = prog;
    await save(); render(); toast("已改名");
  };
  if ($("btnOrigLevel")) $("btnOrigLevel").onclick = async () => {
    const needNow = CHAR.expNeed(lv);
    if (lv >= CHAR.maxLevel) return toast("已满级", true);
    if ((Number(prog.exp) || 0) < needNow) return toast("经验不够（需 " + fmt(needNow) + "）", true);
    prog.exp = (Number(prog.exp) || 0) - needNow;
    prog.lv = lv + 1;
    prog.free = (Number(prog.free) || 0) + 2;
    store.orig[o.id] = prog;
    await save(); render(); toast("升级！Lv" + (lv + 1));
  };
  if ($("btnOrigBreak")) $("btnOrigBreak").onclick = async () => {
    if (brk >= 5) return;
    const cost = BRK_COST[brk];
    if (lv < (Number(cost.at) || 0)) return toast("需要 Lv" + cost.at + " 才能突破", true);
    store.flags = store.flags || {};
    if ((Number(store.flags.bstone) || 0) < cost.b) return toast("突破石不够（需要 " + cost.b + "）", true);
    if ((Number(store.gold) || 0) < cost.g) return toast("金币不够（需要 " + fmt(cost.g) + "）", true);
    store.flags.bstone = (Number(store.flags.bstone) || 0) - cost.b;
    store.gold = (Number(store.gold) || 0) - cost.g;
    store.orig = store.orig || {};
    store.orig[o.id] = Object.assign({}, prog, { breaks: brk + 1 });
    addReceipt(store, "突破", o.name + " 第 " + (brk + 1) + " 突", { gold: -cost.g, items: [{ name: "突破石", count: -cost.b }], note: "全属性 +3%" });
    await save(); render(); toast("⚡ 突破成功：" + (brk + 1) + "/3");
  };
}

function renderStore() {
  const ch = activeChar(), all = store.items || [];
  const fl = store.flags || {};
  const F = window.__stFilter || (window.__stFilter = { cat: "all", sort: "lv" });
  const batch = window.__batch || (window.__batch = { on: false, sel: {} });

  const filtered = all.filter((it) => F.cat === "all" || it.cat === F.cat);
  const rank = { R: 1, SR: 2, SSR: 3, UR: 4 };
  filtered.sort((a, b) => {
    if (F.sort === "rarity") {
      const d = (rank[b.data.rarity] || 0) - (rank[a.data.rarity] || 0);
      if (d) return d;
    }
    if (F.sort === "name") return String(a.data.name).localeCompare(String(b.data.name));
    return (Number(b.data.lv) || 1) - (Number(a.data.lv) || 1);
  });

  const chip = (key, label) => '<button data-f="' + key + '" style="font-size:11px;padding:3px 9px;border-color:' + (F.cat === key ? "#6ea8fe" : "#3a3a5c") + ';color:' + (F.cat === key ? "#cfe6ff" : "#8a8ab0") + ';">' + label + '</button>';
  const tool = '<div class="card" style="padding:10px 12px;">' +
    '<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;">' +
      chip("all", "全部") + chip("weapon", "⚔️武器") + chip("armor", "🛡️防具") + chip("accessory", "💍饰品") +
      '<span style="width:10px;"></span>' +
      '<button data-sort="lv" style="font-size:11px;padding:3px 9px;border-color:' + (F.sort === "lv" ? "#6ea8fe" : "#3a3a5c") + ';">等级↓</button>' +
      '<button data-sort="rarity" style="font-size:11px;padding:3px 9px;border-color:' + (F.sort === "rarity" ? "#6ea8fe" : "#3a3a5c") + ';">品质↓</button>' +
      '<button data-sort="name" style="font-size:11px;padding:3px 9px;border-color:' + (F.sort === "name" ? "#6ea8fe" : "#3a3a5c") + ';">名字</button>' +
      '<span style="margin-left:auto;"></span>' +
      (batch.on
        ? '<button id="bAll" style="font-size:11px;">全选</button><button id="bRun" style="font-size:11px;border-color:#ff9b9b;color:#ff9b9b;">分解选中(' + Object.keys(batch.sel).length + ')</button><button id="bExit" style="font-size:11px;">退出</button>'
        : '<button id="bOn" style="font-size:11px;">🧹 批量分解</button>') +
    '</div></div>';

  const resCard = '<div class="card"><div class="card-title">资源</div>' +
    '<div class="row"><span class="k">金币</span><span class="v">' + fmt(Number(store.gold) || 0) + '</span></div>' +
    '<div class="row"><span class="k">碎片</span><span class="v">' + fmt(Number(fl.shards) || 0) + '</span></div>' +
    '<div class="row"><span class="k">强化石</span><span class="v">' + fmt(Number(fl.stone) || 0) + '</span></div>' +
    '<div class="row"><span class="k">突破石</span><span class="v">' + fmt(Number(fl.bstone) || 0) + '</span></div>' + '</div>';

  if (!filtered.length) {
    view().innerHTML = tool + resCard + '<div class="card"><div class="hint">' + (all.length ? "这个筛选下没有装备" : "仓库是空的") + '</div></div>';
    bindStoreTool(filtered);
    return;
  }

  const rows = filtered.map((it) => {
    const d = it.data || {};
    const rc = RARITY_COLOR[d.rarity] || "#eaeaea";
    const picked = !!batch.sel[it.id];
    return '<div style="border:1px solid ' + (picked ? "#ff9b9b" : rc + "55") + ';border-radius:10px;padding:10px;margin:8px 0;">' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
        (batch.on ? '<input type="checkbox" data-pick="' + it.id + '" ' + (picked ? 'checked' : '') + '>' : '') +
        '<span style="font-weight:600;cursor:pointer;text-decoration:underline dotted;color:' + rc + ';" data-detail="' + it.id + '">' + (it.lock ? "🔒 " : "") + esc(d.name) + '</span>' +
        '<span class="tag" style="border-color:' + rc + '55;color:' + rc + ';">' + (d.rarity || "") + ' · ' + (d.star || 1) + '★ · Lv' + (d.lv || 1) + '</span>' +
        '<span style="margin-left:auto;color:#ffd666;font-size:11.5px;">售价 ' + sellPrice(it) + '</span></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">' +
        (ch && isEquip(it) ? '<button data-equip="' + it.id + '">穿上</button>' : '') +
        '<button data-lock="' + it.id + '">' + (it.lock ? '🔓 解锁' : '🔒 锁定') + '</button>' +
        '<button data-sell="' + it.id + '" style="border-color:#ffd666;color:#ffd666;">出售</button>' +
        '<button data-dis="' + it.id + '" style="border-color:#ff9b9b;color:#ff9b9b;">分解</button>' +
      '</div></div>';
  }).join("");

  view().innerHTML = tool + resCard +
    '<div class="card"><div class="card-title">仓库（' + filtered.length + ' / ' + all.length + ' 件）</div>' + rows + '</div>';
  bindStoreTool(filtered);
}

function bindStoreTool(filtered) {
  const F = window.__stFilter, batch = window.__batch;
  view().querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { F.cat = b.dataset.f; render(); });
  view().querySelectorAll("[data-sort]").forEach((b) => b.onclick = () => { F.sort = b.dataset.sort; render(); });
  if ($("bOn")) $("bOn").onclick = () => { batch.on = true; batch.sel = {}; render(); };
  if ($("bExit")) $("bExit").onclick = () => { batch.on = false; batch.sel = {}; render(); };
  if ($("bAll")) $("bAll").onclick = () => {
    filtered.forEach((it) => { if (!it.lock) batch.sel[it.id] = 1; });
    render();
  };
  if ($("bRun")) $("bRun").onclick = async () => {
    const ids = Object.keys(batch.sel);
    if (!ids.length) return toast("还没选装备", true);
    if (!confirm("确定分解这 " + ids.length + " 件？（锁定的会跳过）")) return;
    let ok = 0, skip = 0;
    ids.forEach((id) => {
      const r = dismantle(store, id);
      if (r.ok) ok++; else skip++;
    });
    addReceipt(store, "批量分解", ok + " 件", { note: "跳过 " + skip });
    batch.on = false; batch.sel = {};
    await save(); render();
    toast("批量分解：成功 " + ok + " 件" + (skip ? "，跳过 " + skip : ""));
  };
  view().querySelectorAll("[data-pick]").forEach((c) => c.onchange = () => {
    if (c.checked) batch.sel[c.dataset.pick] = 1; else delete batch.sel[c.dataset.pick];
    render();
  });
  view().querySelectorAll("[data-inherit]").forEach((b) => b.onclick = () => openInherit(b.dataset.inherit));
  view().querySelectorAll("[data-detail]").forEach((b) => b.onclick = () => showItemDetail(findItem(store, b.dataset.detail)));
  view().querySelectorAll("[data-equip]").forEach((b) => b.onclick = async () => {
    const r = equip(store, activeChar().id, b.dataset.equip);
    if (!r.ok) return toast(r.why, true);
    await save(); render();
  });
  view().querySelectorAll("[data-cult]").forEach((b) => b.onclick = async () => {
    const it = findItem(store, b.dataset.cult), r = cultApply(store, it, "level");
    if (!r.ok) return toast(r.why, true);
    bumpDaily(store, "cults");
    addReceipt(store, "培养", it.data.name + " → Lv" + r.lv);
    await save(); render();
  });
  view().querySelectorAll("[data-star]").forEach((b) => b.onclick = async () => {
    const it = findItem(store, b.dataset.star), r = cultApply(store, it, "star");
    if (!r.ok) return toast(r.why, true);
    bumpDaily(store, "cults");
    await save(); render();
  });
  view().querySelectorAll("[data-lock]").forEach((b) => b.onclick = async () => {
    const it = findItem(store, b.dataset.lock); it.lock = !it.lock;
    await save(); render();
  });
  view().querySelectorAll("[data-sell]").forEach((b) => b.onclick = async () => {
    const it = findItem(store, b.dataset.sell);
    if (!confirm("出售「" + it.data.name + "」？")) return;
    const r = sell(store, b.dataset.sell);
    if (!r.ok) return toast(r.why, true);
    addReceipt(store, "出售", it.data.name, { gold: r.price });
    await save(); render();
  });
  view().querySelectorAll("[data-dis]").forEach((b) => b.onclick = async () => {
    const it = findItem(store, b.dataset.dis);
    if (!confirm("分解「" + it.data.name + "」？")) return;
    const r = dismantle(store, b.dataset.dis);
    if (!r.ok) return toast(r.why, true);
    addReceipt(store, "分解", it.data.name, { items: [{ name: "强化石", count: r.stone }] });
    await save(); render();
  });
}

// 🏪 每日货架：按日期生成固定一批（同一天所有人一样），买过就没了
function dayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
function shelfOf(store) {
  const day = dayKey();
  const f = (store.flags = store.flags || {});
  if (!f.shop || f.shop.day !== day) {
    // 用日期做种子，保证同一天稳定
    let seed = 0;
    for (const ch of day) seed = (seed * 31 + ch.charCodeAt(0)) % 100000;
    const pickN = (list, n) => {
      const out = [];
      // 🎚 货架抽取范围：R ~ SR（SR 还没设计时自然只剩 R）
      const allowed = list.filter((x) => x.rarity === "R" || x.rarity === "SR");
      const pool = (allowed.length ? allowed : list).slice();
      for (let i = 0; i < n && pool.length; i++) {
        seed = (seed * 1103515245 + 12345) % 2147483647;
        out.push(pool.splice(seed % pool.length, 1)[0]);
      }
      return out;
    };
    f.shop = {
      day,
      weapons: pickN(WEAPONS, 3).map((x) => x.id),
      armors: pickN(ARMORS, 2).map((x) => x.id),
      accessories: pickN(ACCESSORIES, 2).map((x) => x.id),
      bought: []
    };
  }
  return f.shop;
}
// 💹 装备每日物价浮动（±25%，按日期+装备 id 稳定）
function priceFactor(day, id) {
  let h = 0;
  const s = day + "|" + id;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1000;
  return 0.75 + (h % 51) / 100;   // 0.75 ~ 1.25
}
function shopPrice(cat, d) {
  const base = (SHOP_PRICE[cat] || {})[d.rarity] || 500;
  const f = priceFactor(dayKey(), d.id);
  const price = Math.max(5, Math.round(base * f / 5) * 5);
  return { base, price, pct: Math.round((f - 1) * 100) };
}

function shelfItems(store) {
  const sh = shelfOf(store);
  const pick = (list, ids) => list.filter((x) => ids.indexOf(x.id) >= 0);
  return {
    weapons: pick(WEAPONS, sh.weapons),
    armors: pick(ARMORS, sh.armors),
    accessories: pick(ACCESSORIES, sh.accessories),
    bought: sh.bought || []
  };
}

// 🔁 继承面板：选一件同部位、且培养更低的装备作为目标
function openInherit(fromId) {
  const src = findItem(store, fromId);
  if (!src) return;
  const targets = (store.items || []).filter((it) => it.id !== fromId && it.cat === src.cat && inheritCheck(store, fromId, it.id).ok);
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;display:flex;align-items:center;justify-content:center;";
  ov.innerHTML = '<div class="card" style="width:min(520px,94vw);max-height:80vh;overflow:auto;margin:0;">' +
    '<div class="card-title">🔁 继承：' + esc(src.data.name) + '（Lv' + (src.data.lv || 1) + ' · ' + (src.data.star || 1) + '★）</div>' +
    '<div class="hint">把培养搬到目标装备，源装备回到 Lv1/1★；同部位才能继承。</div>' +
    (targets.length
      ? targets.map((t) => {
          const c = inheritCheck(store, fromId, t.id).cost;
          return '<div class="row"><span class="k">' + esc(t.data.name) +
            '<div class="hint">Lv' + (t.data.lv || 1) + ' · ' + (t.data.star || 1) + '★ → Lv' + Math.max(t.data.lv || 1, src.data.lv || 1) +
            ' · ' + Math.max(t.data.star || 1, src.data.star || 1) + '★　费用 ' + c.gold + ' 金</div></span>' +
            '<span class="v"><button data-go="' + t.id + '">继承</button></span></div>';
        }).join("")
      : '<div class="hint">没有可继承的目标（同部位且培养更低）</div>') +
    '<div style="margin-top:10px;"><button id="inhClose" style="width:100%;">关闭</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#inhClose").onclick = () => ov.remove();
  ov.querySelectorAll("[data-go]").forEach((b) => b.onclick = async () => {
    const r = inheritApply(store, fromId, b.dataset.go);
    if (!r.ok) { toast(r.why, true); return; }
    addReceipt(store, "继承", src.data.name + " → " + findItem(store, b.dataset.go).data.name, { gold: -r.gold });
    ov.remove();
    await save(); render();
    toast("继承完成：目标 Lv" + r.lv + " · " + r.star + "★（花费 " + r.gold + " 金）");
  });
}

// 🏪 每日限购计数（按本地日期重置）
function shopDay() {
  store.flags = store.flags || {};
  const k = dayKey();
  const d = store.flags.shopDay;
  if (!d || d.day !== k) store.flags.shopDay = { day: k, count: {} };
  return store.flags.shopDay;
}

// 🍱 战前准备文案
function buffText(meal) {
  const b = (meal && meal.buff) || {};
  const p = [];
  if (b.hpPct) p.push("生命 +" + b.hpPct + "%");
  if (b.atkPct) p.push("攻击 +" + b.atkPct + "%");
  if (b.defPct) p.push("防御 +" + b.defPct + "%");
  if (b.spd) p.push("速度 +" + b.spd);
  return p.join(" · ") || "无加成";
}

function renderShop() {
  const tab = window.__shopTab || "gear";
  const shelf = shelfItems(store);
  const grp = (title, cat, list) => card(title, list.map((d) => {
    const sp = shopPrice(cat, d);
    const sold = shelf.bought.indexOf(d.id) >= 0;
    const trend = sp.pct === 0 ? '' : (sp.pct > 0
      ? ' <span class="hint" style="color:#ff9b9b;">↑' + sp.pct + '%</span>'
      : ' <span class="hint" style="color:#7ee787;">↓' + Math.abs(sp.pct) + '%</span>');
    return '<div class="row"><span class="k">' + esc(d.name) + ' <span class="tag">' + d.rarity + '</span></span>' +
      '<span class="v"><span style="color:#ffd666;">' + sp.price + ' 金</span>' + trend +
      ' <span class="hint" style="text-decoration:line-through;">' + sp.base + '</span> ' +
      (sold ? '<span class="hint">已售罄</span>' : '<button data-buy="' + cat + ':' + d.id + '">购买</button>') +
      '</span></div>';
  }).join("") || '<div class="hint">今天的货架空了</div>');

  const tabBar = '<div class="tree-tabs" style="margin-bottom:10px;">' +
    '<button data-shoptab="store"' + (tab === "store" ? ' class="on"' : '') + '>🏪 便利店</button>' +
    '<button data-shoptab="gear"' + (tab === "gear" ? ' class="on"' : '') + '>⚔️ 装备店</button>' +
    '</div>';

  const storeHtml = tabBar +
    (store.flags && store.flags.meal
      ? '<div class="card"><div class="card-title">🍱 已准备</div><div class="hint">' + esc(store.flags.meal.name) + '：' + buffText(store.flags.meal) + '（下一场战斗生效）</div></div>'
      : "") +
    card("🏪 便利店 · 日常补给",
      CONSUMABLES.map((p) => {
        const own = Number((store.flags || {})[p.id]) || 0;
        const bought = Number(shopDay().count[p.id]) || 0;
        const left = p.limit ? Math.max(0, p.limit - bought) : null;
        const soldOut = left !== null && left <= 0;
        return '<div class="row"><span class="k">' + esc(p.name) +
          ' <span class="hint">持有 ' + own + (left !== null ? ' · 今日剩 ' + left + '/' + p.limit : '') + '</span>' +
          '<div class="hint">' + esc(p.desc) + '</div></span>' +
          '<span class="v"><span style="color:#ffd666;">' + p.price + ' 金</span> ' +
          (soldOut ? '<span class="hint">今日售罄</span>' : '<button data-buy="prop:' + p.id + '">购买</button>') +
          (p.meal && own > 0 ? ' <button data-eat="' + p.id + '" style="border-color:#7ee787;color:#7ee787;">食用</button>' : '') +
          '</span></div>';
      }).join(""));

  const gearHtml = tabBar +
    '<div class="card" style="padding:10px 12px;"><div style="display:flex;justify-content:space-between;align-items:center;">' +
      '<span style="font-size:11px;color:#8a8ab0;">⚔️ 今日货架（每天 0 点换新，卖完就没有）</span>' +
      '<span style="font-size:11px;color:#6a6a86;">' + dayKey() + '</span></div></div>' +
    grp("⚔️ 武器", "weapon", shelf.weapons) + grp("🛡️ 防具", "armor", shelf.armors) + grp("💍 饰品", "accessory", shelf.accessories) +
    card("♻️ 回收（把仓库里的装备换成金币）",
      (store.items || []).length
        ? (store.items || []).map((it) => {
            const d = it.data || {};
            return '<div class="row"><span class="k">' + (it.lock ? "🔒 " : "") + esc(d.name) +
              '<div class="hint">' + (d.rarity || "") + ' · ' + (d.star || 1) + '★ · Lv' + (d.lv || 1) + '</div></span>' +
              '<span class="v"><span style="color:#ffd666;">' + sellPrice(it) + ' 金</span> ' +
              (it.lock ? '<span class="hint">已锁定</span>' : '<button data-sellshop="' + it.id + '" style="border-color:#ffd666;color:#ffd666;">出售</button>') +
              '</span></div>';
          }).join("")
        : '<div class="hint">仓库里没有可卖的东西</div>');

  view().innerHTML = tab === "store" ? storeHtml : gearHtml;
  view().querySelectorAll("[data-shoptab]").forEach((b) => b.onclick = () => {
    window.__shopTab = b.dataset.shoptab;
    render();
  });

  view().querySelectorAll("[data-eat]").forEach((b) => b.onclick = async () => {
    const p = CONSUMABLES.find((x) => x.id === b.dataset.eat);
    if (!p || !p.meal) return;
    store.flags = store.flags || {};
    const own = Number(store.flags[p.id]) || 0;
    if (own <= 0) return toast("还没买", true);
    store.flags[p.id] = own - 1;
    store.flags.meal = { id: p.id, name: p.name, buff: p.meal };
    addReceipt(store, "便利店", "食用 " + p.name, { note: "战前准备" });
    await save(); render();
    toast("🍱 已准备：" + p.name + "（下一场生效）");
  });

  view().querySelectorAll("[data-sellshop]").forEach((b) => b.onclick = async () => {
    const it = findItem(store, b.dataset.sellshop);
    if (!it) return;
    const price = sellPrice(it);
    if (!confirm("出售「" + it.data.name + "」得 " + price + " 金？")) return;
    const r = sell(store, b.dataset.sellshop);
    if (!r.ok) return toast(r.why, true);
    addReceipt(store, "出售", it.data.name, { gold: r.price });
    await save(); render();
  });

  view().querySelectorAll("[data-buy]").forEach((b) => b.onclick = async () => {
    const [cat, id] = b.dataset.buy.split(":");
    let def = null, price = 0;
    if (cat === "weapon") { def = WEAPONS.find((x) => x.id === id); price = shopPrice("weapon", def).price; }
    if (cat === "armor") { def = ARMORS.find((x) => x.id === id); price = shopPrice("armor", def).price; }
    if (cat === "accessory") { def = ACCESSORIES.find((x) => x.id === id); price = shopPrice("accessory", def).price; }
    if (cat === "material") {
      const mp = id === "manuscript" ? 350 : 600;
      const nm = id === "manuscript" ? "资历手稿" : "资质鉴定勋章";
      if ((Number(store.gold) || 0) < mp) return toast("金币不够", true);
      store.gold -= mp;
      store.flags = store.flags || {};
      store.flags[id] = (Number(store.flags[id]) || 0) + 1;
      addReceipt(store, "购买", nm, { gold: -mp });
      await save(); render(); return;
    }
    if (cat === "prop") {
      def = CONSUMABLES.find((x) => x.id === id); price = def.price;
      if (def.limit) {
        const sd = shopDay();
        const bought = Number(sd.count[id]) || 0;
        if (bought >= def.limit) return toast("今日限购已满（" + def.limit + " 件），明天再来", true);
      }
      if ((store.gold || 0) < price) return toast("金币不够", true);
      store.gold -= price;
      store.flags[id] = (store.flags[id] || 0) + 1;
      if (def.limit) {
        const sd = shopDay();
        sd.count[id] = (Number(sd.count[id]) || 0) + 1;
      }
      addReceipt(store, "购买", def.name, { gold: -price });
      await save(); render(); return;
    }
    if (!def) return;
    if ((store.gold || 0) < price) return toast("金币不够", true);
    store.gold -= price;
    store.items.push(makeItem(cat, def));
    try { shelfOf(store).bought.push(def.id); } catch (e) {}
    addReceipt(store, "购买", def.name, { gold: -price, items: [{ name: def.name, count: 1 }] });
    await save(); render();
  });
}

function render() {
  const hostMode = (() => { try { if (localStorage.getItem("rpg2:host") === "1") return true; } catch (e) {} return box === "zynSD117"; })();
  document.body.classList.toggle("host-mode", hostMode);
  if (!hostMode) {
    const b = document.querySelector('[data-tab="orig"]');
    if (b) b.style.display = "none";
    if (tab === "orig") tab = "char";
  } else {
    // 🧬 主机端：布局与玩家端一致，但角色是「原创角色」
    document.querySelectorAll('[data-tab]').forEach((b) => {
      if (b.dataset.tab === "char") b.textContent = "🧬 原创角色";
      if (b.dataset.tab === "orig") { b.style.display = "none"; return; }
      b.style.display = "";
    });
    if (tab === "orig") tab = "char";
    const sb = $("btnSwitchBox");
    if (sb) sb.style.display = "none";
    // 🚪 主机专属：到处看看（基地设施）
    if (!document.querySelector('[data-tab="base"]')) {
      const nav = document.querySelector(".nav");
      if (nav) {
        const b = document.createElement("button");
        b.setAttribute("data-tab", "base");
        b.textContent = "🚪 到处看看";
        b.onclick = () => { tab = "base"; render(); };
        nav.appendChild(b);
      }
    }
  }
  if (!store) {
    view().innerHTML =
      '<div class="card"><div class="card-title">这个位号里是旧版存档（v1）</div>' +
      '<div class="hint">新版不会读取也不会覆盖它。请选一种方式开始：</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">' +
        '<button id="btnLocal">💾 本机试用（不写云端）</button>' +
        '<button id="btnNewBox">🆕 换一个新位号正式玩</button>' +
      '</div></div>';
    const bLocal = document.getElementById("btnLocal");
    if (bLocal) bLocal.onclick = () => {
      store = newStore();
      ensureSeed();
      toast("本机试用：不会写云端，放心点");
      render();
    };
    const bNew = document.getElementById("btnNewBox");
    if (bNew) bNew.onclick = () => {
      const nb = prompt("输入一个新的位号（英文/数字，例如 zyn2）", "zyn2");
      if (!nb) return;
      localStorage.setItem("rpg2:box", nb);
      location.href = "create.html?box=" + encodeURIComponent(nb);
    };
    return;
  }
  document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  (store.chars || []).forEach((c) => { if (c.tp == null) c.tp = talentPointsOf(c); });
  try {
    if (tab === "orig" && !ORIGINALS.length) pullOriginals().then(() => { try { render(); } catch (e) {} }).catch(() => {});
    if (hostMode && (tab === "char" || tab === "orig")) { renderOrig(); return; }
    if (hostMode && tab === "cult") { renderOrigCult(); return; }
    if (hostMode && tab === "talent") {
      view().innerHTML = card("🌳 天赋（原创角色）", '<div class="hint">按玩家端天赋树接入中；解锁阶段待配置。</div>');
      return;
    }
    if (hostMode && tab === "base") { renderBase(); return; }
    if (tab === "char") renderChar();
    else if (tab === "talent") renderTalent();
    else if (tab === "cult") renderCult();
    else if (tab === "orig") renderOrig();
    else if (tab === "rank") renderRank();
    else if (tab === "daily") renderDaily();
    else if (tab === "store") renderStore();
    else renderShop();
  } catch (e) {
    view().innerHTML = '<div class="card"><div class="card-title">页面出错</div><div class="hint">' + String(e && e.message || e) + '</div></div>';
  }
}

document.querySelectorAll("[data-tab]").forEach((b) => {
  b.onclick = () => { tab = b.dataset.tab; render(); };
});
$("btnSave").onclick = () => save();
document.addEventListener("click", async (e) => {
  const b = e.target && e.target.closest ? e.target.closest("#btnNick") : null;
  if (!b || !store) return;
  const v = prompt("账号昵称（最多 12 字，大厅/聊天显示）", (store.account && store.account.nick) || "");
  if (v === null) return;
  store.account = store.account || { id: box, nick: "" };
  store.account.nick = v.trim().slice(0, 12);
  try { localStorage.setItem("rpg2:nick", store.account.nick); } catch (err) {}
