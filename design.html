async function sha(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("xd2|" + s));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function deny(msg) {
  $("view").innerHTML = '<div class="card"><div class="card-title">🔒 需要设计师口令</div><div class="hint">' + esc(msg) + '</div>' +
    '<div style="margin-top:10px;"><a href="index.html"><button>← 回玩家端</button></a></div></div>';
}
async function gate() {
  const stored = localStorage.getItem(PWKEY);
  if (stored && localStorage.getItem("rpg2:designok") === stored) { localStorage.setItem("rpg2:host", "1"); return true; }
  if (!stored) {
    const p1 = prompt("首次使用：设置设计师口令（4 位以上）");
    if (!p1 || p1.length < 4) { deny("口令太短。"); return false; }
    const h = await sha(p1);
    localStorage.setItem(PWKEY, h); localStorage.setItem("rpg2:designok", h); localStorage.setItem("rpg2:host", "1");
    alert("口令已设置，这台设备已记住。");
    return true;
  }
  for (let i = 0; i < 3; i++) {
    const p = prompt("请输入设计师口令（第 " + (i + 1) + " 次）");
    if (p == null) { deny("已取消。"); return false; }
    if ((await sha(p)) === stored) { localStorage.setItem("rpg2:designok", stored); localStorage.setItem("rpg2:host", "1"); return true; }
  }
  deny("口令错误 3 次。");
  return false;
}

const blankGear = () => {
  const o = {};
  GEAR_SLOTS.forEach((k) => { o[k] = { name: "", atk: 0, hp: 0, def: 0, res: 0, spd: 0, critRate: 0 }; });

};

  name: "", title: "", role: "通用", desc: "", gear: "", notes: "",

  basic: { hp: 15, atk: 15, def: 15, res: 15 },
  spec: { str: 9, int: 9, tech: 9, agi: 9 }

const sum = (o) => Object.values(o).reduce((a, b) => a + (Number(b) || 0), 0);

// 最终面板：固定值 + 四维%（每点 5%）+ 专精换算
function calc(d) {
  const T = ORIGIN[d.rare ? "rare" : "normal"];
  const f = T.fix;
  const b = d.basic, s = d.spec;
  const pct = (n) => 1 + (Number(n) || 0) * 5 / 100;
  const atk0 = (f.atk + (s.str || 0) * 2 + (s.int || 0) * 2 + (s.tech || 0) * 2) * pct(b.atk);
  const hp0 = f.hp * pct(b.hp);
  const def0 = f.def * pct(b.def);
  const res0 = f.res * pct(b.res);
  const spd0 = f.spd + (s.agi || 0) * 0.6;
  // 🗡 专属装备加成
  const g = d.gearObj || {};
  const gs = { atk: 0, hp: 0, def: 0, res: 0, spd: 0, critRate: 0 };
  GEAR_SLOTS.forEach((k) => {
    const it = g[k] || {};
    Object.keys(gs).forEach((key) => { gs[key] += Number(it[key]) || 0; });
  });
  const atk = atk0 + gs.atk, hp = hp0 + gs.hp, def = def0 + gs.def, res = res0 + gs.res, spd = spd0 + gs.spd;
  const critRate = f.critRate + gs.critRate;
  const power = powerOf({ atk, hp, def, res, spd, critRate, critDmg: f.critDmg });
  return { atk, hp, def, res, spd, critRate, critDmg: f.critDmg, power, T, gs };
}

  const line = (k, v) => '<div class="ostat"><span>' + k + '</span><b>' + v + '</b></div>';
  return '<div class="card"><div class="card-title" style="color:#ffb347;">最终面板预览</div>' +
    '<div style="font-size:18px;font-weight:800;margin-bottom:2px;">' + esc(d.name || "（未命名）") +
      (d.title ? ' <span class="obadge">' + esc(d.title) + '</span>' : '') + '</div>' +
    '<div class="hint">' + esc(r.T.label) + ' · ' + esc(d.role) + '</div>' +
    (d.desc ? '<div class="hint" style="margin-top:6px;color:#c9bda3;line-height:1.7;">' + esc(d.desc) + '</div>' : '') +
    '<div class="ostat" style="margin-top:8px;"><span>战力</span><b style="color:#ffb347;font-size:16px;">' + r.power + '</b></div>' +
    line("攻击", Math.round(r.atk)) + line("生命", Math.round(r.hp)) + line("防御", Math.round(r.def)) +
    line("法抗", Math.round(r.res)) + line("速度", Math.round(r.spd * 10) / 10) +
    line("暴击率", r.critRate + "%") + line("暴击伤害", r.critDmg + "%") +
    (d.gear ? '<div class="hint" style="margin-top:8px;white-space:pre-wrap;">装备：' + esc(d.gear) + '</div>' : '') +
    '</div>';
}

    '<div class="ogrid2">' +
      '<div><div class="hint">名字</div><input class="ofield" id="fName" maxlength="16" value="' + esc(d.name) + '" placeholder="例如：灰烬"></div>' +
      '<div><div class="hint">称号</div><input class="ofield" id="fTitle" maxlength="20" value="' + esc(d.title) + '" placeholder="例如：不眠的守夜人"></div>' +
    '</div>' +
    '<div class="ogrid2" style="margin-top:10px;">' +
      '<div><div class="hint">定位预设</div><select class="ofield" id="fPreset">' +

      '</select></div>' +
      '<div><div class="hint">稀有度模板</div><select class="ofield" id="fRare">' +
        '<option value="0"' + (!d.rare ? " selected" : "") + '>普通原创（固定值较低 / 加点 60+36）</option>' +
        '<option value="1"' + (d.rare ? " selected" : "") + '>稀有原创（固定值更高 / 加点 80+48）</option>' +
      '</select></div>' +
    '</div>' +
    '<div style="margin-top:10px;"><div class="hint">描述</div><textarea class="ofield" id="fDesc" rows="3" placeholder="性格、来历、战斗风格…">' + esc(d.desc) + '</textarea></div>' +

    '<div class="card-title" style="margin-top:14px;color:#ffb347;">① 固定数值（所有' + esc(T.label) + '统一，比玩家略高）</div>' +
    '<div class="ostat"><span>攻击</span><b>' + T.fix.atk + '</b></div>' +
    '<div class="ostat"><span>生命</span><b>' + T.fix.hp + '</b></div>' +
    '<div class="ostat"><span>防御</span><b>' + T.fix.def + '</b></div>' +
    '<div class="ostat"><span>法抗</span><b>' + T.fix.res + '</b></div>' +
    '<div class="ostat"><span>速度</span><b>' + T.fix.spd + '</b></div>' +
    '<div class="ostat"><span>暴击率 / 暴伤</span><b>' + T.fix.critRate + '% / ' + T.fix.critDmg + '%</b></div>' +

    '<div class="card-title" style="margin-top:14px;color:#ffb347;">② 基础四维（' + sum(d.basic) + '/' + T.basicPoints + '，单项上限 ' + T.basicCap + '）</div>' +
    '<div class="hint">每点 +5% 对应属性。剩余 <b style="color:' + (bLeft > 0 ? "#ffcf7a" : "#7ee787") + ';">' + bLeft + '</b> 点</div>' +
    '<div class="ogrid2" style="margin-top:6px;">' +
      '<div class="ostat"><span>生命</span>' + bNum("hp") + '</div>' +
      '<div class="ostat"><span>攻击</span>' + bNum("atk") + '</div>' +
      '<div class="ostat"><span>防御</span>' + bNum("def") + '</div>' +
      '<div class="ostat"><span>法抗</span>' + bNum("res") + '</div>' +
    '</div>' +

    '<div class="card-title" style="margin-top:14px;color:#ffb347;">③ 专精四项（' + sum(d.spec) + '/' + T.specPoints + '，单项上限 ' + T.specCap + '）</div>' +
    '<div class="hint">力量/智力/技巧 每点 +2 攻击，敏捷每点 +0.6 速度。剩余 <b style="color:' + (sLeft > 0 ? "#ffcf7a" : "#7ee787") + ';">' + sLeft + '</b> 点</div>' +
    '<div class="ogrid2" style="margin-top:6px;">' +

    '</div>' +

    '<div class="card-title" style="margin-top:14px;color:#ffb347;">④ 专属装备</div>' +

      '<button id="btnCloud" style="border-color:#6ea8fe;color:#6ea8fe;">☁️ 发布到云端</button>' +
      '<button id="btnCloudPull">☁️ 从云端拉取</button>' +
    '</div></div>';
}

function listHtml(list) {
  if (!list.length) return '<div class="card"><div class="card-title" style="color:#ffb347;">已保存的设计（0）</div><div class="hint">还没有，填好点「保存设计」。</div></div>';
  return '<div class="card"><div class="card-title" style="color:#ffb347;">已保存的设计（' + list.length + '）</div>' +
    list.map((d) => {
      const T = ORIGIN[d.rare ? "rare" : "normal"];
      return '<div class="row"><span class="k">' + esc(d.name || "未命名") +
        ' <span class="hint">' + esc(T.label) + ' · ' + esc(d.role) + (d.title ? " · " + esc(d.title) : "") + '</span>' +
        '<div class="hint">' + esc((d.desc || d.gear || "").slice(0, 40)) + '</div></span>' +
        '<span class="v"><button data-load="' + d.id + '">编辑</button> ' +
        '<button data-del="' + d.id + '" style="border-color:#ff9b9b;color:#ff9b9b;">删除</button></span></div>';
    }).join("") + '</div>';
}

function render() {
  const list = loadAll();
  if (!editing) editing = list[0] || blank();
  $("view").innerHTML =
    '<div class="hint" style="margin-bottom:8px;">原创角色<strong>不写玩家存档</strong>，只存本机；装备为自由填写，不走预设。导出 JSON 可转成游戏内容。</div>' +
    form(editing) + preview(editing) + listHtml(list);
  bind();
}

function bind() {
  const d = editing;
  const T = ORIGIN[d.rare ? "rare" : "normal"];
  $("fName").oninput = () => { d.name = $("fName").value; };
  $("fTitle").oninput = () => { d.title = $("fTitle").value; };
  if ($("fRole")) $("fRole").onchange = () => { d.role = $("fRole").value; };
  // 🎯 定位预设：按当前品质模板缩放加点
  if ($("fPreset")) $("fPreset").onchange = () => {
    const table = d.rare ? RARE_PRESETS : ROLE_PRESETS;
    const p = table[$("fPreset").value];
    if (!p) return;
    const fb = T.basicPoints / (d.rare ? 80 : 60), fs = T.specPoints / (d.rare ? 48 : 36);
    const scale = (obj, k, keys) => {
      const o = {};
      keys.forEach((key) => { o[key] = Math.max(0, Math.round((obj[key] || 0) * k)); });
      return o;
    };
    const bk = ["hp", "atk", "def", "res"], sk = ["str", "int", "tech", "agi"];
    d.basic = scale(p.basic, fb, bk);
    d.spec = scale(p.spec, fs, sk);
    // 补齐/扣除差值，保证总和精确
    const fix = (obj, keys, total, cap) => {
      let diff = total - keys.reduce((s2, k) => s2 + (obj[k] || 0), 0);
      if (diff !== 0) obj[keys[0]] = Math.max(0, Math.min(cap, (obj[keys[0]] || 0) + diff));
    };
    fix(d.basic, bk, T.basicPoints, T.basicCap);
    fix(d.spec, sk, T.specPoints, T.specCap);
    d.role = p.role;
    if (!d.desc) d.desc = p.desc;
    render();
  };
  if ($("fCamp")) $("fCamp").onchange = () => { d.camp = $("fCamp").value; render(); };
  $("fRare").onchange = () => {
    d.rare = $("fRare").value === "1";
    // 换档时按新模板重置加点，避免超出新上限
    d.basic = d.rare ? { hp: 20, atk: 20, def: 20, res: 20 } : { hp: 15, atk: 15, def: 15, res: 15 };
    d.spec = d.rare ? { str: 12, int: 12, tech: 12, agi: 12 } : { str: 9, int: 9, tech: 9, agi: 9 };
    render();
  };
  $("fDesc").oninput = () => { d.desc = $("fDesc").value; };
  // 🗡 专属装备 4 格
  const gearText = (obj) => GEAR_SLOTS.map((s) => {
    const it = (obj || {})[s] || {};
    if (!it.name) return "";
    const parts = [];
    if (it.atk) parts.push("攻击 +" + it.atk);
    if (it.hp) parts.push("生命 +" + it.hp);
    if (it.def) parts.push("防御 +" + it.def);
    if (it.res) parts.push("法抗 +" + it.res);
    if (it.spd) parts.push("速度 +" + it.spd);
    if (it.critRate) parts.push("暴击 +" + it.critRate + "%");
    return it.name + (parts.length ? " — " + parts.join(" · ") : "");
  }).filter(Boolean).join("\n");
  document.querySelectorAll("[data-gslot]").forEach((inp) => inp.onchange = () => {
    const s = inp.dataset.gslot, k = inp.dataset.gkey;
    d.gearObj = d.gearObj || blankGear();
    d.gearObj[s] = d.gearObj[s] || {};
    d.gearObj[s][k] = Math.max(0, Number(inp.value) || 0);
    d.gear = gearText(d.gearObj);
    render();
  });
  GEAR_SLOTS.forEach((s) => {
    const el = $("gname_" + s);
    if (el) el.onchange = () => {
      d.gearObj = d.gearObj || blankGear();
      d.gearObj[s] = d.gearObj[s] || {};
      d.gearObj[s].name = el.value;
      d.gear = gearText(d.gearObj);
    };
  });
  $("fNotes").oninput = () => { d.notes = $("fNotes").value; };
  document.querySelectorAll("[data-basic]").forEach((inp) => {
    inp.onchange = () => {
      const k = inp.dataset.basic;
      let v = Math.floor(Number(inp.value) || 0);
      v = Math.max(0, Math.min(T.basicCap, v));
      v = Math.min(v, T.basicPoints - (sum(d.basic) - d.basic[k]));
      d.basic[k] = v; render();
    };
  });
  document.querySelectorAll("[data-spec]").forEach((inp) => {
    inp.onchange = () => {
      const k = inp.dataset.spec;
      let v = Math.floor(Number(inp.value) || 0);
      v = Math.max(0, Math.min(T.specCap, v));
      v = Math.min(v, T.specPoints - (sum(d.spec) - d.spec[k]));
      d.spec[k] = v; render();
    };
  });
  $("btnSave").onclick = () => {
    if (!d.name.trim()) return alert("先填名字");
    const list = loadAll();
    const i = list.findIndex((x) => x.id === d.id);
    if (i >= 0) list[i] = JSON.parse(JSON.stringify(d)); else list.push(JSON.parse(JSON.stringify(d)));
    saveAll(list); alert("已保存：" + d.name); render();
  };
  $("btnReset").onclick = () => { editing = blank(); render(); };
  const buildGameData = () => {
    const list = loadAll();
    return list.map((x) => {
      const r = calc(x);
      return {
        id: x.id, name: x.name || "未命名", title: x.title || "", role: x.role || "通用",
        rare: !!x.rare, camp: x.camp || "enemy", desc: x.desc || "", gear: x.gear || "", notes: x.notes || "",
    gearObj: x.gearObj || blankGear(),
        gearObj: x.gearObj || blankGear(),
        basic: x.basic, spec: x.spec,
        stats: {
          atk: Math.round(r.atk), hp: Math.round(r.hp), def: Math.round(r.def), res: Math.round(r.res),
          spd: Math.round(r.spd * 10) / 10, critRate: r.critRate, critDmg: r.critDmg, power: r.power
        }
      };
    });
  };
  $("btnGame").onclick = () => {
    const data = buildGameData();
    if (!data.length) return alert("先保存至少一个设计");
    const text = "export const ORIGINALS = " + JSON.stringify(data, null, 2) + ";";
    const w = window.open("", "_blank");
    if (w) { w.document.write("<pre style='white-space:pre-wrap;font:12px/1.5 monospace;'>" + esc(text) + "</pre>"); return; }
    prompt("复制下面的游戏数据：", text);
  };
  // ☁️ 发布到云端（全玩家生效，不用重新部署）
  $("btnCloud").onclick = async () => {
    const data = buildGameData();
    if (!data.length) return alert("先保存至少一个设计");
    if (!confirm("发布 " + data.length + " 个原创角色到云端？所有玩家都会看到。")) return;
    try { await pushOriginals(data); alert("✅ 已发布 " + data.length + " 个原创角色"); }
    catch (e) { alert("发布失败：" + (e && e.message || e)); }
  };
  $("btnCloudPull").onclick = async () => {
    try { await pullOriginals(); alert("已从云端拉取 " + ORIGINALS.length + " 个原创角色"); }
    catch (e) { alert("拉取失败：" + (e && e.message || e)); }
  };
  $("btnExport").onclick = () => {
    const data = JSON.stringify(loadAll(), null, 2);
    const w = window.open("", "_blank");
    if (w) { w.document.write("<pre style='white-space:pre-wrap;font:12px/1.5 monospace;'>" + esc(data) + "</pre>"); return; }
    prompt("复制 JSON：", data);
  };
  $("btnImport").onclick = () => {
    const raw = prompt("粘贴之前导出的 JSON：");
    if (!raw) return;
    try {
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) throw new Error("不是数组");
      saveAll(arr); editing = arr[0] || blank(); render(); alert("导入成功：" + arr.length + " 个");
    } catch (e) { alert("导入失败：" + e.message); }
  };
  document.querySelectorAll("[data-load]").forEach((b) => b.onclick = () => {
    const d2 = loadAll().find((x) => x.id === b.dataset.load);
    if (d2) { editing = JSON.parse(JSON.stringify(d2)); render(); }
  });
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
    if (!confirm("删除这个设计？")) return;
    saveAll(loadAll().filter((x) => x.id !== b.dataset.del));
    editing = blank(); render();
  });
  $("btnLock") && ($("btnLock").onclick = () => {
    if (!confirm("锁定？下次需要重新输入口令。")) return;
    localStorage.removeItem("rpg2:designok"); localStorage.removeItem("rpg2:host"); location.reload();
  });
}

if (await gate()) render();
</script>
</body>
</html>
