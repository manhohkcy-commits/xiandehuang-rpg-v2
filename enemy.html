<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>敌人图鉴 · 闲得慌RPG</title>
<link rel="stylesheet" href="css/app.css?v=d8dee059">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span> 闲得慌RPG <span class="hint">· 敌人图鉴</span></div>
    <a class="hint" href="index.html">← 返回首页</a>
  </div>
  <div id="view"></div>
  <div class="foot">敌人档案：单位信息 / 面板数据 / 装备 / 招式组</div>
</div>
<script type="module">
import { ENEMIES, enemyAt, enemyPower } from "./js/enemies.js?v=6c576b03";

const RARITY_COLOR = { normal: "#8a8ab0", elite: "#6ea8fe", special: "#c9a0ff", boss: "#ff6b6b" };
const TIER_NAME = { boss: "首领", special: "特色", elite: "精英", normal: "普通" };
const TIER_ORDER = ["boss", "special", "elite", "normal"];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("zh-CN");
const card = (title, body) => '<div class="card"><div class="card-title">' + title + '</div>' + body + '</div>';

let lv = 1;

function detail(id, atLv) {
  const e0 = ENEMIES.find((x) => x.id === id);
  if (!e0) return;
  const showLv = atLv || lv;
  const e = enemyAt(id, showLv);
  const tint = RARITY_COLOR[e0.tier] || "#8a8ab0";
  const s = e.stats;
  const statBox = (label, val, big) => '<div style="background:#0d1322;border:1px solid #1e2740;border-radius:9px;padding:7px 9px;">' +
    '<div class="hint" style="font-size:9.5px;">' + label + '</div>' +
    '<div style="font-weight:' + (big ? "800" : "700") + ';font-size:' + (big ? "18px" : "14px") + ';color:' + (big ? "#ffd666" : "#dbe4f3") + ';">' + val + '</div></div>';
  const eqChip = (k, v) => v ? '<span style="display:inline-block;background:#101a2e;border:1px solid #22304d;border-radius:6px;padding:3px 7px;margin:0 4px 4px 0;font-size:11px;">' +
    '<span class="hint">' + k + '</span> ' + esc(v) + '</span>' : "";
  const skCard = (sk) => '<div style="background:#0d1322;border-left:3px solid ' + tint + ';border-radius:7px;padding:7px 9px;margin-bottom:6px;">' +
    '<div style="display:flex;align-items:center;gap:6px;">' +
      '<b style="font-size:13px;">' + esc(sk.name) + '</b>' +
      '<span style="margin-left:auto;font-size:10.5px;color:#8fd8ff;">' + (sk.mult ? sk.mult + "%" : "") + (sk.cd ? ' · CD ' + sk.cd : "") + '</span></div>' +
    '<div class="hint" style="margin-top:2px;">' + esc(sk.desc || "") + '</div></div>';

  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(5,8,16,.88);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;";
  ov.innerHTML = '<div class="card" style="max-width:500px;width:100%;max-height:88vh;overflow:auto;border:1px solid ' + tint + '66;">' +
    '<div style="display:flex;align-items:center;gap:8px;">' +
      '<div style="font-size:21px;font-weight:800;color:' + tint + ';">' + esc(e.name) + '</div>' +
      '<span class="tag" style="border-color:' + tint + ';color:' + tint + ';">' + (TIER_NAME[e0.tier] || "") + '</span>' +
      '<span class="tag" style="margin-left:auto;">⚔️ 战力 ' + fmt(enemyPower(e)) + '</span></div>' +
    '<div class="hint" style="margin:3px 0 8px;">' + esc(e.camp) + ' · ' + esc(e.role) + ' · Lv' + e.lv + '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">' +
      statBox("生命", fmt(s.hp), true) + statBox("攻击", fmt(s.atk), true) + '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;">' +
      statBox("防御", s.def) + statBox("法抗", s.res) + statBox("速度", s.spd) + '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px;">' +
      statBox("暴击率", s.critRate + "%") + statBox("暴击伤害", s.critDmg + "%") + '</div>' +
    (e.desc ? '<div class="hint" style="margin:9px 0;line-height:1.7;">' + esc(e.desc) + '</div>' : "") +
    '<div class="hint" style="font-weight:700;color:#8fd8ff;margin:10px 0 4px;">③ 装备</div>' +
    (eqChip("武器", e.equip.weapon) + eqChip("上装", e.equip.armor) + eqChip("下装", e.equip.armor2) + eqChip("饰品", e.equip.accessory) || '<div class="hint">没有装备</div>') +
    '<div class="hint" style="font-weight:700;color:#8fd8ff;margin:10px 0 4px;">④ 招式组</div>' +
    ((e.skills || []).map(skCard).join("") || '<div class="hint">没有招式</div>') +
    '<div style="display:flex;align-items:center;gap:6px;margin-top:8px;">' +
      '<span class="hint">等级预览</span>' +
      '<input id="dLv" type="number" min="1" max="100" value="' + showLv + '" style="width:66px;padding:3px 6px;">' +
      '<span class="hint">Lv1~100</span>' +
      '<button id="ecClose" style="margin-left:auto;">关闭</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#ecClose").onclick = () => ov.remove();
  const lvIn = ov.querySelector("#dLv");
  if (lvIn) lvIn.onchange = () => { ov.remove(); detail(id, Math.max(1, Math.min(100, Number(lvIn.value) || 1))); };
  ov.onclick = (ev) => { if (ev.target === ov) ov.remove(); };
}

function render() {
  const groups = TIER_ORDER.map((t) => ({ t, list: ENEMIES.filter((e) => e.tier === t) })).filter((g) => g.list.length);
  const bar = '<div class="card" style="padding:8px 10px;"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">' +
    '<span class="hint">等级预览</span><input id="lvIn" type="number" min="1" max="100" value="' + lv + '" style="width:70px;padding:3px 6px;">' +
    '<span class="hint">Lv1~100（面板按成长率缩放）</span></div></div>';
  document.getElementById("view").innerHTML =
    card("👹 敌人图鉴", '<div class="hint">共 ' + ENEMIES.length + ' 名敌人档案。点任意一名查看完整资料。</div>') +
    bar +
    groups.map((g) => card('<span style="color:' + RARITY_COLOR[g.t] + ';">' + TIER_NAME[g.t] + '</span>（' + g.list.length + '）',
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:6px;">' +
      g.list.map((e) => {
        const s = e.stats;
        return '<button data-enemy="' + e.id + '" style="text-align:left;background:#12182a;border:1px solid ' + RARITY_COLOR[g.t] + '66;border-radius:9px;padding:9px;cursor:pointer;font-family:inherit;">' +
          '<div style="font-size:13px;font-weight:700;color:' + RARITY_COLOR[g.t] + ';">' + esc(e.name) + '</div>' +
          '<div style="font-size:9.5px;color:#8a8ab0;margin-top:2px;">' + esc(e.role) + '</div>' +
          '<div style="font-size:10px;color:#ffd666;margin-top:5px;">攻 ' + s.atk + ' · 生 ' + s.hp + '</div>' +
          '<div style="font-size:10px;color:#9aa4b8;margin-top:2px;">防 ' + s.def + ' · 抗 ' + s.res + ' · 速 ' + s.spd + '</div>' +
          '</button>';
      }).join("") + '</div>')).join("");
  document.getElementById("view").querySelectorAll("[data-enemy]").forEach((b) => b.onclick = () => detail(b.dataset.enemy));
  const inp = document.getElementById("lvIn");
  if (inp) inp.onchange = () => { lv = Math.max(1, Math.min(100, Number(inp.value) || 1)); render(); };
}

render();
</script>
</body>
</html>
