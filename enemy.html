<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>敌人图鉴 · 闲得慌RPG</title>
<link rel="stylesheet" href="css/app.css?v=c6880e77">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span> 闲得慌RPG <span class="hint">· 敌人图鉴</span></div>
    <a class="hint" href="index.html">← 返回首页</a>
  </div>
  <div id="view"></div>
  <div class="foot">敌人档案：单位信息 / 面板数据 / 装备 / 招式组</div>
</div>
<script type="module">
import { ENEMIES, enemyAt, enemyPower } from "./js/enemies.js?v=00f0acb8";
import { DUNGEONS } from "./js/data.js?v=6a88c017";

const RARITY_COLOR = { normal: "#8a8ab0", elite: "#6ea8fe", special: "#c9a0ff", boss: "#ff6b6b" };
const TIER_NAME = { boss: "首领", special: "特色", elite: "精英", normal: "普通" };
const TIER_ORDER = ["boss", "special", "elite", "normal"];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("zh-CN");
const card = (title, body) => '<div class="card"><div class="card-title">' + title + '</div>' + body + '</div>';

let lv = 1;

function detail(id, atLv) {
  const e0 = ENEMIES.find((x) => x.id === id);
  if (!e0) return;
  const showLv = atLv || lv;
  const e = enemyAt(id, showLv);
  const tint = RARITY_COLOR[e0.tier] || "#8a8ab0";
  const s = e.stats;
  const r = (k, v) => '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 9px;border-bottom:1px solid #1a2438;">' +
    '<span class="hint">' + k + '</span><span style="font-weight:600;color:#dbe4f3;font-size:13px;">' + v + '</span></div>';
  const sec = (t) => '<div style="font-size:11px;color:#8fd8ff;font-weight:700;letter-spacing:1px;margin:12px 0 5px;">' + t + '</div>';
  const panel = (inner) => '<div style="background:#0d1322;border:1px solid #1c2740;border-radius:10px;overflow:hidden;">' + inner + '</div>';
  const skRow = (sk) => '<div style="padding:6px 9px;border-bottom:1px solid #1a2438;">' +
    '<div style="display:flex;justify-content:space-between;gap:8px;"><b style="font-size:13px;color:#dbe4f3;">' + esc(sk.name) + '</b>' +
    '<span style="font-size:10.5px;color:#8fd8ff;">' + (sk.mult ? sk.mult + "%" : "") +
    (sk.kind === "ult" ? ' · 怒气100' : (sk.cd ? ' · CD' + sk.cd : "")) + '</span></div>' +
    '<div class="hint" style="margin-top:2px;">' + esc(sk.desc || "") + '</div></div>';

  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(5,8,16,.88);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;";
  ov.innerHTML = '<div class="card" style="max-width:480px;width:100%;max-height:88vh;overflow:auto;border:1px solid ' + tint + '66;">' +
    '<div style="display:flex;align-items:center;gap:8px;">' +
      '<div style="font-size:21px;font-weight:800;color:' + tint + ';">' + esc(e.name) + '</div>' +
      '<span class="tag" style="border-color:' + tint + ';color:' + tint + ';">' + (TIER_NAME[e0.tier] || "") + '</span>' +
      '<span style="margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#1c2740,#101827);border:1px solid #ffd66655;border-radius:20px;padding:3px 11px;font-size:11px;color:#ffd666;">⚔️ 战力 <b style="font-size:13px;">' + fmt(enemyPower(e)) + '</b></span></div>' +
    '<div class="hint" style="margin:3px 0 2px;">' + esc(e.camp) + ' · ' + esc(e.role) + ' · Lv' + e.lv + '</div>' +
    '<div style="display:flex;gap:3px;flex-wrap:wrap;margin:4px 0;">' + (e0.tags || []).map((t) =>
      '<span style="font-size:10px;color:#8fd8ff;border:1px solid #2a3a55;border-radius:5px;padding:1px 6px;">' + esc(t) + '</span>').join("") + '</div>' +
    (appearOf(e0.id).length ? '<div class="hint" style="margin-bottom:4px;">📅 出现关卡：' + esc(appearOf(e0.id).join("、")) + '</div>' : "") +
    (e.desc ? '<div class="hint" style="margin:8px 0;line-height:1.7;color:#9fb0c8;">' + esc(e.desc) + '</div>' : "") +
    sec("① 面板数据") +
    panel(r("攻击", fmt(s.atk)) + r("生命", fmt(s.hp)) + r("防御", fmt(s.def)) + r("法抗", fmt(s.res)) +
      r("速度", s.spd) + r("暴击率", s.critRate + "%") + r("暴击伤害", s.critDmg + "%") +
      r("回怒效率", "+" + (e.rageGain || 25) + " / 行动")) +
    sec("② 装备") +
    panel(r("武器", esc(e.equip.weapon)) + r("上装", esc(e.equip.armor)) + r("下装", esc(e.equip.armor2)) + r("饰品", esc(e.equip.accessory))) +
    sec("③ 招式组") +
    panel((e.skills || []).map(skRow).join("") || '<div class="hint" style="padding:8px 9px;">没有招式</div>') +
    '<div style="display:flex;align-items:center;gap:6px;margin-top:10px;">' +
      '<span class="hint">等级预览</span>' +
      '<input id="dLv" type="number" min="1" max="100" value="' + showLv + '" style="width:66px;padding:3px 6px;">' +
      '<span class="hint">Lv1~100</span>' +
      '<button id="ecClose" style="margin-left:auto;">关闭</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#ecClose").onclick = () => ov.remove();
  const lvIn = ov.querySelector("#dLv");
  if (lvIn) lvIn.onchange = () => { ov.remove(); detail(id, Math.max(1, Math.min(100, Number(lvIn.value) || 1))); };
  ov.onclick = (ev) => { if (ev.target === ov) ov.remove(); };
}

const roleTag = (e) => {
  const r = e.role || "";
  if (r.indexOf("首领") >= 0) return "boss";
  if (r.indexOf("坦克") >= 0) return "tank";
  if (r.indexOf("远程") >= 0) return "ranged";
  if (r.indexOf("法术") >= 0) return "spell";
  if (r.indexOf("辅助") >= 0) return "support";
  return "melee";
};
const ROLE_NAME = { boss: "首领", tank: "坦克", melee: "近战", ranged: "远程", spell: "法术", support: "辅助" };
const F = (window.__ef = window.__ef || { tier: "all", role: "all", theme: "all", tag: "all" });
// 出现关卡
const appearOf = (id) => DUNGEONS.flatMap((d) => d.stages.filter((s) => (s.enemies || []).indexOf(id) >= 0).map((s) => s.name.split(" · ")[0]));
// 所有主题（阵营）
const THEMES = Array.from(new Set(ENEMIES.map((e) => e.faction || e.camp)));
// 所有特性标签
const TAGS = Array.from(new Set(ENEMIES.flatMap((e) => e.tags || []))).slice(0, 12);
const chip = (type, val, label) => {
  const on = F[type] === val;
  return '<button data-f="' + type + ':' + val + '" style="font-size:11px;padding:3px 10px;border-radius:20px;' +
    (on ? 'border-color:#6ea8fe;color:#cfe6ff;background:#1b2740;' : '') + '">' + label + '</button>';
};

function render() {
  const bar = '<div class="card" style="padding:8px 10px;"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">' +
    '<span class="hint">主题</span>' + chip("theme", "all", "全部") +
    THEMES.map((t) => chip("theme", t, t)).join("") +
    '<span style="width:8px;"></span><span class="hint">品质</span>' + chip("tier", "all", "全部") +
    TIER_ORDER.map((t) => chip("tier", t, TIER_NAME[t])).join("") +
    '</div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;">' +
    '<span class="hint">定位</span>' + chip("role", "all", "全部") +
    ["boss", "tank", "melee", "ranged", "spell", "support"].map((k) => chip("role", k, ROLE_NAME[k])).join("") +
    '<span style="width:8px;"></span><span class="hint">特性</span>' + chip("tag", "all", "全部") +
    TAGS.map((t) => chip("tag", t, t)).join("") +
    '<span style="width:8px;"></span><span class="hint">等级预览</span>' +
    '<input id="lvIn" type="number" min="1" max="100" value="' + lv + '" style="width:64px;padding:3px 6px;">' +
    '</div></div>';

  const groups = TIER_ORDER.map((t) => {
    const list = ENEMIES.filter((e) => e.tier === t)
      .filter((e) => F.tier === "all" || e.tier === F.tier)
      .filter((e) => F.role === "all" || roleTag(e) === F.role)
      .filter((e) => F.theme === "all" || (e.faction || e.camp) === F.theme)
      .filter((e) => F.tag === "all" || (e.tags || []).indexOf(F.tag) >= 0);
    return { t, list };
  }).filter((g) => g.list.length);

  document.getElementById("view").innerHTML =
    card("👹 敌人图鉴", '<div class="hint">共 ' + ENEMIES.length + ' 名敌人档案。点任意一名查看完整资料。</div>') +
    bar +
    (groups.length
      ? groups.map((g) => card('<span style="color:' + RARITY_COLOR[g.t] + ';">' + TIER_NAME[g.t] + '</span>（' + g.list.length + '）',
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:6px;">' +
        g.list.map((e) => {
          const s = e.stats;
          return '<button data-enemy="' + e.id + '" style="text-align:left;background:#12182a;border:1px solid ' + RARITY_COLOR[g.t] + '66;border-radius:9px;padding:9px;cursor:pointer;font-family:inherit;">' +
            '<div style="font-size:13px;font-weight:700;color:' + RARITY_COLOR[g.t] + ';">' + esc(e.name) + '</div>' +
            '<div style="font-size:9.5px;color:#8a8ab0;margin-top:2px;">' + esc(e.faction || e.camp) + ' · ' + esc(e.role) + '</div>' +
            '<div style="margin-top:4px;display:flex;gap:3px;flex-wrap:wrap;">' + (e.tags || []).slice(0, 3).map((t) =>
              '<span style="font-size:9px;color:#8fd8ff;border:1px solid #2a3a55;border-radius:4px;padding:0 4px;">' + esc(t) + '</span>').join("") + '</div>' +
            '<div style="font-size:10px;color:#ffd666;margin-top:5px;">攻 ' + s.atk + ' · 生 ' + s.hp + '</div>' +
            '<div style="font-size:10px;color:#9aa4b8;margin-top:2px;">防 ' + s.def + ' · 抗 ' + s.res + ' · 速 ' + s.spd + '</div>' +
            '</button>';
        }).join("") + '</div>')).join("")
      : card("没有结果", '<div class="hint">这个筛选下没有敌人</div>'));

  const view = document.getElementById("view");
  view.querySelectorAll("[data-enemy]").forEach((b) => b.onclick = () => detail(b.dataset.enemy));
  view.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => {
    const [k, v] = b.dataset.f.split(":");
    F[k] = v;
    render();
  });
  const inp = document.getElementById("lvIn");
  if (inp) inp.onchange = () => { lv = Math.max(1, Math.min(100, Number(inp.value) || 1)); render(); };
}

render();
</script>
<script>
(function(){try{var a=document.querySelector('a[href="index.html"]');if(!a)return;a.href="lobby.html";a.textContent="← 公共大厅";}catch(e){}})();
</script>
</body>
</html>
