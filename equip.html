<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲得慌RPG v2 · 装备图鉴</title>
<link rel="stylesheet" href="css/app.css?v=d8dee059">
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="index.html">← 返回</a><span class="tag">装备图鉴</span>
    <a href="affixes.html" style="margin-left:auto;">📖 词条库</a></div>
  <div id="view"></div>
</div>

<script type="module">
import { WEAPONS, ARMORS, ACCESSORIES } from "./js/data.js?v=8ac29ba8";
import { itemBonus, mainKeysOf } from "./js/power.js?v=a4de8ad8";

const RARITY_COLOR = { R: "#6ea8fe", SR: "#c9a0ff", SSR: "#ffd666", UR: "#ff6b6b" };
const NAMES = { atk: "攻击", hp: "生命", def: "防御", res: "法抗", spd: "速度", critRate: "暴击率", critDmg: "暴击伤害", atkPct: "攻击加成", hpPct: "生命加成", defPct: "防御加成", resPct: "法抗加成", ragePct: "怒气获取", dmgCut: "减伤", thorns: "反伤", str: "力量", intel: "智力", tech: "技巧", agi: "敏捷", strPct: "力量加成", intelPct: "智力加成", techPct: "技巧加成", agiPct: "敏捷加成", physPct: "物理伤害", spellPct: "法术伤害", normalPct: "普攻伤害", skillPct: "技能伤害", ultPct: "必杀伤害", physPen: "物理穿透", spellPen: "法术穿透", meleePct: "近战伤害", rangedPct: "远程伤害", focusPct: "法器伤害", cdReduce: "冷却缩减", rageOnSkill: "招式回怒", rageOnKill: "击杀回怒", rageStart: "初始怒气", block: "格挡", tenacity: "韧性", lowHpCut: "残血减伤", statusPower: "状态强度", statusHit: "状态命中", statusResist: "状态抗性", penetrate: "穿透", doubleStrike: "连击", chase: "追击", counter: "反击", dualborn: "双生", charge: "蓄势", reverse: "逆流", fate: "天命", splash: "溅射", stun: "眩晕", silence: "沉默", freeze: "冰冻", noheal: "禁疗", disarm: "缴械", taunt: "嘲讽", purify: "净化" };
const UNITS = { critRate: "%", critDmg: "%", atkPct: "%", hpPct: "%", defPct: "%", resPct: "%", ragePct: "%", dmgCut: "%", thorns: "%", strPct: "%", intelPct: "%", techPct: "%", agiPct: "%", physPct: "%", spellPct: "%", normalPct: "%", skillPct: "%", ultPct: "%", physPen: "%", spellPen: "%", meleePct: "%", rangedPct: "%", focusPct: "%", block: "%", tenacity: "%", lowHpCut: "%", statusPower: "%", statusHit: "%", statusResist: "%", penetrate: "%", doubleStrike: "%", chase: "%", counter: "%", dualborn: "%", splash: "%" };
const FLAGS = new Set(["reverse", "fate", "charge", "taunt"]);

const card = (t, inner) => '<div class="card"><div class="card-title">' + t + '</div>' + inner + '</div>';
const statText = (b, only) => Object.keys(b).filter((k) => only.indexOf(k) >= 0 && Number(b[k]) > 0)
  .map((k) => (NAMES[k] || k) + " +" + (Math.round(Number(b[k]) * 10) / 10) + (UNITS[k] || "")).join(" · ");

function detail(it) {
  const d = it.data;
  const b = itemBonus(it);
  const mainKeys = mainKeysOf(it);
  const rc = RARITY_COLOR[d.rarity] || "#8a8ab0";
  const styleText = d.style === "melee" ? "近战" : d.style === "ranged" ? "远程" : d.style === "focus" ? "法器" : "";
  const meta = [styleText, d.dmgType === "spell" ? "法术" : "物理"].filter(Boolean).join(" · ");
  const row = (k) => {
    const v = Number(b[k]) || 0;
    const val = FLAGS.has(k) ? "✔ 已获得" : ("+" + (Math.round(v * 10) / 10) + (UNITS[k] || ""));
    return '<div class="row"><span class="k">' + NAMES[k] + '</span><span class="v" style="color:' + rc + ';">' + val + '</span></div>';
  };
  const keys = Object.keys(NAMES).filter((k) => Number(b[k]) > 0);
  const mainBlock = mainKeys.length
    ? (() => {
        const rows = mainKeys.filter((k) => Number(b[k]) > 0).map(row).join("");
        return rows ? '<div class="hint" style="margin-top:8px;font-weight:700;color:#ffd666;">主属性（部位基础）</div>' + rows : "";
      })()
    : "";
  const groups = [
    { t: "基础与加成", ks: ["atk", "hp", "def", "res", "spd", "atkPct", "hpPct", "defPct", "resPct", "critRate", "critDmg", "dmgCut", "thorns", "ragePct"] },
    { t: "专精", ks: ["str", "intel", "tech", "agi", "strPct", "intelPct", "techPct", "agiPct"] },
    { t: "伤害类型", ks: ["physPct", "spellPct", "normalPct", "skillPct", "ultPct", "physPen", "spellPen", "meleePct", "rangedPct", "focusPct"] },
    { t: "战斗词条", ks: keys.filter((k) => !["atk", "hp", "def", "res", "spd", "atkPct", "hpPct", "defPct", "resPct", "critRate", "critDmg", "dmgCut", "thorns", "ragePct", "str", "intel", "tech", "agi", "strPct", "intelPct", "techPct", "agiPct", "physPct", "spellPct", "normalPct", "skillPct", "ultPct", "physPen", "spellPen", "meleePct", "rangedPct", "focusPct"].includes(k)) }
  ].map((g) => {
    const ks = g.ks.filter((k) => Number(b[k]) > 0 && mainKeys.indexOf(k) < 0);
    return ks.length ? '<div class="hint" style="margin-top:8px;font-weight:700;color:#8fd8ff;">' + g.t + '</div>' + ks.map(row).join("") : "";
  }).join("");

  const skill = it.cat !== "weapon" ? "" :
    '<div class="hint" style="margin-top:10px;font-weight:700;color:#8fd8ff;">招式</div>' +
    '<div class="row"><span class="k">普攻</span><span class="v">' + (Number(d.aMult) || 100) + '%' + ((Number(d.aHits) || 1) > 1 ? ' ×' + d.aHits + ' 段' : '') + ' · ' + (d.dmgType === "spell" ? "法术" : "物理") + '</span></div>' +
    (d.sSupport
      ? '<div class="row"><span class="k">技能（辅助）</span><span class="v">「' + (d.sName || "—") + '」· CD ' + (d.sCd || 3) + '</span></div>'
      : (d.sMult
        ? '<div class="row"><span class="k">技能</span><span class="v">「' + (d.sName || "—") + '」' + d.sMult + '%' + (d.sHits > 1 ? ' ×' + d.sHits + ' 段' : '') + ' · CD ' + (d.sCd || 2) + ' · 回怒 ' + (d.sRage || 0) + '%</span></div>'
        : '<div class="row"><span class="k">技能</span><span class="v" style="color:#6a6a86;">R 阶没有技能（SR 起才有）</span></div>')) +
    '<div class="row"><span class="k">必杀</span><span class="v">' + (Number(d.uMult) || 250) + '%' + ((Number(d.uHits) || 1) > 1 ? ' ×' + d.uHits + ' 段' : '') + ' · 怒气满 100 时可用</span></div>';

  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;display:flex;align-items:center;justify-content:center;";
  ov.innerHTML = '<div class="card" style="width:min(480px,92vw);max-height:82vh;overflow:auto;margin:0;border-color:' + rc + ';box-shadow:0 0 22px ' + rc + '55;">' +
    '<div class="card-title" style="color:' + rc + ';font-size:15px;">' + (d.name || "装备") +
      ' <span class="tag" style="color:' + rc + ';border-color:' + rc + ';">' + (d.rarity || "") + '</span></div>' +
    (meta ? '<div class="hint">' + meta + '</div>' : '') +
    (d.desc ? '<div class="hint" style="margin-top:4px;color:#9aa4b8;">' + d.desc + '</div>' : '') +
    mainBlock +
    (groups || '<div class="hint" style="margin-top:8px;">没有属性加成</div>') +
    skill +
    '<div style="margin-top:10px;"><button id="dpClose" style="width:100%;">关闭</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#dpClose").onclick = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
}

const list = [];
WEAPONS.forEach((d) => list.push({ cat: "weapon", data: d }));
ARMORS.forEach((d) => list.push({ cat: "armor", data: d }));
ACCESSORIES.forEach((d) => list.push({ cat: "accessory", data: d }));

const groups = [
  { cat: "weapon", title: "⚔️ 武器", list: WEAPONS },
  { cat: "armor", title: "🛡️ 防具", list: ARMORS },
  { cat: "accessory", title: "💍 饰品", list: ACCESSORIES }
];
const RARITIES = ["R", "SR", "SSR", "UR"];
const F = (window.__eqFilter = window.__eqFilter || { cat: "all", rarity: "all", part: "all" });
const chip = (type, val, label) => {
  const on = F[type] === val;
  return '<button data-f="' + type + ':' + val + '" style="font-size:11px;padding:3px 10px;border-radius:20px;' +
    (on ? 'border-color:#6ea8fe;color:#cfe6ff;background:#1b2740;' : '') + '">' + label + '</button>';
};

function render() {
  const shown = (cat) => F.cat === "all" || F.cat === cat;
  const byRarity = (d) => F.rarity === "all" || d.rarity === F.rarity;
  const byPart = (d) => F.part === "all" || d.part === F.part;
  const bar = '<div class="card" style="padding:8px 10px;"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">' +
    '<span class="hint" style="font-size:10.5px;">类别</span>' +
    chip("cat", "all", "全部") + chip("cat", "weapon", "⚔️武器") + chip("cat", "armor", "🛡️防具") + chip("cat", "accessory", "💍饰品") +
    '<span style="width:8px;"></span><span class="hint" style="font-size:10.5px;">品质</span>' +
    chip("rarity", "all", "全部") + RARITIES.map((r) => chip("rarity", r, r)).join("") +
    '<span style="width:8px;"></span><span class="hint" style="font-size:10.5px;">部位</span>' +
    chip("part", "all", "全部") + chip("part", "top", "上装") + chip("part", "bottom", "下装") +
    '</div></div>';
  const RANK = { UR: 4, SSR: 3, SR: 2, R: 1 };
  const CAT_TAG = { weapon: "⚔️ 武器", armor: "🛡️ 防具", accessory: "💍 饰品" };
  const flat = list
    .filter((x) => F.cat === "all" || x.cat === F.cat)
    .filter((x) => byRarity(x.data)).filter((x) => byPart(x.data))
    .sort((a, b) => (RANK[b.data.rarity] || 0) - (RANK[a.data.rarity] || 0) || String(a.data.name).localeCompare(String(b.data.name), "zh"));
  const order = ["UR", "SSR", "SR", "R"].filter((r) => flat.some((x) => x.data.rarity === r));

  document.getElementById("view").innerHTML =
    card("📚 装备图鉴",
      '<div class="hint">当前全部装备（' + list.length + ' 件）。按品质从高到低排列，点任意一件查看完整属性与招式。</div>') +
    bar +
    (order.length
      ? order.map((r) => {
          const rc = RARITY_COLOR[r] || "#8a8ab0";
          const rows = flat.filter((x) => x.data.rarity === r);
          return card('<span style="color:' + rc + ';">' + r + '</span> 品质（' + rows.length + '）',
            '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px;">' +
            rows.map((x) => {
              const d = x.data;
              const b = itemBonus({ cat: x.cat, data: d });
              const mk = mainKeysOf({ cat: x.cat, data: d });
              const mainTxt = statText(b, mk);
              const subTxt = statText(b, Object.keys(b).filter((k) => mk.indexOf(k) < 0));
              return '<button data-i="' + list.findIndex((y) => y.data === d) + '" style="text-align:left;background:#12182a;border:1px solid ' + rc + '66;border-radius:9px;padding:9px;cursor:pointer;font-family:inherit;">' +
                '<div style="font-size:13px;font-weight:700;color:' + rc + ';">' + d.name + '</div>' +
                '<div style="font-size:9.5px;letter-spacing:1px;color:#8a8ab0;margin-top:2px;">' + (CAT_TAG[x.cat] || "") +
                (d.part ? ' · ' + (d.part === "bottom" ? "下装" : "上装") : "") + '</div>' +
                (mainTxt ? '<div style="font-size:10px;color:#ffd666;margin-top:5px;line-height:1.4;">主　' + mainTxt + '</div>' : '') +
                (subTxt ? '<div style="font-size:10px;color:#9aa4b8;margin-top:2px;line-height:1.4;">副　' + subTxt + '</div>' : '') +
                '</button>';
            }).join("") + '</div>');
        }).join("")
      : '<div class="card"><div class="hint">这个条件下没有装备</div></div>');
}

render();

document.getElementById("view").addEventListener("click", (e) => {
  const f = e.target.closest("[data-f]");
  if (f) {
    const [k, v] = f.dataset.f.split(":");
    F[k] = v;
    render();
    return;
  }
  const el = e.target.closest("[data-i]");
  if (el) {
    const it = list[Number(el.dataset.i)];
    if (it) detail(it);
  }
});
</script>
</body>
</html>
