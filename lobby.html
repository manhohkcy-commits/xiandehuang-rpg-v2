<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公共大厅 · 闲得慌RPG</title>
<link rel="stylesheet" href="css/app.css?v=c6880e77">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span> 闲得慌RPG <span class="hint">· 公共大厅</span></div>
    <a class="hint" id="backLink" href="index.html">← 返回</a>
  </div>
  <div id="view"></div>
  <div class="foot">玩家大厅：云端玩家角色 · 原创大厅：主机发布的原创角色</div>
</div>
<script type="module">
import { cloudList, cloudGet, cloudSave } from "./js/core.js?v=13807141";
import { charPower, gradeOf } from "./js/power.js?v=d92ed317";
import { ORIGINALS, pullOriginals, originalFinal, gearAbilities, ORIGINAL_GEAR } from "./js/originals.js?v=0167d36b";

const $ = (id) => document.getElementById(id);
const view = () => $("view");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("zh-CN");
const card = (t, inner) => '<div class="card"><div class="card-title">' + t + '</div>' + inner + '</div>';
const box = (() => { try { return localStorage.getItem("rpg2:box") || ""; } catch (e) { return ""; } })();
const RARITY_COLOR = { R: "#6ea8fe", SR: "#c9a0ff", SSR: "#ffd666", UR: "#ff6b6b" };
const hostMode = (() => { try { return localStorage.getItem("rpg2:host") === "1"; } catch (e) { return false; } })();

let tab = (new URLSearchParams(location.search)).get("tab") || "player";
let cache = null;

function playerRows(rows) {
  const map = new Map();
  rows.filter((r) => r && r.store && Number(r.store.v) === 2 && String(r.box).indexOf("__") !== 0).forEach((r) => {
    const chars = r.store.chars || [];
    const ch = chars.find((c) => c.id === r.store.activeChar) || chars[0];
    if (!ch) return;
    const g = gradeOf(ch);
    const row = { box: String(r.box), name: ch.name || "无名", lv: Number(ch.lv) || 1, power: charPower(ch), grade: g.key, color: g.color, updated: r.updated_at || "" };
    const prev = map.get(row.name);
    if (!prev || row.power > prev.power) map.set(row.name, row);
    else prev.dup = (prev.dup || 1) + 1;
  });
  return Array.from(map.values()).sort((a, b) => b.power - a.power);
}

function origRows() {
  return ORIGINALS.slice().sort((a, b) => (Number((b.stats || {}).power) || 0) - (Number((a.stats || {}).power) || 0))
    .map((o) => ({ o, final: originalFinal(o, {}), lv: 1 }));
}

function render() {
  document.body.classList.toggle("host-mode", hostMode);
  if (hostMode) {
    $("backLink").href = "create.html?tab=char";
    $("backLink").textContent = "← 我的原创";
  } else {
    $("backLink").href = "create.html?tab=char" + (box ? "&box=" + encodeURIComponent(box) : "");
    $("backLink").textContent = "← 我的角色";
  }
  const HOST_BOX = "zynFUTA";
  try { if (hostMode) localStorage.setItem("rpg2:hostBox", HOST_BOX); } catch (e) {}
  const hostBox = HOST_BOX;
  const myBox = hostMode ? hostBox : box;
  const myEnc = encodeURIComponent(myBox || "");
  const myQs = myBox ? "?box=" + myEnc : "?";
  const enc = encodeURIComponent(box || "");
  const qs = box ? "?box=" + enc : "?";
  const enter = '<div class="card" style="padding:10px;"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">' +
    '<span class="hint">进入个人页面</span>' +
    (hostMode
      ? '<a href="create.html' + myQs + (myBox ? "&" : "") + 'tab=orig" style="text-decoration:none;"><button style="border-color:#ffb347;color:#ffb347;">🧬 原创端 · 原创角色</button></a>'
      : '<a href="create.html' + myQs + (myBox ? "&" : "") + 'tab=char" style="text-decoration:none;"><button style="border-color:#6ea8fe;color:#cfe6ff;">🧑 玩家端 · 我的角色</button></a>') +
    '</div>' +
    '<div style="display:flex;gap:6px;margin-top:8px;align-items:center;">' +
      '<span class="hint">' + (hostMode ? "原创端位号" : "我的位号") + '</span>' +
      '<input id="lobbyBox" value="' + esc(myBox) + '" placeholder="没有可留空，进个人页会自动生成" style="flex:1;background:#0b0e17;border:1px solid #24304a;border-radius:8px;color:#dbe4f3;padding:7px;">' +
      '<button id="lobbyBoxSave" style="border-color:' + (hostMode ? "#ffb347" : "#6ea8fe") + ';color:' + (hostMode ? "#ffb347" : "#cfe6ff") + ';">保存位号</button>' +
    '</div></div>';
  const feat = '<div class="hall-grid" style="margin:10px 0;">' +
    '<a href="battle.html' + (myBox ? "?box=" + myEnc : "") + '"><div style="font-size:22px;">⚔️</div><div class="t">挑战副本</div><div class="hint">枫林剿匪 / 波次战斗</div></a>' +
    '<a href="rooms.html"><div style="font-size:22px;">🏠</div><div class="t">联机房间</div><div class="hint">和朋友一起打</div></a>' +
    '<a href="create.html' + myQs + (myBox ? "&" : "") + 'tab=rank"><div style="font-size:22px;">🏆</div><div class="t">排行榜</div><div class="hint">可游玩角色战力榜</div></a>' +
    '<a href="equip.html"><div style="font-size:22px;">📚</div><div class="t">装备图鉴</div><div class="hint">武器 / 防具 / 饰品</div></a>' +
    '<a href="enemy.html"><div style="font-size:22px;">👹</div><div class="t">敌人图鉴</div><div class="hint">敌人档案 / 招式</div></a>' +
    '<a href="affixes.html"><div style="font-size:22px;">📖</div><div class="t">词条库</div><div class="hint">词条效果说明</div></a>' +
    '<a href="create.html' + myQs + (myBox ? "&" : "") + 'tab=store"><div style="font-size:22px;">🎒</div><div class="t">仓库</div><div class="hint">装备 / 资源</div></a>' +
    '</div>';
  const tabBar = '<div class="tree-tabs" style="margin-bottom:10px;">' +
    '<button data-tab="player"' + (tab === "player" ? ' class="on"' : '') + '>🧑 玩家大厅</button>' +
    '<button data-tab="orig"' + (tab === "orig" ? ' class="on"' : '') + '>🧬 原创大厅</button>' +
    '</div>';

  let body = "";
  if (tab === "player") {
    body = card("🧑 玩家大厅", '<div class="hint" id="pmsg">读取云端玩家角色中…</div><div id="plist"></div>');
  } else {
    const list = origRows();
    body = card("🧬 原创大厅（" + list.length + "）",
      '<div class="hint" style="margin-bottom:6px;">主机发布的原创角色；点任意一名查看完整面板。</div>' +
      (list.length ? '<table style="width:100%;border-collapse:collapse;">' +
        '<tr style="color:#8a8ab0;font-size:10.5px;text-align:left;"><th style="padding:4px 2px;">名字</th><th>定位</th><th style="text-align:right;">战力</th></tr>' +
        list.map((x) => '<tr data-orig="' + x.o.id + '" style="border-top:1px dashed #23233a;cursor:pointer;">' +
          '<td style="padding:6px 2px;font-size:12.5px;"><b style="color:' + (x.o.rare ? "#ffb347" : "#8a8ab0") + ';">' + esc(x.o.name) + '</b>' +
          (x.o.title ? ' <span class="hint">' + esc(x.o.title) + '</span>' : '') + '</td>' +
          '<td style="font-size:11px;color:#8a8ab0;">' + esc(x.o.role || "") + '</td>' +
          '<td style="text-align:right;font-size:12px;color:#ffb347;font-weight:700;">' + fmt(x.final.power) + '</td></tr>').join("") +
        '</table>' : '<div class="hint">主机还没发布原创角色。</div>'));
  }
  view().innerHTML = enter + card("🏛 大厅功能区", feat) + tabBar + body + chatCard();

  view().querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; history.replaceState(null, "", "?tab=" + tab); render(); });
  view().querySelectorAll("[data-orig]").forEach((tr) => tr.onclick = () => {
    const o = ORIGINALS.find((x) => x.id === tr.dataset.orig);
    if (!o) return;
    const f = originalFinal(o, {});
    const g = ORIGINAL_GEAR[o.id] || o.gearObj || {};
    const SLOT = { weapon: "武器", armor: "上装", armor2: "下装", accessory: "饰品" };
    const tint = o.rare ? "#ffb347" : "#8a8ab0";
    const row = (k, v) => '<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 9px;border-bottom:1px solid #1a2438;">' +
      '<span class="hint">' + k + '</span><span style="font-weight:600;color:#dbe4f3;font-size:13px;">' + v + '</span></div>';
    const panel = (inner) => '<div style="background:#0d1322;border:1px solid #1c2740;border-radius:10px;overflow:hidden;">' + inner + '</div>';
    const gearHtml = Object.keys(SLOT).map((k) => {
      const it = g[k] || {};
      if (!it.name) return "";
      const parts = [];
      if (it.atk) parts.push("攻击 +" + it.atk);
      if (it.hp) parts.push("生命 +" + it.hp);
      if (it.def) parts.push("防御 +" + it.def);
      if (it.res) parts.push("法抗 +" + it.res);
      if (it.spd) parts.push("速度 +" + it.spd);
      if (it.critRate) parts.push("暴击 +" + it.critRate + "%");
      if (it.critDmg) parts.push("暴伤 +" + it.critDmg + "%");
      if (it.lifesteal) parts.push("吸血 " + it.lifesteal + "%");
      if (it.ultPct) parts.push("必杀 +" + it.ultPct + "%");
      return '<div data-gear="' + k + '" style="padding:7px 9px;border-bottom:1px solid #1a2438;cursor:pointer;">' +
        '<div style="display:flex;justify-content:space-between;"><b style="font-size:13px;color:#dbe4f3;">' + ({ weapon: "🗡", armor: "🛡", armor2: "👖", accessory: "💍" }[k] || "🗡") + ' ' + esc(it.name) + '</b>' +
        '<span class="hint">' + SLOT[k] + ' ›</span></div>' +
        (parts.length ? '<div class="hint" style="margin-top:2px;">' + esc(parts.join(" · ")) + '</div>' : "") + '</div>';
    }).join("") || '<div class="hint" style="padding:8px 9px;">（暂无专属装备）</div>';

    const skillsHtml = '<div style="background:#0d1322;border:1px solid #1c2740;border-radius:10px;overflow:hidden;">' +
      '<div style="display:flex;justify-content:space-between;padding:6px 9px;border-bottom:1px solid #1a2438;"><b style="font-size:13px;">[普攻]</b><span style="color:' + tint + ';font-weight:700;">100%</span></div>' +
      '<div style="display:flex;justify-content:space-between;padding:6px 9px;"><b style="font-size:13px;">[必杀]</b><span style="color:' + tint + ';font-weight:700;">250% · 怒气 100</span></div></div>';
    const basic = o.basic || {}, spec = o.spec || {};
    const abil = [];
    Object.keys(g).forEach((k) => {
      const it = g[k] || {};
      if (it.lifesteal) abil.push("吸血 " + it.lifesteal + "%");
      if (it.ultPct) abil.push("必杀 +" + it.ultPct + "%");
    });

    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;background:rgba(5,8,16,.88);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;";
    ov.innerHTML = '<div class="card" style="max-width:460px;width:100%;max-height:88vh;overflow:auto;border:1px solid ' + tint + '66;">' +
      '<div style="display:flex;align-items:center;gap:8px;">' +
        '<div style="font-size:21px;font-weight:800;color:' + tint + ';">' + esc(o.name) + '</div>' +
        '<span class="tag" style="border-color:' + tint + ';color:' + tint + ';">' + (o.rare ? "稀有" : "普通") + '</span>' +
        '<span style="margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#241d10,#141014);border:1px solid ' + tint + '55;border-radius:20px;padding:3px 11px;font-size:11px;color:' + tint + ';">⚔️ 战力 <b style="font-size:13px;">' + fmt(f.power) + '</b></span></div>' +
      '<div class="hint" style="font-size:11px;color:' + tint + ';font-weight:700;letter-spacing:1px;margin:10px 0 5px;">① 基础面板</div>' +
      panel(row("攻击", Math.round(f.atk)) + row("生命", fmt(Math.round(f.hp))) + row("防御", Math.round(f.def)) +
        row("法抗", Math.round(f.res)) + row("速度", f.spd) + row("暴击率", f.critRate + "%") + row("暴击伤害", f.critDmg + "%")) +
      '<div class="hint" style="font-size:11px;color:' + tint + ';font-weight:700;letter-spacing:1px;margin:10px 0 5px;">② 专精面板</div>' +
      panel(row("基础四维", "生命 " + (basic.hp || 0) + " · 攻击 " + (basic.atk || 0) + " · 防御 " + (basic.def || 0) + " · 法抗 " + (basic.res || 0)) +
        row("专精四项", "力量 " + (spec.str || 0) + " · 智力 " + (spec.int || 0) + " · 技巧 " + (spec.tech || 0) + " · 敏捷 " + (spec.agi || 0))) +
      '<div class="hint" style="font-size:11px;color:' + tint + ';font-weight:700;letter-spacing:1px;margin:10px 0 5px;">③ 其他属性（装备词条）</div>' +
      panel(abil.length ? abil.map((t) => '<div class="hint" style="padding:6px 9px;border-bottom:1px solid #1a2438;color:#8fd8ff;">' + esc(t) + '</div>').join("") : '<div class="hint" style="padding:8px 9px;">无特殊词条</div>') +
      '<div class="hint" style="font-size:11px;color:' + tint + ';font-weight:700;letter-spacing:1px;margin:10px 0 5px;">④ 装备栏</div>' +
      panel(gearHtml) +
      '<div class="hint" style="font-size:11px;color:' + tint + ';font-weight:700;letter-spacing:1px;margin:10px 0 5px;">⑤ 招式一览</div>' +
      skillsHtml +
      '<div style="margin-top:10px;"><button id="lClose" style="width:100%;">关闭</button></div></div>';
    document.body.appendChild(ov);
    ov.querySelector("#lClose").onclick = () => ov.remove();
    ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
    ov.querySelectorAll("[data-gear]").forEach((el) => el.onclick = (ev) => {
      ev.stopPropagation();
      const slot = el.dataset.gear;
      const it = g[slot] || {};
      if (!it.name) return;
      const d = document.createElement("div");
      d.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;";
      const stats = [];
      if (it.atk) stats.push("攻击 +" + it.atk);
      if (it.hp) stats.push("生命 +" + it.hp);
      if (it.def) stats.push("防御 +" + it.def);
      if (it.res) stats.push("法抗 +" + it.res);
      if (it.spd) stats.push("速度 +" + it.spd);
      if (it.critRate) stats.push("暴击 +" + it.critRate + "%");
      if (it.critDmg) stats.push("暴伤 +" + it.critDmg + "%");
      if (it.lifesteal) stats.push("吸血 " + it.lifesteal + "%");
      if (it.ultPct) stats.push("必杀 +" + it.ultPct + "%");
      const rc2 = RARITY_COLOR[it.rarity] || tint;
      const skCard = (label, name, mult, extra) => '<div style="background:#0d1322;border:1px solid #1c2740;border-radius:9px;padding:7px 9px;margin-bottom:6px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;"><b style="font-size:13px;color:#dbe4f3;"><span style="color:' + rc2 + ';">[' + label + ']</span> ' + esc(name || "") + '</b>' +
        '<span style="font-size:12px;font-weight:700;color:' + rc2 + ';">' + mult + '</span></div>' +
        (extra ? '<div class="hint" style="margin-top:2px;">' + esc(extra) + '</div>' : "") + '</div>';
      const skills = it.sName
        ? '<div class="hint" style="margin:12px 0 5px;color:#8fd8ff;font-weight:700;">招式组</div>' +
          skCard("普攻", it.aName, (it.aMult || 100) + "%", "") +
          skCard("技能", it.sName, it.sMult + "% · CD" + it.sCd, "回怒 " + (it.sRage || 0)) +
          skCard("必杀", it.uName, it.uMult + "% · 怒气100", it.skillDesc || "")
        : "";
      d.innerHTML = '<div class="card" style="max-width:400px;width:100%;border:1px solid ' + rc2 + '66;">' +
        '<div style="display:flex;align-items:center;gap:8px;"><b style="font-size:18px;color:' + rc2 + ';">' + ({weapon:"🗡",armor:"🛡",armor2:"👖",accessory:"💍"}[slot] || "🗡") + ' ' + esc(it.name) + '</b>' +
        (it.rarity ? '<span class="tag" style="border-color:' + rc2 + ';color:' + rc2 + ';">' + it.rarity + '</span>' : "") +
        '<span class="tag" style="margin-left:auto;">' + SLOT[slot] + '</span></div>' +
        '<div class="hint" style="margin:8px 0 4px;color:#ffd666;font-weight:700;">属性</div>' +
        '<div style="background:#0d1322;border:1px solid #1c2740;border-radius:10px;overflow:hidden;">' +
        (stats.length ? stats.map((t) => { const i = t.lastIndexOf(" "); return '<div style="display:flex;justify-content:space-between;padding:6px 9px;border-bottom:1px solid #1a2438;"><span class="hint">' + esc(t.slice(0, i)) + '</span><b style="font-size:13px;color:#dbe4f3;">' + esc(t.slice(i + 1)) + '</b></div>'; }).join("") : '<div class="hint" style="padding:8px 9px;">无属性加成</div>') +
        '</div>' + skills +
        '<div style="margin-top:10px;"><button id="gClose" style="width:100%;">关闭</button></div></div>';
      document.body.appendChild(d);
      d.querySelector("#gClose").onclick = () => d.remove();
      d.onclick = (e) => { if (e.target === d) d.remove(); };
    });
  });

  if (tab === "player") loadPlayers();
  if ($("chatList")) loadChat();
}

async function loadPlayers() {
  const msg = $("pmsg"), list = $("plist");
  if (!msg || !list) return;
  try {
    if (!cache) cache = await cloudList(200);
    const rows = playerRows(cache);
    if (!rows.length) { msg.textContent = "还没有玩家的云端角色。"; return; }
    msg.textContent = "共 " + rows.length + " 名玩家角色（同名取战力最高）。";
    list.innerHTML = '<table style="width:100%;border-collapse:collapse;">' +
      '<tr style="color:#8a8ab0;font-size:10.5px;text-align:left;"><th style="padding:4px 2px;">#</th><th>名字</th><th>等级</th><th style="text-align:right;">战力</th></tr>' +
      rows.map((r, i) => '<tr style="border-top:1px dashed #23233a;' + (r.box === myBox ? "background:#1b2740;" : "") + '">' +
        '<td style="padding:6px 2px;font-size:11px;color:' + (i < 3 ? "#ffd666" : "#8a8ab0") + ';">' + (i + 1) + '</td>' +
        '<td style="font-size:12.5px;"><b style="color:' + r.color + ';">' + esc(r.name) + '</b>' + (r.dup > 1 ? ' <span class="hint">同名 ×' + r.dup + '</span>' : '') + '</td>' +
        '<td style="font-size:11px;color:#8a8ab0;">Lv' + r.lv + '</td>' +
        '<td style="text-align:right;font-size:12px;color:#6ea8fe;font-weight:700;">' + fmt(r.power) + '</td></tr>').join("") + '</table>';
  } catch (e) {
    msg.textContent = "读取失败：" + (e && e.message || e);
  }
}

// 💬 公共频道
let myName = "玩家";
const CHAT_BOX = "__chat";
function chatCard() {
  return card("💬 公共频道", '<div class="hint" id="chatMsg" style="margin-bottom:6px;">读取中…</div>' +
    '<div id="chatList" style="max-height:220px;overflow:auto;background:#0d1322;border:1px solid #1c2740;border-radius:10px;padding:8px;"></div>' +
    '<div style="display:flex;gap:6px;margin-top:8px;">' +
      '<input id="chatIn" maxlength="120" placeholder="说点什么…" style="flex:1;background:#0b0e17;border:1px solid #24304a;border-radius:8px;color:#dbe4f3;padding:8px;">' +
      '<button id="chatSend" style="border-color:#6ea8fe;color:#cfe6ff;">发送</button>' +
    '</div>');
}
async function loadChat() {
  const list = $("chatList"), msg = $("chatMsg");
  if (!list) return;
  try {
    const r = await cloudGet(CHAT_BOX);
    const msgs = (r && r.store && r.store.msgs) || [];
    if (!msgs.length) { list.innerHTML = '<div class="hint">还没有人说话，来一句吧。</div>'; }
    else {
      list.innerHTML = msgs.slice(-60).map((m) =>
        '<div style="padding:3px 0;border-bottom:1px dashed #1a2438;">' +
        '<b style="color:' + (m.n === myName ? "#8fd8ff" : "#ffd666") + ';">' + esc(m.n || "玩家") + '</b>' +
        ' <span style="font-size:10px;color:#6a7a90;">' + new Date(m.at || Date.now()).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }) + '</span>' +
        '<div style="font-size:12.5px;color:#dbe4f3;">' + esc(m.t || "") + '</div></div>').join("");
      list.scrollTop = list.scrollHeight;
    }
    if (msg) msg.textContent = "共 " + msgs.length + " 条消息";
  } catch (e) {
    if (msg) msg.textContent = "聊天读取失败：" + (e && e.message || e);
  }
}
async function sendChat() {
  const inp = $("chatIn");
  const text = ((inp && inp.value) || "").trim();
  if (!text) return;
  try {
    const r = await cloudGet(CHAT_BOX);
    const msgs = ((r && r.store && r.store.msgs) || []).slice(-59);
    msgs.push({ n: myName, t: text, at: Date.now() });
    await cloudSave(CHAT_BOX, { v: 2, items: [], chars: [], msgs }, r && r.updated_at, "公共聊天");
    if (inp) inp.value = "";
    await loadChat();
  } catch (e) { alert("发送失败：" + (e && e.message || e)); }
}
async function initChat() {
  try {
    if (box) {
      const r = await cloudGet(box);
      const chars = (r && r.store && r.store.chars) || [];
      const ch = chars.find((c) => c.id === r.store.activeChar) || chars[0];
      if (ch && ch.name) myName = ch.name;
    }
  } catch (e) {}
  await loadChat();
  setInterval(loadChat, 8000);
}
// 事件代理：切换分栏重渲染后依然可点
document.addEventListener("click", (e) => {
  if (e.target && e.target.closest && e.target.closest("#chatSend")) sendChat();
  const sb = e.target && e.target.closest ? e.target.closest("#lobbyBoxSave") : null;
  if (sb) {
    const v = (($("lobbyBox") || {}).value || "").trim();
    try {
      if (hostMode) localStorage.setItem("rpg2:hostBox", v);
      localStorage.setItem("rpg2:box", v);
    } catch (err) {}
    location.href = "lobby.html";
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target && e.target.id === "chatIn" && e.key === "Enter") sendChat();
});

try { await pullOriginals(); } catch (e) {}
render();
initChat();
</script>
</body>
</html>
