<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专属装备图鉴 · 主机端</title>
<link rel="stylesheet" href="css/app.css?v=52e2ada0">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot" style="background:#ffb347;box-shadow:0 0 10px #ffb34788;"></span> 闲得慌RPG <span class="hint">· 专属装备图鉴（主机端）</span></div>
    <a class="hint" href="studio.html">← 回主机工作台</a>
  </div>
  <div id="view"></div>
  <div class="foot">原创角色专属装备，玩家端只读展示</div>
</div>
<script type="module">
import { ORIGINALS, ORIGINAL_GEAR, pullOriginals } from "./js/originals.js?v=b859ebc5";

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("zh-CN");
const RARITY_COLOR = { R: "#6ea8fe", SR: "#c9a0ff", SSR: "#ffd666", UR: "#ff6b6b" };
const SLOT = { weapon: "武器", armor: "上装", armor2: "下装", accessory: "饰品" };

function statsOf(it) {
  const parts = [];
  if (it.atk) parts.push("攻击 +" + it.atk);
  if (it.hp) parts.push("生命 +" + it.hp);
  if (it.def) parts.push("防御 +" + it.def);
  if (it.res) parts.push("法抗 +" + it.res);
  if (it.spd) parts.push("速度 +" + it.spd);
  if (it.critRate) parts.push("暴击 +" + it.critRate + "%");
  if (it.critDmg) parts.push("暴伤 +" + it.critDmg + "%");
  if (it.lifesteal) parts.push("吸血 " + it.lifesteal + "%");
  if (it.ultPct) parts.push("必杀 +" + it.ultPct + "%");
  return parts;
}

function detail(it, slot) {
  const rc = RARITY_COLOR[it.rarity] || "#8a8ab0";
  const row = (k, v) => '<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 9px;border-bottom:1px solid #1a2438;">' +
    '<span class="hint">' + k + '</span><span style="font-weight:600;color:#dbe4f3;font-size:13px;">' + v + '</span></div>';
  const panel = (inner) => '<div style="background:#0d1322;border:1px solid #1c2740;border-radius:10px;overflow:hidden;">' + inner + '</div>';
  const sec = (t) => '<div class="hint" style="margin:10px 0 5px;color:#8fd8ff;font-weight:700;letter-spacing:1px;">' + t + '</div>';
  const LBL = { atk: "攻击", hp: "生命", def: "防御", res: "法抗", spd: "速度", critRate: "暴击率", critDmg: "暴击伤害", lifesteal: "吸血", ultPct: "必杀伤害" };
  const UNIT = { critRate: "%", critDmg: "%", lifesteal: "%", ultPct: "%" };
  const MAIN = { weapon: ["atk"], armor: ["hp", "def", "res"], armor2: ["hp", "def", "spd"], accessory: ["atk", "critRate", "critDmg"] };
  const mk = MAIN[slot] || [];
  const mainRows = mk.filter((k) => it[k]).map((k) => row(LBL[k], "+" + it[k] + (UNIT[k] || ""))).join("");
  const subRows = ["atk", "hp", "def", "res", "spd", "critRate", "critDmg"]
    .filter((k) => mk.indexOf(k) < 0 && it[k]).map((k) => row(LBL[k], "+" + it[k] + (UNIT[k] || ""))).join("");
  const specRows = ["lifesteal", "ultPct"].filter((k) => it[k]).map((k) => row(LBL[k], "+" + it[k] + "%")).join("");
  const sk = (label, name, mult, extra) => '<div style="background:#0d1322;border:1px solid #1c2740;border-radius:9px;padding:7px 9px;margin-bottom:6px;">' +
    '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">' +
    '<b style="font-size:13px;color:#dbe4f3;"><span style="color:' + rc + ';">[' + label + ']</span> ' + esc(name || "") + '</b>' +
    '<span style="font-size:12px;font-weight:700;color:' + rc + ';">' + mult + '</span></div>' +
    (extra ? '<div class="hint" style="margin-top:2px;">' + esc(extra) + '</div>' : "") + '</div>';
  const skills = it.sName
    ? sec("招式组") +
      sk("普攻", it.aName, (it.aMult || 100) + "%", "") +
      sk("技能", it.sName, it.sMult + "% · CD" + it.sCd, "回怒 " + (it.sRage || 0)) +
      sk("必杀", it.uName, it.uMult + "% · 怒气100", it.skillDesc || "")
    : "";
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;";
  ov.innerHTML = '<div class="card" style="max-width:420px;width:100%;max-height:86vh;overflow:auto;border:1px solid ' + rc + '66;">' +
    '<div style="display:flex;align-items:center;gap:8px;"><b style="font-size:19px;color:' + rc + ';">' + esc(it.name) + '</b>' +
    (it.rarity ? '<span class="tag" style="border-color:' + rc + ';color:' + rc + ';">' + it.rarity + '</span>' : "") +
    '<span class="tag" style="margin-left:auto;">' + SLOT[slot] + '</span></div>' +
    (it.style || it.dmgType ? '<div class="hint" style="margin-top:2px;">' +
      [(it.style === "ranged" ? "远程" : it.style === "focus" ? "法器" : "近战"), it.dmgType === "spell" ? "法术" : "物理"].join(" · ") + '</div>' : "") +
    (mainRows ? '<div class="hint" style="margin:8px 0 5px;color:#ffd666;font-weight:700;">主属性（部位基础）</div>' + panel(mainRows) : "") +
    (subRows ? sec("副属性") + panel(subRows) : "") +
    (specRows ? sec("战斗词条") + panel(specRows) : "") +
    (it.mech ? sec("机制说明") + '<div style="background:#0d1322;border:1px solid #1c2740;border-radius:10px;padding:8px 9px;line-height:1.7;color:#9fb0c8;font-size:12px;">' + esc(it.mech) + '</div>' : "") +
    skills +
    '<div style="margin-top:10px;"><button id="ogClose" style="width:100%;">关闭</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#ogClose").onclick = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
}

function render() {
  const owners = ORIGINALS.filter((o) => { const g = ORIGINAL_GEAR[o.id] || o.gearObj; return g && Object.keys(g).some((k) => (g[k] || {}).name); });
  if (!owners.length) {
    document.getElementById("view").innerHTML = '<div class="card"><div class="card-title">🛡 专属装备图鉴</div><div class="hint">还没有配置专属装备。</div></div>';
    return;
  }
  document.getElementById("view").innerHTML =
    '<div class="card"><div class="card-title">🛡 专属装备图鉴</div><div class="hint">共 ' + owners.length + ' 名原创角色、' +
      owners.reduce((n, o) => n + Object.keys(ORIGINAL_GEAR[o.id] || o.gearObj || {}).filter((k) => ((ORIGINAL_GEAR[o.id] || o.gearObj || {})[k] || {}).name).length, 0) +
      ' 件专属装备。点任意一件看详情。</div></div>' +
    owners.map((o) => {
      const g = ORIGINAL_GEAR[o.id] || o.gearObj || {};
      return '<div class="card"><div class="card-title" style="color:#ffb347;">' + esc(o.name) + ' <span class="tag">' + (o.rare ? "稀有" : "普通") + '</span></div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px;">' +
        Object.keys(SLOT).map((k) => {
          const it = g[k] || {};
          if (!it.name) return "";
          const rc = RARITY_COLOR[it.rarity] || "#8a8ab0";
          return '<button data-g="' + o.id + ":" + k + '" style="text-align:left;background:#12182a;border:1px solid ' + rc + '66;border-radius:9px;padding:9px;cursor:pointer;font-family:inherit;">' +
            '<div style="font-size:13px;font-weight:700;color:' + rc + ';">' + esc(it.name) + '</div>' +
            '<div style="font-size:9.5px;color:#8a8ab0;margin-top:2px;">' + (it.rarity || "") + ' · ' + SLOT[k] + '</div>' +
            '<div style="font-size:10px;color:#9aa4b8;margin-top:5px;line-height:1.4;">' + esc(statsOf(it).join(" · ")) + '</div></button>';
        }).join("") + '</div></div>';
    }).join("");

  document.getElementById("view").querySelectorAll("[data-g]").forEach((b) => b.onclick = () => {
    const [id, slot] = b.dataset.g.split(":");
    const o = ORIGINALS.find((x) => x.id === id);
    const g = (o && (ORIGINAL_GEAR[o.id] || o.gearObj)) || {};
    if (g[slot]) detail(g[slot], slot);
  });
}

try { await pullOriginals(); } catch (e) {}
render();
</script>
</body>
</html>
