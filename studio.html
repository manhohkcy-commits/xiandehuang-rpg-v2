<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲得慌 · 设计工作室（主机端）</title>
<link rel="stylesheet" href="css/app.css?v=52e2ada0">
<style>
  body{background:#0d0b08;}
  .studio-bar{display:flex;align-items:center;gap:8px;background:#2a1f10;border:1px solid #6b4a1e;color:#ffcf7a;
    padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:10px;}
  .studio-bar .tag{color:#ffcf7a;border-color:#6b4a1e;}
  .studio-card{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .studio-card a{display:block;text-decoration:none;background:#151109;border:1px solid #3a2c14;border-radius:12px;padding:14px;color:#f3e6cf;transition:.15s;}
  .studio-card a:hover{border-color:#ffb347;background:#1c150a;transform:translateY(-1px);}
  .studio-card .t{font-size:15px;font-weight:800;color:#ffb347;margin-top:4px;}
  .studio-card .hint{color:#b6a382;}
  .studio-note{font-size:10.5px;color:#8a7a5f;margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="index.html">← 玩家端</a><span class="tag">主机端</span></div>
  <div id="view"></div>
</div>

<script type="module">
import { cloudGet, cloudDelete } from "./js/core.js?v=13807141";
const PWKEY = "rpg2:designpw";
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function sha(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("xd2|" + s));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function deny(msg) {
  document.getElementById("view").innerHTML =
    '<div class="card"><div class="card-title">🔒 主机端 · 需要设计师口令</div><div class="hint">' + esc(msg) + '</div>' +
    '<div style="margin-top:10px;"><a href="index.html"><button>← 回玩家端</button></a></div></div>';
}
async function gate() {
  const stored = localStorage.getItem(PWKEY);
  if (stored && localStorage.getItem("rpg2:designok") === stored) { localStorage.setItem("rpg2:host", "1"); return true; }
  if (!stored) {
    const p1 = prompt("首次使用：设置设计师口令（4 位以上）");
    if (!p1 || p1.length < 4) { deny("口令太短。"); return false; }
    const h = await sha(p1);
    localStorage.setItem(PWKEY, h);
    localStorage.setItem("rpg2:designok", h); localStorage.setItem("rpg2:host", "1");
    alert("口令已设置，这台设备已记住。");
    return true;
  }
  for (let i = 0; i < 3; i++) {
    const p = prompt("请输入设计师口令（第 " + (i + 1) + " 次）");
    if (p == null) { deny("已取消。"); return false; }
    if ((await sha(p)) === stored) { localStorage.setItem("rpg2:designok", stored); localStorage.setItem("rpg2:host", "1"); return true; }
  }
  deny("口令错误 3 次。");
  return false;
}
function render() {
  const hostBox = (() => { try { return localStorage.getItem("rpg2:hostBox") || localStorage.getItem("rpg2:box") || ""; } catch (e) { return ""; } })();
  const enc = encodeURIComponent(hostBox);
  const L = (page, tab) => page + (hostBox ? "?box=" + enc + "&tab=" + tab : "?tab=" + tab);
  const qa = hostBox ? "?box=" + enc : "";
  document.getElementById("view").innerHTML =
    '<div class="studio-bar">🧑‍💻 <b>主机端 · 设计工作室</b>　这里的东西只改设计数据，不写任何玩家存档 / 排行榜</div>' +
    '<div class="card"><div class="card-title" style="color:#ffb347;">工作台</div>' +
      '<div class="studio-card">' +
        '<a href="design.html"><div style="font-size:22px;">🎨</div><div class="t">原创角色</div><div class="hint">设计 NPC / 角色设定，导出 JSON</div></a>' +
        '<a href="equip.html"><div style="font-size:22px;">📚</div><div class="t">装备图鉴</div><div class="hint">全部武器 / 防具 / 饰品预览</div></a>' +
        '<a href="affixes.html"><div style="font-size:22px;">📖</div><div class="t">词条库</div><div class="hint">词条效果说明</div></a>' +
        '<a href="index.html"><div style="font-size:22px;">🎮</div><div class="t">玩家端</div><div class="hint">回到游戏首页（朋友看到的样子）</div></a>' +
        '<a href="lobby.html"><div style="font-size:22px;">🏛</div><div class="t">公共大厅</div><div class="hint">玩家大厅 / 原创大厅</div></a>' +
        '<a href="origgear.html"><div style="font-size:22px;">🛡</div><div class="t">专属装备图鉴</div><div class="hint">原创角色专属装备</div></a>' +
      '</div>' +
      '<div class="studio-note">提示：设计器里点「导出 JSON」可以把设计发给我，转成游戏内容。</div>' +
      '<div style="margin-top:12px;"><button id="btnLock" style="font-size:11px;border-color:#6b4a1e;color:#ffcf7a;">🔒 锁定主机端</button></div>' +
    '</div>' +
    '<div class="card"><div class="card-title" style="color:#ffb347;">👤 主机位号</div>' +
      '<div class="row"><span class="k">当前位号</span><span class="v">' + (hostBox ? '<b style="color:#ffcf7a;">' + hostBox + '</b>' : '<span class="hint">未设置（游戏入口会落到公用/新位号）</span>') + '</span></div>' +
      '<div style="display:flex;gap:8px;margin-top:6px;"><input id="hostBoxIn" value="' + hostBox + '" placeholder="填你的位号" style="flex:1;background:#0b0e17;border:1px solid #3a2c14;border-radius:6px;color:#f3e6cf;padding:7px;">' +
      '<button id="btnHostBox" style="border-color:#6b4a1e;color:#ffcf7a;">保存</button></div>' +
      '<div class="hint" style="margin-top:6px;">设置后，下面的游戏入口都会带上这个位号，直接进你自己的角色。</div>' +
    '</div>' +
    '<div class="card"><div class="card-title" style="color:#ffb347;">🎮 我的游戏（主机操控）</div>' +
      '<div class="studio-card">' +
        '<a href="' + L("create.html", "char") + '"><div style="font-size:22px;">🧑</div><div class="t">我的角色</div><div class="hint">属性 / 突破 / 战斗面板</div></a>' +
        '<a href="' + L("create.html", "talent") + '"><div style="font-size:22px;">🌳</div><div class="t">天赋</div><div class="hint">分支加点</div></a>' +
        '<a href="' + L("create.html", "cult") + '"><div style="font-size:22px;">⚒</div><div class="t">培养</div><div class="hint">装备强化 / 升星 / 精炼</div></a>' +
        '<a href="' + L("create.html", "orig") + '"><div style="font-size:22px;">🧬</div><div class="t">原创角色</div><div class="hint">等级 / 突破 / 出战</div></a>' +
        '<a href="' + L("create.html", "store") + '"><div style="font-size:22px;">🎒</div><div class="t">仓库</div><div class="hint">装备 / 资源</div></a>' +
        '<a href="battle.html' + qa + '"><div style="font-size:22px;">⚔️</div><div class="t">战斗</div><div class="hint">副本 / 同行 / 出战</div></a>' +
      '</div>' +
      '<div class="studio-note">这几项和玩家端一样，只是给你自己用的入口。</div>' +
    '</div>' +
    '<div class="card"><div class="card-title" style="color:#ffb347;">🗑 删除位号（云端存档）</div>' +
      '<div class="row"><span class="k">位号</span><span class="v"><input id="delBox" placeholder="要查询/删除的位号" style="flex:1;background:#0b0e17;border:1px solid #3a2c14;border-radius:6px;color:#f3e6cf;padding:7px;"></span></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">' +
        '<button id="btnLookup" style="border-color:#6b4a1e;color:#ffcf7a;">🔍 查询</button>' +
        '<button id="btnDelBox" style="border-color:#ff6b6b;color:#ff6b6b;">🗑 删除</button>' +
      '</div>' +
      '<div id="delMsg" class="hint" style="margin-top:8px;">输入位号先查询，确认后再删；删除不可恢复。</div>' +
    '</div>';
  document.getElementById("btnLock").onclick = () => {
    if (!confirm("锁定？下次进入需要重新输入口令。")) return;
    localStorage.removeItem("rpg2:designok"); localStorage.removeItem("rpg2:host");
    location.reload();
  };
  const hbBtn = document.getElementById("btnHostBox");
  if (hbBtn) hbBtn.onclick = () => {
    const v = document.getElementById("hostBoxIn").value.trim();
    try {
      localStorage.setItem("rpg2:hostBox", v);
      if (v) localStorage.setItem("rpg2:box", v);
    } catch (e) {}
    render();
  };
  const msg = (t, bad) => { const el = document.getElementById("delMsg"); el.textContent = t; el.style.color = bad ? "#ff9b9b" : "#9ee7a0"; };
  document.getElementById("btnLookup").onclick = async () => {
    const b = document.getElementById("delBox").value.trim();
    if (!b) return msg("先填位号", true);
    msg("查询中…");
    try {
      const row = await cloudGet(b);
      if (!row) return msg("云端没有这个位号：" + b, true);
      const chars = (row.store && row.store.chars) || [];
      msg("存在：" + b + "　角色 " + chars.length + " 个　更新于 " + (row.updated_at || "?"));
    } catch (e) { msg("查询失败：" + e.message, true); }
  };
  document.getElementById("btnDelBox").onclick = async () => {
    const b = document.getElementById("delBox").value.trim();
    if (!b) return msg("先填位号", true);
    const typed = prompt("删除不可恢复。请再输入一次位号确认：");
    if (typed !== b) return msg("位号不一致，已取消", true);
    if (!confirm("真的删除云端存档「" + b + "」？角色、装备、金币都会没。")) return;
    msg("删除中…");
    try {
      const r = await cloudDelete(b);
      const chk = await cloudGet(b);
      if (chk) return msg("删除失败：云端仍有记录", true);
      msg("✅ 已删除 " + b + "（HTTP " + r.status + "）。记得在本机清缓存，否则可能被离线缓存恢复。");
    } catch (e) { msg("删除失败：" + e.message, true); }
  };
}
// 🖱 兜底：用事件代理处理「保存位号」，避免绑定丢失
document.addEventListener("click", (e) => {
  const t = e.target && e.target.closest ? e.target.closest("#btnHostBox") : null;
  if (!t) return;
  const inp = document.getElementById("hostBoxIn");
  const v = ((inp && inp.value) || "").trim();
  try {
    localStorage.setItem("rpg2:hostBox", v);
    if (v) localStorage.setItem("rpg2:box", v);
  } catch (err) {}
  alert(v ? ("✅ 已保存主机位号：" + v) : "已清空主机位号");
  render();
});

if (await gate()) render();
</script>
</body>
</html>
